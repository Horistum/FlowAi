kind: FlowTargetRegistry
version: "1.0"
description: Built-in target capability registry for the current Flow capability-contract line.
targets:
  - name: local
    description: Reference local target used to validate plan semantics before platform generation.
    capabilities:
      sequentialTasks: supported
      parallel: supported
      conditions: supported
      dynamicLoops: supported
      match: supported
      retry: supported
      approvals: partial
      errorHandlers: supported
      artifacts: partial
      secrets: partial
      nativeRuntime: supported
    features:
      approval.inline: partial
      approval.manual: partial
      parallel.dag: supported
      retry.task: supported
      errorHandlers.finally: supported
      secrets.runtime: partial
      rollback.native: partial
      cron.schedule: partial
      safety.destructiveOperation: partial
    notes:
      - Manual approvals require an interactive or external gate when running locally.

  - name: jenkins
    description: Jenkins Pipeline generator target. Good scripted support, weaker portability.
    capabilities:
      sequentialTasks: supported
      parallel: supported
      conditions: supported
      dynamicLoops: supported
      match: supported
      retry: supported
      approvals: supported
      errorHandlers: supported
      artifacts: supported
      secrets: supported
      nativeRuntime: supported
    features:
      approval.inline: supported
      approval.manual: supported
      parallel.dag: supported
      retry.task: supported
      errorHandlers.finally: supported
      secrets.runtime: supported
      artifacts.uploadDownload: supported
      rollback.native: supported
      cron.schedule: supported
      safety.destructiveOperation: supported
      kubernetes.api: supported
      container.image: supported
      notification.send: supported

  - name: github-actions
    description: GitHub Actions generator target. Good for simple CI/CD, limited dynamic control-flow semantics.
    capabilities:
      sequentialTasks: supported
      parallel: supported
      conditions: supported
      dynamicLoops: partial
      match: partial
      retry: partial
      approvals: supported
      errorHandlers: partial
      artifacts: supported
      secrets: supported
      nativeRuntime: partial
    features:
      approval.inline: partial
      approval.manual: partial
      approval.environmentGate: supported
      parallel.dag: supported
      retry.task: partial
      errorHandlers.finally: partial
      secrets.runtime: supported
      artifacts.uploadDownload: supported
      rollback.native: partial
      cron.schedule: supported
      safety.destructiveOperation: partial
      kubernetes.api: partial
      container.image: supported
      notification.send: partial

  - name: tekton
    description: Tekton generator target. Strong Kubernetes-native task graph, limited runtime expression semantics.
    capabilities:
      sequentialTasks: supported
      parallel: supported
      conditions: partial
      dynamicLoops: unsupported
      match: unsupported
      retry: partial
      approvals: unsupported
      errorHandlers: partial
      artifacts: partial
      secrets: partial
      nativeRuntime: partial
    features:
      approval.inline: unsupported
      approval.manual: unsupported
      parallel.dag: supported
      retry.task: partial
      errorHandlers.finally: partial
      secrets.runtime: partial
      artifacts.uploadDownload: partial
      rollback.native: partial
      cron.schedule: partial
      safety.destructiveOperation: partial
      kubernetes.api: supported
      container.image: supported
      notification.send: partial
    notes:
      - Manual approval requires an external gate before Tekton execution.
      - Dynamic loops and match semantics require pre-expansion or a controller outside Flow Core.
