name: v0.9.7.9.2 Evidence Digest Honesty

on:
  push:
    branches:
      - agent/v0.9.7.9.2-artifact-derived-lowering-evidence

permissions:
  contents: write

jobs:
  rename-and-refresh:
    if: ${{ !startsWith(github.event.head_commit.message, '[v0.9.7.9.2-digest]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.2-artifact-derived-lowering-evidence
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rename aggregate digest to its exact meaning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt'),
              Path('src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt'),
              Path('src/test/kotlin/ArtifactDerivedIntentLoweringEvidenceTests.kt'),
              Path('schemas/execution-plan.schema.json'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('artifactDigest')
              if count == 0:
                  raise SystemExit(f'No artifactDigest reference found in {path}')
              path.write_text(text.replace('artifactDigest', 'evidenceDigest'))
              total += count
          print(f'Renamed {total} references.')
          PY

      - name: Regenerate canonical reference bundles
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy"
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/checkout-build-image.intent.yaml --out conformance/snapshots/checkout-build-image --scenario-id checkout-build-image --targets jenkins"

      - name: Remove one-shot workflow and commit evidence
        run: |
          git rm .github/workflows/v0.9.7.9.2-evidence-digest.yml
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add src/main src/test schemas conformance/snapshots
          git commit -m "[v0.9.7.9.2-digest] Name certified lowering digest precisely"
          git push origin HEAD:agent/v0.9.7.9.2-artifact-derived-lowering-evidence
