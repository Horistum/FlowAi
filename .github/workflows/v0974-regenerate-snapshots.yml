name: Regenerate v0.9.7.4 Snapshots

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-regenerate-snapshots.yml

permissions:
  contents: write

jobs:
  regenerate-snapshots:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate canonical snapshots
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test --tests V0974SnapshotRegenerationTest --no-daemon

      - name: Commit canonical snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/test/kotlin/V0974SnapshotRegenerationTest.kt
          rm -f .github/workflows/v0974-regenerate-snapshots.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate v0.9.7.4 reference snapshots"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
