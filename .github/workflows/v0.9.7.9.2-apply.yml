name: v0.9.7.9.2 Apply Artifact-Derived Lowering

on:
  push:
    branches:
      - agent/v0.9.7.9.2-artifact-derived-lowering-evidence

permissions:
  contents: write

jobs:
  apply-migration:
    if: ${{ !startsWith(github.event.head_commit.message, '[v0.9.7.9.2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.2-artifact-derived-lowering-evidence
          fetch-depth: 0

      - name: Apply bounded source migration
        run: python3 .flow-agent/tools/apply-v0.9.7.9.2.py

      - name: Commit migrated sources
        run: |
          if git diff --quiet; then
            echo "Migration is already applied."
            exit 0
          fi
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add src/main schemas
          git commit -m "[v0.9.7.9.2-applied] Derive lowering evidence from execution artifacts"
          git push origin HEAD:agent/v0.9.7.9.2-artifact-derived-lowering-evidence
