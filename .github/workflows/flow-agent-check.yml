name: Flow CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Exact Checked-Out Revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected exact revision $EXPECTED_SHA but checked out $actual_sha." >&2
            exit 1
          fi
          echo "FLOW_VALIDATED_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Prepare CI Log Directory
        run: mkdir -p ci-logs

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Offline Tests When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon test --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-test.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping project tests in GitHub Actions." | tee ci-logs/offline-test.log
          fi

      - name: Run Offline Conformance When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon run --args="conformance" --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-conformance.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping conformance in GitHub Actions." | tee ci-logs/offline-conformance.log
          fi

      - name: Compile and Test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write CI Summary
        if: always()
        shell: bash
        run: |
          echo "# Flow CI Exact-Head Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated checkout: ${FLOW_VALIDATED_SHA:-unverified}" >> "$GITHUB_STEP_SUMMARY"
          echo "Event SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks executed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact checked-out revision verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent tooling unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent structure validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent context generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Gradle test when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Flow conformance when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle clean test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "build/test-results/test/*.xml" > /dev/null; then
            echo "## Failing test report excerpts" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import html
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure') or case.find('error')
                  if failure is None:
                      continue
                  cls = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  message = failure.attrib.get('message', '')
                  text = (failure.text or '').strip().splitlines()
                  print(f"### {cls}.{name}")
                  print("")
                  print("```text")
                  print(html.unescape(message)[:2000])
                  for line in text[:12]:
                      print(html.unescape(line)[:2000])
                  print("```")
                  print("")
          PY
          fi
          for file in ci-logs/*.log; do
            if [ -f "$file" ]; then
              echo "## ${file}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload CI Gradle Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-exact-head-gradle-logs
          path: ci-logs/*.log
          if-no-files-found: warn

      - name: Upload CI Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-exact-head-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn

  merge-candidate-compile-test-conformance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Merge Candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Merge Candidate Revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected merge candidate $EXPECTED_SHA but checked out $actual_sha." >&2
            exit 1
          fi
          echo "FLOW_MERGE_CANDIDATE_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI Log Directory
        run: |
          chmod +x ./gradlew
          mkdir -p ci-logs

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Compile and Test Merge Candidate
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/merge-candidate-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Merge Candidate Conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/merge-candidate-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write Merge Candidate Summary
        if: always()
        shell: bash
        run: |
          echo "# Flow CI Merge-Candidate Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated merge candidate: ${FLOW_MERGE_CANDIDATE_SHA:-unverified}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request head: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request base: ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Merge Candidate Gradle Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-merge-candidate-gradle-logs
          path: ci-logs/*.log
          if-no-files-found: warn

      - name: Upload Merge Candidate Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-merge-candidate-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn
