name: Flow CI

on:
  push:
    branches:
      - 'fix/v0.9.7.9.3-environment-safety-production-integration'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.9.7.9.3-environment-safety-production-integration
          fetch-depth: 0

      - name: Apply guarded production integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v0_9_7_9_3.py')
          text = path.read_text()
          old = '.map(String::normalized)'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 member-extension references, found {count}')
          path.write_text(text.replace(old, '.map { it.normalized() }'))
          PY
          python3 scripts/apply_v0_9_7_9_3.py
          python3 scripts/patch_v0_9_7_9_3_round2.py
          python3 scripts/patch_v0_9_7_9_3_round3.py
          python3 scripts/patch_v0_9_7_9_3_round4.py

      - name: Restore standard workflow and remove migration helpers
        run: |
          git show origin/main:.github/workflows/flow-agent-check.yml > .github/workflows/flow-agent-check.yml
          rm scripts/apply_v0_9_7_9_3.py
          rm scripts/patch_v0_9_7_9_3_round2.py
          rm scripts/patch_v0_9_7_9_3_round3.py
          rm scripts/patch_v0_9_7_9_3_round4.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI log directory
        run: |
          chmod +x ./gradlew
          mkdir -p ci-logs

      - name: Test Flow Agent tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent context
        run: python3 tools/flow_agent_runner.py

      - name: Compile and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Commit validated implementation
        run: |
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes produced."
            exit 1
          fi
          git commit -m "Implement v0.9.7.9.3 environment safety production integration"
          git push origin HEAD:fix/v0.9.7.9.3-environment-safety-production-integration

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-v0.9.7.9.3-logs
          path: ci-logs/*.log
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-v0.9.7.9.3-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn
