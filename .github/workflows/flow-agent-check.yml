name: Flow CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

permissions:
  contents: write

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v095-universal-model-completion
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate canonical reference snapshots
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon test --tests GenerateUniversalCompletionArtifactsTest --stacktrace --console=plain

      - name: Apply target-neutral CUSTOM lowering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main/kotlin/org/flowlang/intent/IntentToAstPlanner.kt")
          text = path.read_text(encoding="utf-8")
          old = '            StandardCapability.CUSTOM -> customAction(step, intent)'
          new = '            StandardCapability.CUSTOM -> standardAction(step, "custom", intent)'
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one legacy CUSTOM lowering branch.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f src/test/kotlin/GenerateUniversalCompletionArtifactsTest.kt
          git diff --check

      - name: Run complete tests and conformance
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p ci-logs
          {
            ./gradlew --no-daemon clean test --stacktrace --console=plain && \
            ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain
          } 2>&1 | tee ci-logs/final-validation.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload final validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-final-validation
          path: |
            ci-logs/final-validation.log
            build/test-results/test/*.xml
            build/reports/tests/test/**
            conformance/snapshots/build-test-deploy/**
          if-no-files-found: warn

      - name: Persist fully validated result
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/flow-agent-check.yml
          git config user.name "flow-ai-validation"
          git config user.email "flow-ai-validation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize universal model contracts and canonical snapshots"
          git push origin HEAD:feature/v095-universal-model-completion