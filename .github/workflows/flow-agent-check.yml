name: Materialize v0.9.7.9.4 Reviewed Tree

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-v0.9.7.9.4-reviewed-tree
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout materialization branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.9.7.9.4-materialize-reviewed-tree
          fetch-depth: 0

      - name: Apply previously validated guarded source assembly
        run: python3 scripts/apply_v0_9_7_9_4.py

      - name: Apply compiler correction discovered by first real build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt")
          text = path.read_text(encoding="utf-8")
          old = 'boundary.report.scenarioSelection.selectedPack == "custom"'
          new = 'boundary.report.scenarioSelection?.selectedPack == "custom"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one nullable scenario-selection correction, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Capture exact project diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          paths=(
            .flow-agent/reports/v0.9.7.9.4-scenario-negation-token-boundary-honesty.md
            .flow-agent/work-packages/v0.9.7.9.4-scenario-negation-token-boundary-honesty.yaml
            docs/V0_9_7_9_4_SCENARIO_NEGATION_TOKEN_BOUNDARY_HONESTY.md
            src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt
            src/main/kotlin/org/flowlang/intent/IntentSourceContradictionAuthority.kt
            src/main/kotlin/org/flowlang/intent/IntentSourceDirectiveAuthority.kt
            src/main/kotlin/org/flowlang/scenarios/ScenarioPacks.kt
            src/main/kotlin/org/flowlang/standard/ScenarioPackQualityAnalyzer.kt
            src/test/kotlin/IntentSourceContradictionAuthorityTests.kt
            src/test/kotlin/ScenarioNegationTokenBoundaryHonestyTests.kt
          )
          tar -cf /tmp/v09794-reviewed-tree.tar "${paths[@]}"

      - name: Create clean review branch from main
        shell: bash
        run: |
          set -euo pipefail
          review_branch=fix/v0.9.7.9.4-scenario-negation-token-boundary-honesty-review
          git fetch origin main
          git reset --hard
          git clean -fdx
          git checkout -B "$review_branch" origin/main
          tar -xf /tmp/v09794-reviewed-tree.tar
          git add \
            .flow-agent/reports/v0.9.7.9.4-scenario-negation-token-boundary-honesty.md \
            .flow-agent/work-packages/v0.9.7.9.4-scenario-negation-token-boundary-honesty.yaml \
            docs/V0_9_7_9_4_SCENARIO_NEGATION_TOKEN_BOUNDARY_HONESTY.md \
            src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt \
            src/main/kotlin/org/flowlang/intent/IntentSourceContradictionAuthority.kt \
            src/main/kotlin/org/flowlang/intent/IntentSourceDirectiveAuthority.kt \
            src/main/kotlin/org/flowlang/scenarios/ScenarioPacks.kt \
            src/main/kotlin/org/flowlang/standard/ScenarioPackQualityAnalyzer.kt \
            src/test/kotlin/IntentSourceContradictionAuthorityTests.kt \
            src/test/kotlin/ScenarioNegationTokenBoundaryHonestyTests.kt
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = sorted([
              ".flow-agent/reports/v0.9.7.9.4-scenario-negation-token-boundary-honesty.md",
              ".flow-agent/work-packages/v0.9.7.9.4-scenario-negation-token-boundary-honesty.yaml",
              "docs/V0_9_7_9_4_SCENARIO_NEGATION_TOKEN_BOUNDARY_HONESTY.md",
              "src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt",
              "src/main/kotlin/org/flowlang/intent/IntentSourceContradictionAuthority.kt",
              "src/main/kotlin/org/flowlang/intent/IntentSourceDirectiveAuthority.kt",
              "src/main/kotlin/org/flowlang/scenarios/ScenarioPacks.kt",
              "src/main/kotlin/org/flowlang/standard/ScenarioPackQualityAnalyzer.kt",
              "src/test/kotlin/IntentSourceContradictionAuthorityTests.kt",
              "src/test/kotlin/ScenarioNegationTokenBoundaryHonestyTests.kt",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"Unexpected review diff. Expected {expected}, got {actual}")
          PY
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git commit -m "Implement v0.9.7.9.4 scenario negation and token boundary honesty"
          git push --force origin HEAD:"$review_branch"
