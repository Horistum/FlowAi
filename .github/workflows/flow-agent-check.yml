name: Flow CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct remaining semantic fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          examples = Path("src/main/kotlin/org/flowlang/intent/IntentExamples.kt")
          examples.write_text('''package org.flowlang.intent

/** Small built-in examples used by documentation and future tests. */
object IntentExamples {
    val buildTestDeploy = IntentDocument(
        name = "build-test-deploy",
        description = "High-level deployment intent. This is the layer AI should produce first.",
        inputs = listOf(
            IntentInput("environment", "option[dev,test,prod]", required = true),
            IntentInput("version", "text", required = true)
        ),
        systems = listOf(
            IntentSystem("source", "git", "Application source repository"),
            IntentSystem("registry", "dockerRegistry", "Image registry"),
            IntentSystem("cluster", "kubernetes", "Declared deployment context; generic deploy remains target-neutral"),
            IntentSystem("standard", "standard", "Semantic build, test, deploy and verify operations")
        ),
        workflows = listOf(
            IntentWorkflow(
                name = "application-lifecycle",
                kind = IntentWorkflowKind.DEPLOY,
                steps = listOf(
                    IntentStep("checkout", StandardCapability.CHECKOUT),
                    IntentStep("test", StandardCapability.TEST, requires = listOf("checkout")),
                    IntentStep("build-image", StandardCapability.BUILD_IMAGE, requires = listOf("test")),
                    IntentStep("approve-prod", StandardCapability.APPROVE, requires = listOf("build-image")),
                    IntentStep("deploy", StandardCapability.DEPLOY, requires = listOf("approve-prod")),
                    IntentStep("verify", StandardCapability.VERIFY, requires = listOf("deploy"))
                )
            )
        ),
        policies = listOf(
            IntentPolicy(
                name = "production-approval",
                type = IntentPolicyType.APPROVAL,
                condition = "environment == 'prod'",
                message = "Production deployment requires approval."
            )
        ),
        failure = IntentFailurePolicy(notify = true, rollback = true, stopOnError = true)
    )
}
''', encoding="utf-8")

          Path("examples/intent/argocd-deploy.intent.yaml").write_text('''intentVersion: "2.0"
kind: FlowIntentDocument
name: argocd-deploy
systems:
  - name: argo
    type: argocd
    config: { url: secret:ARGOCD_URL, token: secret:ARGOCD_TOKEN }
workflows:
  - name: cd
    kind: DEPLOY
    steps:
      - id: deploy
        capability: DEPLOY
        uses: argocd.sync
        params: { system: argo, app: demo-app, wait: true }
''', encoding="utf-8")

          planner = Path("src/main/kotlin/org/flowlang/intent/IntentToAstPlanner.kt")
          text = planner.read_text(encoding="utf-8")
          old = '            StandardCapability.CUSTOM -> customAction(step, intent)'
          new = '            StandardCapability.CUSTOM -> standardAction(step, "custom", intent)'
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one legacy CUSTOM lowering branch.")
          planner.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Add one-time canonical snapshot generator
        shell: bash
        run: |
          cat > src/test/kotlin/RegenerateReferenceSnapshotsTest.kt <<'KOTLIN'
          import java.io.File
          import kotlin.test.Test
          import org.flowlang.capabilities.CompatibilityAnalyzer
          import org.flowlang.cli.Json
          import org.flowlang.conformance.ReferenceSnapshotHonesty
          import org.flowlang.generators.manifest.GitHubActionsManifestRenderer
          import org.flowlang.generators.manifest.JenkinsManifestRenderer
          import org.flowlang.generators.manifest.TargetManifest
          import org.flowlang.generators.manifest.TargetManifestGenerationPipeline
          import org.flowlang.generators.manifest.TargetRenderPolicy
          import org.flowlang.generators.manifest.TektonManifestRenderer
          import org.flowlang.intent.IntentCapabilityValidator
          import org.flowlang.intent.IntentToAstPlanner
          import org.flowlang.intent.IntentYamlLoader
          import org.flowlang.modules.ModuleRegistry
          import org.flowlang.planner.ExecutionPlanCanonicalizer
          import org.flowlang.planner.FlowPlanner
          import org.flowlang.standard.FlowStandardVersions
          import org.flowlang.targets.TargetRegistryYamlLoader

          class RegenerateReferenceSnapshotsTest {
              @Test
              fun regenerateFromCanonicalPipeline() {
                  val snapshotDir = File("conformance/snapshots/build-test-deploy")
                  val registry = ModuleRegistry.fromDirectory(File("modules"), includeDefaults = true)
                  val targets = TargetRegistryYamlLoader.loadDirectory(File("targets"))
                  val intent = IntentYamlLoader.load(File("examples/intent/build-test-deploy.intent.yaml"))
                  IntentCapabilityValidator(registry).validate(intent).assertValid()
                  val ast = IntentToAstPlanner(registry).plan(intent)
                  val plan = FlowPlanner(registry).plan(ast)
                  val compatibility = CompatibilityAnalyzer(targets)
                  val manifests = listOf("jenkins", "github-actions", "tekton").associateWith { target ->
                      TargetManifestGenerationPipeline.generate(plan, compatibility.analyze(plan, target))
                  }
                  val writer = Json.mapper.writerWithDefaultPrettyPrinter()
                  writer.writeValue(File(snapshotDir, "normalized-intent.json"), intent)
                  writer.writeValue(File(snapshotDir, "flow-ast.json"), ast)
                  writer.writeValue(File(snapshotDir, "execution-plan.json"), ExecutionPlanCanonicalizer.canonicalize(plan))
                  writer.writeValue(
                      File(snapshotDir, "snapshot-index.json"),
                      ReferenceSnapshotHonesty.build(
                          scenarioId = "build-test-deploy",
                          standardVersion = FlowStandardVersions.FLOW_STANDARD_VERSION,
                          manifests = manifests.values.toList()
                      )
                  )
                  manifests.forEach { (target, manifest) ->
                      val readiness = TargetRenderPolicy.evaluate(manifest)
                      File(snapshotDir, ReferenceSnapshotHonesty.projectionFile(target, readiness.mode)).writeText(render(target, manifest))
                  }
              }

              private fun render(target: String, manifest: TargetManifest): String = when (target) {
                  "jenkins" -> JenkinsManifestRenderer().render(manifest)
                  "github-actions" -> GitHubActionsManifestRenderer().render(manifest)
                  "tekton" -> TektonManifestRenderer().render(manifest)
                  else -> error("Unknown target '$target'.")
              }
          }
          KOTLIN

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate snapshots from real pipeline
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test --tests RegenerateReferenceSnapshotsTest --stacktrace --console=plain
          rm -f src/test/kotlin/RegenerateReferenceSnapshotsTest.kt
          git diff --check

      - name: Run complete tests and conformance
        id: validation
        shell: bash
        run: |
          set +e
          {
            ./gradlew --no-daemon clean test --stacktrace --console=plain && \
            ./gradlew --no-daemon conformance --stacktrace --console=plain
          } 2>&1 | tee /tmp/universal-finalization.log
          status=${PIPESTATUS[0]}
          git diff > /tmp/universal-finalization.diff
          exit "$status"

      - name: Upload finalization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-finalization-diagnostics
          path: |
            /tmp/universal-finalization.log
            /tmp/universal-finalization.diff
            build/test-results
            build/reports/tests
            conformance/snapshots/build-test-deploy
          if-no-files-found: warn

      - name: Persist fully validated result
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/flow-agent-check.yml
          rm -f .github/workflows/universal-finalize.yml
          git config user.name "flow-ai-validation"
          git config user.email "flow-ai-validation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize universal model contracts and reference snapshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}