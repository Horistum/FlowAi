name: Flow CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Prepare CI Log Directory
        run: mkdir -p ci-logs

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Offline Tests When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon test --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-test.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping project tests in GitHub Actions." | tee ci-logs/offline-test.log
          fi

      - name: Run Offline Conformance When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon run --args="conformance" --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-conformance.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping conformance in GitHub Actions." | tee ci-logs/offline-conformance.log
          fi

      - name: Compile and Test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write CI Summary
        if: always()
        shell: bash
        run: |
          echo "# Flow CI Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks executed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent structure validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent context generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Gradle test when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Flow conformance when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle clean test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for file in ci-logs/*.log; do
            if [ -f "$file" ]; then
              echo "## ${file}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload CI Gradle Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-gradle-logs
          path: ci-logs/*.log
          if-no-files-found: error
