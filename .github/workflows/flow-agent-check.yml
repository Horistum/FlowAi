name: Flow CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# One active run per PR/ref. Returning to draft cancels obsolete paid work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolation-candidates:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.candidates.outputs.matrix }}
    steps:
      - name: Checkout Event And Immediate Parents
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Select Exact Isolation Trees
        id: candidates
        shell: bash
        env:
          VALIDATION_EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tools/ci_isolation_candidates.py --event "$VALIDATION_EVENT" \
            --event-sha "$EVENT_SHA" --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA"

  # Source-deletion proofs depend on copied files, never Git history. Run them
  # once per complete tree, not once per label when HEAD and merge are identical.
  # Different trees retain independent proofs. No earlier-run receipt is reused.
  module-isolation:
    needs: isolation-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.isolation-candidates.outputs.matrix) }}
    steps:
      - name: Checkout Isolation Candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Isolation Revision And Tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.revision }}
          EXPECTED_TREE: ${{ matrix.tree }}
          COVERS: ${{ join(matrix.covers, ',') }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          mkdir -p ci-logs
          printf 'revision=%s\ntree=%s\ncovers=%s\nrun=%s\nattempt=%s\n' \
            "$EXPECTED_SHA" "$EXPECTED_TREE" "$COVERS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > ci-logs/isolation-revision.txt

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # A cold runner may resolve dependencies. Compiled outputs remain forbidden
      # by each proof's --no-build-cache and fresh physical workspace.
      - name: Prove Kernel Without Product Sources
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_semantic_kernel_isolation.py 2>&1 | tee ci-logs/kernel-isolation.log
          exit ${PIPESTATUS[0]}

      - name: Prove Compiler Without Frontends Or Adapters
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_compiler_isolation.py 2>&1 | tee ci-logs/compiler-isolation.log
          exit ${PIPESTATUS[0]}

      - name: Prove Generic Adapter Boundary Without Concrete Implementations
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_adapter_isolation.py 2>&1 | tee ci-logs/adapter-isolation.log
          exit ${PIPESTATUS[0]}

      - name: Prove Installed Product Without Verification Sources
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_product_isolation.py --report-dir ci-logs/product-isolation 2>&1 | tee ci-logs/product-isolation.log
          exit ${PIPESTATUS[0]}

      - name: Upload Isolation Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-isolation-${{ matrix.label }}
          path: |
            ci-logs/*.log
            ci-logs/isolation-revision.txt
            ci-logs/kernel-isolation/**
            ci-logs/compiler-isolation/**
            ci-logs/adapter-isolation/**
            ci-logs/product-isolation/**
          if-no-files-found: error
          retention-days: 7

  compile-test-conformance:
    needs: [isolation-candidates, module-isolation]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require Successful Module Isolation
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.isolation-candidates.result }}
          ISOLATION_RESULT: ${{ needs.module-isolation.result }}
        run: |
          set -euo pipefail
          if [ "$SELECTION_RESULT" != success ] || [ "$ISOLATION_RESULT" != success ]; then
            echo "Isolation prerequisites did not pass: selection=$SELECTION_RESULT, proof=$ISOLATION_RESULT" >&2
            exit 1
          fi

      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Exact Checked-Out Revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected exact revision $EXPECTED_SHA but checked out $actual_sha." >&2
            exit 1
          fi
          echo "FLOW_VALIDATED_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Prepare CI Workspace
        run: |
          chmod +x ./gradlew
          mkdir -p ci-logs

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Repeated same-repository PR revisions may reuse compilation outputs.
          # Forks can restore caches but cannot publish them through this action.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Compile and Test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --build-cache clean test installDist --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Conformance
        shell: bash
        run: |
          set -o pipefail
          ./build/install/flow-core/bin/flow-core conformance 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write CI Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "# Flow CI Exact-Head Result" >> "$GITHUB_STEP_SUMMARY"
          echo "Physical isolation prerequisite: ${{ needs.module-isolation.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated checkout: ${FLOW_VALIDATED_SHA:-unverified}" >> "$GITHUB_STEP_SUMMARY"
          echo "Event SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Required checks (execution status is recorded in the job steps):" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact checked-out revision verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent tooling unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent structure validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent context generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle clean test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required source-tree isolation prerequisite (kernel/compiler/generic adapters)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "build/test-results/test/*.xml" > /dev/null || compgen -G "flow-*/build/test-results/test/*.xml" > /dev/null; then
            echo "## Failing test report excerpts" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import html
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('build/test-results/test/*.xml') + glob.glob('flow-*/build/test-results/test/*.xml')):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  cls = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  message = failure.attrib.get('message', '')
                  text = (failure.text or '').strip().splitlines()
                  print(f"### {cls}.{name}")
                  print("")
                  print("```text")
                  print(html.unescape(message)[:2000])
                  for line in text[:12]:
                      print(html.unescape(line)[:2000])
                  print("```")
                  print("")
          PY
          fi
          for file in ci-logs/*.log; do
            if [ -f "$file" ]; then
              echo "## ${file}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload CI Gradle Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-ci-exact-head-gradle-logs
          path: |
            ci-logs/*.log
            flow-semantic-kernel/build/reports/semantic-kernel-boundary/**
            flow-*/build/reports/production-module-boundary/**
            build/reports/module-ownership/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CI Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-ci-exact-head-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
            flow-*/build/test-results/test/*.xml
            flow-*/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7

  merge-candidate-compile-test-conformance:
    needs: [isolation-candidates, module-isolation]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require Successful Module Isolation
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.isolation-candidates.result }}
          ISOLATION_RESULT: ${{ needs.module-isolation.result }}
        run: |
          set -euo pipefail
          if [ "$SELECTION_RESULT" != success ] || [ "$ISOLATION_RESULT" != success ]; then
            echo "Isolation prerequisites did not pass: selection=$SELECTION_RESULT, proof=$ISOLATION_RESULT" >&2
            exit 1
          fi

      - name: Checkout Merge Candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Merge Candidate Revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected merge candidate $EXPECTED_SHA but checked out $actual_sha." >&2
            exit 1
          fi
          echo "FLOW_MERGE_CANDIDATE_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Prepare CI Workspace
        run: |
          chmod +x ./gradlew
          mkdir -p ci-logs

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Repeated same-repository PR revisions may reuse compilation outputs.
          # Forks can restore caches but cannot publish them through this action.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Compile and Test Merge Candidate
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --build-cache clean test installDist --stacktrace --console=plain 2>&1 | tee ci-logs/merge-candidate-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Merge Candidate Conformance
        shell: bash
        run: |
          set -o pipefail
          ./build/install/flow-core/bin/flow-core conformance 2>&1 | tee ci-logs/merge-candidate-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write Merge Candidate Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "# Flow CI Merge-Candidate Result" >> "$GITHUB_STEP_SUMMARY"
          echo "Physical isolation prerequisite: ${{ needs.module-isolation.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated merge candidate: ${FLOW_MERGE_CANDIDATE_SHA:-unverified}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request head: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request base: ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Merge Candidate Gradle Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-ci-merge-candidate-gradle-logs
          path: |
            ci-logs/*.log
            flow-semantic-kernel/build/reports/semantic-kernel-boundary/**
            flow-*/build/reports/production-module-boundary/**
            build/reports/module-ownership/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Merge Candidate Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-ci-merge-candidate-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
            flow-*/build/test-results/test/*.xml
            flow-*/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
