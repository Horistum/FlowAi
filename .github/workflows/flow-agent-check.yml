name: Flow CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.2-artifact-derived-lowering-evidence
          fetch-depth: 0

      - name: Finalize v0.9.7.9.2 branch and restore CI workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          conformance = Path('src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt')
          text = conformance.read_text()
          marker = 'import org.flowlang.intent.StandardCapability\n'
          if 'import org.flowlang.lowering.IntentLoweringAuthority\n' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Missing unique lowering import marker')
              text = text.replace(marker, marker + 'import org.flowlang.lowering.IntentLoweringAuthority\n', 1)
          old = '''        require(ast.metadata.loweringReport?.evidence.orEmpty().isNotEmpty()) { "AST lacks lowering coverage evidence." }
          require(plan.loweringReport == ast.metadata.loweringReport) { "Execution plan lost lowering coverage evidence." }
'''
          new = '''        val sourceMetadata = requireNotNull(ast.metadata.sourceIntent) { "AST lacks stable lowering source metadata." }
          require(sourceMetadata.fields.isNotEmpty()) { "AST lacks stable lowering source field identities." }
          require(ast.metadata.loweringReport == null) { "AST must not certify execution-plan values before the plan exists." }
          val loweringReport = requireNotNull(plan.loweringReport) { "Execution plan lacks artifact-derived lowering evidence." }
          require(loweringReport.evidence.map { it.sourceIdentity }.toSet() == sourceMetadata.fields.map { it.identity }.toSet()) {
              "Execution-plan lowering evidence does not cover the stable source catalog."
          }
          require(loweringReport == IntentLoweringAuthority.report(plan.copy(loweringReport = null))) {
              "Execution-plan lowering evidence is not reproducible from concrete plan values."
          }
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Lowering conformance block is neither old nor finalized')
          conformance.write_text(text)

          authority = Path('src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt')
          text = authority.read_text()
          text = text.replace('planning.lowering.artifact-digest.invalid', 'planning.lowering.evidence-digest.invalid')
          text = text.replace(
              'Lowering evidence must declare a lowercase SHA-256 artifact digest.',
              'Lowering evidence must declare a lowercase SHA-256 aggregate evidence digest.'
          )
          authority.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          heading = '### v0.9.7.9.2 Artifact-Derived Lowering Evidence'
          if heading not in text:
              marker = '### v0.9.7.9.1 Evidence and Control Integrity Repair'
              section = '''### v0.9.7.9.2 Artifact-Derived Lowering Evidence

#### Added

- Added stable semantic source and target identities for every accepted Intent field covered by lowering evidence.
- Added source, expected-target and concrete-target SHA-256 digests with explicit named transformations.
- Added adversarial tests for concrete target mutation, forged evidence digest, missing evidence, duplicate evidence and topological source-step reordering.
- Added an embedded lowering evidence contract `2.0` while preserving the public ExecutionPlan artifact version at `2.0`.

#### Changed

- Lowering reports are issued only after FlowPlanner constructs the concrete execution plan.
- Mandatory materialization re-derives every target value and requires exact equality with the stored report.
- `sourcePath` is diagnostic only; `sourceIdentity` is the stable authority independent of list position.
- `PRESERVED` now requires verified source-target equality, while `TRANSFORMED` requires a named conversion and verified expected target value.
- Canonical build-test-deploy and checkout-build-image snapshot bundles were regenerated through the reference generator.

#### Removed

- Removed source-iterated path-only preservation claims.
- Removed index-based target addressing as lowering evidence authority.
- Removed `dropBlockedParams` and the synthetic notes-driven materialization marker.

#### Validation boundary

- The aggregate `evidenceDigest` covers the certified lowering evidence view and is not represented as a signature of the entire execution plan.
- The v0.9.7 closure gate remains blocked pending work items v0.9.7.9.3 through v0.9.7.9.7.

'''
              if marker not in text:
                  raise SystemExit(f'Missing changelog marker: {marker}')
              changelog.write_text(text.replace(marker, section + marker, 1))
          PY
          git rm .github/workflows/v0.9.7.9.2-final-metadata.yml .github/workflows/v0.9.7.9.2-finalize-now.yml
          git fetch origin main
          git show origin/main:.github/workflows/flow-agent-check.yml > .github/workflows/flow-agent-check.yml
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/flow-agent-check.yml src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt
          git commit -m "[v0.9.7.9.2-final] Finalize artifact-derived lowering conformance"
          git push origin HEAD:agent/v0.9.7.9.2-artifact-derived-lowering-evidence

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Prepare CI Log Directory
        run: mkdir -p ci-logs

      - name: Test Flow Agent Tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Offline Tests When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon test --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-test.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping project tests in GitHub Actions." | tee ci-logs/offline-test.log
          fi

      - name: Run Offline Conformance When Cache Is Available
        shell: bash
        run: |
          set -o pipefail
          if [ -x ./gradlew ] && [ -d .gradle/caches ]; then
            ./gradlew --no-daemon run --args="conformance" --offline --stacktrace --console=plain 2>&1 | tee ci-logs/offline-conformance.log
            exit ${PIPESTATUS[0]}
          else
            echo "Offline Gradle cache not available. Skipping conformance in GitHub Actions." | tee ci-logs/offline-conformance.log
          fi

      - name: Compile and Test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run Conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Write CI Summary
        if: always()
        shell: bash
        run: |
          echo "# Flow CI Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks executed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent tooling unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent structure validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent context generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Gradle test when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline Flow conformance when cache is available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle clean test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "build/test-results/test/*.xml" > /dev/null; then
            echo "## Failing test report excerpts" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import html
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure') or case.find('error')
                  if failure is None:
                      continue
                  cls = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  message = failure.attrib.get('message', '')
                  text = (failure.text or '').strip().splitlines()
                  print(f"### {cls}.{name}")
                  print("")
                  print("```text")
                  print(html.unescape(message)[:2000])
                  for line in text[:12]:
                      print(html.unescape(line)[:2000])
                  print("```")
                  print("")
          PY
          fi
          for file in ci-logs/*.log; do
            if [ -f "$file" ]; then
              echo "## ${file}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload CI Gradle Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-gradle-logs
          path: ci-logs/*.log
          if-no-files-found: warn

      - name: Upload CI Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ci-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn
