name: Flow CI

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize-pr-110:
    if: github.event.pull_request.number == 110 && github.event.pull_request.head.ref == 'agent/core-neutrality-governance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged correction branch
        uses: actions/checkout@v6
        with:
          ref: agent/core-neutrality-governance-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          cat .pr110-fix-upload/part-* | base64 -d > /tmp/pr110-fixes.tar.gz
          echo "99c01475f94b17006e164bd0fbc90bf9268199dfbc31675a0f37a8fc25b7770b  /tmp/pr110-fixes.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open('/tmp/pr110-fixes.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY
          tar -xzf /tmp/pr110-fixes.tar.gz -C .
          sha256sum -c .pr110-fix-manifest.sha256
          rm -f .pr110-fix-manifest.sha256
          rm -rf .pr110-fix-upload
          rm -f .github/workflows/pr110-finalize.yml
          rm -f __no_such_file__ __temp_should_not_use __temp_should_not_use_2
          git checkout 4474cfd404af9629ea8fd861629ebb8a58887d17 -- .github/workflows/flow-agent-check.yml

          cat > /tmp/expected-files <<'EOF_EXPECTED'
conformance/equivalence/semantic-equivalence-rules.yaml
docs/C0_3_SEMANTIC_EQUIVALENCE_RULES.md
docs/CORE_PLATFORM_NEUTRALITY_AND_FAIL_CLOSED_INTEGRITY.md
src/main/kotlin/org/flowlang/architecture/ArchitectureGovernance.kt
src/main/kotlin/org/flowlang/architecture/CiCdBiasInventory.kt
src/main/kotlin/org/flowlang/architecture/KotlinLexicalScanner.kt
src/main/kotlin/org/flowlang/conformance/SemanticEquivalenceAuthority.kt
src/main/kotlin/org/flowlang/conformance/SemanticEquivalenceContracts.kt
src/main/kotlin/org/flowlang/conformance/SemanticEquivalencePlanFactory.kt
src/main/kotlin/org/flowlang/conformance/SemanticImplementationObservationAuthority.kt
src/main/kotlin/org/flowlang/conformance/SemanticObservationAuthority.kt
src/main/kotlin/org/flowlang/effects/SemanticEffects.kt
src/main/kotlin/org/flowlang/generators/manifest/TargetManifestLowering.kt
src/main/kotlin/org/flowlang/intent/StandardCapabilityCompatibility.kt
src/main/kotlin/org/flowlang/parser/ExpressionParser.kt
src/main/kotlin/org/flowlang/parser/FlowParser.kt
src/main/kotlin/org/flowlang/parser/Lexer.kt
src/main/kotlin/org/flowlang/scenarios/BaseScenarioPack.kt
src/main/kotlin/org/flowlang/scenarios/DeliveryScenarioPacks.kt
src/main/kotlin/org/flowlang/scenarios/MaintenanceScenarioPacks.kt
src/main/kotlin/org/flowlang/scenarios/OperationsScenarioPacks.kt
src/main/kotlin/org/flowlang/scenarios/ScenarioPacks.kt
src/main/kotlin/org/flowlang/serialization/FlowYaml.kt
src/main/kotlin/org/flowlang/standard/StandardIntentCatalog.kt
src/main/kotlin/org/flowlang/validator/SafetyBoundaryValidator.kt
src/main/resources/standard/compatibility/capability-aliases.yaml
src/test/kotlin/CiCdBiasBoundaryPrecisionTests.kt
src/test/kotlin/CritiqueFailClosedRegressionTests.kt
src/test/kotlin/SemanticEquivalenceAuthorityTests.kt
src/test/kotlin/StandardCapabilityNeutralityTests.kt
tests/FlowCiCdBiasInventoryTests.kt
EOF_EXPECTED
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only 4474cfd404af9629ea8fd861629ebb8a58887d17 | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Publish one clean commit and reopen final PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/pulls/110 -f state=closed >/dev/null
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git add -A
          git diff --cached --check
          git reset --soft 4474cfd404af9629ea8fd861629ebb8a58887d17
          git commit -m "Harden neutrality and fail-closed evidence boundaries"
          git push --force origin HEAD:agent/core-neutrality-governance-hardening
          git push origin --delete agent/pr110-finalize-base || true
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/pulls/110 -f state=open >/dev/null
