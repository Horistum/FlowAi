name: Flow CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Validate Flow Agent Structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent Context
        run: python3 tools/flow_agent_runner.py

      - name: Compile and Test
        shell: bash
        run: |
          mkdir -p build/ci
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee build/ci/gradle-test.log
          exit ${PIPESTATUS[0]}

      - name: Upload Gradle Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            build/ci/gradle-test.log
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn

      - name: Run Conformance
        shell: bash
        run: |
          mkdir -p build/ci
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee build/ci/conformance.log
          exit ${PIPESTATUS[0]}

      - name: Upload Conformance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            build/ci/conformance.log
          if-no-files-found: warn

      - name: Write CI Summary
        if: always()
        run: |
          echo "# Flow CI Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks executed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent structure validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow agent context generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle clean test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts uploaded:" >> "$GITHUB_STEP_SUMMARY"
          echo "- gradle-test-reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- conformance-report" >> "$GITHUB_STEP_SUMMARY"
