    if: ${{ always() && !cancelled() && needs.github-actions-condition-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Authenticate Actual Native Job Results
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REVISION: ${{ github.sha }}
          FLOW_CONDITION_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          ./gradlew --no-daemon --build-cache :flow-conformance-kit:installDist --stacktrace
          git fetch --no-tags origin "$WORKFLOW_REVISION"
          git show "$WORKFLOW_REVISION:.github/workflows/adapter-runtime-check.yml" > "$RUNNER_TEMP/condition-envelope.yml"
          java -cp 'flow-conformance-kit/build/install/flow-conformance/lib/*' \
            org.flowlang.conformance.GitHubActionsConditionRuntimeCertificationCli verify \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/condition-envelope.yml" \
            "$RUNNER_TEMP/github-condition-evidence"
          cat "$RUNNER_TEMP/github-condition-evidence/true/behavior-matrix.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/github-condition-evidence/false/behavior-matrix.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Condition Proofs And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory "$RUNNER_TEMP/github-condition-evidence" --artifact github-actions-condition-runtime --revision "$EXPECTED_SHA"
      - name: Upload Condition Runtime Evidence
