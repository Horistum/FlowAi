        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Manual Approval And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsApprovalRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-approval-certification/approve/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-approval-certification/reject/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Assessment Proof And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory flow-conformance-kit/build/jenkins-approval-certification --artifact jenkins-approval-runtime --revision "$EXPECTED_SHA"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-approval-runtime
          path: flow-conformance-kit/build/jenkins-approval-certification/
          if-no-files-found: error
          retention-days: 7

  adapter-certification-portfolio:
    needs: [jenkins-checkout-runtime, jenkins-failure-runtime, jenkins-condition-runtime, jenkins-error-boundary-runtime, jenkins-local-recovery-runtime, jenkins-approval-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # Without a run-id or token, download-artifact is restricted to this workflow run.
      # Preserve artifact directories so scenarios from separate jobs cannot overwrite each other.
      - name: Download Same-Run Runtime Evidence
        uses: actions/download-artifact@v4
        with:
          pattern: jenkins-*-runtime
          path: build/certification-inputs
      - name: Reauthenticate And Aggregate Runtime Evidence
        env:
          FLOW_CERTIFICATION_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FLOW_CERTIFICATION_JOB_RECEIPTS: ${{ toJSON(needs) }}
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyAdapterCertificationPortfolio --stacktrace
      - name: Publish Portfolio Summary
        run: cat flow-conformance-kit/build/adapter-certification-portfolio/portfolio.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Verified Portfolio
        uses: actions/upload-artifact@v4
        with:
          name: adapter-certification-portfolio
          path: flow-conformance-kit/build/adapter-certification-portfolio/
          if-no-files-found: error
          retention-days: 7
