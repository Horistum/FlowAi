name: Adapter Runtime Certification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jenkins-checkout-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Checkout And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsCheckoutRuntime --stacktrace
      - name: Publish Bounded Observation Summary
        run: cat flow-conformance-kit/build/jenkins-runtime-certification/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-checkout-runtime
          path: flow-conformance-kit/build/jenkins-runtime-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-failure-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Failure And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsFailureRuntime --stacktrace
      - name: Publish Bounded Observation Summary
        run: cat flow-conformance-kit/build/jenkins-failure-certification/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-failure-runtime
          path: flow-conformance-kit/build/jenkins-failure-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-condition-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Conditions And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsConditionRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-condition-certification/true/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-condition-certification/false/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-condition-runtime
          path: flow-conformance-kit/build/jenkins-condition-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-error-boundary-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Error Boundaries And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsErrorBoundaryRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-error-boundary-certification/failure/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-error-boundary-certification/success/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-error-boundary-runtime
          path: flow-conformance-kit/build/jenkins-error-boundary-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-local-recovery-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Local Recovery And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsLocalRecoveryRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-local-recovery-certification/failure/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-local-recovery-certification/success/evidence-view.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-local-recovery-runtime
          path: flow-conformance-kit/build/jenkins-local-recovery-certification/
          if-no-files-found: error
          retention-days: 7
