      - name: Pin Assessment Proof And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory flow-conformance-kit/build/jenkins-condition-certification --artifact jenkins-condition-runtime --revision "$EXPECTED_SHA"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-condition-runtime
          path: flow-conformance-kit/build/jenkins-condition-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-error-boundary-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Error Boundaries And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsErrorBoundaryRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-error-boundary-certification/failure/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-error-boundary-certification/success/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Assessment Proof And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory flow-conformance-kit/build/jenkins-error-boundary-certification --artifact jenkins-error-boundary-runtime --revision "$EXPECTED_SHA"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-error-boundary-runtime
          path: flow-conformance-kit/build/jenkins-error-boundary-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-local-recovery-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Local Recovery And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsLocalRecoveryRuntime --stacktrace
      - name: Publish Bounded Observation Summaries
        run: |
          cat flow-conformance-kit/build/jenkins-local-recovery-certification/failure/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
          cat flow-conformance-kit/build/jenkins-local-recovery-certification/success/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Assessment Proof And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory flow-conformance-kit/build/jenkins-local-recovery-certification --artifact jenkins-local-recovery-runtime --revision "$EXPECTED_SHA"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
