name: Adapter Runtime Certification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jenkins-checkout-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Checkout And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsCheckoutRuntime --stacktrace
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-checkout-runtime
          path: flow-conformance-kit/build/jenkins-runtime-certification/
          if-no-files-found: error
          retention-days: 7

  jenkins-failure-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact Revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Exact Revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Real Jenkins Failure And Mutants
        run: ./gradlew --no-daemon --build-cache :flow-conformance-kit:verifyJenkinsFailureRuntime --stacktrace
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-failure-runtime
          path: flow-conformance-kit/build/jenkins-failure-certification/
          if-no-files-found: error
          retention-days: 7
