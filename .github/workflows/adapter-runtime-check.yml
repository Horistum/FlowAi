          cat flow-conformance-kit/build/jenkins-condition-certification/false/behavior-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Assessment Proof And Trust
        id: receipt
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/certification_portfolio_receipt.py --directory flow-conformance-kit/build/jenkins-condition-certification --artifact jenkins-condition-runtime --revision "$EXPECTED_SHA"
      - name: Upload Runtime Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-condition-runtime
          path: flow-conformance-kit/build/jenkins-condition-certification/
