name: SI-01 Materialization Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'flow/si-01-control-evidence-scope' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: flow/si-01-control-evidence-scope
      - name: Replace lossy control rederivation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt")
          text = path.read_text()
          old = '''        val tasks = PlanDependencyRelations.flatten(plan.nodes).filterIsInstance<TaskNode>()
        val canonicalCapabilities = tasks.mapNotNull { task -> task.semanticCapability?.let { runCatching { StandardCapability.valueOf(it) }.getOrNull() } }
        val expectedCanonical = CanonicalControlRequirementAuthority.requirementsForCapabilities(canonicalCapabilities)
        val expectedModule = PlanningControlAuthority.rederivedModuleRequirements(plan.nodes, modules)
'''
          new = '''        val canonicalReconstruction = ExecutionPlanCanonicalControlRequirementAuthority.rederive(plan)
        issues += canonicalReconstruction.issues
        val expectedCanonical = canonicalReconstruction.requirements
        val expectedModule = PlanningControlAuthority.rederivedModuleRequirements(plan.nodes, modules)
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one legacy control rederivation block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt
          git commit -m "SI-01: preserve operation scope in materialization validation [skip ci]"
          git push origin HEAD:flow/si-01-control-evidence-scope
