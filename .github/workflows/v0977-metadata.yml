name: Apply v0.9.7.7 Metadata

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0977-metadata.yml

permissions:
  contents: write

jobs:
  apply-metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.7-universal-control-policy-requirements
          fetch-depth: 0

      - name: Verify and apply metadata
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            echo "1f04f1e0f1ec0005fb706a1546ef9b32f59c2544e67cd6115a8c55ef80823b7a  .flow-agent/tmp/v0977-metadata-000.patch" | sha256sum --check
            echo "7abe291254decb88e1756cec4e47c1c4ec7e62f408218935f9d7cc3087fec465  .flow-agent/tmp/v0977-metadata-001.patch" | sha256sum --check
            echo "6ca29760b98c8411c7472ffabfa6fa58c3e65cac331ec43ec879c12f55e509d2  .flow-agent/tmp/v0977-metadata-002.patch" | sha256sum --check
            echo "d1ad4ff563c016d6e4a8a1289628d7adac917f0c3c3c9e5c7760413d73acb8cc  .flow-agent/tmp/v0977-metadata-003.patch" | sha256sum --check
            echo "" | base64 --decode > /tmp/v0977-metadata-004.patch
            echo "ed704e197ae7c6e96eb367825215beca661e65f1b7dbf241c485a014e349d7c1  /tmp/v0977-metadata-004.patch" | sha256sum --check
            cat .flow-agent/tmp/v0977-metadata-000.patch \
                .flow-agent/tmp/v0977-metadata-001.patch \
                .flow-agent/tmp/v0977-metadata-002.patch \
                .flow-agent/tmp/v0977-metadata-003.patch \
                /tmp/v0977-metadata-004.patch \
                > /tmp/v0977-metadata.patch
            echo "d0ee4b3e05d24b045f6557a1a664c44163ed38f906d14aa8c58e96e16ffb2f36  /tmp/v0977-metadata.patch" | sha256sum --check
            git apply --check /tmp/v0977-metadata.patch
            git apply /tmp/v0977-metadata.patch
            git diff --check
          } 2>&1 | tee /tmp/v0977-metadata.log

      - name: Upload metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0977-metadata-diagnostics
          path: /tmp/v0977-metadata.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0977-metadata-*.patch
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0977-metadata.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete v0.9.7.7 roadmap and migration metadata"
          git push origin HEAD:agent/v0.9.7.7-universal-control-policy-requirements
