name: C0.3 Finalize And Cleanup

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'milank78git/FlowAi' && github.event.pull_request.head.ref == 'agent/c0-3-semantic-equivalence-rules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/c0-3-semantic-equivalence-rules
          fetch-depth: 0

      - name: Finalize C0.3 lifecycle and roadmap atomically
        run: python3 .github/scripts/c0_3_finalize.py

      - name: Commit finalized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete C0.3 and activate C0.4"
          git push origin HEAD:agent/c0-3-semantic-equivalence-rules

      - name: Delete obsolete staging branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/agent/c0-3-completion-staging >/dev/null 2>&1; then
            git push origin --delete agent/c0-3-completion-staging
          fi
