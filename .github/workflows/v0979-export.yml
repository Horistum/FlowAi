name: Export v0.9.7.9 Workspace

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0979-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9-intent-lowering-diagnostic-honesty
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.gradle --exclude=build -czf /tmp/flow-v0979-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: flow-v0979-source
          path: /tmp/flow-v0979-source.tar.gz
          retention-days: 1
