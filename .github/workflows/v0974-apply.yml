name: Apply v0.9.7.4 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-apply.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0974-parts
          for index in 00 01 02 03 04 05 06; do
            tr -d '\r\n' < ".flow-agent/tmp/v0974-patch1-part-${index}.b64" > "/tmp/v0974-parts/part-${index}"
          done
          cat > /tmp/v0974-parts.sha256 <<'EOF'
          d1da9bd87cc3ae7a5b9123391a8963762e0705dba00c8deb8671bbb84b1c0bba  /tmp/v0974-parts/part-00
          2fa4083e9c4e965e87f1f52fd0fa65a493312215a1a2b3ec4e3f6373e7162d25  /tmp/v0974-parts/part-01
          5d4c041b753df678958306f9478f6366961be47c24b48f051ea5124160af62e4  /tmp/v0974-parts/part-02
          ba695706e78fbbc802f3608b108a678e3b8e06fc8b0aeeeed5697aa826d4bc77  /tmp/v0974-parts/part-03
          2a0657a6ebe4a0efc52a2d9584688ff0a791625f276d167b336af98d34ce6576  /tmp/v0974-parts/part-04
          14adf24306a9ca54af8e8f7fdf53a54c4a3fe7820542b482612e22f3ea88b6b1  /tmp/v0974-parts/part-05
          d2901b5a8e3227d72ef6e8b69d1fd68362e77ebe8ad8a334beb84d04d41c89d6  /tmp/v0974-parts/part-06
          EOF
          sed -i 's/^          //' /tmp/v0974-parts.sha256
          sha256sum --check /tmp/v0974-parts.sha256
          cat /tmp/v0974-parts/part-{00..06} | base64 --decode > /tmp/v0974-patch1.tar.gz
          echo "dc04281f104eef62f9851e2a2f156f9666075024f1a6b85d3258753f8d583115  /tmp/v0974-patch1.tar.gz" | sha256sum --check

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0974-patch1.tar.gz
          rm -f .flow-agent/tmp/v0974-patch1-part-{00..06}.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0974-source-export.yml
          rm -f .github/workflows/v0974-apply.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.4 dependency continuity contract"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
