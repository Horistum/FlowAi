name: Apply v0.9.7.4 Evidence Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-fix1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Verify segmented fix payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0974-fix1-parts
          for index in 00 01 02 03 04 05 06 07 08; do
            tr -d '\r\n' < ".flow-agent/tmp/v0974-fix1-part-${index}.b64" > "/tmp/v0974-fix1-parts/part-${index}"
          done
          cat > /tmp/v0974-fix1-parts.sha256 <<'EOF'
          98f66192fcfdb461ce70cf1326f5209804daf597245466a1940a379360cb97bd  /tmp/v0974-fix1-parts/part-00
          f435d2b5f0222060a3d56c76c58f861270d36a83eab9908056d2e72b7307c975  /tmp/v0974-fix1-parts/part-01
          b6d2d1fca583160bf1beeffffe12db63aa550458236524fe56aafdceea65d2f7  /tmp/v0974-fix1-parts/part-02
          51250cb1dccb91a61874aaeb75d070049881b43538421c7ad9206f0ec282de9f  /tmp/v0974-fix1-parts/part-03
          f13c00eda1a33844dba171513b6d3c301499b4f6d9dca31dd509689d9d4a6abe  /tmp/v0974-fix1-parts/part-04
          3e8f92dc05eff92c24bc9efb9092b9ac0b8f83da6d8a68b3d9604e373a9cffba  /tmp/v0974-fix1-parts/part-05
          1265aa7879367cd645c2f5709d7acc98b6dcf7cf1c95ca33a77ab2542721352a  /tmp/v0974-fix1-parts/part-06
          1f8a7f339562512397bf1593e3749c302c0ab0fb654418462ca3a936118029ae  /tmp/v0974-fix1-parts/part-07
          083a798cc73060ab5351c3c875dbe77feb101ba594ff8487cf31eee2d312e77c  /tmp/v0974-fix1-parts/part-08
          EOF
          sed -i 's/^          //' /tmp/v0974-fix1-parts.sha256
          sha256sum --check /tmp/v0974-fix1-parts.sha256
          cat /tmp/v0974-fix1-parts/part-{00..08} | base64 --decode > /tmp/v0974-fix1.tar.gz
          echo "f91ed1ad9dce753aae73c71944e836a2cd0c6ca09a7290549a8700637df88e4d  /tmp/v0974-fix1.tar.gz" | sha256sum --check
          tar -tzf /tmp/v0974-fix1.tar.gz > /dev/null

      - name: Apply continuity evidence fix
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0974-fix1.tar.gz
          rm -f .flow-agent/tmp/v0974-fix1.tar.gz
          rm -f .flow-agent/tmp/v0974-fix1-part-{00..08}.b64
          rm -f .flow-agent/v0974-payload-diagnostics.txt
          rm -f .flow-agent/v0974-segment-diagnostics.txt
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0974-fix1.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align continuity evidence and reference expectations"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
