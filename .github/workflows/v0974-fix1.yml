name: Diagnose v0.9.7.4 Evidence Payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-fix1.yml

permissions:
  contents: write

jobs:
  diagnose-payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Record payload diagnostics
        shell: bash
        run: |
          set -u
          file=.flow-agent/tmp/v0974-fix1.tar.gz
          {
            printf 'bytes='; wc -c < "${file}"
            printf 'sha256='; sha256sum "${file}" | cut -d' ' -f1
            printf 'file='; file -b "${file}"
            echo 'archive:'
            tar -tzf "${file}" 2>&1 || true
          } > .flow-agent/v0974-payload-diagnostics.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add .flow-agent/v0974-payload-diagnostics.txt
          git commit -m "Record v0.9.7.4 payload diagnostics"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
