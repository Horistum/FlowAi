name: Diagnose v0.9.7.4 Segments

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-fix1.yml

permissions:
  contents: write

jobs:
  diagnose-segments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Record segment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            for index in 00 01 02 03 04 05 06 07 08; do
              file=".flow-agent/tmp/v0974-fix1-part-${index}.b64"
              printf '%s bytes=' "${file}"
              tr -d '\r\n' < "${file}" | wc -c
              printf '%s sha256=' "${file}"
              tr -d '\r\n' < "${file}" | sha256sum | cut -d' ' -f1
            done
          } > .flow-agent/v0974-segment-diagnostics.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add .flow-agent/v0974-segment-diagnostics.txt
          git commit -m "Record v0.9.7.4 segment diagnostics"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
