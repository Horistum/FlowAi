name: Apply v0.9.7.4 Evidence Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-fix1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0

      - name: Verify and apply evidence fix
        shell: bash
        run: |
          set -euo pipefail
          echo "f91ed1ad9dce753aae73c71944e836a2cd0c6ca09a7290549a8700637df88e4d  .flow-agent/tmp/v0974-fix1.tar.gz" | sha256sum --check
          tar -xzf .flow-agent/tmp/v0974-fix1.tar.gz
          rm -f .flow-agent/tmp/v0974-fix1.tar.gz
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0974-fix1.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align continuity evidence and reference expectations"
          git push origin HEAD:agent/v0.9.7.4-universal-dependency-continuity
