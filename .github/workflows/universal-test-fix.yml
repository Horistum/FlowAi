name: Universal Model Test Correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .flow-agent/transactions/universal-test-fix.patch.gz.b64)" = "bfc4cb2a6ce7d521ccb1cfa4da15df3cf96c2f84"
          echo "369b5136d670b4de6a9b0e4a7ccb9a2944b8a6e70592465b8d8e7128f4786d59  .flow-agent/transactions/universal-test-fix.patch.gz.b64" | sha256sum -c -
          base64 --decode .flow-agent/transactions/universal-test-fix.patch.gz.b64 | gzip --decompress > /tmp/universal-test-fix.patch
          echo "46c1a7e5435f7376a45cd28e498538182c7757d0226557b8bc0af9bc5bbb28d2  /tmp/universal-test-fix.patch" | sha256sum -c -
          git apply --check /tmp/universal-test-fix.patch
          git apply /tmp/universal-test-fix.patch

          test "$(git hash-object .flow-agent/transactions/universal-node-inventory-fix.patch.gz.b64)" = "11000f56a02ad55823d3a8c3fab5862606269392"
          echo "30242febe0717b2ac4a453935dd6bf8460ef9bf85ecb6ccab12b3797d21a2a41  .flow-agent/transactions/universal-node-inventory-fix.patch.gz.b64" | sha256sum -c -
          base64 --decode .flow-agent/transactions/universal-node-inventory-fix.patch.gz.b64 | gzip --decompress > /tmp/universal-node-inventory-fix.patch
          echo "f1a3f40067eaae0ae690efc92150e04887bbe83b8b9c1aad07b5dac4216e7e91  /tmp/universal-node-inventory-fix.patch" | sha256sum -c -
          git apply --check /tmp/universal-node-inventory-fix.patch
          git apply /tmp/universal-node-inventory-fix.patch
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run affected regression suites
        id: regression
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          {
            ./gradlew --no-daemon compileTestKotlin --stacktrace --console=plain && \
            ./gradlew --no-daemon test --stacktrace --console=plain \
              --tests FlowCompatibilityReadinessHonestyTests \
              --tests FlowConnectedMaterializationPipelineTests \
              --tests FlowRendererFailureSemanticsTests \
              --tests FlowSpecJUnitTest \
              --tests IntentLoweringNoShellProjectionTests \
              --tests ManifestHonestyTests
          } 2>&1 | tee /tmp/universal-model-regression.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-regression-diagnostics
          path: |
            /tmp/universal-model-regression.log
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: warn

      - name: Persist validated correction
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/transactions/universal-test-fix.patch.gz.b64
          rm -f .flow-agent/transactions/universal-node-inventory-fix.patch.gz.b64
          rmdir .flow-agent/transactions 2>/dev/null || true
          rm -f .github/workflows/universal-test-fix.yml
          git config user.name "flow-ai-validation"
          git config user.email "flow-ai-validation@users.noreply.github.com"
          git add -A
          git commit -m "Correct universal model regression contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
