name: Universal Model Test Correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .flow-agent/transactions/universal-test-fix.patch.gz.b64)" = "bfc4cb2a6ce7d521ccb1cfa4da15df3cf96c2f84"
          echo "369b5136d670b4de6a9b0e4a7ccb9a2944b8a6e70592465b8d8e7128f4786d59  .flow-agent/transactions/universal-test-fix.patch.gz.b64" | sha256sum -c -
          base64 --decode .flow-agent/transactions/universal-test-fix.patch.gz.b64 | gzip --decompress > /tmp/universal-test-fix.patch
          echo "46c1a7e5435f7376a45cd28e498538182c7757d0226557b8bc0af9bc5bbb28d2  /tmp/universal-test-fix.patch" | sha256sum -c -
          git apply --check /tmp/universal-test-fix.patch
          git apply /tmp/universal-test-fix.patch

          python3 - <<'PY'
          from pathlib import Path

          policy = Path("src/main/kotlin/org/flowlang/generators/manifest/TargetRenderPolicy.kt")
          text = policy.read_text(encoding="utf-8")
          old = '''        sb.appendLine("  findings:")
                  readiness.findings.forEach { finding ->
                      sb.appendLine("    - nodeId: ${quoted(finding.nodeId)}")
                      sb.appendLine("      status: ${quoted(finding.status)}")
                      sb.appendLine("      reason: ${quoted(finding.reason)}")
                  }
                  val requirements = manifest.bindingRequirements()
          '''
          new = '''        sb.appendLine("  findings:")
                  readiness.findings.forEach { finding ->
                      sb.appendLine("    - nodeId: ${quoted(finding.nodeId)}")
                      sb.appendLine("      status: ${quoted(finding.status)}")
                      sb.appendLine("      reason: ${quoted(finding.reason)}")
                  }
                  sb.appendLine("  semanticInventory:")
                  manifest.reviewInventoryLeaves().forEach { step ->
                      sb.appendLine("    - nodeId: ${quoted(step.id)}")
                      sb.appendLine("      module: ${quoted(step.module)}")
                      sb.appendLine("      action: ${quoted(step.action)}")
                      sb.appendLine("      materializationStatus: ${quoted(step.materialization.status.name)}")
                      sb.appendLine("      materializationEvidence: ${quoted(step.materialization.evidenceReference.orEmpty())}")
                      sb.appendLine("      rendererPayloadPresent: ${step.rendererPayload != null}")
                      step.rendererPayload?.let { payload ->
                          sb.appendLine("      rendererPayloadKind: ${quoted(payload.kind.name)}")
                          sb.appendLine("      rendererPayloadReference: ${quoted(payload.reference)}")
                          sb.appendLine("      rendererPayloadEvidence: ${quoted(payload.evidenceReference)}")
                      }
                  }
                  val requirements = manifest.bindingRequirements()
          '''
          if old not in text:
              raise SystemExit("Target review findings block did not match the expected validated source.")
          text = text.replace(old, new, 1)
          marker = '''    private data class BindingRequirement(
          '''
          helpers = '''    private fun TargetManifest.reviewInventoryLeaves(): List<TargetStep> = jobs
                  .flatMap { job -> job.steps.flatMap { it.flattenForReviewInventory() } }
                  .filter { it.isReviewInventoryLeaf() }

              private fun TargetStep.isReviewInventoryLeaf(): Boolean = children.isEmpty() && type !in setOf(
                  "try-body", "error-handler", "parallel", "parallel-branch", "loop", "match", "retry", "condition"
              )

              private fun TargetStep.flattenForReviewInventory(): List<TargetStep> =
                  listOf(this) + children.flatMap { it.flattenForReviewInventory() }

              private data class BindingRequirement(
          '''
          if marker not in text:
              raise SystemExit("Target review helper insertion point was not found.")
          policy.write_text(text.replace(marker, helpers, 1), encoding="utf-8")

          tests = Path("tests/FlowRendererFailureSemanticsTests.kt")
          text = tests.read_text(encoding="utf-8")
          old = '''        outputs.forEach { output ->
                      expectedNodeIds.forEach { nodeId ->
                          assertTrue(output.contains("nodeId: \\"$nodeId\\""), "Review artifact silently dropped $nodeId:\\n$output")
                      }
                  }
          '''
          new = '''        outputs.forEach { output ->
                      assertTrue(output.contains("semanticInventory:"), "Review artifact must expose complete semantic inventory:\\n$output")
                      expectedNodeIds.forEach { nodeId ->
                          assertTrue(output.contains("nodeId: \\"$nodeId\\""), "Review artifact silently dropped $nodeId:\\n$output")
                      }
                  }
                  val jenkinsOutput = outputs.first()
                  assertTrue(jenkinsOutput.contains("nodeId: \\"git_checkout_1\\""))
                  assertTrue(jenkinsOutput.contains("materializationStatus: \\"NATIVE\\""))
                  assertTrue(jenkinsOutput.contains("rendererPayloadPresent: true"))
          '''
          if old not in text:
              raise SystemExit("Renderer semantic inventory assertion block did not match the expected source.")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run affected regression suites
        id: regression
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          {
            ./gradlew --no-daemon compileTestKotlin --stacktrace --console=plain && \
            ./gradlew --no-daemon test --stacktrace --console=plain \
              --tests FlowCompatibilityReadinessHonestyTests \
              --tests FlowConnectedMaterializationPipelineTests \
              --tests FlowRendererFailureSemanticsTests \
              --tests FlowSpecJUnitTest \
              --tests IntentLoweringNoShellProjectionTests \
              --tests ManifestHonestyTests
          } 2>&1 | tee /tmp/universal-model-regression.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-regression-diagnostics
          path: |
            /tmp/universal-model-regression.log
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: warn

      - name: Persist validated correction
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/transactions/universal-test-fix.patch.gz.b64
          rm -f .flow-agent/transactions/universal-node-inventory-fix.patch.gz.b64
          rm -f .flow-agent/transactions/universal-review-inventory-fix.patch.gz.b64
          rmdir .flow-agent/transactions 2>/dev/null || true
          rm -f .github/workflows/universal-test-fix.yml
          git config user.name "flow-ai-validation"
          git config user.email "flow-ai-validation@users.noreply.github.com"
          git add -A
          git commit -m "Correct universal model regression contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
