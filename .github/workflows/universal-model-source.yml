name: Universal Model Transaction

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.00)" = "b257f4aa7638965f30f97f07eca53f56de0cd1ac"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.01)" = "00495eaf0b0419d93a8b55e15e047a8c1cd892b6"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.02a)" = "20aff9564169aa857560142112f978ec49884177"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.02b)" = "bba9b0fb19b40dbef548339451a8829318b17347"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.02c)" = "cd252ee128ad00c343097eecaa7c229e5c331add"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.02d)" = "6f6aecd33003e8ec4e00bd39fd6a99b6fef5e17a"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.03)" = "881966ea0f012fb27f86ecacabf999f7b795f0b3"
          test "$(git hash-object .flow-agent/transactions/universal-model.patch.gz.b64.04)" = "254f6953a185fc0cf6ad3c48e1cdf14e9f636d82"
          test "$(git hash-object .flow-agent/transactions/universal-model-compile-fix.patch.gz.b64)" = "fd6b74845cc2a30655409f56b4fa820ba49384b7"
          cat \
            .flow-agent/transactions/universal-model.patch.gz.b64.00 \
            .flow-agent/transactions/universal-model.patch.gz.b64.01 \
            .flow-agent/transactions/universal-model.patch.gz.b64.02a \
            .flow-agent/transactions/universal-model.patch.gz.b64.02b \
            .flow-agent/transactions/universal-model.patch.gz.b64.02c \
            .flow-agent/transactions/universal-model.patch.gz.b64.02d \
            .flow-agent/transactions/universal-model.patch.gz.b64.03 \
            .flow-agent/transactions/universal-model.patch.gz.b64.04 \
            > /tmp/universal-model.patch.gz.b64
          echo "62e6e2a48cb80d025ace2f7c1d9cee531ea9b0405315be95ece30c0e058c7950  /tmp/universal-model.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/universal-model.patch.gz.b64 | gzip --decompress > /tmp/universal-model.patch
          echo "b3f20e44654333e51c875db81aa0297ce7c299916cf8472212bc378a157af6df  /tmp/universal-model.patch" | sha256sum -c -
          git apply --check /tmp/universal-model.patch
          git apply /tmp/universal-model.patch
          echo "591071c5f12381857e9c5edb5ccc98f080a1cb50701c9428473fffea41774fa5  .flow-agent/transactions/universal-model-compile-fix.patch.gz.b64" | sha256sum -c -
          base64 --decode .flow-agent/transactions/universal-model-compile-fix.patch.gz.b64 | gzip --decompress > /tmp/universal-model-compile-fix.patch
          echo "b8d170fa989024b231846725541febc49049063c2939054992e66e0e12f67d57  /tmp/universal-model-compile-fix.patch" | sha256sum -c -
          git apply --check /tmp/universal-model-compile-fix.patch
          git apply /tmp/universal-model-compile-fix.patch
          git diff --check

      - name: Verify repaired architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'IntentWorkflowKind\.SCHEDULE|StandardCapability\.SCHEDULE' src/main/kotlin
          ! grep -R -n -E 'val (jenkins|githubActions|tekton): String' src/main/kotlin
          ! grep -R -n -E 'steps: \[\]|flow-materialization-required' src/main/kotlin/org/flowlang/generators
          ! grep -R -n -E 'selector \?: "app=|StringLiteralNode\("default"\)' src/main/kotlin/org/flowlang/intent
          test "$(grep -R -l 'reconcileCompatibilityReadiness()' src/main/kotlin/org/flowlang/generators/manifest | wc -l)" -ge 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile production and tests
        id: compile
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon compileTestKotlin --stacktrace --console=plain 2>&1 | tee /tmp/universal-model-compile.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-compile-diagnostics
          path: /tmp/universal-model-compile.log
          if-no-files-found: error

      - name: Persist validated implementation
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .flow-agent/transactions
          rm -f .github/workflows/universal-model-source.yml
          git config user.name "flow-ai-validation"
          git config user.email "flow-ai-validation@users.noreply.github.com"
          git add -A
          git commit -m "Complete universal model integrity and v0.9.5 contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
