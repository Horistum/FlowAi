name: Export v0.9.7.8 Workspace

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0978-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.8-abstract-execution-topology
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude=build \
            --exclude='**/build' \
            --exclude=.github/workflows/v0978-export.yml \
            -czf /tmp/flow-v0978-source.tar.gz .
          sha256sum /tmp/flow-v0978-source.tar.gz > /tmp/flow-v0978-source.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: flow-v0978-source
          path: |
            /tmp/flow-v0978-source.tar.gz
            /tmp/flow-v0978-source.sha256
          retention-days: 1
