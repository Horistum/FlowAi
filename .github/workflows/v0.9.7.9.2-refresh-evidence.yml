name: v0.9.7.9.2 Refresh Canonical Evidence

on:
  push:
    branches:
      - agent/v0.9.7.9.2-artifact-derived-lowering-evidence

permissions:
  contents: write

jobs:
  refresh-evidence:
    if: ${{ !startsWith(github.event.head_commit.message, '[v0.9.7.9.2-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.2-artifact-derived-lowering-evidence
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply final evidence hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt')
          text = path.read_text()
          replacements = {
              'import org.flowlang.intent.IntentPolicyType\n': '',
              'import org.flowlang.planner.PlanTrigger\n': '',
              'sourceFields(intent, systems, workflows, policies, inputNames)': 'sourceFields(intent, systems, policies, inputNames)',
              '        workflows: List<IntentWorkflowMetadata>,\n': '',
              'return bytes.joinToString("") { byte -> "%02x".format(byte) }': 'return bytes.joinToString("") { byte -> "%02x".format(byte.toInt() and 0xff) }',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Regenerate canonical reference bundles
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy"
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/checkout-build-image.intent.yaml --out conformance/snapshots/checkout-build-image --scenario-id checkout-build-image --targets jenkins"

      - name: Remove one-shot workflow and commit evidence
        run: |
          git rm .github/workflows/v0.9.7.9.2-refresh-evidence.yml
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt conformance/snapshots
          git commit -m "[v0.9.7.9.2-evidence] Refresh artifact-derived lowering proof"
          git push origin HEAD:agent/v0.9.7.9.2-artifact-derived-lowering-evidence
