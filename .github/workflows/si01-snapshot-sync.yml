name: SI-01 Snapshot Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'flow/si-01-control-evidence-scope' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: flow/si-01-control-evidence-scope
          fetch-depth: 0

      - name: Restore canonical formatting without changing synchronized meaning
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          base = "483e0b3ec17bf132c3dab8fd1cb0a287d8b64bf8"
          files = [
              "conformance/snapshots/build-test-deploy/flow-ast.json",
              "conformance/snapshots/checkout-build-image/execution-plan.json",
              "conformance/snapshots/checkout-build-image/flow-ast.json",
              "conformance/snapshots/github-actions-checkout-build-image/execution-plan.json",
              "conformance/snapshots/github-actions-checkout-build-image/flow-ast.json",
          ]

          for name in files:
              path = Path(name)
              synchronized = json.loads(path.read_text())
              text = subprocess.check_output(
                  ["git", "show", f"{base}:{name}"],
                  text=True,
              )

              if name.endswith("flow-ast.json"):
                  before = text
                  text = text.replace('"astVersion" : "2.0"', '"astVersion" : "2.1"', 1)
                  text = text.replace('"astVersion":"2.0"', '"astVersion":"2.1"', 1)
                  if text == before:
                      raise SystemExit(f"{name}: AST version 2.0 marker was not found")
              else:
                  before = text
                  text = text.replace('"planVersion" : "2.0"', '"planVersion" : "2.1"', 1)
                  text = text.replace('"planVersion":"2.0"', '"planVersion":"2.1"', 1)
                  if text == before:
                      raise SystemExit(f"{name}: plan version 2.0 marker was not found")

              if name == "conformance/snapshots/build-test-deploy/flow-ast.json":
                  pattern = re.compile(
                      r'(?m)^(?P<indent>\s*)"message" : "Approval is required before deployment in this reference flow\."(?P<nl>\r?\n)(?P<closing>\s*)\}'
                  )

                  def add_scope(match: re.Match[str]) -> str:
                      indent = match.group("indent")
                      nl = match.group("nl")
                      closing = match.group("closing")
                      return (
                          f'{indent}"message" : "Approval is required before deployment in this reference flow.",{nl}'
                          f'{indent}"scope" : {{{nl}'
                          f'{indent}  "kind" : "INTENT"{nl}'
                          f'{indent}}}{nl}'
                          f'{closing}}}'
                      )

                  text, count = pattern.subn(add_scope, text, count=1)
                  if count != 1:
                      raise SystemExit("build-test-deploy approval scope insertion did not match exactly once")
                  old_detail = '"detail" : "approve-prod"'
                  new_detail = '"detail" : "Intent-level approval predecessor(s): approve-prod"'
                  if old_detail not in text:
                      raise SystemExit("build-test-deploy approval evidence detail was not found")
                  text = text.replace(old_detail, new_detail, 1)

              candidate = json.loads(text)
              if candidate != synchronized:
                  raise SystemExit(f"{name}: formatting cleanup changed synchronized JSON meaning")
              path.write_text(text)
              print(f"Preserved canonical formatting: {name}")

      - name: Commit formatting-preserving snapshots
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting cleanup was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conformance
          git commit -m "SI-01: preserve reference snapshot formatting [skip ci]"
          git push origin HEAD:flow/si-01-control-evidence-scope
