name: SI-01 Snapshot Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'flow/si-01-control-evidence-scope' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: flow/si-01-control-evidence-scope
          fetch-depth: 0

      - name: Synchronize bounded 2.1 snapshots
        shell: python
        run: |
          import json
          from pathlib import Path

          changed = []

          def write_if_changed(path: Path, original: object, updated: object) -> None:
              if updated == original:
                  return
              path.write_text(json.dumps(updated, indent=2) + "\n")
              changed.append(path)

          # ControlRequirement.scope is serialized into Flow AST, so every
          # committed AST reference produced by the current planner is 2.1.
          for ast in Path("conformance").rglob("flow-ast.json"):
              original = json.loads(ast.read_text())
              updated = json.loads(ast.read_text())
              if updated.get("astVersion") == "2.0":
                  updated["astVersion"] = "2.1"

              if ast.as_posix() == "conformance/snapshots/build-test-deploy/flow-ast.json":
                  requirements = updated.get("flow", {}).get("controlRequirements", [])
                  requirement = next(
                      (item for item in requirements if item.get("id") == "control.approval.production-approval"),
                      None,
                  )
                  if requirement is None:
                      raise SystemExit("Expected build-test-deploy approval requirement was not found")
                  requirement["scope"] = {"kind": "INTENT"}

                  evidence = updated.get("flow", {}).get("controlEvidence", [])
                  record = next(
                      (item for item in evidence if item.get("requirementId") == "control.approval.production-approval"),
                      None,
                  )
                  if record is None:
                      raise SystemExit("Expected build-test-deploy approval evidence was not found")
                  record["detail"] = "Intent-level approval predecessor(s): approve-prod"

              write_if_changed(ast, original, updated)

          # These target-scoped plans have no control requirements; the only
          # generated contract change is planVersion 2.0 -> 2.1.
          for root in [
              Path("conformance/snapshots/checkout-build-image"),
              Path("conformance/snapshots/github-actions-checkout-build-image"),
              Path("conformance/evidence/semantic-equivalence/implementation-pairs"),
          ]:
              if not root.is_dir():
                  continue
              for path in root.rglob("execution-plan.json"):
                  original = json.loads(path.read_text())
                  updated = json.loads(path.read_text())
                  if updated.get("planVersion") == "2.0":
                      updated["planVersion"] = "2.1"
                  write_if_changed(path, original, updated)

          print("Synchronized:")
          for path in changed:
              print(f"- {path}")

      - name: Commit synchronized snapshots
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No snapshot changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conformance
          git commit -m "SI-01: synchronize 2.1 reference snapshots [skip ci]"
          git push origin HEAD:flow/si-01-control-evidence-scope
