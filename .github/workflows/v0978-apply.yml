name: Apply v0.9.7.8 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0978-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.8-abstract-execution-topology
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply implementation
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            echo "23516f2bc74d0883b2cc31c6bd433bb28c177a57f64190ebb56c72018e40c1fc  .flow-agent/tmp/v0978-implementation-000.patch" | sha256sum --check
            echo "94417590a5f6c2603bb703aa1c4326255e2fb034291fd25711c134d1b9186ce2  .flow-agent/tmp/v0978-implementation-001.patch" | sha256sum --check
            echo "ab2eae21222c9f2d00051b76c48b6a70ca89fa57a744efaa27869f23c20fe4d2  .flow-agent/tmp/v0978-implementation-002.patch" | sha256sum --check
            echo "2e74728857c9189c284f9a1d158e7090ea024e914cdc220d625ee5393fae512c  .flow-agent/tmp/v0978-implementation-003.patch" | sha256sum --check
            echo "e8bfe0514a27acd5e6c9e6de6d6dc1ffd402cb985e2a15af5723ce548015045b  .flow-agent/tmp/v0978-repair-004.patch" | sha256sum --check
            echo "68f2e2bda4c6396ea629f21d1565a7e9592075738feb0c6ab30646cabbf74794  .flow-agent/tmp/v0978-repair-005.patch" | sha256sum --check
            cat .flow-agent/tmp/v0978-implementation-000.patch \
                .flow-agent/tmp/v0978-implementation-001.patch \
                .flow-agent/tmp/v0978-implementation-002.patch \
                .flow-agent/tmp/v0978-implementation-003.patch \
                > /tmp/v0978-implementation.b64
            echo "9c1efeff89e313a07a7310877ae15928d254925b9f7f4031d10e056d78b9f96b  /tmp/v0978-implementation.b64" | sha256sum --check
            base64 --decode /tmp/v0978-implementation.b64 > /tmp/v0978-implementation.patch.gz
            echo "1d6741745d225afab37ce72615a5562741c7ee06c35ae01bd72ed5b3ba7c823f  /tmp/v0978-implementation.patch.gz" | sha256sum --check
            gzip -dc /tmp/v0978-implementation.patch.gz > /tmp/v0978-implementation.patch
            echo "f8a1cb33e6bf108578c6b33a0fb9f4c759ebd2e04d3665c38a8be6fb60cc940d  /tmp/v0978-implementation.patch" | sha256sum --check
            git apply --check /tmp/v0978-implementation.patch
            git apply /tmp/v0978-implementation.patch
            git apply --check .flow-agent/tmp/v0978-repair-004.patch
            git apply .flow-agent/tmp/v0978-repair-004.patch
            git apply --check .flow-agent/tmp/v0978-repair-005.patch
            git apply .flow-agent/tmp/v0978-repair-005.patch
            git diff --check
          } 2>&1 | tee /tmp/v0978-apply.log

      - name: Validate focused topology contracts
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test \
            --tests AbstractExecutionTopologyModelTests \
            --tests UniversalDependencyContinuityContractTests \
            --tests MandatoryMaterializationAuthorityTests \
            --stacktrace 2>&1 | tee /tmp/v0978-focused-tests.log

      - name: Regenerate canonical reference snapshots
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon run --args='reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy'
          ./gradlew --no-daemon run --args='reference-snapshot --intent examples/intent/checkout-build-image.intent.yaml --out conformance/snapshots/checkout-build-image --scenario-id checkout-build-image --targets jenkins'
          git diff --check

      - name: Validate conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon test \
            --tests FlowConformanceBridgeJUnitTest \
            --tests org.flowlang.tests.FlowRcConformanceTests \
            --stacktrace 2>&1 | tee /tmp/v0978-conformance.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0978-apply-diagnostics
          path: |
            /tmp/v0978-apply.log
            /tmp/v0978-focused-tests.log
            /tmp/v0978-conformance.log
            build/test-results/test
          if-no-files-found: warn
          retention-days: 1

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0978-implementation-*.patch
          rm -f .flow-agent/tmp/v0978-repair-*.patch
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0978-export.yml
          rm -f .github/workflows/v0978-apply.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.8 abstract execution topology model"
          git push origin HEAD:agent/v0.9.7.8-abstract-execution-topology
