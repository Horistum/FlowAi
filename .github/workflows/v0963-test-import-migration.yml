name: v0.9.6.3 Test Import Migration

on:
  push:
    branches: [feature/v0963-core-target-projection-separation]

permissions:
  contents: write

jobs:
  migrate-test-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0963-core-target-projection-separation
          fetch-depth: 0

      - name: Migrate imports and registry calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('src/test/kotlin'), Path('tests')]
          names = [
              'JenkinsManifestGenerator', 'JenkinsManifestRenderer',
              'GitHubActionsManifestGenerator', 'GitHubActionsManifestRenderer',
              'TektonManifestGenerator', 'TektonManifestRenderer',
              'TargetExpressionTranslator', 'TargetExpressionTranslationException'
          ]
          old_prefix = 'import org.flowlang.generators.manifest.'
          new_prefix = 'import org.flowlang.targets.builtin.'
          changed = []

          for root in roots:
              for path in sorted(root.rglob('*.kt')):
                  original = path.read_text()
                  migrated = original
                  for name in names:
                      migrated = migrated.replace(old_prefix + name, new_prefix + name)
                  if 'TargetManifestGenerationPipeline.generate(' in migrated:
                      migrated = migrated.replace(
                          old_prefix + 'TargetManifestGenerationPipeline\n',
                          new_prefix + 'BuiltInTargetProjections\n'
                      )
                      migrated = migrated.replace(
                          'TargetManifestGenerationPipeline.generate(',
                          'BuiltInTargetProjections.pipeline().generate('
                      )
                  if migrated != original:
                      path.write_text(migrated)
                      changed.append(path)

          forbidden = [old_prefix + name for name in names]
          forbidden.append('TargetManifestGenerationPipeline.generate(')
          offenders = [
              f'{path}: {token}'
              for root in roots
              for path in sorted(root.rglob('*.kt'))
              for token in forbidden
              if token in path.read_text()
          ]
          if not changed:
              raise SystemExit('No legacy test references found.')
          if offenders:
              raise SystemExit('Legacy references remain:\n' + '\n'.join(offenders))
          print('\n'.join(map(str, changed)))
          PY

      - name: Commit migrated tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0963-test-import-migration.yml
          git add src/test/kotlin tests
          git diff --cached --check
          git commit -m "Migrate tests to edge projection implementations"
          git push origin HEAD:feature/v0963-core-target-projection-separation
