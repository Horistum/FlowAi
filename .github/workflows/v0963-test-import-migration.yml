name: v0.9.6.3 Test Import Migration

on:
  push:
    branches:
      - feature/v0963-core-target-projection-separation

permissions:
  contents: write

jobs:
  migrate-test-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0963-core-target-projection-separation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Migrate concrete projection imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = (Path('src/test/kotlin'), Path('tests'))
          replacements = {
              'import org.flowlang.generators.manifest.JenkinsManifestGenerator':
                  'import org.flowlang.targets.builtin.JenkinsManifestGenerator',
              'import org.flowlang.generators.manifest.JenkinsManifestRenderer':
                  'import org.flowlang.targets.builtin.JenkinsManifestRenderer',
              'import org.flowlang.generators.manifest.GitHubActionsManifestGenerator':
                  'import org.flowlang.targets.builtin.GitHubActionsManifestGenerator',
              'import org.flowlang.generators.manifest.GitHubActionsManifestRenderer':
                  'import org.flowlang.targets.builtin.GitHubActionsManifestRenderer',
              'import org.flowlang.generators.manifest.TektonManifestGenerator':
                  'import org.flowlang.targets.builtin.TektonManifestGenerator',
              'import org.flowlang.generators.manifest.TektonManifestRenderer':
                  'import org.flowlang.targets.builtin.TektonManifestRenderer',
              'import org.flowlang.generators.manifest.TargetExpressionTranslator':
                  'import org.flowlang.targets.builtin.TargetExpressionTranslator',
              'import org.flowlang.generators.manifest.TargetExpressionTranslationException':
                  'import org.flowlang.targets.builtin.TargetExpressionTranslationException',
          }

          changed = []
          for root in roots:
              for path in sorted(root.rglob('*.kt')):
                  original = path.read_text()
                  migrated = original
                  for old, new in replacements.items():
                      migrated = migrated.replace(old, new)

                  if 'TargetManifestGenerationPipeline.generate(' in migrated:
                      migrated = migrated.replace(
                          'import org.flowlang.generators.manifest.TargetManifestGenerationPipeline\n',
                          'import org.flowlang.targets.builtin.BuiltInTargetProjections\n'
                      )
                      migrated = migrated.replace(
                          'TargetManifestGenerationPipeline.generate(',
                          'BuiltInTargetProjections.pipeline().generate('
                      )

                  if migrated != original:
                      path.write_text(migrated)
                      changed.append(str(path))

          if not changed:
              raise SystemExit('No legacy test projection imports were found to migrate.')

          forbidden = tuple(replacements.keys()) + ('TargetManifestGenerationPipeline.generate(',)
          offenders = []
          for root in roots:
              for path in sorted(root.rglob('*.kt')):
                  text = path.read_text()
                  for token in forbidden:
                      if token in text:
                          offenders.append(f'{path}: {token}')
          if offenders:
              raise SystemExit('Legacy test projection references remain:\n' + '\n'.join(offenders))

          print(f'Migrated {len(changed)} test files:')
          print('\n'.join(changed))
          PY

      - name: Compile migrated tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileTestKotlin

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0963-test-import-migration.yml
          git add src/test/kotlin tests
          git diff --cached --check
          git commit -m "Migrate tests to edge projection implementations"
          git push origin HEAD:feature/v0963-core-target-projection-separation
