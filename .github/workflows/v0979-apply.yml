name: Apply v0.9.7.9 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0979-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9-intent-lowering-diagnostic-honesty
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply implementation
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            echo "7f46a28249e2e861730b82a76edcfc8ee356bc699a48bef7f6f3d3bfa608d4f3  .flow-agent/tmp/v0979-implementation-00.b64" | sha256sum --check
            echo "6e73a765479e04aac2688d60a9d834c53076ca59028c40865511e8c34d435256  .flow-agent/tmp/v0979-implementation-01.b64" | sha256sum --check
            echo "97fbecc4e1e08a00e9bcd3dbb09f9448edf5787461dcb851d588711a25d66519  .flow-agent/tmp/v0979-implementation-02.b64" | sha256sum --check
            echo "39210e32aa7a19de621e0be55671bd0ef58a87a9b9abd81feacc06f440986f40  .flow-agent/tmp/v0979-implementation-03.b64" | sha256sum --check
            echo "54d2f76c84adde304d7dd576e150ae94061881249a3159822f987a0847c2a542  .flow-agent/tmp/v0979-implementation-04.b64" | sha256sum --check
            echo "d8b0d5e3804fa24ec2763872d7e647f3386f87b519598b64c11241dddc921705  .flow-agent/tmp/v0979-implementation-05.b64" | sha256sum --check
            echo "bdb7b0381011331e8c970173f977f5447bdc962ea3218a2995df2135e85ddc3d  .flow-agent/tmp/v0979-repair-06.patch" | sha256sum --check
            echo "7e32ef12f61c0823e0939dab3c1cae2f31c8d4f5a919f2511f3a1be10bc8c235  .flow-agent/tmp/v0979-repair-07.patch" | sha256sum --check
            cat .flow-agent/tmp/v0979-implementation-*.b64 > /tmp/v0979-implementation.patch.gz.b64
            echo "e035e8d65603ca148de927db9e60af174b0673983e993c5ecad3312625c8e377  /tmp/v0979-implementation.patch.gz.b64" | sha256sum --check
            base64 --decode /tmp/v0979-implementation.patch.gz.b64 > /tmp/v0979-implementation.patch.gz
            echo "f965c91f618970a651fb1da5ee9ecaf245820ba506a974ea2f3931a340f9bcdd  /tmp/v0979-implementation.patch.gz" | sha256sum --check
            gzip -dc /tmp/v0979-implementation.patch.gz > /tmp/v0979-implementation.patch
            echo "124f0d5518f5958a30c36658cd1ff7be1589630d2b8f791c0326787ef0ed1332  /tmp/v0979-implementation.patch" | sha256sum --check
            git apply --check /tmp/v0979-implementation.patch
            git apply /tmp/v0979-implementation.patch
            git apply --check .flow-agent/tmp/v0979-repair-06.patch
            git apply .flow-agent/tmp/v0979-repair-06.patch
            git apply --check .flow-agent/tmp/v0979-repair-07.patch
            git apply .flow-agent/tmp/v0979-repair-07.patch
            git diff --check
          } 2>&1 | tee /tmp/v0979-apply.log

      - name: Regenerate canonical reference snapshots
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon run --args='reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy' 2>&1 | tee /tmp/v0979-snapshot-build-test-deploy.log
          ./gradlew --no-daemon run --args='reference-snapshot --intent examples/intent/checkout-build-image.intent.yaml --out conformance/snapshots/checkout-build-image --scenario-id checkout-build-image --targets jenkins' 2>&1 | tee /tmp/v0979-snapshot-checkout-build-image.log
          git diff --check

      - name: Validate focused lowering contracts
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon test \
            --tests IntentLoweringDiagnosticHonestyTests \
            --tests CanonicalIntentMeaningTests \
            --tests FlowConformanceBridgeJUnitTest \
            --tests org.flowlang.tests.FlowRcConformanceTests \
            --stacktrace 2>&1 | tee /tmp/v0979-focused-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0979-apply-diagnostics
          path: |
            /tmp/v0979-apply.log
            /tmp/v0979-snapshot-build-test-deploy.log
            /tmp/v0979-snapshot-checkout-build-image.log
            /tmp/v0979-focused-tests.log
            build/test-results/test
          if-no-files-found: warn
          retention-days: 1

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0979-implementation-*.b64
          rm -f .flow-agent/tmp/v0979-repair-*.patch
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0979-export.yml
          rm -f .github/workflows/v0979-apply.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.9 lowering diagnostic honesty"
          git push origin HEAD:agent/v0.9.7.9-intent-lowering-diagnostic-honesty
