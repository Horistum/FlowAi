name: Apply v0.9.7.7 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0977-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.7-universal-control-policy-requirements
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "21b4342e3b44d9a0e9e8c99748fa59846452535d492305b513946a3f98baad7e  .flow-agent/tmp/v0977-implementation-000.b64" | sha256sum --check
          echo "6ef0ab89e0f2a0c7d0e150e285b4a1fb5e9c63a2dcdb65b41e1e9caf57393ee3  .flow-agent/tmp/v0977-implementation-001.b64" | sha256sum --check
          cat .flow-agent/tmp/v0977-implementation-000.b64 .flow-agent/tmp/v0977-implementation-001.b64 > /tmp/v0977-implementation.b64
          echo "adf1b166a2070e9c34abf5ce2d8e7716221d0ae1162215fa0b01f95453c884a3  /tmp/v0977-implementation.b64" | sha256sum --check
          base64 --decode /tmp/v0977-implementation.b64 > /tmp/v0977-implementation.tar.gz
          echo "d76ee0d45797b747f32ed125a515cfdfca7fc0573c4498e73d1fd76d6565665c  /tmp/v0977-implementation.tar.gz" | sha256sum --check
          tar -tzf /tmp/v0977-implementation.tar.gz > /dev/null
          tar -xzf /tmp/v0977-implementation.tar.gz
          git diff --check

      - name: Validate focused control contracts
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test \
            --tests UniversalControlPolicyRequirementsTests \
            --tests FlowConformanceBridgeJUnitTest \
            --stacktrace 2>&1 | tee /tmp/v0977-focused-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0977-apply-diagnostics
          path: /tmp/v0977-focused-tests.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0977-implementation-*.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0977-export.yml
          rm -f .github/workflows/v0977-apply.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.7 universal control policy model"
          git push origin HEAD:agent/v0.9.7.7-universal-control-policy-requirements
