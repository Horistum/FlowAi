name: Apply v0.9.7.7 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0977-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.7-universal-control-policy-requirements
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply implementation
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            echo "d08c749a941603356e1998db0a73033756efd591f5adf967506b76bc59aef4bc  .flow-agent/tmp/v0977-filepatch-000.patch" | sha256sum --check
            echo "4b75be54e8cc0942a12f7b3438f457438935adc7a1271e2f48906b8dbc7a5246  .flow-agent/tmp/v0977-filepatch-001.patch" | sha256sum --check
            echo "49b582a6edc5c1662bd2fac096bf37bbdfa64d29ce9a629cf33cfdbb090606a4  .flow-agent/tmp/v0977-filepatch-002.patch" | sha256sum --check
            echo "71756e5ff398246fa4a686b83c90b3f9fb9f2c370ac8ccf2e8ed95f246ce4e67  .flow-agent/tmp/v0977-filepatch-003.patch" | sha256sum --check
            echo "d0447621ea6a5942f4d668dff910082befa144e752d5cc288a5c186534f2ef3b  .flow-agent/tmp/v0977-filepatch-004.patch" | sha256sum --check
            echo "043fd3e20116361c768629cc4937751906df11dd1a965b794a0cf7f2bcaac594  .flow-agent/tmp/v0977-filepatch-005.patch" | sha256sum --check
            echo "22e8207c47763cfc445c61f102b50f31d2427903415e95b02539c9d483637cb7  .flow-agent/tmp/v0977-repair-006.patch" | sha256sum --check
            cat .flow-agent/tmp/v0977-filepatch-000.patch \
                .flow-agent/tmp/v0977-filepatch-001.patch \
                .flow-agent/tmp/v0977-filepatch-002.patch \
                .flow-agent/tmp/v0977-filepatch-003.patch \
                .flow-agent/tmp/v0977-filepatch-004.patch \
                .flow-agent/tmp/v0977-filepatch-005.patch \
                .flow-agent/tmp/v0977-repair-006.patch \
                > /tmp/v0977-implementation.patch
            echo "976f97331cfd765ff9d7b2befee10aec55204c9ee9e6dde68c8098d4e5b951ac  /tmp/v0977-implementation.patch" | sha256sum --check
            git apply --check /tmp/v0977-implementation.patch
            git apply /tmp/v0977-implementation.patch
            git diff --check
          } 2>&1 | tee /tmp/v0977-apply.log

      - name: Validate focused control contracts
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test \
            --tests UniversalControlPolicyRequirementsTests \
            --tests FlowConformanceBridgeJUnitTest \
            --tests org.flowlang.tests.FlowRcConformanceTests \
            --stacktrace 2>&1 | tee /tmp/v0977-focused-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0977-apply-diagnostics
          path: |
            /tmp/v0977-apply.log
            /tmp/v0977-focused-tests.log
            build/test-results/test
          if-no-files-found: warn
          retention-days: 1

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0977-*
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0977-export.yml
          rm -f .github/workflows/v0977-apply.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.7 universal control policy model"
          git push origin HEAD:agent/v0.9.7.7-universal-control-policy-requirements
