name: v0.9.5.7.9 Source Export

on:
  push:
    branches:
      - feature/v0957-9-reference-snapshot-honesty-reset

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-9-reference-snapshot-honesty-reset
          fetch-depth: 0

      - name: Archive checked-out source
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/flowai-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: flowai-source
          path: /tmp/flowai-source.tgz
          if-no-files-found: error
          retention-days: 1
