name: Temporary v0.9.5.7.3 runner patch

on:
  push:
    branches:
      - feature/v0957-3-renderer-failure-semantics
    paths:
      - .github/workflows/temp-v0957-3-runner-patch.yml
      - .flow-agent/tmp/v0957_3_conformance_runner.patch

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-3-renderer-failure-semantics
          fetch-depth: 0

      - name: Apply reviewed ConformanceRunner patch
        run: |
          git apply --check .flow-agent/tmp/v0957_3_conformance_runner.patch
          git apply .flow-agent/tmp/v0957_3_conformance_runner.patch

      - name: Commit exact patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/org/flowlang/conformance/ConformanceRunner.kt
          git commit -m "Align conformance runner with renderer readiness"
          git push origin HEAD:feature/v0957-3-renderer-failure-semantics
