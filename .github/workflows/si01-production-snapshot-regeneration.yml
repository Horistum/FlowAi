name: SI-01 Production Snapshot Regeneration

on:
  push:
    branches:
      - flow/si-01-control-evidence-scope

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SI-01 branch
        uses: actions/checkout@v6
        with:
          ref: flow/si-01-control-evidence-scope
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate references through production generator
        shell: bash
        run: |
          set -euo pipefail
          cat > src/test/kotlin/SI01SnapshotRegeneratorTests.kt <<'KOTLIN'
          import java.io.File
          import kotlin.test.Test
          import org.flowlang.conformance.ReferenceSnapshotBundleGenerator

          class SI01SnapshotRegeneratorTests {
              @Test
              fun regenerateCanonicalSI01References() {
                  val root = File(".")
                  val generator = ReferenceSnapshotBundleGenerator(root)

                  generator.generate(
                      intentFile = File(root, "examples/intent/build-test-deploy.intent.yaml"),
                      outputDir = File(root, "conformance/snapshots/build-test-deploy"),
                      scenarioId = "build-test-deploy"
                  )
                  generator.generate(
                      intentFile = File(root, "examples/intent/checkout-build-image.intent.yaml"),
                      outputDir = File(root, "conformance/snapshots/checkout-build-image"),
                      scenarioId = "checkout-build-image",
                      targetIds = setOf("jenkins")
                  )
                  generator.generate(
                      intentFile = File(root, "examples/intent/checkout-build-image.intent.yaml"),
                      outputDir = File(root, "conformance/snapshots/github-actions-checkout-build-image"),
                      scenarioId = "checkout-build-image",
                      targetIds = setOf("github-actions")
                  )
              }
          }
          KOTLIN

          chmod +x ./gradlew
          ./gradlew --no-daemon test --tests SI01SnapshotRegeneratorTests --stacktrace --console=plain
          rm src/test/kotlin/SI01SnapshotRegeneratorTests.kt

      - name: Verify bounded generated diff
        shell: python
        run: |
          import subprocess

          allowed = (
              "conformance/snapshots/build-test-deploy/",
              "conformance/snapshots/checkout-build-image/",
              "conformance/snapshots/github-actions-checkout-build-image/",
          )
          output = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          changed = []
          unexpected = []
          for raw in output.splitlines():
              if not raw:
                  continue
              path = raw[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.append(path)
              if not path.startswith(allowed):
                  unexpected.append(path)
          if unexpected:
              raise SystemExit("Snapshot regeneration changed unexpected paths: " + ", ".join(unexpected))
          if not changed:
              raise SystemExit("Production snapshot regeneration produced no changes despite stale-snapshot CI failures")
          print("Bounded generated changes:")
          for path in changed:
              print(f"- {path}")

      - name: Commit generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            conformance/snapshots/build-test-deploy \
            conformance/snapshots/checkout-build-image \
            conformance/snapshots/github-actions-checkout-build-image
          git commit -m "SI-01: regenerate canonical 2.1 reference snapshots [skip ci]"
          git push origin HEAD:flow/si-01-control-evidence-scope
