name: PR 167 Snapshot Repair

on:
  push:
    branches:
      - agent/ar-02-flow-sensitive-semantics-activation

permissions:
  contents: write

concurrency:
  group: pr-167-snapshot-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        env:
          EXPECTED_PARENT: 1176c3a76d2830858fa5f82bb628267b9f3f4725
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$EXPECTED_PARENT" ]; then
            echo "Expected repair bootstrap parent $EXPECTED_PARENT, found $actual_parent" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate normal-exit snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('conformance/snapshots/build-test-deploy/execution-plan.json')
          text = path.read_text(encoding='utf-8')
          obsolete = '''  }, {
              "name" : "rollback_result",
              "type" : "any",
              "sourceNodeId" : "standard_rollback_1"
          '''
          count = text.count(obsolete)
          if count != 1:
              raise SystemExit(f'Expected exactly one obsolete handler-only output, found {count}')
          path.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Run full test suite
        shell: bash
        run: ./gradlew --no-daemon clean test --stacktrace --console=plain

      - name: Run conformance
        shell: bash
        run: ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain

      - name: Commit verified snapshot repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr167-snapshot-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ar-02a): regenerate normal-exit execution snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
