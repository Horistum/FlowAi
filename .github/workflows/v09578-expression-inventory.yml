name: v0.9.5.7.8 Expression Evidence Validation

on:
  push:
    branches:
      - feature/v0957-8-target-expression-unknown-target-safety
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-8-target-expression-unknown-target-safety
          fetch-depth: 0

      - name: Apply exact implementation patch chunks
        shell: bash
        run: |
          for patch in .flow-agent/patches/v09578/*.patch; do
            git apply --check "$patch"
          done
          for patch in .flow-agent/patches/v09578/*.patch; do
            git apply "$patch"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Validate Flow Agent structure
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent context
        run: python3 tools/flow_agent_runner.py

      - name: Compile and test
        run: ./gradlew --no-daemon clean test --stacktrace --console=plain

      - name: Run conformance
        run: ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain

      - name: Persist validated implementation
        if: success()
        shell: bash
        run: |
          rm .flow-agent/patches/v0.9.5.7.8-expression-evidence.patch
          rm -rf .flow-agent/patches/v09578
          rm .github/workflows/v09578-expression-inventory.yml
          git config user.name "flow-expression-safety-bot"
          git config user.email "flow-expression-safety-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add evidence-driven target expression safety"
          git push origin HEAD:feature/v0957-8-target-expression-unknown-target-safety
