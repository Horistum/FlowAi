name: Apply v0.9.7.3 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0
      - name: Verify and apply reviewed implementation overlay
        shell: bash
        run: |
          wc -c .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64
          sha256sum .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64
          cat .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64 | tr -d '\n' | base64 --decode > /tmp/v0973-overlay.tar.gz
          sha256sum /tmp/v0973-overlay.tar.gz
          echo "dc60615a5af5448b3818c69cc56290e990c085795ea36efbdaed344298a26d52  /tmp/v0973-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/v0973-overlay.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -f "$path"
          done < .v0973-deletions
          rm -f .v0973-deletions TEMP.md
          rm -f .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/source-export.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.3 mandatory materialization authority"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
