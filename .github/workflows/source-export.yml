name: Apply v0.9.7.3 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0
      - name: Verify payload part 1
        run: test "$(tr -d '\n' < .flow-agent/tmp/v0973-overlay-1.b64 | sha256sum | cut -d' ' -f1)" = "be501f2dbc248ade771c09fb91ece988234d84abf770cbc06bdd631dd29a180e"
      - name: Verify payload part 2
        run: test "$(tr -d '\n' < .flow-agent/tmp/v0973-overlay-2.b64 | sha256sum | cut -d' ' -f1)" = "fcddb1a63ae44a7f4bbb5210e3874490ea9b8a5a29f0bb82e8369fca6482761f"
      - name: Verify payload part 3
        run: test "$(tr -d '\n' < .flow-agent/tmp/v0973-overlay-3.b64 | sha256sum | cut -d' ' -f1)" = "c5fc0f8dab9b38940a89330b923f0835f29e8e4ca3f362ce2d937ae9e3ddd274"
      - name: Verify payload part 4
        run: test "$(tr -d '\n' < .flow-agent/tmp/v0973-overlay-4.b64 | sha256sum | cut -d' ' -f1)" = "83e6c5261f455b095de10bf2ab18ca5228ceb7a46f33276f336730e5bfe17172"
      - name: Apply reviewed implementation overlay
        shell: bash
        run: |
          cat .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64 | tr -d '\n' | base64 --decode > /tmp/v0973-overlay.tar.gz
          echo "dc60615a5af5448b3818c69cc56290e990c085795ea36efbdaed344298a26d52  /tmp/v0973-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/v0973-overlay.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -f "$path"
          done < .v0973-deletions
          rm -f .v0973-deletions TEMP.md
          rm -f .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/source-export.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.3 mandatory materialization authority"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
