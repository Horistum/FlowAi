name: Apply v0.9.7.3 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0

      - name: Verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0973-parts
          for index in $(seq -w 0 14); do
            tr -d '\r\n' < ".flow-agent/tmp/v0973-part-${index}.b64" > "/tmp/v0973-parts/part-${index}"
          done
          cat > /tmp/v0973-parts.sha256 <<'EOF'
          daf137d51c78e700a0802d4bd0e8ea76600b9c27d80069a5d82f50daabcd9788  /tmp/v0973-parts/part-00
          14b4788de3dd13b1e374ff16e539461a83bd915d93a61ad2a2c26f18c82917c3  /tmp/v0973-parts/part-01
          267eca9f0bb7dd17c97a49ce9af23f916ee259dbfe4db875dcf2d8c0e2c24e8e  /tmp/v0973-parts/part-02
          42d09838a710696f5bd95a9db2e6057278b90d0374182c25f5b888503f06b429  /tmp/v0973-parts/part-03
          c9982a8c575fd9ddc5f77f663e01c4993e05d9a2f1210ec89a72a3ec0212b27f  /tmp/v0973-parts/part-04
          463cd392553bef39ba2a8bcf87ba256baef1e7dae80ddc37168c62eee51e565c  /tmp/v0973-parts/part-05
          34698a2cf356c9062ff6743a7fac3dfbc9cf8d14122f0ad8dc93f861095f34fa  /tmp/v0973-parts/part-06
          309fd3ef5437b065d2fa135c5c1515368a46793682a7010d440d98ca7e56eb66  /tmp/v0973-parts/part-07
          81cf614045c647eade91d9a17ac58f166473534f05bf25abb689830031bfb597  /tmp/v0973-parts/part-08
          6dc1d338a8b4a0173b86d3c7b3d9f468315fef5eac69ad1926a32a62ddde1190  /tmp/v0973-parts/part-09
          cc84610cd08e9bbfc4896813a2dcc29bc930649b06a945d2b67577062bbfd581  /tmp/v0973-parts/part-10
          938c3ac4abae95f54f8e5bdae1ba7f2777f9bac3a921f5ce748235cb0043a260  /tmp/v0973-parts/part-11
          cc8dd4b4689ba05467bfb981a194460043e43cd3d8cade458dac5f332fe23973  /tmp/v0973-parts/part-12
          4e0698370a1adf5c616efb4dc8aae72cfa03233d1bb9d04f079e83f3f7709891  /tmp/v0973-parts/part-13
          0cc5f8f071172b6fb8f87e303a73b2fd0e245e7267676f65caf7ee3bd41eab87  /tmp/v0973-parts/part-14
          EOF
          sed -i 's/^          //' /tmp/v0973-parts.sha256
          sha256sum --check /tmp/v0973-parts.sha256
          cat /tmp/v0973-parts/part-{00..14} | base64 --decode > /tmp/v0973-overlay.tar.gz
          echo "dc60615a5af5448b3818c69cc56290e990c085795ea36efbdaed344298a26d52  /tmp/v0973-overlay.tar.gz" | sha256sum --check

      - name: Apply reviewed implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0973-overlay.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -f "$path"
          done < .v0973-deletions
          rm -f .v0973-deletions TEMP.md
          rm -f .flow-agent/tmp/v0973-overlay-{1,2,3,4}.b64
          rm -f .flow-agent/tmp/v0973-part-{00..14}.b64
          rm -f .flow-agent/tmp/v0973-payload-diagnostics.txt
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/source-export.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement v0.9.7.3 mandatory materialization authority"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
