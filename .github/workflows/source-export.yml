name: Source Export

on:
  push:
    branches:
      - agent/v0.9.7.3-mandatory-materialization-authority
    paths:
      - .github/workflows/source-export.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude=.gradle \
            -czf /tmp/flowai-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: flowai-source
          path: /tmp/flowai-source.tar.gz
          if-no-files-found: error
          retention-days: 1
