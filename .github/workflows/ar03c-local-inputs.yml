name: AR-03C Local Development Inputs

# Temporary branch-only preparation. Removed before the final AR-03C candidate.
on:
  push:
    branches: [agent/adapter-contract-boundaries]
    paths: [.github/workflows/ar03c-local-inputs.yml]
permissions:
  contents: read
concurrency:
  group: ar03c-local-inputs
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'milank78git/FlowAi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact repository sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ar03c-inputs"
          git bundle create "$RUNNER_TEMP/ar03c-inputs/repository.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/ar03c-inputs/source-head.txt"
          sha256sum "$RUNNER_TEMP/ar03c-inputs/repository.bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: ar03c-local-sources
          path: |
            ${{ runner.temp }}/ar03c-inputs/repository.bundle
            ${{ runner.temp }}/ar03c-inputs/source-head.txt
          retention-days: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve baseline build inputs without changing product sources
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ar03c-baseline" c8ca99273a3cc7380c840d4075ad0b57361b86e2
          cat > "$RUNNER_TEMP/ar03c-resolve.gradle" <<'GRADLE'
          allprojects {
              afterEvaluate {
                  tasks.register('resolveOfflineInputs') {
                      doLast {
                          configurations.findAll { it.canBeResolved }.each { config ->
                              println("Resolving ${project.path}:${config.name}")
                              config.resolve()
                          }
                      }
                  }
              }
          }
          GRADLE
          export GRADLE_USER_HOME="$RUNNER_TEMP/ar03c-gradle-home"
          cd "$RUNNER_TEMP/ar03c-baseline"
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --init-script "$RUNNER_TEMP/ar03c-resolve.gradle" resolveOfflineInputs
          tar -C "$GRADLE_USER_HOME" --exclude='*.lock' --exclude=daemon -czf "$RUNNER_TEMP/ar03c-inputs/gradle-home.tar.gz" .
          tar -C "$JAVA_HOME" -czf "$RUNNER_TEMP/ar03c-inputs/jdk25.tar.gz" .
          sha256sum "$RUNNER_TEMP/ar03c-inputs/gradle-home.tar.gz" "$RUNNER_TEMP/ar03c-inputs/jdk25.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ar03c-local-gradle
          path: ${{ runner.temp }}/ar03c-inputs/gradle-home.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ar03c-local-jdk25
          path: ${{ runner.temp }}/ar03c-inputs/jdk25.tar.gz
          compression-level: 0
          retention-days: 1
