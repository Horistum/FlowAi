name: v0.9.7.9.1 Canonical Snapshot Refresh

on:
  push:
    branches:
      - agent/v0.9.7.9.1-evidence-control-integrity

permissions:
  contents: write

jobs:
  refresh-reference-snapshot:
    if: ${{ !startsWith(github.event.head_commit.message, '[snapshot-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.1-evidence-control-integrity
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate canonical reference snapshot bundle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy"

      - name: Commit generated evidence
        run: |
          if git diff --quiet -- conformance/snapshots/build-test-deploy; then
            echo "Canonical snapshot bundle is already current."
            exit 0
          fi
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add conformance/snapshots/build-test-deploy
          git commit -m "[snapshot-generated] Refresh v0.9.7.9.1 canonical evidence"
          git push origin HEAD:agent/v0.9.7.9.1-evidence-control-integrity
