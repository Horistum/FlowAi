    needs: [prepare, git_checkout_1, docker_build_1, docker_build_2, docker_build_3, docker_build_4, docker_build_5, git_checkout_2, missing-transfer-mutant, hidden-file-mutant, guard-omission-mutant, git_checkout_3, git_checkout_4, docker_build_6, docker_build_7, docker_build_8, docker_build_9, producer-guard-omission-mutant, git_checkout_5, docker_build_10, failure-checkout-consumer-mutant, git_checkout_6, docker_build_11, failure-upload-consumer-mutant]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: github-workspace-prepared
          path: ${{ runner.temp }}/workspace-evidence
      - name: Verify native file observations and required mutant failures
        env:
          FLOW_JOB_RESULTS: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s tools/tests -p 'test_github_workspace_composition.py' -v
