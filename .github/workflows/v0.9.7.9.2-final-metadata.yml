name: v0.9.7.9.2 Final Metadata

on:
  push:
    branches:
      - agent/v0.9.7.9.2-artifact-derived-lowering-evidence

permissions:
  contents: write

jobs:
  finalize-metadata:
    if: ${{ !startsWith(github.event.head_commit.message, '[v0.9.7.9.2-metadata]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.2-artifact-derived-lowering-evidence
          fetch-depth: 0

      - name: Align diagnostics and changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt')
          text = authority.read_text()
          replacements = {
              'planning.lowering.artifact-digest.invalid': 'planning.lowering.evidence-digest.invalid',
              'Lowering evidence must declare a lowercase SHA-256 artifact digest.': 'Lowering evidence must declare a lowercase SHA-256 aggregate evidence digest.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          authority.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          heading = '### v0.9.7.9.2 Artifact-Derived Lowering Evidence'
          if heading not in text:
              marker = '### v0.9.7.9.1 Evidence and Control Integrity Repair'
              section = '''### v0.9.7.9.2 Artifact-Derived Lowering Evidence

#### Added

- Added stable semantic source and target identities for every accepted Intent field covered by lowering evidence.
- Added source, expected-target and concrete-target SHA-256 digests with explicit named transformations.
- Added adversarial tests for concrete target mutation, forged evidence digest, missing evidence, duplicate evidence and topological source-step reordering.
- Added an embedded lowering evidence contract `2.0` while preserving the public ExecutionPlan artifact version at `2.0`.

#### Changed

- Lowering reports are issued only after FlowPlanner constructs the concrete execution plan.
- Mandatory materialization re-derives every target value and requires exact equality with the stored report.
- `sourcePath` is diagnostic only; `sourceIdentity` is the stable authority independent of list position.
- `PRESERVED` now requires verified source-target equality, while `TRANSFORMED` requires a named conversion and verified expected target value.
- Canonical build-test-deploy and checkout-build-image snapshot bundles were regenerated through the reference generator.

#### Removed

- Removed source-iterated path-only preservation claims.
- Removed index-based target addressing as lowering evidence authority.
- Removed `dropBlockedParams` and the synthetic notes-driven materialization marker.

#### Validation boundary

- The aggregate `evidenceDigest` covers the certified lowering evidence view and is not represented as a signature of the entire execution plan.
- The v0.9.7 closure gate remains blocked pending work items v0.9.7.9.3 through v0.9.7.9.7.

'''
              if marker not in text:
                  raise SystemExit(f'Missing changelog marker: {marker}')
              text = text.replace(marker, section + marker, 1)
              changelog.write_text(text)
          PY

      - name: Remove one-shot workflow and commit metadata
        run: |
          git rm .github/workflows/v0.9.7.9.2-final-metadata.yml
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add CHANGELOG.md src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt
          git commit -m "[v0.9.7.9.2-metadata] Record artifact-derived lowering contract"
          git push origin HEAD:agent/v0.9.7.9.2-artifact-derived-lowering-evidence
