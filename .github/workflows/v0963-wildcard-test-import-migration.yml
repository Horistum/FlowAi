name: v0.9.6.3 Wildcard Test Import Migration

on:
  push:
    branches: [feature/v0963-core-target-projection-separation]

permissions:
  contents: write

jobs:
  migrate-wildcard-test-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0963-core-target-projection-separation
          fetch-depth: 0

      - name: Add explicit edge imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/FlowSpecPlannerScenarioTests.kt')
          source = path.read_text()
          anchor = 'import org.flowlang.generators.manifest.*\n'
          imports = ''.join(
              f'import org.flowlang.targets.builtin.{name}\n'
              for name in (
                  'JenkinsManifestGenerator', 'JenkinsManifestRenderer',
                  'GitHubActionsManifestGenerator', 'GitHubActionsManifestRenderer',
                  'TektonManifestGenerator', 'TektonManifestRenderer'
              )
          )
          if imports in source:
              raise SystemExit('Explicit edge imports already exist.')
          if anchor not in source:
              raise SystemExit('Expected manifest wildcard import is missing.')
          path.write_text(source.replace(anchor, anchor + imports, 1))
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0963-wildcard-test-import-migration.yml
          git add tests/FlowSpecPlannerScenarioTests.kt
          git diff --cached --check
          git commit -m "Migrate wildcard projection test imports"
          git push origin HEAD:feature/v0963-core-target-projection-separation
