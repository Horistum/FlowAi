name: v0.9.5.7.9 Honesty Validation

on:
  push:
    branches:
      - feature/v0957-9-reference-scenario-snapshot-honesty
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-9-reference-scenario-snapshot-honesty
          fetch-depth: 0

      - name: Reconstruct and verify exact patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          cat .flow-agent/patches/v09579/honesty.patch.gz.b64.* | base64 --decode > /tmp/honesty.patch.gz
          echo 'b01f9be2e6d99c986bb88c3ec1d911131dbc0d04d18458f00b811640c9cc450a  /tmp/honesty.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/honesty.patch.gz > /tmp/honesty.patch
          echo '7a2817f39474e4dd058618368e867631cbf67e8f2f3346f462988ceee37be30b  /tmp/honesty.patch' | sha256sum --check

          base64 --decode .flow-agent/patches/v09579/additions.patch.gz.b64 > /tmp/honesty-additions.patch.gz
          echo '938280b77c695a6bade149fd7358291a67e399b69f038235085c87d87f3108f2  /tmp/honesty-additions.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/honesty-additions.patch.gz > /tmp/honesty-additions.patch
          echo '13decd53617e98c93c208324417bac1096e62ffc9e986853c8e5e1479cb51431  /tmp/honesty-additions.patch' | sha256sum --check

          git apply --check /tmp/honesty.patch
          git apply /tmp/honesty.patch
          git apply --check /tmp/honesty-additions.patch
          git apply /tmp/honesty-additions.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Validate Flow Agent structure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent context
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_runner.py

      - name: Generate canonical reference snapshots
        shell: bash
        run: |
          set -o pipefail
          cp conformance/snapshots/build-test-deploy/README.md /tmp/build-test-deploy-README.md
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --scenario-id build-test-deploy --out conformance/snapshots/build-test-deploy" --stacktrace --console=plain 2>&1 | tee ci-logs/reference-snapshot-generation.log
          status=${PIPESTATUS[0]}
          if [[ ${status} -ne 0 ]]; then
            exit ${status}
          fi
          cp /tmp/build-test-deploy-README.md conformance/snapshots/build-test-deploy/README.md
          test -f conformance/snapshots/build-test-deploy/jenkins.review.yaml
          test -f conformance/snapshots/build-test-deploy/github-actions.review.yaml
          test -f conformance/snapshots/build-test-deploy/tekton.blocked.json
          test ! -e conformance/snapshots/build-test-deploy/tekton.review.yaml
          test ! -e conformance/snapshots/build-test-deploy/tekton-pipeline.yaml

      - name: Verify active examples contain no shell execution path
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'shell\.run|type:[[:space:]]*shell|use module "shell"' examples --include='*.flow' --exclude-dir=blocked-shell; then
            echo 'Active examples still contain a shell execution path.' >&2
            exit 1
          fi

      - name: Compile and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-clean-test.log
          exit ${PIPESTATUS[0]}

      - name: Run full conformance
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-conformance.log
          exit ${PIPESTATUS[0]}

      - name: Persist only validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .flow-agent/patches/v09579
          rm .github/workflows/v09579-worktree-export.yml
          rm .github/workflows/v09579-honesty-validation.yml
          git config user.name 'flow-reference-honesty-bot'
          git config user.email 'flow-reference-honesty-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Complete evidence-driven reference snapshot honesty reset'
          git push origin HEAD:feature/v0957-9-reference-scenario-snapshot-honesty

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09579-honesty-validation-logs
          path: ci-logs/*.log
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09579-honesty-test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn
