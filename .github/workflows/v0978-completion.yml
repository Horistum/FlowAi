name: Apply v0.9.7.8 Completion

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0978-completion.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.8-abstract-execution-topology
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply completion patch
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            echo "e875ac29e6575583e8e3fe30c459f0495f99b9d5194a4af049818335a4623866  .flow-agent/tmp/v0978-completion.b64" | sha256sum --check
            base64 --decode .flow-agent/tmp/v0978-completion.b64 > /tmp/v0978-completion.patch.gz
            echo "c1084ecae06b20226118663297cbcb0f4722eec15977ad61ba43bff61baec896  /tmp/v0978-completion.patch.gz" | sha256sum --check
            gzip -dc /tmp/v0978-completion.patch.gz > /tmp/v0978-completion.patch
            echo "cbd2f6bfc2b44eed9296027b962cbdba4cb9f4e6c642ebf41766b9c0bc705a8a  /tmp/v0978-completion.patch" | sha256sum --check
            git apply --check /tmp/v0978-completion.patch
            git apply /tmp/v0978-completion.patch
            git diff --check
          } 2>&1 | tee /tmp/v0978-completion-apply.log

      - name: Validate completion contracts
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test \
            --tests AbstractExecutionTopologyModelTests \
            --tests VersionConsistencyTests \
            --tests FlowConformanceBridgeJUnitTest \
            --tests org.flowlang.tests.FlowRcConformanceTests \
            --stacktrace 2>&1 | tee /tmp/v0978-completion-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0978-completion-diagnostics
          path: |
            /tmp/v0978-completion-apply.log
            /tmp/v0978-completion-tests.log
            build/test-results/test
          if-no-files-found: warn
          retention-days: 1

      - name: Commit completion metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0978-completion.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0978-completion.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete v0.9.7.8 topology conformance and metadata"
          git push origin HEAD:agent/v0.9.7.8-abstract-execution-topology
