name: v0.9.5.7.8 Metadata Finalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-8-target-expression-unknown-target-safety
          fetch-depth: 0

      - name: Apply exact metadata finalization
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/v09578_finalize_metadata.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Validate Flow Agent structure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent context
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_runner.py

      - name: Compile and test
        run: ./gradlew --no-daemon clean test --stacktrace --console=plain

      - name: Run conformance
        run: ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain

      - name: Persist validated metadata
        shell: bash
        run: |
          git config user.name "flow-metadata-bot"
          git config user.email "flow-metadata-bot@users.noreply.github.com"
          git add REPORT.md CHANGELOG.md \
            .flow-agent/release-state.yaml \
            .flow-agent/roadmap.yaml \
            .flow-agent/roadmap-v0.9.5.7-repair-track.yaml \
            .flow-agent/reports/v0.9.5.7.8-target-expression-and-unknown-target-safety.md \
            docs/TARGET_REGISTRY.md \
            docs/V0_9_5_7_8_TARGET_EXPRESSION_AND_UNKNOWN_TARGET_SAFETY.md \
            src/test/kotlin/VersionConsistencyTests.kt
          git commit -m "Finalize v0.9.5.7.8 metadata and documentation"
          git push origin HEAD:feature/v0957-8-target-expression-unknown-target-safety
