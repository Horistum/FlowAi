name: Apply v0.9.7.5 Implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0975-export.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.5-canonical-intent-meaning
          fetch-depth: 0

      - name: Verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0975-parts
          files=(
            v0975-implementation-part-00.b64
            v0975-implementation-part-01.b64
            v0975-implementation-part-02.b64
            v0975-implementation-rest-00.b64
            v0975-implementation-rest-01.b64
            v0975-implementation-rest-02.b64
            v0975-implementation-tail-00.b64
            v0975-implementation-tail-01.b64
          )
          for file in "${files[@]}"; do
            tr -d '\r\n' < ".flow-agent/tmp/${file}" > "/tmp/v0975-parts/${file}"
          done
          cat > /tmp/v0975-parts.sha256 <<'EOF'
          a32ac49262b41cffbf411f88c1ed8718be6d263cec3b6ca87566d9ebe51f3a20  /tmp/v0975-parts/v0975-implementation-part-00.b64
          75a6ee01d8e537cd5639347c7ae5dcb301b0ff0e21d0886e309de2e176b048db  /tmp/v0975-parts/v0975-implementation-part-01.b64
          3e131420a03234d7b1ed520ea0eb560c6b46edd4826421150770016c189189b9  /tmp/v0975-parts/v0975-implementation-part-02.b64
          c282090bc1e55ea93a9faf64aadb22fac7d30c83400aab4eb598c2241eab394a  /tmp/v0975-parts/v0975-implementation-rest-00.b64
          da2fc01535224a72ff15d49318d47725d74fa9bd2ddd9f6f586dca1e889cbe12  /tmp/v0975-parts/v0975-implementation-rest-01.b64
          aca6d9c00b66524980da97c564e5f10af5f125a9d32f83e496f86f1e521d1534  /tmp/v0975-parts/v0975-implementation-rest-02.b64
          d06aa3c9f4d64db348c9ef5049e29352507b91714f21c2c4932f0c8837a70a6d  /tmp/v0975-parts/v0975-implementation-tail-00.b64
          be2b87f6c9f4fbe5b2d14b24ccc72b4084f4e3eeeef04e3349075af19b3eea39  /tmp/v0975-parts/v0975-implementation-tail-01.b64
          EOF
          sed -i 's/^          //' /tmp/v0975-parts.sha256
          sha256sum --check /tmp/v0975-parts.sha256
          cat \
            /tmp/v0975-parts/v0975-implementation-part-00.b64 \
            /tmp/v0975-parts/v0975-implementation-part-01.b64 \
            /tmp/v0975-parts/v0975-implementation-part-02.b64 \
            /tmp/v0975-parts/v0975-implementation-rest-00.b64 \
            /tmp/v0975-parts/v0975-implementation-rest-01.b64 \
            /tmp/v0975-parts/v0975-implementation-rest-02.b64 \
            /tmp/v0975-parts/v0975-implementation-tail-00.b64 \
            /tmp/v0975-parts/v0975-implementation-tail-01.b64 \
            > /tmp/v0975-implementation.b64
          echo "2d6fd16110f728a65933931d5f29a6eba9ba3f9bdb82dd2697ca6ba09206004f  /tmp/v0975-implementation.b64" | sha256sum --check
          base64 --decode /tmp/v0975-implementation.b64 > /tmp/v0975-implementation.tar.gz
          echo "286dbe77ee28459dcba247f874b92a2cef968624c8ac991881c5fa2b3dda0c6e  /tmp/v0975-implementation.tar.gz" | sha256sum --check
          tar -tzf /tmp/v0975-implementation.tar.gz > /dev/null

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0975-implementation.tar.gz
          rm -f .flow-agent/tmp/v0975-implementation-*.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0975-export.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement canonical intent meaning authority"
          git push origin HEAD:agent/v0.9.7.5-canonical-intent-meaning
