name: SI-01 Lowering Membership Patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'flow/si-01-control-evidence-scope' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: flow/si-01-control-evidence-scope
      - name: Bind workflow-step membership into lowering evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt")
          text = path.read_text()

          old_version = 'const val CONTRACT_VERSION = "2.0"'
          if text.count(old_version) != 1:
              raise SystemExit(f"Expected one lowering contract version marker, found {text.count(old_version)}")
          text = text.replace(old_version, 'const val CONTRACT_VERSION = "2.1"', 1)

          old_steps = '''            workflow.steps.forEachIndexed { stepIndex, step ->
                addStepFields(step, "$workflowSource.steps[$stepIndex]", inputNames)
            }
'''
          new_steps = '''            workflow.steps.forEachIndexed { stepIndex, step ->
                val stepId = segment(step.id)
                add(preserved(
                    "workflow/$workflowId/step/$stepId",
                    "$workflowSource.steps[$stepIndex].id",
                    "plan/source-intent/workflow/$workflowId/step/$stepId",
                    "workflow-step-membership",
                    step.id
                ))
                addStepFields(step, "$workflowSource.steps[$stepIndex]", inputNames)
            }
'''
          if text.count(old_steps) != 1:
              raise SystemExit(f"Expected one workflow-step lowering block, found {text.count(old_steps)}")
          text = text.replace(old_steps, new_steps, 1)

          old_resolver = '''                    "name" -> workflow.name
                    "kind" -> workflow.kind
                    else -> missing(identity)
'''
          new_resolver = '''                    "name" -> workflow.name
                    "kind" -> workflow.kind
                    "step" -> {
                        val stepId = parts.getOrNull(5) ?: missing(identity)
                        stepId.takeIf { it in workflow.stepIds } ?: missing(identity)
                    }
                    else -> missing(identity)
'''
          if text.count(old_resolver) != 1:
              raise SystemExit(f"Expected one source-workflow resolver block, found {text.count(old_resolver)}")
          text = text.replace(old_resolver, new_resolver, 1)

          path.write_text(text)

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt
          git commit -m "SI-01: certify workflow-step lowering membership [skip ci]"
          git push origin HEAD:flow/si-01-control-evidence-scope
