name: Repair v0.9.7.5 Canonical Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0975-repair.yml

permissions:
  contents: write

jobs:
  repair-and-regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.5-canonical-intent-meaning
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Apply contract and invariant fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new))

          replace_once(
              "src/main/kotlin/org/flowlang/standard/StandardCapabilityContracts.kt",
              '        StandardCapability.DATA_SYNC to contract(StandardCapability.DATA_SYNC, required = listOf("source", "destination"), optional = listOf("mode", "system", "target")),\n        StandardCapability.SYNC to contract(StandardCapability.SYNC, required = listOf("source", "destination"), optional = listOf("mode", "system", "target")),',
              '''        StandardCapability.DATA_SYNC to contract(
                  StandardCapability.DATA_SYNC,
                  required = listOf("source", "destination"),
                  optional = listOf("mode", "filters", "batches", "system", "target")
              ),
              StandardCapability.SYNC to contract(
                  StandardCapability.SYNC,
                  required = listOf("source", "destination"),
                  optional = listOf("mode", "filters", "batches", "system", "target")
              ),'''
          )
          replace_once(
              "tests/FlowAiNormalizationTests.kt",
              '''        val build = plan.tasks.first { it.module == "docker" && it.action == "build" }
                  assertTrue(build.params["image"]?.contains("${'$'}{version}") == true, "Plan must retain version as a template reference, not as a quoted literal value.")''',
              '''        val build = plan.tasks.first {
                  it.module == "standard" &&
                      it.action == "execute" &&
                      it.params["operation"] == "\\\"build-image\\\""
              }
              assertTrue(
                  build.params["image"]?.contains("${'$'}{version}") == true,
                  "Semantic build intent must retain version as a template reference without selecting Docker implicitly."
              )'''
          )
          replace_once(
              "tests/FlowRendererFailureSemanticsTests.kt",
              '            "standard_rollback_1",\n            "notify_send_1"',
              '            "standard_rollback_1",\n            "standard_execute_4"'
          )
          PY

      - name: Regenerate canonical reference snapshots
        shell: bash
        run: |
          set -euo pipefail
          cat > src/test/kotlin/RegenerateV0975SnapshotsTest.kt <<'KOTLIN'
          import java.io.File
          import kotlin.test.Test
          import org.flowlang.conformance.ReferenceSnapshotBundleGenerator

          class RegenerateV0975SnapshotsTest {
              @Test
              fun regenerateCanonicalSnapshots() {
                  ReferenceSnapshotBundleGenerator().generate(
                      intentFile = File("examples/intent/build-test-deploy.intent.yaml"),
                      outputDir = File("conformance/snapshots/build-test-deploy"),
                      scenarioId = "build-test-deploy"
                  )
                  ReferenceSnapshotBundleGenerator().generate(
                      intentFile = File("examples/intent/checkout-build-image.intent.yaml"),
                      outputDir = File("conformance/snapshots/checkout-build-image"),
                      scenarioId = "checkout-build-image",
                      targetIds = setOf("jenkins")
                  )
              }
          }
          KOTLIN
          ./gradlew test --tests RegenerateV0975SnapshotsTest --no-daemon --stacktrace
          rm -f src/test/kotlin/RegenerateV0975SnapshotsTest.kt

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0975-repair.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align canonical meaning evidence and snapshots"
          git push origin HEAD:agent/v0.9.7.5-canonical-intent-meaning
