name: v0.9.5.7.9 Validated Apply

on:
  push:
    branches:
      - feature/v0957-9-reference-snapshot-honesty-reset

permissions:
  contents: write

concurrency:
  group: v09579-validated-apply
  cancel-in-progress: false

jobs:
  validate-and-persist:
    if: ${{ !contains(github.event.head_commit.message, '[v09579-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-9-reference-snapshot-honesty-reset
          fetch-depth: 0

      - name: Reconstruct and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .flow-agent/patches/v09579.patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/v09579.patch
          git apply --check /tmp/v09579.patch
          git apply /tmp/v09579.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate exact snapshots from the real pipeline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon test --tests org.flowlang.tests.ReferenceSnapshotWriterTests --stacktrace --console=plain
          cp -R build/generated-reference-snapshots/. conformance/snapshots/build-test-deploy/

      - name: Remove transactional bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm tests/ReferenceSnapshotWriterTests.kt
          rm .github/workflows/v09579-validated-apply.yml
          rm .flow-agent/patches/v09579.patch.gz.b64.00
          rm .flow-agent/patches/v09579.patch.gz.b64.01
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate Flow Agent tooling and structure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/flow_agent_validate.py
          python3 tools/flow_agent_runner.py

      - name: Compile and test complete clean tree
        shell: bash
        run: ./gradlew --no-daemon clean test --stacktrace --console=plain

      - name: Run full conformance
        shell: bash
        run: ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain

      - name: Persist only the fully validated clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main
          git reset --mixed origin/main
          git add -A
          git diff --cached --check
          git config user.name "flow-reference-honesty-bot"
          git config user.email "flow-reference-honesty-bot@users.noreply.github.com"
          git commit -m "Reset v0.9.5.7.9 reference scenario and snapshot honesty [v09579-final]"
          git push --force-with-lease origin HEAD:feature/v0957-9-reference-snapshot-honesty-reset
