name: v0.9.7.9.1 Changelog Refresh

on:
  push:
    branches:
      - agent/v0.9.7.9.1-evidence-control-integrity

permissions:
  contents: write

jobs:
  refresh-changelog:
    if: ${{ !startsWith(github.event.head_commit.message, '[changelog-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.9.1-evidence-control-integrity
          fetch-depth: 0

      - name: Insert bounded correction entry
        run: python3 .flow-agent/tools/insert-v0.9.7.9.1-changelog.py

      - name: Commit changelog evidence
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already current."
            exit 0
          fi
          git config user.name "flow-ci"
          git config user.email "flow-ci@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[changelog-generated] Record v0.9.7.9.1 integrity repair"
          git push origin HEAD:agent/v0.9.7.9.1-evidence-control-integrity
