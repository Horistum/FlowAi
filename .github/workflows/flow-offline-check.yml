name: Flow Offline Reproducibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  offline-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare and verify isolated offline build
        shell: bash
        run: bash tools/offline_gradle_build.sh all

      - name: Upload offline input manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-offline-input-manifest
          path: .flow-offline/input-manifest.txt
          if-no-files-found: warn
