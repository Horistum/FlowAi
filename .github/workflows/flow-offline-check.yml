name: flow-offline-check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Two independent 20-minute build phases plus setup and evidence upload.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install online prefetch prerequisites
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3

      - name: Prefetch and seal the Gradle input cache
        timeout-minutes: 20
        run: ./tools/offline_gradle_build.sh prefetch

      - name: Verify the relocated offline Gradle cache contract
        timeout-minutes: 20
        run: ./tools/offline_gradle_build.sh verify

      - name: Upload offline input-cache manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-offline-input-manifests
          path: |
            build/reports/offline-cache/*.json
            build/reports/offline-cache/*.txt
          retention-days: 14

  empty-home-proof:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Keep the same phase budgets for the independently prepared empty home.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install online prefetch prerequisites
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3

      - name: Prefetch and seal with an explicitly empty home
        timeout-minutes: 20
        run: |
          proof_root="$RUNNER_TEMP/flow-empty-home-proof"
          rm -rf "$proof_root"
          ./tools/offline_gradle_build.sh prefetch \
            --prefetch-gradle-home "$proof_root/prepared-gradle-home" \
            --verify-gradle-home "$proof_root/verified-gradle-home"

      - name: Verify the relocated explicitly empty home
        timeout-minutes: 20
        run: |
          proof_root="$RUNNER_TEMP/flow-empty-home-proof"
          ./tools/offline_gradle_build.sh verify \
            --prefetch-gradle-home "$proof_root/prepared-gradle-home" \
            --verify-gradle-home "$proof_root/verified-gradle-home"

      - name: Upload empty-home offline input-cache manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-offline-empty-home-input-manifests
          path: |
            build/reports/offline-cache/*.json
            build/reports/offline-cache/*.txt
          retention-days: 14
