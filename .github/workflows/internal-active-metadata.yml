name: Internal Active Correction Metadata

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'assembly/v0.9.7.9.9-target-selection-cli-result'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Assembly Branch
        uses: actions/checkout@v4
        with:
          ref: assembly/v0.9.7.9.9-target-selection-cli-result
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Active Metadata And Remove Helpers
        shell: bash
        run: |
          set -euo pipefail
          encoded=.flow-agent/internal/active-metadata.patch.gz.b64
          test "$(wc -c < "$encoded")" = "6980"
          test "$(sha256sum "$encoded" | awk '{print $1}')" = "b8ae13a83e8fedc8bfcdc6f0980302472350fccc4969ec27e43e9c3f0aceb9a4"
          compressed="$(mktemp)"
          patch_file="$(mktemp)"
          base64 --decode "$encoded" > "$compressed"
          test "$(sha256sum "$compressed" | awk '{print $1}')" = "3a51ba02ff5048876deef6525dac1bdd6e1d9c164e15c96b62ffa13e6b0ab620"
          gzip --decompress --stdout "$compressed" > "$patch_file"
          test "$(sha256sum "$patch_file" | awk '{print $1}')" = "0c445dadba2917c24f0bd2cd83356d8dd13ff480a3c269fe53194d94dbf8903c"
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -rf .flow-agent/internal
          rm -f .github/workflows/internal-active-metadata.yml
          git add -A
          git diff --cached --check
          git config user.name "Flow Architecture Agent"
          git config user.email "flow-architecture-agent@users.noreply.github.com"
          git commit -m "Reopen correction for typed target selection validation"
          git push origin HEAD:assembly/v0.9.7.9.9-target-selection-cli-result
