name: Apply v0.9.5.7.4 fixture repair

on:
  push:
    branches:
      - feature/v0957-4-remove-legacy-shell-generator-fixtures

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-4-remove-legacy-shell-generator-fixtures
          fetch-depth: 0

      - name: Apply repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          branch_workflow = Path('.github/workflows/v0957-4-apply-repair.yml')
          spec_path = Path('tests/FlowSpecTests_part2.kt')
          spec = spec_path.read_text()

          plan_helper = re.compile(
              r'@Suppress\("DEPRECATION"\)\n'
              r'private fun legacyJenkinsGeneratorOutput\(plan: org\.flowlang\.planner\.ExecutionPlan\): String =\n'
              r'    JenkinsGenerator\(\)\.generate\(plan\)\n\n'
          )
          document_helper = re.compile(
              r'@Suppress\("DEPRECATION"\)\n'
              r'private fun legacyJenkinsGeneratorOutput\(document: FlowDocument\): String =\n'
              r'    JenkinsGenerator\(\)\.generate\(document, ModuleRegistry\(\)\)\n\n'
          )
          spec, plan_count = plan_helper.subn('', spec, count=1)
          spec, document_count = document_helper.subn('', spec, count=1)
          if plan_count != 1 or document_count != 1:
              raise SystemExit(f'Expected both legacy Jenkins helpers once, got plan={plan_count}, document={document_count}')

          section_start = '/* ============================ Jenkins generator (#1) ============================ */'
          section_end = '/* ============================ main ============================ */'
          start = spec.find(section_start)
          end = spec.find(section_end)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Legacy Jenkins generator test section markers were not found')
          replacement = '''/* ============================ archived projection fixtures ============================ */
          /*
           * The executable-looking Jenkins generator assertions formerly stored here were
           * removed by v0.9.5.7.4. Legacy shell/CLI mappings now live as structured negative
           * fixture cases under conformance/negative-fixtures and are evaluated through the
           * canonical materialization and renderer-readiness contracts.
           */

          '''
          spec = spec[:start] + replacement + spec[end:]
          if '    jenkinsGeneratorTests()\n' not in spec:
              raise SystemExit('Legacy Jenkins generator test invocation was not found')
          spec = spec.replace('    jenkinsGeneratorTests()\n', '', 1)
          if 'JenkinsGenerator()' in spec or 'fun jenkinsGeneratorTests()' in spec:
              raise SystemExit('Active legacy Jenkins generator references remain in FlowSpecTests_part2.kt')
          spec_path.write_text(spec)

          fixture = Path('conformance/negative-fixtures/legacy-jenkins-shell-projections.yaml')
          fixture.parent.mkdir(parents=True, exist_ok=True)
          fixture.write_text('''fixtureVersion: "1.0"
          kind: LegacyProjectionNegativeFixture
          classification: ARCHIVED_NEGATIVE
          compiled: false
          purpose: >-
            Preserve historical Jenkins shell and CLI projection cases only as negative
            conformance evidence. Every case is evaluated through the canonical
            materialization resolver and unified renderer readiness policy.
          cases:
            - id: shell-run
              module: shell
              action: run
              expectedMaterialization: BLOCKED
              expectedRenderMode: FAIL_FAST
            - id: docker-build
              module: docker
              action: build
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: helm-template
              module: helm
              action: template
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: helm-upgrade
              module: helm
              action: upgrade
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: argocd-sync
              module: argocd
              action: sync
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: kubernetes-get
              module: kubernetes
              action: get
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: kubernetes-deploy
              module: kubernetes
              action: deploy
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: kubernetes-delete
              module: kubernetes
              action: delete
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: database-query
              module: database
              action: query
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
            - id: notify-send
              module: notify
              action: send
              expectedMaterialization: ADAPTER_REQUIRED
              expectedRenderMode: REVIEW_ONLY
          ''')

          test_file = Path('src/test/kotlin/LegacyShellGeneratorFixtureTests.kt')
          test_file.write_text(r'''import com.fasterxml.jackson.databind.ObjectMapper
          import com.fasterxml.jackson.dataformat.yaml.YAMLFactory
          import com.fasterxml.jackson.module.kotlin.registerKotlinModule
          import java.io.File
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFailsWith
          import kotlin.test.assertFalse
          import kotlin.test.assertTrue
          import org.flowlang.capabilities.CompatibilityReport
          import org.flowlang.capabilities.SupportLevel
          import org.flowlang.generators.manifest.JenkinsManifestGenerator
          import org.flowlang.generators.manifest.JenkinsManifestRenderer
          import org.flowlang.generators.manifest.TargetMaterializationStatus
          import org.flowlang.generators.manifest.TargetRenderBlockedException
          import org.flowlang.generators.manifest.TargetRenderMode
          import org.flowlang.generators.manifest.TargetRenderPolicy
          import org.flowlang.planner.ExecutionPlan
          import org.flowlang.planner.TaskNode

          private data class LegacyProjectionNegativeFixture(
              val fixtureVersion: String = "",
              val kind: String = "",
              val classification: String = "",
              val compiled: Boolean = true,
              val purpose: String = "",
              val cases: List<LegacyProjectionCase> = emptyList()
          )

          private data class LegacyProjectionCase(
              val id: String = "",
              val module: String = "",
              val action: String = "",
              val expectedMaterialization: String = "",
              val expectedRenderMode: String = ""
          )

          class LegacyShellGeneratorFixtureTests {
              private val fixtureFile = File("conformance/negative-fixtures/legacy-jenkins-shell-projections.yaml")
              private val fixture = ObjectMapper(YAMLFactory())
                  .registerKotlinModule()
                  .readValue(fixtureFile, LegacyProjectionNegativeFixture::class.java)

              @Test
              fun legacyJenkinsGeneratorIsAbsentFromActiveKotlinSourceSets() {
                  val activeRoots = listOf(File("src/main/kotlin"), File("src/test/kotlin"), File("tests"))
                  val offenders = activeRoots
                      .filter { it.exists() }
                      .flatMap { root -> root.walkTopDown().filter { it.isFile && it.extension == "kt" }.toList() }
                      .filter { it.nameWithoutExtension == "JenkinsGenerator" }
                      .map { it.invariantSeparatorsPath }

                  assertTrue(
                      offenders.isEmpty(),
                      "Legacy JenkinsGenerator must not be compiled from active Kotlin source sets: $offenders"
                  )
              }

              @Test
              fun archivedFixtureIsExplicitlyNegativeAndNonCompiled() {
                  assertTrue(fixtureFile.isFile)
                  assertEquals("1.0", fixture.fixtureVersion)
                  assertEquals("LegacyProjectionNegativeFixture", fixture.kind)
                  assertEquals("ARCHIVED_NEGATIVE", fixture.classification)
                  assertFalse(fixture.compiled)
                  assertTrue(fixture.purpose.contains("canonical materialization resolver"))
                  assertTrue(fixture.cases.isNotEmpty())
              }

              @Test
              fun archivedCasesUseCanonicalMaterializationAndRenderPolicy() {
                  fixture.cases.forEach { case ->
                      val manifest = JenkinsManifestGenerator().generate(
                          ExecutionPlan(
                              flowName = "legacy-negative-${case.id}",
                              nodes = listOf(
                                  TaskNode(
                                      id = case.id,
                                      module = case.module,
                                      action = case.action,
                                      target = "fixture"
                                  )
                              )
                          ),
                          CompatibilityReport(target = "jenkins", status = SupportLevel.SUPPORTED)
                      )
                      val step = manifest.jobs.single().steps.single()
                      val expectedMaterialization = TargetMaterializationStatus.valueOf(case.expectedMaterialization)
                      val expectedRenderMode = TargetRenderMode.valueOf(case.expectedRenderMode)

                      assertEquals(expectedMaterialization, step.materialization.status, case.id)
                      assertEquals(null, step.run, "${case.id} must not carry legacy executable text")

                      val readiness = TargetRenderPolicy.evaluate(manifest)
                      assertEquals(expectedRenderMode, readiness.mode, case.id)

                      when (expectedRenderMode) {
                          TargetRenderMode.FAIL_FAST -> {
                              val failure = assertFailsWith<TargetRenderBlockedException>(case.id) {
                                  JenkinsManifestRenderer().render(manifest)
                              }
                              assertEquals(TargetRenderMode.FAIL_FAST, failure.readiness.mode, case.id)
                          }
                          TargetRenderMode.REVIEW_ONLY -> {
                              val rendered = JenkinsManifestRenderer().render(manifest)
                              assertTrue(rendered.contains("kind: TargetProjectionReview"), case.id)
                              assertTrue(rendered.contains("renderMode: REVIEW_ONLY"), case.id)
                              assertTrue(rendered.contains("executable: false"), case.id)
                              assertFalse(rendered.contains("pipeline {"), case.id)
                              assertFalse(rendered.contains("agent any"), case.id)
                          }
                          TargetRenderMode.EXECUTABLE -> error("Archived legacy case '${case.id}' must never claim executable readiness.")
                      }
                  }
              }
          }
          ''')

          doc = Path('docs/V0_9_5_7_4_REMOVE_LEGACY_SHELL_GENERATOR_FIXTURES.md')
          doc.write_text('''# v0.9.5.7.4 Remove Legacy Shell Generator Fixtures

          ## Purpose

          v0.9.5.7.4 removes the last compiled test generator that still treated shell commands and concrete CLI calls as successful Jenkins projection.

          ## Removed active behavior

          `src/test/kotlin/org/flowlang/generators/JenkinsGenerator.kt` was part of the normal Gradle test source set. Despite its legacy label, it emitted active Jenkins syntax for `shell.run`, Docker, Helm, Argo CD, Kubernetes and database operations, and used `echo` as a fallback for unmapped work.

          The file is deleted rather than retained as a compatibility facade. A compiled facade would remain a second projection implementation and would keep obsolete shell behavior available to tests and future callers.

          ## Archived negative fixture

          Historical cases are represented by `conformance/negative-fixtures/legacy-jenkins-shell-projections.yaml`.

          The fixture contains only structured capability identities and expected outcomes. It stores no shell command bodies and is explicitly classified as `ARCHIVED_NEGATIVE` and `compiled: false`.

          Each case is executed through the real `JenkinsManifestGenerator`, `TargetMaterializationResolver`, `TargetRenderPolicy` and `JenkinsManifestRenderer` contracts:

          - `shell.run` resolves to `BLOCKED` and `FAIL_FAST`.
          - Docker, Helm, Argo CD, Kubernetes, database and notification actions resolve to `ADAPTER_REQUIRED` and `REVIEW_ONLY` until explicit target projection evidence exists.
          - review-only cases emit `TargetProjectionReview`, never Jenkins pipeline syntax.
          - no case carries `TargetStep.run` executable text.

          ## Test migration

          `FlowSpecTests_part2.kt` no longer compiles or asserts the historical Jenkins shell generator. Its old expectations for `sh`, `kubectl`, Docker, Helm, Argo CD and `echo` output were removed.

          `LegacyShellGeneratorFixtureTests` adds structural and behavioral gates that:

          - reject a `JenkinsGenerator.kt` file in active Kotlin source sets;
          - require the archived fixture to remain explicitly negative and non-compiled;
          - verify every fixture case against canonical materialization and renderer readiness.

          ## Versioning boundary

          This repair does not change the package version, public standard version or artifact schema versions. Compatibility and executable readiness remain separate until v0.9.5.7.5.
          ''')

          report = Path('.flow-agent/reports/v0.9.5.7.4-remove-legacy-shell-generator-fixtures.md')
          report.write_text('''# v0.9.5.7.4 Remove Legacy Shell Generator Fixtures

          ## Summary

          The compiled legacy Jenkins generator fixture has been removed from the active Gradle test source set.

          ## Changes

          - Deleted the 372-line test generator that emitted Jenkins `sh`, concrete CLI commands and `echo` fallbacks.
          - Removed obsolete generator-output assertions from `FlowSpecTests_part2.kt`.
          - Added a structured, non-compiled archived negative fixture for the historical shell and CLI cases.
          - Added executable regression coverage using the canonical manifest, materialization and renderer-readiness path.
          - Added a structural gate preventing `JenkinsGenerator.kt` from returning to active Kotlin source roots.

          ## Expected semantics

          - `shell.run`: `BLOCKED` / `FAIL_FAST`.
          - historical concrete-tool actions: `ADAPTER_REQUIRED` / `REVIEW_ONLY`.
          - no legacy case may emit Jenkins syntax or populate `TargetStep.run`.

          ## Version boundary

          Package version remains `0.9.4`, public standard version remains `0.7.6`, and artifact schema versions are unchanged.
          ''')

          roadmap_path = Path('.flow-agent/roadmap-v0.9.5.7-repair-track.yaml')
          roadmap = roadmap_path.read_text()
          old_item = '''  - version: "0.9.5.7.4"
              name: Remove Legacy Shell Generator Fixtures
              status: next
              purpose: Remove or quarantine legacy test generators that still encode shell execution as the expected behavior.
              requiredOutcome:
                - Legacy Jenkins shell generator is deleted or moved into explicit archived negative fixtures.
                - Tests no longer assert sh/docker/kubectl/helm/argocd shell projection as active Flow behavior.
                - Shell-based examples are reclassified as blocked or review-required scenarios.

            - version: "0.9.5.7.5"
              name: Compatibility and Readiness Honesty
              status: planned
          '''
          new_item = '''  - version: "0.9.5.7.4"
              name: Remove Legacy Shell Generator Fixtures
              status: completed
              purpose: Remove or quarantine legacy test generators that still encode shell execution as the expected behavior.
              requiredOutcome:
                - Legacy Jenkins shell generator was removed from compiled test sources.
                - Historical shell and concrete-tool cases are stored only as structured archived negative fixtures.
                - Tests classify shell execution as blocked and unresolved adapter work as review-only.

            - version: "0.9.5.7.5"
              name: Compatibility and Readiness Honesty
              status: next
          '''
          if old_item not in roadmap:
              raise SystemExit('Expected v0.9.5.7.4/.5 roadmap block was not found')
          roadmap_path.write_text(roadmap.replace(old_item, new_item, 1))

          report_path = Path('REPORT.md')
          top_report = report_path.read_text()
          top_report = top_report.replace('Current scoped correction item: `0.9.5.7.3`', 'Current scoped correction item: `0.9.5.7.4`')
          old_progress = '''`0.9.5.7.3 Renderer Failure Semantics Unification` introduces one renderer readiness policy. Unresolved target payloads produce a non-executable Flow review artifact, blocked materialization fails before target syntax is returned, and vendor syntax requires explicit renderer payload evidence.

          The repair subtrack is recorded in `.flow-agent/roadmap-v0.9.5.7-repair-track.yaml`. The next scoped repair item is `0.9.5.7.4 Remove Legacy Shell Generator Fixtures`.
          '''
          new_progress = '''`0.9.5.7.3 Renderer Failure Semantics Unification` introduces one renderer readiness policy. Unresolved target payloads produce a non-executable Flow review artifact, blocked materialization fails before target syntax is returned, and vendor syntax requires explicit renderer payload evidence.

          `0.9.5.7.4 Remove Legacy Shell Generator Fixtures` removes the compiled Jenkins shell generator and replaces historical command-oriented expectations with structured archived negative fixtures evaluated through canonical materialization and renderer-readiness contracts.

          The repair subtrack is recorded in `.flow-agent/roadmap-v0.9.5.7-repair-track.yaml`. The next scoped repair item is `0.9.5.7.5 Compatibility and Readiness Honesty`.
          '''
          if old_progress not in top_report:
              raise SystemExit('Expected REPORT.md correction progress block was not found')
          top_report = top_report.replace(old_progress, new_progress, 1)
          old_boundary = 'v0.9.5.7.3 changes renderer output honesty. It does not add renderer payload implementations; it prevents incomplete materialization from being serialized as apparently executable vendor artifacts.\n'
          new_boundary = 'v0.9.5.7.4 removes obsolete compiled projection behavior from test sources. It does not add target payload implementations or claim executable readiness for archived shell and concrete-tool cases.\n'
          if old_boundary not in top_report:
              raise SystemExit('Expected REPORT.md architecture boundary was not found')
          report_path.write_text(top_report.replace(old_boundary, new_boundary, 1))

          branch_workflow.unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete v0.9.5.7.4 legacy fixture removal"
          git push origin HEAD:feature/v0957-4-remove-legacy-shell-generator-fixtures
