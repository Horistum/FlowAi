name: Repair v0.9.7.6 Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0976-repair.yml

permissions:
  contents: write

jobs:
  repair-and-regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.6-universal-effect-state-transition
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and apply fixture repair
        shell: bash
        run: |
          set -euo pipefail
          echo "b1cc274e6adefcb4dd61c4371f26c03a25d8c7577930a71050372cf8863c259b  .flow-agent/tmp/v0976-repair-000.b64" | sha256sum --check
          echo "0d663fb1dab842e5b20692e7e837efda14401a757bc9e2423f08db87fff0116f  .flow-agent/tmp/v0976-repair-001.b64" | sha256sum --check
          cat .flow-agent/tmp/v0976-repair-*.b64 | tr -d '\r\n' > /tmp/v0976-repair.b64
          echo "ba8ffac09fb6c00bcb28fe0cfbac6ce83fa72935ba8b68bde302095f713ed3c5  /tmp/v0976-repair.b64" | sha256sum --check
          base64 --decode /tmp/v0976-repair.b64 > /tmp/v0976-repair.tar.gz
          echo "08a6e7476854014893d90fa467ac2f40a7d583d74fdacbdb00bb8f07246d6094  /tmp/v0976-repair.tar.gz" | sha256sum --check
          tar -tzf /tmp/v0976-repair.tar.gz > /dev/null
          tar -xzf /tmp/v0976-repair.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path("src/test/kotlin/UniversalEffectStateTransitionModelTests.kt")
          text = path.read_text()
          old = '''        val update = CanonicalIntentEffectAuthority.effectsFor(StandardCapability.DEPLOY).single()
                  assertEquals(EffectOperation.UPDATE, update.operation)
                  assertEquals(ResourceState.PRESENT, update.transition?.from)
                  assertEquals(ResourceState.PRESENT, update.transition?.to)
                  assertTrue(update.mutatesState)
          '''
          new = '''        val reconcile = CanonicalIntentEffectAuthority.effectsFor(StandardCapability.DEPLOY).single()
                  assertEquals(EffectOperation.UPSERT, reconcile.operation)
                  assertEquals(ResourceState.UNKNOWN, reconcile.transition?.from)
                  assertEquals(ResourceState.PRESENT, reconcile.transition?.to)
                  assertTrue(reconcile.mutatesState)
          '''
          if old not in text:
              raise SystemExit("Expected deployment transition assertion was not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Validate typed effect contract
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test --tests UniversalEffectStateTransitionModelTests --stacktrace 2>&1 | tee /tmp/v0976-effect-tests.log

      - name: Regenerate canonical reference snapshots
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/build-test-deploy.intent.yaml --out conformance/snapshots/build-test-deploy --scenario-id build-test-deploy" --stacktrace 2>&1 | tee /tmp/v0976-build-test-deploy.log
          ./gradlew --no-daemon run --args="reference-snapshot --intent examples/intent/checkout-build-image.intent.yaml --out conformance/snapshots/checkout-build-image --scenario-id checkout-build-image --targets jenkins" --stacktrace 2>&1 | tee /tmp/v0976-checkout-build-image.log

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0976-repair-diagnostics
          path: /tmp/v0976-*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flow-agent/tmp/v0976-repair-*.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0976-repair.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair v0.9.7.6 fixtures and regenerate evidence"
          git push origin HEAD:agent/v0.9.7.6-universal-effect-state-transition
