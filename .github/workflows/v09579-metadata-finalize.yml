name: v0.9.5.7.9 Metadata Finalization

on:
  push:
    branches:
      - feature/v0957-9-reference-snapshot-honesty-reset

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/v0957-9-reference-snapshot-honesty-reset
          fetch-depth: 0

      - name: Apply exact metadata finalization
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/v09579_finalize_metadata.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Test Flow Agent tooling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate Flow Agent structure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_validate.py

      - name: Generate Flow Agent context
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/flow_agent_runner.py

      - name: Compile and test
        run: ./gradlew --no-daemon clean test --stacktrace --console=plain

      - name: Run conformance
        run: ./gradlew --no-daemon run --args="conformance" --stacktrace --console=plain

      - name: Persist only fully validated metadata
        shell: bash
        run: |
          rm .github/workflows/v09579-metadata-finalize.yml
          rm tools/v09579_finalize_metadata.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "flow-metadata-bot"
          git config user.email "flow-metadata-bot@users.noreply.github.com"
          git add REPORT.md CHANGELOG.md \
            .flow-agent/release-state.yaml \
            .flow-agent/roadmap.yaml \
            .flow-agent/roadmap-v0.9.5.7-repair-track.yaml \
            .flow-agent/reports/v0.9.5.7.9-reference-scenario-and-snapshot-honesty-reset.md \
            docs/V0_9_5_7_9_REFERENCE_SCENARIO_AND_SNAPSHOT_HONESTY_RESET.md \
            src/test/kotlin/VersionConsistencyTests.kt \
            .github/workflows/v09579-metadata-finalize.yml \
            tools/v09579_finalize_metadata.py
          git diff --cached --check
          git commit -m "Finalize v0.9.5.7.9 metadata and repair track"
          git push origin HEAD:feature/v0957-9-reference-snapshot-honesty-reset
