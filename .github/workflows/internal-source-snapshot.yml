name: Internal Source Snapshot

on:
  push:
    branches:
      - 'assembly/**'
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Exact Assembly Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify And Package Source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git rev-parse HEAD > snapshot-commit.txt
          git rev-parse HEAD^{tree} > snapshot-tree.txt
          parent="$(git rev-parse HEAD^)"
          git rev-parse "${parent}^{tree}" > snapshot-parent-tree.txt
          tar --exclude=.git --exclude=source-snapshot.tar.gz -czf source-snapshot.tar.gz .

      - name: Upload Source Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: internal-source-snapshot
          path: |
            source-snapshot.tar.gz
            snapshot-commit.txt
            snapshot-tree.txt
            snapshot-parent-tree.txt
          if-no-files-found: error
          retention-days: 1
