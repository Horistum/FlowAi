name: Internal Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Exact Assembly Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify And Package Source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE_SHA: 37c965575c3c8be4bdca3c98e876d1bad7bbb268
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD~3)" = "${REVIEW_BASE_SHA}"
          git rev-parse HEAD > snapshot-commit.txt
          git rev-parse HEAD^{tree} > snapshot-tree.txt
          git rev-parse HEAD~3^{tree} > snapshot-base-tree.txt
          git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD

      - name: Upload Source Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: internal-source-snapshot
          path: |
            source-snapshot.tar.gz
            snapshot-commit.txt
            snapshot-tree.txt
            snapshot-base-tree.txt
          if-no-files-found: error
          retention-days: 1
