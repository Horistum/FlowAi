name: Internal Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Exact Assembly Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Package Source And Provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > snapshot-commit.txt
          git rev-parse HEAD^{tree} > snapshot-tree.txt
          git rev-parse 37c965575c3c8be4bdca3c98e876d1bad7bbb268^{tree} > snapshot-base-tree.txt
          git log --format='%H %P %s' -10 > snapshot-history.txt
          git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD

      - name: Upload Source Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: internal-source-snapshot
          path: |
            source-snapshot.tar.gz
            snapshot-commit.txt
            snapshot-tree.txt
            snapshot-base-tree.txt
            snapshot-history.txt
          if-no-files-found: error
          retention-days: 1
