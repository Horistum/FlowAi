name: Export v0.9.7.4 Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0974-source-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.4-universal-dependency-continuity
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          tar --exclude=.git --exclude=.gradle --exclude=build -czf /tmp/flowai-v0974-source.tar.gz .
          sha256sum /tmp/flowai-v0974-source.tar.gz > /tmp/flowai-v0974-source.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: flowai-v0974-source
          path: |
            /tmp/flowai-v0974-source.tar.gz
            /tmp/flowai-v0974-source.sha256
          if-no-files-found: error
