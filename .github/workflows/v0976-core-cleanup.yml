name: Finalize v0.9.7.6 Core Boundaries

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0976-core-cleanup.yml

permissions:
  contents: write

jobs:
  finalize-core-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.6-universal-effect-state-transition
          fetch-depth: 0

      - name: Remove serializer coupling and align conformance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrence(s) in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          effects = "src/main/kotlin/org/flowlang/effects/SemanticEffects.kt"
          replace_exact(effects, "import com.fasterxml.jackson.annotation.JsonIgnore\n\n", "")
          replace_exact(
              effects,
              "    @get:JsonIgnore\n    val observesResource: Boolean get() = operation == EffectOperation.READ\n\n",
              ""
          )
          replace_exact(
              effects,
              "    @get:JsonIgnore\n    val mutatesState: Boolean get() = operation in MUTATING_OPERATIONS\n\n",
              ""
          )
          replace_exact(
              effects,
              "    /** Backward-compatible resource projection for the historical string list. */\n    @get:JsonIgnore\n    val legacyIdentity: String get() = resource\n\n",
              ""
          )
          replace_exact(
              effects,
              "        private val MUTATING_OPERATIONS = setOf(\n            EffectOperation.CREATE,\n            EffectOperation.UPDATE,\n            EffectOperation.DELETE,\n            EffectOperation.UPSERT\n        )\n\n",
              ""
          )

          replace_exact(
              "src/main/kotlin/org/flowlang/planner/ExecutionPlan.kt",
              "effectModel.map(SemanticEffect::legacyIdentity)",
              "effectModel.map(SemanticEffect::resource)",
              expected=2
          )
          replace_exact(
              "src/main/kotlin/org/flowlang/planner/FlowPlanner.kt",
              "effectModel.map(SemanticEffect::legacyIdentity)",
              "effectModel.map(SemanticEffect::resource)"
          )
          replace_exact(
              "src/main/kotlin/org/flowlang/generators/manifest/MandatoryMaterializationAuthority.kt",
              "effectModel.map(SemanticEffect::legacyIdentity)",
              "effectModel.map(SemanticEffect::resource)"
          )

          tests = "src/test/kotlin/UniversalEffectStateTransitionModelTests.kt"
          replace_exact(tests, "import kotlin.test.assertFalse\n", "")
          replace_exact(tests, "        assertTrue(create.mutatesState)\n", "")
          replace_exact(tests, "        assertTrue(reconcile.mutatesState)\n", "")
          replace_exact(tests, "        assertTrue(read.observesResource)\n", "")
          replace_exact(tests, "        assertFalse(read.mutatesState)\n", "")
          replace_exact(
              tests,
              "forgedEffect.map(SemanticEffect::legacyIdentity)",
              "forgedEffect.map(SemanticEffect::resource)"
          )

          replace_exact(
              "src/main/kotlin/org/flowlang/conformance/StandardArchitectureNormalizationChecks.kt",
              "        val update = CanonicalIntentEffectAuthority.effectsFor(StandardCapability.DEPLOY).single()\n        require(update.operation == EffectOperation.UPDATE)\n        require(update.transition?.from == ResourceState.PRESENT && update.transition.to == ResourceState.PRESENT)\n",
              "        val reconcile = CanonicalIntentEffectAuthority.effectsFor(StandardCapability.DEPLOY).single()\n        require(reconcile.operation == EffectOperation.UPSERT)\n        require(reconcile.transition?.from == ResourceState.UNKNOWN && reconcile.transition.to == ResourceState.PRESENT)\n"
          )

          replace_exact(
              ".flow-agent/work-packages/v0.9.7.6-universal-effect-state-transition.yaml",
              '  - "Derived effect helpers remain internal and do not expand serialized artifact contracts."\n',
              '  - "Serialized effect evidence contains only declared semantic fields and keeps Core independent from serializer annotations."\n'
          )
          PY
          git diff --check

      - name: Validate focused effect and conformance contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test \
            --tests UniversalEffectStateTransitionModelTests \
            --tests FlowConformanceBridgeJUnitTest \
            --tests org.flowlang.tests.FlowRcConformanceTests \
            --stacktrace

      - name: Commit boundary cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0976-core-cleanup.yml
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize v0.9.7.6 core effect boundaries"
          git push origin HEAD:agent/v0.9.7.6-universal-effect-state-transition
