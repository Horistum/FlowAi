name: AR-02B Source Bundle

on:
  push:
    branches:
      - agent/ar-02b-explicit-merge-semantics

permissions:
  contents: read

concurrency:
  group: ar-02b-source-bundle
  cancel-in-progress: true

jobs:
  bundle-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Populate verified offline build cache
        shell: bash
        run: ./gradlew --no-daemon clean compileKotlin compileTestKotlin --stacktrace --console=plain

      - name: Archive source, Gradle state and JDK
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.gradle -czf /tmp/flowai-source.tgz .
          tar \
            --exclude='daemon' \
            --exclude='notifications' \
            --exclude='build-scan-data' \
            --exclude='jdks' \
            -C "$HOME" \
            -czf /tmp/flowai-gradle-home.tgz .gradle
          tar -C "$JAVA_HOME" -czf /tmp/flowai-jdk25.tgz .

      - name: Upload source bundle
        uses: actions/upload-artifact@v7
        with:
          name: ar02b-source-bundle
          path: /tmp/flowai-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload offline Gradle cache
        uses: actions/upload-artifact@v7
        with:
          name: ar02b-gradle-home
          path: /tmp/flowai-gradle-home.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK 25 toolchain
        uses: actions/upload-artifact@v7
        with:
          name: ar02b-jdk25
          path: /tmp/flowai-jdk25.tgz
          if-no-files-found: error
          retention-days: 1
