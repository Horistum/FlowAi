name: Diagnose v0.9.7.3 Fix Payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0973-fix1.yml

permissions:
  contents: write

jobs:
  diagnose-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0
      - name: Record payload diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            for index in 00 01 02 03 04 05; do
              file=".flow-agent/tmp/v0973-fix1-part-${index}.b64"
              printf '%s raw-bytes=' "$file"
              wc -c < "$file"
              printf '%s normalized-bytes=' "$file"
              tr -d '\r\n' < "$file" | wc -c
              printf '%s normalized-sha256=' "$file"
              tr -d '\r\n' < "$file" | sha256sum | cut -d' ' -f1
            done
          } > .flow-agent/tmp/v0973-fix1-diagnostics.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add .flow-agent/tmp/v0973-fix1-diagnostics.txt
          git commit -m "Record v0.9.7.3 fix payload diagnostics"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
