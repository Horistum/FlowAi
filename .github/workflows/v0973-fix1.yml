name: Apply v0.9.7.3 Diagnostic Authorization Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0973-fix1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0

      - name: Verify fix payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0973-fix1-parts
          for index in 00 02 03 04 05; do
            tr -d '\r\n' < ".flow-agent/tmp/v0973-fix1-part-${index}.b64" > "/tmp/v0973-fix1-parts/part-${index}"
          done
          for suffix in a b c; do
            tr -d '\r\n' < ".flow-agent/tmp/v0973-fix1-part-01${suffix}.b64" > "/tmp/v0973-fix1-parts/part-01${suffix}"
          done
          cat > /tmp/v0973-fix1-subparts.sha256 <<'EOF'
          ba67f3fb950d1b0cbf6a6b068c6454fc9a474ec58b30a2e7ef7b7c28e4569d07  /tmp/v0973-fix1-parts/part-01a
          988380fb05de43d9c7cbcc53574b14f38e536b095303acea5cc6a3dd050862f7  /tmp/v0973-fix1-parts/part-01b
          02530248c03affe918e8006abd12b5d8ff7a52b968ce4389ae05507f52c24bbb  /tmp/v0973-fix1-parts/part-01c
          EOF
          sed -i 's/^          //' /tmp/v0973-fix1-subparts.sha256
          sha256sum --check /tmp/v0973-fix1-subparts.sha256
          cat /tmp/v0973-fix1-parts/part-01{a,b,c} > /tmp/v0973-fix1-parts/part-01
          cat > /tmp/v0973-fix1-parts.sha256 <<'EOF'
          e6612a227c43e9d8316865a1effa3510374069ba729df382846f9b32c3967c20  /tmp/v0973-fix1-parts/part-00
          d862b52f09e18a69e7473ef3c50117955c828b9cf0665c90947c952c0aa834fb  /tmp/v0973-fix1-parts/part-01
          20dd9cad2f5dd34540454588d79ef97b33c218c0b11970a51b77fc84cef4880d  /tmp/v0973-fix1-parts/part-02
          418be171199ff1fb91301aadc0160f18b6589ca20c12919209de44b67997f7a9  /tmp/v0973-fix1-parts/part-03
          35c5f4a392923f3464ba1691ae76dec0e02d232e078af36873ae287872a9ed45  /tmp/v0973-fix1-parts/part-04
          3451ad97e1b01c10bd55be2a5e15fdce85ca807b732bf6ad7aef304b84901555  /tmp/v0973-fix1-parts/part-05
          EOF
          sed -i 's/^          //' /tmp/v0973-fix1-parts.sha256
          sha256sum --check /tmp/v0973-fix1-parts.sha256
          cat /tmp/v0973-fix1-parts/part-{00..05} | base64 --decode > /tmp/v0973-fix1.tar.gz
          echo "a60e6234a80250cdf1c85c92f4bdc72f15b83238bd6eb324b4ebf2ad0558f29e  /tmp/v0973-fix1.tar.gz" | sha256sum --check

      - name: Apply diagnostic authorization fix
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0973-fix1.tar.gz
          rm -f .flow-agent/tmp/v0973-fix1-part-{00..05}.b64
          rm -f .flow-agent/tmp/v0973-fix1-part-01{a,b,c}.b64
          rm -f .flow-agent/tmp/v0973-fix1-diagnostics.txt
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0973-fix1.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add diagnostic materialization authorization"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
