name: Apply v0.9.7.3 Diagnostic Authorization Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v0973-fix1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.9.7.3-mandatory-materialization-authority
          fetch-depth: 0

      - name: Verify fix payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0973-fix1-parts
          for index in $(seq -w 0 5); do
            tr -d '\r\n' < ".flow-agent/tmp/v0973-fix1-part-${index}.b64" > "/tmp/v0973-fix1-parts/part-${index}"
          done
          cat > /tmp/v0973-fix1-parts.sha256 <<'EOF'
          e6612a227c43e9d8316865a1effa3510374069ba729df382846f9b32c3967c20  /tmp/v0973-fix1-parts/part-0
          d862b52f09e18a69e7473ef3c50117955c828b9cf0665c90947c952c0aa834fb  /tmp/v0973-fix1-parts/part-1
          20dd9cad2f5dd34540454588d79ef97b33c218c0b11970a51b77fc84cef4880d  /tmp/v0973-fix1-parts/part-2
          418be171199ff1fb91301aadc0160f18b6589ca20c12919209de44b67997f7a9  /tmp/v0973-fix1-parts/part-3
          35c5f4a392923f3464ba1691ae76dec0e02d232e078af36873ae287872a9ed45  /tmp/v0973-fix1-parts/part-4
          3451ad97e1b01c10bd55be2a5e15fdce85ca807b732bf6ad7aef304b84901555  /tmp/v0973-fix1-parts/part-5
          EOF
          sed -i 's/^          //' /tmp/v0973-fix1-parts.sha256
          sha256sum --check /tmp/v0973-fix1-parts.sha256
          cat /tmp/v0973-fix1-parts/part-{0..5} | base64 --decode > /tmp/v0973-fix1.tar.gz
          echo "a60e6234a80250cdf1c85c92f4bdc72f15b83238bd6eb324b4ebf2ad0558f29e  /tmp/v0973-fix1.tar.gz" | sha256sum --check

      - name: Apply diagnostic authorization fix
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v0973-fix1.tar.gz
          rm -f .flow-agent/tmp/v0973-fix1-part-{00..05}.b64
          rmdir .flow-agent/tmp 2>/dev/null || true
          rm -f .github/workflows/v0973-fix1.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flow-ai-agent"
          git config user.email "flow-ai-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add diagnostic materialization authorization"
          git push origin HEAD:agent/v0.9.7.3-mandatory-materialization-authority
