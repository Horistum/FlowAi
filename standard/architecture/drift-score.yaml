version: 1.3
purpose: Score active architecture risk from negative signals without crediting existing baseline artifacts as a positive floor.
minimumScore: 0
scoringMode: negative-signal-only
baselineSignals:
  - id: semantic-correctness
    description: Existing reference-corpus execution coverage is descriptive context and contributes no score.
  - id: safety-validation
    description: Existing safety validation is descriptive context and contributes no score.
  - id: conformance-coverage
    description: Existing conformance coverage is descriptive context and contributes no score.
  - id: artifact-stability
    description: Existing public artifact stability is descriptive context and contributes no score.
  - id: portability-explanation
    description: Existing portability explanation is descriptive context and contributes no score.
negativeSignals:
  - id: runtime-direction
    score: -3
    description: Introduces workflow execution, task execution, or runtime lifecycle mechanisms.
  - id: sdk-direction
    score: -3
    description: Introduces SDK, base-class, extension-point, or plugin-lifecycle mechanisms.
  - id: target-specific-standard
    score: -2
    description: Couples the public standard to a target implementation mechanism.
  - id: report-without-validation-purpose
    score: -2
    description: Adds public reporting or registry-consistency bookkeeping beyond the report budget without a behavior, safety, normalization, or governance role.
  - id: silent-semantic-fallback
    score: -4
    description: Allows unsupported semantics to degrade silently.
rule: Any present negative signal lowers the score. A score below minimum is rejected unless an Architecture Decision records an explicit exception and adds a falsifying conformance fixture.
