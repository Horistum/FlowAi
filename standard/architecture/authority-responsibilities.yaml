version: "1.0"
purpose: "AR0.1 machine-verifiable ownership inventory for every production Kotlin type whose name ends in Authority."
authorities:
  - name: "AbstractTopologyMatrixAuthority"
    path: "src/main/kotlin/org/flowlang/conformance/AbstractTopologyMatrixAuthority.kt"
    role: "evidence-integrity-owner"
    invariant: "Owns fail-closed integrity rules for abstract topology matrix; incomplete, contradictory or structurally invalid evidence must not be promoted to a passing claim."
    inputs: "Typed repository/runtime evidence being independently checked; production API: analyze."
    outputs: "Integrity assessment/report whose failures block unsupported promotion."
    callers:
      - "src/main/kotlin/org/flowlang/conformance/AbstractTopologyMatrixConformanceChecks.kt"
  - name: "AbstractTopologyMatrixRoadmapLifecycleAuthority"
    path: "src/main/kotlin/org/flowlang/conformance/AbstractTopologyMatrixRoadmapLifecycleAuthority.kt"
    role: "lifecycle-boundary"
    invariant: "Owns C0.2 local lifecycle and proves that its adjacent C0.3 handoff occurred."
    inputs: "Roadmap/work-package/release evidence and frozen predecessor boundaries; production API: analyze, evaluate."
    outputs: "Lifecycle phase/report and fail-closed transition findings."
    callers:
      - "src/main/kotlin/org/flowlang/conformance/AbstractTopologyMatrixConformanceChecks.kt"
  - name: "AdapterArtifactRenderingAuthority"
    path: "src/main/kotlin/org/flowlang/adapters/rendering/AdapterArtifactRenderingAuthority.kt"
    role: "adapter-policy-owner"
    invariant: "The single application-edge authority for adapter artifacts."
    inputs: "Frozen neutral requirements plus adapter-owned target evidence/configuration; production API: analyze, render, requireValid."
    outputs: "Adapter assessment, support evidence, or reconciled diagnostic result without semantic rewriting."
    callers:
      - "src/main/kotlin/org/flowlang/adapters/trigger/AdapterTriggerAuthorizedRenderingAuthority.kt"
      - "src/main/kotlin/org/flowlang/conformance/AdapterArtifactRenderingConformanceChecks.kt"
      - "src/main/kotlin/org/flowlang/conformance/ConformanceCheckSupport.kt"
  - name: "AdapterArtifactRenderingEvidenceIntegrityAuthority"
    path: "src/main/kotlin/org/flowlang/adapters/rendering/AdapterArtifactRenderingEvidenceIntegrityAuthority.kt"
    role: "evidence-integrity-owner"
    invariant: "Certifies distribution-owned renderer evidence independently from one concrete manifest. Provider presence, target registry flags and output syntax are not enough to claim executable artifact rendering."
    inputs: "Typed repository/runtime evidence being independently checked; production API: analyze."
    outputs: "Integrity assessment/report whose failures block unsupported promotion."
    callers:
      - "src/main/kotlin/org/flowlang/adapters/rendering/AdapterArtifactRenderingAuthority.kt"
      - "src/main/kotlin/org/flowlang/conformance/AdapterArtifactRenderingConformanceChecks.kt"
