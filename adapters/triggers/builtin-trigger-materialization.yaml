        prerequisites: []
        limitations:
          - "PipelineRun, EventListener, Trigger, TriggerTemplate and TriggerBinding ownership is outside the current provider."
      - <<: *tekton_unsupported
        family: CRON
        semantics:
          supported: []
          unsupported:
            schedule.cron: "The Pipeline artifact contains no scheduler resource."
          unknown: {}
      - <<: *tekton_unsupported
        family: INTERVAL
        semantics:
          supported: []
          unsupported:
            schedule.interval: "The Pipeline artifact contains no interval scheduler resource."
          unknown: {}
      - <<: *tekton_unsupported
        family: CALENDAR
        semantics:
          supported: []
          unsupported:
            schedule.calendar: "The Pipeline artifact contains no calendar scheduler resource."
          unknown: {}
      - <<: *tekton_unsupported
        family: EVENT
        semantics:
          supported: []
          unsupported:
            event.named: "The provider does not emit Tekton Triggers EventListener or event routing resources."
          unknown: {}
      - <<: *tekton_unsupported
        family: WEBHOOK
        semantics:
          supported: []
          unsupported:
            webhook.external: "The provider does not emit a webhook listener, interceptor, binding or trigger template."
          unknown: {}

