    claims:
      - &local_unknown
        family: MANUAL
        status: UNKNOWN
        mechanism: "Semantic reference only; no production target provider owns trigger delivery."
        semantics:
          supported: []
          unsupported: {}
          unknown:
            manual.explicit: "No production provider is composed for the local semantic reference."
        constraints:
          workflowScopes: []
          eventNames: []
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "adapters/portfolio/builtin-adapter-portfolio.yaml#targets.local"
        prerequisites: []
        limitations:
          - "Preserved trigger structure is not delivery evidence."
      - <<: *local_unknown
        family: CRON
        semantics:
          supported: []
          unsupported: {}
          unknown:
            schedule.cron: "No production scheduler is composed."
      - <<: *local_unknown
        family: INTERVAL
        semantics:
          supported: []
          unsupported: {}
          unknown:
            schedule.interval: "No production interval scheduler is composed."
      - <<: *local_unknown
        family: CALENDAR
        semantics:
          supported: []
          unsupported: {}
          unknown:
            schedule.calendar: "No production calendar scheduler is composed."
      - <<: *local_unknown
        family: EVENT
        semantics:
          supported: []
          unsupported: {}
          unknown:
            event.named: "No production event source is composed."
      - <<: *local_unknown
        family: WEBHOOK
        semantics:
          supported: []
          unsupported: {}
          unknown:
            webhook.external: "No production webhook listener is composed."

  - target: jenkins
    claims:
      - family: MANUAL
        status: SUPPORTED
        mechanism: "A manual-only Flow plan emits no automatic Jenkins trigger block and remains explicitly user-invokable as a Jenkins Pipeline job."
        semantics:
          supported: [manual.explicit]
          unsupported: {}
          unknown: {}
        constraints:
          workflowScopes: [main]
          eventNames: []
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt#renderJenkinsTriggers"
          - "src/test/kotlin/AdapterTriggerProviderBehaviorTests.kt#jenkinsManualTriggerRemainsManualOnly"
        prerequisites:
          - "The plan contains an explicit MANUAL trigger and no automatic trigger family."
        limitations:
          - "Jenkins manual invocation policy and authorization remain administrator-owned."
      - family: CRON
        status: SUPPORTED
        mechanism: "Jenkins declarative Pipeline emits one cron trigger for each preserved portable five-field CRON requirement."
        semantics:
          supported: [schedule.cron]
          unsupported: {}
          unknown: {}
        constraints:
          workflowScopes: [main]
          eventNames: []
          parameterNames: []
          timezoneMode: FORBIDDEN
          expressionMode: POSIX_CRON_5_FIELD
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt#renderJenkinsTriggers"
          - "src/test/kotlin/AdapterTriggerProviderBehaviorTests.kt#jenkinsPortableCronPreservesExpression"
        prerequisites:
          - "The CRON expression contains exactly five portable POSIX fields."
        limitations:
          - "Jenkins-specific H hashing syntax is intentionally outside the portable Flow CRON subset."
          - "The current provider does not preserve an explicit timezone."
      - &jenkins_unsupported
        family: INTERVAL
        status: UNSUPPORTED
        mechanism: "The Jenkins provider emits only CRON schedule syntax and does not approximate other trigger families."
        semantics:
          supported: []
          unsupported:
            schedule.interval: "An interval duration is not converted to CRON because the conversion changes alignment and catch-up semantics."
          unknown: {}
        constraints:
          workflowScopes: []
          eventNames: []
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt#renderJenkinsTriggers"
        prerequisites: []
        limitations:
          - "Only the bounded portable CRON subset is materialized."
      - <<: *jenkins_unsupported
        family: CALENDAR
        semantics:
          supported: []
          unsupported:
            schedule.calendar: "Calendar recurrences are not reduced to CRON because exceptions and timezone rules would be lost."
          unknown: {}
      - <<: *jenkins_unsupported
        family: EVENT
        semantics:
          supported: []
          unsupported:
            event.named: "The provider does not materialize Jenkins SCM polling, upstream or plugin events from the generic Flow event contract."
          unknown: {}
      - <<: *jenkins_unsupported
        family: WEBHOOK
        semantics:
          supported: []
          unsupported:
            webhook.external: "No provider-owned webhook endpoint, authentication or payload contract is emitted."
          unknown: {}

  - target: github-actions
    claims:
      - family: MANUAL
        status: SUPPORTED
        mechanism: "GitHub Actions emits workflow_dispatch for an explicit MANUAL trigger."
        semantics:
          supported: [manual.explicit]
          unsupported: {}
          unknown: {}
        constraints:
          workflowScopes: [main]
          eventNames: []
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/GitHubActionsManifestRenderer.kt#workflow_dispatch"
          - "src/test/kotlin/AdapterTriggerProviderBehaviorTests.kt#githubManualTriggerRendersWorkflowDispatch"
        prerequisites: []
        limitations:
          - "Manual input declarations remain governed by the separate target input contract."
      - family: CRON
        status: SUPPORTED
        mechanism: "GitHub Actions emits one schedule entry for each portable five-field CRON requirement and preserves an optional IANA timezone."
        semantics:
          supported: [schedule.cron]
          unsupported: {}
          unknown: {}
        constraints:
          workflowScopes: [main]
          eventNames: []
          parameterNames: []
          timezoneMode: IANA_OPTIONAL
          expressionMode: POSIX_CRON_5_FIELD
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/GitHubActionsManifestRenderer.kt#schedule"
          - "src/test/kotlin/AdapterTriggerProviderBehaviorTests.kt#githubPortableCronPreservesExpressionAndTimezone"
        prerequisites:
          - "The CRON expression contains exactly five portable POSIX fields."
        limitations:
          - "GitHub schedules execute from the default branch and may be delayed under high load."
          - "A five-minute minimum interval is a platform constraint and is not inferred from arbitrary Flow intervals."
      - &github_unsupported
        family: INTERVAL
        status: UNSUPPORTED
        mechanism: "GitHub schedule syntax is CRON-based; the provider does not approximate other schedule families."
        semantics:
          supported: []
          unsupported:
            schedule.interval: "An interval duration is not converted to CRON because alignment and delayed-run semantics differ."
          unknown: {}
        constraints:
          workflowScopes: []
          eventNames: []
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/GitHubActionsManifestRenderer.kt#schedule"
        prerequisites: []
        limitations:
          - "Only the bounded portable CRON subset is materialized."
      - <<: *github_unsupported
        family: CALENDAR
        semantics:
          supported: []
          unsupported:
            schedule.calendar: "Calendar exceptions and recurrence rules cannot be represented faithfully by the current provider."
          unknown: {}
      - family: EVENT
        status: SUPPORTED
        mechanism: "GitHub Actions emits a closed no-parameter event vocabulary directly under the workflow on mapping."
        semantics:
          supported: [event.named]
          unsupported: {}
          unknown: {}
        constraints:
          workflowScopes: [main]
          eventNames: [push, pull_request, release]
          parameterNames: []
          timezoneMode: NOT_APPLICABLE
          expressionMode: NONE
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/GitHubActionsManifestRenderer.kt#renderGitHubEvents"
          - "src/test/kotlin/AdapterTriggerProviderBehaviorTests.kt#githubNamedEventPreservesIdentity"
        prerequisites:
          - "The event identity is one of push, pull_request or release and declares no unmodeled filters."
        limitations:
          - "Branch, path, activity-type and payload filters remain unsupported until represented by a typed Flow event contract."
      - <<: *github_unsupported
        family: WEBHOOK
        semantics:
          supported: []
          unsupported:
            webhook.external: "repository_dispatch is an authenticated repository event API, not a generic webhook listener with equivalent delivery semantics."
          unknown: {}
        limitations:
          - "No endpoint, authentication, replay, signature or payload schema contract is emitted."

  - target: tekton
    claims:
      - &tekton_unsupported
        family: MANUAL
        status: UNSUPPORTED
        mechanism: "The current provider emits a Tekton Pipeline only; it does not emit PipelineRun or Tekton Triggers resources."
