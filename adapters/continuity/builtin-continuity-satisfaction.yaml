  - target: jenkins
    claims:
      - family: DATA
        status: UNSUPPORTED
        mechanism: "The Jenkins renderer does not bind generic Flow task results into downstream parameter expressions."
        semantics:
          supported: []
          unsupported:
            data.value: "Result names are preserved as metadata, but no provider-owned generic value export/import contract is rendered."
          unknown: {}
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/generators/manifest/TargetManifestLowering.kt"
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt"
          - "src/test/kotlin/AdapterContinuityProviderBehaviorTests.kt"
        prerequisites:
          - "Add typed producer output and consumer input bindings without raw command fallback."
        limitations:
          - "Stage ordering does not transfer arbitrary Flow values."
      - family: ARTIFACT
        status: SUPPORTED
        mechanism: "Jenkins emits the admitted checkout and Docker build leaves as sequential stages under one pipeline agent and one workspace."
        semantics:
          supported:
            - artifact.shared-workspace
          unsupported: {}
          unknown: {}
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/targets/builtin/BuiltInTargetProjections.kt"
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt"
          - "src/test/kotlin/AdapterContinuityProviderBehaviorTests.kt"
          - "conformance/snapshots/checkout-build-image/snapshot-index.json"
        prerequisites:
          - "The plan must contain a resolved WORKSPACE relation backed by module-contract evidence."
          - "The admitted projection must remain a single Jenkins job with one pipeline agent."
        limitations:
          - "This proves shared-workspace continuity only; it does not certify generic artifact upload/download semantics."
      - family: MUTABLE_STATE
        status: UNSUPPORTED
        mechanism: "The Jenkins provider has no generic Flow mutable-state transfer contract."
        semantics:
          supported: []
          unsupported:
            state.mutable.workflow: "No typed state handle is emitted or propagated between arbitrary Flow tasks."
          unknown: {}
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/generators/manifest/TargetManifestLowering.kt"
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt"
          - "src/test/kotlin/AdapterContinuitySatisfactionAuthorityTests.kt"
        prerequisites:
          - "Add a typed mutable-state provider and consumer mechanism."
        limitations:
          - "A shared workspace is not a generic mutable-state contract."
      - family: DURABLE_STATE
        status: UNSUPPORTED
        mechanism: "The Jenkins provider has no generic Flow durable-state lifetime contract."
        semantics:
          supported: []
          unsupported:
            state.durable.workflow: "No provider-owned persistence and restoration contract is emitted for Flow STATE relations."
          unknown: {}
        evidenceReferences:
          - "src/main/kotlin/org/flowlang/generators/manifest/TargetManifestLowering.kt"
          - "src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt"
          - "src/test/kotlin/AdapterContinuitySatisfactionAuthorityTests.kt"
        prerequisites:
          - "Add typed durable persistence, identity and restoration evidence."
        limitations:
          - "Jenkins job durability does not prove application-state continuity."

