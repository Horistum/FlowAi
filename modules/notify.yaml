kind: FlowModule
name: notify
version: "1.0"
description: "Notifications"
systemTypes:
  notify:
    input:
      channel:
        type: text
  email:
    input:
      channel:
        type: text
actions:
  send:
    kind: action
    implements: [NOTIFY]
    targetTypes:
      - notify
      - email
    input:
      subject:
        type: text
        required: true
      body:
        type: text
      to:
        type: text
      channel:
        type: text
    output:
      ok:
        type: boolean
    effects:
      network:
        - notify.send
    requiredCapabilities:
      - notification.send
    safety:
      destructive: false
  email:
    kind: action
    implements: [NOTIFY]
    targetTypes:
      - notify
      - email
    input:
      to:
        type: text
        required: true
      subject:
        type: text
        required: true
      body:
        type: text
    output:
      ok:
        type: boolean
    effects:
      network:
        - email.send
    requiredCapabilities:
      - notification.send
    safety:
      destructive: false
