kind: FlowModule
name: git
version: "1.0"
description: "Git source control"
systemTypes:
  git:
    input:
      url:
        type: text
        sensitive: false
      branch:
        type: text
actions:
  checkout:
    kind: action
    implements: [CHECKOUT]
    targetTypes:
      - git
    input:
      branch:
        type: text
      url:
        type: text
      depth:
        type: number
    output:
      ok:
        type: boolean
      path:
        type: text
    effects:
      reads:
        - git.repository
      filesystem:
        - workspace.write
    continuity:
      provides:
        - kind: workspace
          name: source
    safety:
      destructive: false
    retry:
      supported: true
