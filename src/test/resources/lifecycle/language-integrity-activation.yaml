implementationSlices:
  - id: "AR-04A"
    name: "Duplicate authored declarations and stable source diagnostics"
    status: selected
    ownsFindings: ["F-07"]
    invariant: "Every duplicate-bearing Flow grammar structure rejects the second authored declaration with a stable diagnostic, source location and owning path; no last-write-wins behavior is accepted."
    scope:
      - "Audit action arguments, safety clauses, transform/select fields, aggregate fields, match defaults/error cases and global error handlers against actual parser behavior."
      - "Preserve existing strict rejection and implement only demonstrated silent-loss cases."
      - "Exercise every public Flow frontend, positive non-duplicate counterparts and nested same-name declarations in distinct scopes."
  - id: "AR-04B"
    name: "Closed schema types and validated descriptor defaults"
    status: planned
    ownsFindings: ["F-12"]
    invariant: "Module schema types belong to one closed model; defaults and authored values pass the same type checker before planning."
  - id: "AR-04C"
    name: "Deterministic system-contract identity"
    status: planned
    ownsFindings: ["F-13"]
    invariant: "Duplicate system identities fail or use an explicitly version-qualified contract; neither filesystem nor registry ordering selects meaning."
  - id: "AR-04D"
    name: "Lossless semantic identities and collision rejection"
    status: planned
    ownsFindings: ["F-14"]
    invariant: "Typed semantic identity, lossless wire encoding and display names remain distinct; collisions fail before AST construction and target-safe derivation."
  - id: "AR-04E"
    name: "Strict public contract loaders"
    status: planned
    ownsFindings: ["F-21"]
    invariant: "Every public YAML/JSON contract entry point follows one explicit duplicate, unknown-field and complexity policy; permissive parsing cannot be selected accidentally."
  - id: "AR-04F"
    name: "Integrated language integrity acceptance"
    status: planned
    ownsFindings: []
    invariant: "All five finding families have positive and mutation evidence across public entry points; no unrelated finding, support level or package version is closed or promoted."

