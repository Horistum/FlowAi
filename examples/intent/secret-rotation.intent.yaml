intentVersion: "2.0"
kind: FlowIntentDocument
name: rotate-service-secret

description: Secret rotation intent. This is intentionally modeled as a standard capability, not as target-specific YAML.

systems:
  - name: vault
    type: rest
    baseUrl: https://vault.example.internal
    token: secret:VAULT_TOKEN
  - name: cluster
    type: kubernetes
    context: prod

workflows:
  - name: rotate
    kind: SECRET_ROTATION
    steps:
      - id: rotate-secret
        capability: SECRET_ROTATE
        params:
          subject: service/database/password
      - id: update-kubernetes-secret
        capability: PROVISION
        requires: [rotate-secret]
        params:
          resource: secret
      - id: notify-owner
        capability: NOTIFY
        requires: [update-kubernetes-secret]
        params:
          subject: Secret rotation completed

failure:
  notify: true
  rollback: false
