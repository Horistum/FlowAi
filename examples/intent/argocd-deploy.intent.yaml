intentVersion: "2.0"
kind: FlowIntentDocument
name: argocd-deploy
systems:
  - name: argo
    type: argocd
    config: { url: secret:ARGOCD_URL, token: secret:ARGOCD_TOKEN }
workflows:
  - name: cd
    kind: DEPLOY
    steps:
      - id: deploy
        capability: DEPLOY
        uses: argocd.sync
        params: { system: argo, app: demo-app, wait: true }
