intentVersion: "2.0"
kind: FlowIntentDocument
name: checkout-build-image
description: Target-scoped reference intent proving ordered native checkout and image build projection.
inputs:
  - name: version
    type: text
    required: true
systems:
  - name: source
    type: git
    purpose: Public application source repository
  - name: registry
    type: dockerRegistry
    purpose: Local image build target without registry push
workflows:
  - name: build-reference-image
    kind: BUILD
    steps:
      - id: checkout
        capability: CHECKOUT
        params:
          system: source
          url: https://github.com/octocat/Hello-World.git
          branch: main
      - id: build-image
        capability: BUILD_IMAGE
        requires: [checkout]
        params:
          system: registry
          image: ghcr.io/flowlang/reference:${version}
          path: .
          push: false
failure:
  notify: false
  rollback: false
  stopOnError: true
