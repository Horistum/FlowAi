  - version: "0.9.6.4"
    name: "Native Projection Architecture"
    type: "projection-architecture"
    status: completed
    purpose: "Require provider-owned contracts before native renderer payloads can exist."
  - version: "0.9.6.5"
    name: "Cross-target Checkout"
    type: "projection-coverage"
    status: completed
    purpose: "Add reviewed checkout projection evidence across selected built-in targets."
  - version: "0.9.6.6"
    name: "Native Image Build"
