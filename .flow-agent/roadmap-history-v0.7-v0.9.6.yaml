  - version: "0.9.5.2"
    name: "CI/CD Bias Inventory"
    type: "architecture-correction"
    status: completed
    purpose: "Inventory hardcoded delivery-domain and concrete implementation assumptions."
  - version: "0.9.5.3"
    name: "Notes Package Contract Model"
    type: "contract-design"
    status: completed
    purpose: "Introduce declarative contract kinds for domain, capability, safety, runtime, target, projection and conformance."
  - version: "0.9.5.4"
    name: "Universal Semantic Action Graph"
    type: "semantic-model"
