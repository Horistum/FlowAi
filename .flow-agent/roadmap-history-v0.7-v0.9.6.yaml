    type: "capability-contract"
    status: completed
    purpose: "Define a stable matrix of target capabilities."
  - version: "0.8.2"
    name: "Target Negotiation Report"
    type: "capability-negotiation"
    status: completed
    purpose: "Explain how intent maps or fails to map to declared target capabilities."
  - version: "0.8.3"
    name: "Package Version and Release Integrity"
    type: "release-integrity"
    status: completed
    purpose: "Align package version, release metadata, versioning policy and consistency tests."
  - version: "0.8.4"
    name: "Planner Capability Constraints"
    type: "planner-hardening"
    status: completed
    purpose: "Ensure the planner respects capability constraints before projection."
  - version: "0.8.5"
    name: "Safety Boundary Hardening"
    type: "safety"
    status: completed
    purpose: "Strengthen pre-projection safety checks for high-risk operations."
  - version: "0.8.6"
    name: "Review Hardening Fixes"
    type: "semantic-hardening"
    status: completed
    purpose: "Close review findings around manifest honesty and runtime secret materialization."
  - version: "0.8.7"
    name: "Safety Boundary Handler Coverage"
    type: "safety"
    status: completed
    purpose: "Ensure safety validation descends into action result handlers."
  - version: "0.9.0"
    name: "Generator Projection Contract"
    type: "projection-contract"
    status: completed
    purpose: "Define the stable contract between ExecutionPlan and target generators."
  - version: "0.9.1"
    name: "Initial Projection Stability"
    type: "target-stability"
    status: completed
    purpose: "Stabilize the first implemented target projections while keeping them adapter concerns."
  - version: "0.9.2"
    name: "Renderer Contract Hardening"
    type: "target-stability"
    status: completed
    purpose: "Harden renderer contracts before broader scenario coverage."
  - version: "0.9.3"
    name: "Capability Degradation Semantics"
    type: "capability-hardening"
    status: completed
    purpose: "Make degraded and unsupported behavior explicit and reviewable."
  - version: "0.9.4"
    name: "Reference Scenario Matrix"
    type: "scenario-hardening"
    status: completed
    purpose: "Build a target-neutral scenario matrix before end-to-end readiness claims."
