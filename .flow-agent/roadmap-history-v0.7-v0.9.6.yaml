  - version: "0.9.5.5"
    name: "Materialization Negotiation"
    type: "materialization"
    status: completed
    purpose: "Require explicit materialization status and evidence for every semantic action."
  - version: "0.9.5.6"
    name: "No-Shell Target Projection"
    type: "projection-correction"
