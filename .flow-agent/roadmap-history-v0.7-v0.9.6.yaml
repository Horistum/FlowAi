    type: "projection-contract"
    status: completed
    purpose: "Remove target-specific payload types from Flow Core."
  - version: "0.9.6.2"
    name: "Universal Typed Projection Bindings"
    type: "projection-contract"
    status: completed
    purpose: "Preserve projection value origin and resolution state."
  - version: "0.9.6.3"
    name: "Core and Target Projection Separation"
    type: "architecture-boundary"
