    name: "Universal Model Completion"
    type: "contract-and-architecture-release"
    status: completed
    purpose: "Promote the repaired notes-driven architecture and evidence-driven projection contracts."
  - version: "0.9.5.0"
    name: "Architecture Recenter - Notes-Driven Flow"
    type: "architecture-recenter"
    status: completed
