project: Flow Architecture
stream: architecture
roadmapVersion: 2
status: completed

purpose: "Own bounded cross-stream architecture maintenance after Core, adapter and conformance contracts have been frozen by their respective streams."

rules:
  - "Architecture work may consolidate ownership boundaries but cannot redefine frozen Core meaning, adapter support claims or conformance outcomes."
  - "Class-count reduction is never an acceptance criterion; every surviving authority must own a concrete invariant or orchestration boundary."
  - "Target-neutral semantic ownership remains separate from target-specific evidence and rendering ownership."
  - "A cross-stream architecture item may consume completed upstream evidence but cannot retroactively rewrite that evidence."
  - "Every architecture transition must preserve exact-head and synthetic merge-candidate validation."

currentDecision:
  completedItem: "AR0.1"
  completedItemName: "Authority Responsibility Consolidation"
  nextItem: ""
  nextItemName: ""
  decisionBasis: "Flow CI #2809, run 31202921728, passed the distinct AR0.1 completion boundary after implementation validation #2807. Exact head 9a355c07052ab72885cbd54beafc2919fe9b710f and synthetic merge candidate 6d79960ac580132079a5a2a9cd1428405de8ba6d both passed compile, test and conformance. The architecture stream has no declared successor item and therefore closes terminally at AR0.1."

items:
  - version: "AR0.1"
    name: "Authority Responsibility Consolidation"
    type: "cross-stream-architecture"
    status: completed
    purpose: "Reduce authority ceremony without collapsing independent semantic, adapter or conformance invariants."
    dependsOnConformance: "C0.4"
    architecturalInvariant: "Every production authority has one explicit, non-overlapping invariant or orchestration responsibility, and dependency direction remains unchanged."
    forbiddenScope:
      - "Do not optimize for a target class count; class-count reduction is evidence of simplification, not the acceptance criterion."
      - "Do not change public semantic meaning, adapter support claims, target syntax or conformance outcomes."
      - "Do not collapse target-neutral semantic ownership into target-specific evidence or rendering ownership."
      - "Do not mutate frozen Core, adapter or conformance inventories without a separately reviewed roadmap transition."
    completionEvidence:
      - "Every remaining production *Authority type has a documented invariant, inputs, outputs and callers."
      - "Forwarding-only authority layers are removed or justified by a concrete boundary requirement."
      - "Structurally duplicated authorities are consolidated only where one surviving owner remains explicit."
      - "Dependency direction remains Core -> neutral contracts and adapter/conformance -> frozen Core contracts, never the reverse."
      - "Frozen inventories and externally visible semantic, adapter and conformance outcomes remain unchanged."
      - "Exact-head and synthetic merge-candidate compile, test and conformance validation both pass."
