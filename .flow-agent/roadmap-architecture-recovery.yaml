overallAcceptance:
  - "F-01 through F-22 each have exact production, test and validation evidence and no finding is closed by prose alone."
  - "Flow Core compiles without Jenkins, GitHub Actions, Tekton, CLI or conformance implementation modules."
  - "Equivalent Intent YAML, Flow Source and AI proposals cross one compiler service and produce equivalent canonical meaning."
  - "The canonical graph preserves path-sensitive data, workflow ownership, effects, controls, continuity, topology and failure semantics."
  - "Target support is derived from adapter certification; missing evidence remains UNKNOWN or UNSUPPORTED."
  - "At least two materially different adapters execute the same bounded canonical scenarios with independently observed equivalent outcomes."
  - "The packaged CLI and artifact writer pass isolated distribution, input-limit, partial-write and tamper tests."
  - "Architecture simplification is measurable: concrete adapters are extracted, redundant semantic models and wrappers decrease, and lexical governance is removed where compiler boundaries supersede it."
  - "No open critical or high audit finding remains before post-recovery feature development resumes."
