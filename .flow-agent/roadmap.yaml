rules:
  - "The Core, adapter and conformance roadmaps are separate authorities with explicit ownership boundaries."
  - "The primary Flow Agent work item is selected only from the Core roadmap unless an active bounded correction work package explicitly blocks the next Core item."
  - "An active bounded correction and a Core item with status next must never coexist."
  - "Core work may not depend on unfinished adapter or conformance work."
  - "Each roadmap stream may advance independently without redefining another stream's contracts."
  - "Every Core item must declare a universal invariant, forbidden scope and completion evidence."
  - "Existing executable reference evidence remains live throughout the Core track."
  - "Implementation inability must not reshape Core meaning."
  - "A previous executable label has no grandfathered status."
  - "No roadmap item may introduce runtime execution, an SDK-first architecture or implementation-specific public syntax."
  - "No roadmap item may bend code or weaken validation only to satisfy tests."
  - "The gating corpus is bounded to software delivery, data transformation and infrastructure state change."

architectureConstitution:
  identity:
    - "Flow is a language and universal automation standardization model."
    - "Flow separates intent, semantic meaning, policy and evidence from implementation mechanisms."
    - "Implementation evidence may falsify assumptions without becoming the source of meaning."
  roadmapOwnership:
    core: "Owns universal meaning, effects, dependencies, policy, control requirements and materialization authority."
    adapters: "Owns concrete capability bindings, execution evidence and target artifacts."
    conformance: "Owns bounded semantic adequacy and independent implementation certification."
  forbiddenDirections:
    - "No concrete implementation default as universal lowering truth."
    - "No concrete platform as semantic authority."
    - "No raw runtime instruction as universal action meaning."
    - "No successful materialization without validated evidence."
    - "No Core dependency on implementation work."
    - "No conformance example as a substitute for a universal invariant."
    - "No governance signal whose status contradicts the property measured."

