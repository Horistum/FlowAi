rules:
  - "The Core, adapter and conformance roadmaps are separate authorities with explicit ownership boundaries."
  - "Cross-stream focus is owned by a global roadmap transition authority, never by a completed stream lifecycle."
  - "The primary Flow Agent work item is selected from primaryRoadmapStream only after that stream's activation and dependency gates pass."
  - "A stream-local correction is selected as that stream's next item and blocks later normal work without impersonating a Core correction."
  - "A completed roadmap item remains immutable evidence unless a concrete invariant is falsified and reopened as a bounded correction."
  - "closureItem identifies the bounded Core closure identity independently from the active non-Core work item."
  - "Each roadmap stream may advance independently without redefining another stream's contracts."
  - "Core work may not depend on unfinished adapter or conformance work."
  - "Adapter and conformance work may consume frozen Core contracts but cannot redefine Core meaning."
  - "Existing executable reference evidence remains live throughout every stream."
  - "Implementation inability must not reshape Core meaning."
  - "A previous executable or support label has no grandfathered status."
  - "No roadmap item may introduce runtime execution, an SDK-first architecture or implementation-specific public syntax."
  - "No roadmap item may bend code or weaken validation only to satisfy tests."
  - "The three C0.1 domains close only its evidence scope, not the automation taxonomy."
  - "A1.0 precedes C0.2 so topology conformance is exercised against a second real executable target rather than an invented abstraction."
  - "C0.2 must complete before C0.3 can define observable semantic equivalence."

architectureConstitution:
  identity:
    - "Flow is a language and universal automation standardization model."
    - "Flow separates intent, semantic meaning, policy and evidence from implementation mechanisms."
    - "Implementation evidence may falsify assumptions without becoming the source of meaning."
  roadmapOwnership:
    core: "Owns universal meaning, effects, dependencies, policy, control requirements and materialization authority."
    adapters: "Owns concrete capability bindings, execution evidence and target artifacts."
    conformance: "Owns bounded semantic adequacy and independent implementation certification."
  forbiddenDirections:
    - "No concrete implementation default as universal lowering truth."
    - "No concrete platform as semantic authority."
    - "No raw runtime instruction as universal action meaning."
    - "No successful materialization without validated evidence."
    - "No Core dependency on implementation work."
    - "No conformance example as a substitute for a universal invariant."
    - "No governance signal whose status contradicts the property measured."

architectureDebtBacklog:
  - id: "AR0.1"
    name: "Authority Responsibility Consolidation"
    status: completed
    ownership: "cross-stream-architecture"
    activation: "Activated after Flow CI #2798 passed the distinct C0.4 completion boundary; a higher-priority invariant correction may still interrupt implementation."
    purpose: "Reduce authority ceremony without collapsing independent semantic, adapter or conformance invariants."
    scope:
      - "Inventory every production *Authority type across Core, adapters and conformance and identify its owned invariant, inputs, outputs and callers."
      - "Classify authorities as invariant owners, orchestration boundaries, evidence adapters or forwarding-only ceremony."
      - "Remove or consolidate forwarding-only and structurally duplicated authorities only when the surviving boundary has one explicit owner."
      - "Prefer cohesive lifecycle components where several authorities split one invariant without independent policy or evidence ownership."
      - "Keep target-neutral semantic authorities independent from target-specific evidence and rendering authorities."
    nonGoals:
      - "Do not optimize for a target class count; class-count reduction is evidence of simplification, not the acceptance criterion."
      - "Do not change public semantic meaning, adapter support claims, target syntax or conformance outcomes as part of the refactor."
      - "Do not mix AR0.1 into C0.4 implementation work."
    completionEvidence:
      - "Every remaining Authority type has a documented non-overlapping invariant or orchestration responsibility."
      - "Forwarding-only authority layers are removed or justified by a concrete boundary requirement."
      - "Dependency direction remains Core -> neutral contracts and adapter/conformance -> frozen Core contracts, never the reverse."
      - "Frozen inventories remain unchanged unless a separately reviewed roadmap transition explicitly owns the change."
      - "Exact-head and synthetic merge-candidate compile, test and conformance validation both pass."

strategicDirection:
  status: "planned-after-c1.0"
  detailDocument: "docs/PROJECT_DIRECTION_AFTER_C1_0.md"
  lifecycleRule: "This section records ordered strategic intent only. It does not select a successor work item and cannot bypass the distinct C1.0 completion boundary or the global roadmap transition authority."
  governingPrinciples:
    - "Use heterogeneous external automation sources to falsify Flow semantics before adding new governance ceremony."
    - "Correct semantic integrity defects before expanding the public surface or claiming broader target support."
    - "Prefer compiler, type-system and module dependency boundaries over lexical source scanning when the same invariant can be enforced structurally."
    - "Keep semantic maturity, target materialization maturity and executable reference maturity as separate claims."
    - "Do not infer implementation defaults, target products or communication channels when authored intent is unresolved."
    - "Every strategic track must delete, consolidate or justify governance it makes obsolete instead of only adding new authorities and inventories."
  orderedCandidateTracks:
    - id: "SEMANTIC-INTEGRITY"
      order: 1
      activationGate: "C1.0 is completed by a later distinct exact-head and synthetic merge-candidate Flow CI boundary."
      purpose: "Repair semantic defects exposed by the project-wide architecture audit before broadening the standard."
      requiredOutcomes:
        - "Bind backup, rollback, approval, review and change-ticket evidence to the concrete protected operation and relevant graph scope."
        - "Preserve the authored dependency graph exactly unless an additional technical ordering edge is explicit, typed and separately evidenced."
        - "Remove Docker and other concrete implementation vocabulary from target-neutral canonical contracts where it currently defines universal meaning."
        - "Derive canonical execution-plan node semantics from explicit semantic types rather than module names, action strings or resource-name heuristics."
        - "Re-evaluate BACKUP and RESTORE effect semantics so recovery-point identity, consistency and lifetime are not flattened into generic data transformation."
        - "Reject malformed authored booleans and other parser values rather than silently coercing them into defaults."
        - "Align public schema validity with production loader validity or explicitly declare a narrower syntactic-only schema contract."
        - "Replace string-fragment policy classification and unconditional durable-state assumptions with typed policy and state-lifetime semantics."
    - id: "EXTERNAL-FALSIFICATION"
      order: 2
      activationGate: "SEMANTIC-INTEGRITY acceptance criteria pass without weakening previously frozen invariants."
      purpose: "Pressure the corrected semantic model with automation domains that are structurally different from software-delivery pipelines."
      requiredDomains:
        - "database migration and recovery"
        - "backup and restore"
        - "incident remediation"
        - "certificate lifecycle"
        - "secret rotation"
        - "data-pipeline orchestration"
        - "infrastructure lifecycle"
        - "human approval and change-control workflows"
      acceptanceRule: "A source that cannot be represented is allowed to falsify the model; it must never be forced through by weakening validation or inventing implementation meaning."
    - id: "STRUCTURAL-BOUNDARIES"
      order: 3
      activationGate: "External falsification no longer exposes a P0 semantic defect in the current bounded corpus."
      purpose: "Replace governance that simulates architecture boundaries with architecture boundaries enforced by the build and type system."
      requiredOutcomes:
        - "Split the single Gradle module into explicit Core, planner, adapter API, target implementation, conformance/governance and CLI boundaries where dependency direction is compiler-enforced."
        - "Delete or consolidate lexical governance checks made redundant by module boundaries."
        - "Introduce a governance budget: a new authority, frozen inventory or report must replace, consolidate or justify an existing mechanism when responsibilities overlap."
        - "Move superseded architecture documents into explicit history and keep one current architecture narrative."
        - "Separate roadmap/work-item identifiers from package, public-standard and artifact contract version numbers."
    - id: "MULTI-TARGET-EXECUTABLE-PROOF"
      order: 4
      activationGate: "Structural dependency boundaries and corrected semantic contracts are stable under the expanded falsification corpus."
      purpose: "Prove practical portability on several real targets rather than treating representability or a bounded checkout/build scenario as executable breadth."
      requiredOutcomes:
        - "Maintain at least two independently executable target implementations and add a third only when it contributes a genuinely different execution model."
        - "Exercise branching, parallelism, artifacts/workspaces, explicit secrets, approvals, rollback/compensation and state continuity where the target claims support."
        - "Keep generic target support UNKNOWN or UNSUPPORTED when only a bounded executable promotion is proven."
        - "Promote target support only from exact production artifacts, continuity evidence and behavioral validation."
    - id: "AI-INTENT-PROVIDER"
      order: 5
      activationGate: "The target-neutral model and multi-target proof are stable enough that provider uncertainty cannot redefine canonical meaning."
      purpose: "Add stronger AI-assisted intent normalization outside Core while keeping deterministic validation authoritative."
      requiredOutcomes:
        - "Represent provider uncertainty, unresolved bindings and clarification requirements explicitly."
        - "Do not invent email, Slack, Docker, Kubernetes, clusters or other implementation choices when the user did not author them."
        - "Treat heuristic match scores as match strength unless they are actually calibrated probabilities."
        - "Validate every provider-produced intent through the same production parser, canonicalization, safety and conformance boundaries as authored intent."
  releaseReadiness:
    - "No broad portability claim from semantic representability alone."
    - "No stable capability label without independent semantic, adapter and executable evidence appropriate to that claim."
    - "No new Core semantic category solely because one target exposes a convenient implementation primitive."
    - "No roadmap closure while a known P0 semantic integrity defect remains open."

