  - version: "0.9.5"
    name: "Universal Model Completion"
    type: "contract-and-architecture-release"
    status: "completed"
    purpose: "Promote the repaired notes-driven architecture with one reconciled manifest path, first-class triggers, extensible target semantics and evidence-driven executable projection."
    requiredOutcome:
      - "CLI, conformance and library generation use mandatory compatibility/readiness reconciliation."
      - "Target renderers contain no executable-looking placebo branches."
      - "Target-neutral lowering does not invent Kubernetes systems, namespaces or selectors."
      - "Intent, AST and ExecutionPlan carry first-class manual, schedule, event and webhook triggers."
      - "Target semantics are keyed by registry target ids instead of vendor fields."
      - "Declarative projection rules can produce structured native payloads while missing evidence fails closed."
      - "Package, standard and artifact contract versions are promoted with an explicit migration."
  - version: "0.9.5.0"
    name: "Architecture Recenter - Notes-Driven Flow"
    purpose: "Stop architecture drift and re-center Flow as a notes-driven universal automation language."
    type: "architecture-recenter"
    status: "completed"
    requiredOutcome:
      - "Defined Flow as a notes-driven universal automation language and standardization model."
      - "Documented that the old direct end-to-end step is replaced by the v0.9.5.x correction track."
  - version: "0.9.5.1"
    name: "Shell Usage Inventory and Prohibition"
    purpose: "Inventory every shell, script, command-string, echo and CLI fallback path and prevent new shell projection from entering Flow Core."
    type: "architecture-correction"
    status: "completed"
    requiredOutcome:
      - "Inventory recorded in docs/V0_9_5_1_SHELL_USAGE_INVENTORY_AND_PROHIBITION.md."
      - "Known command-oriented paths are classified as legacy defects scheduled for removal."
  - version: "0.9.5.2"
    name: "CI/CD Bias Inventory"
    purpose: "Inventory hardcoded CI/CD, Kubernetes, Docker, Maven, PostgreSQL, GitHub Actions, Jenkins, Tekton and ArgoCD assumptions."
    type: "architecture-correction"
    status: "completed"
    requiredOutcome:
      - "CI/CD bias inventory recorded in docs/V0_9_5_2_CICD_BIAS_INVENTORY.md."
      - "Drift tests separate adapter-boundary evidence from active semantic-source debt."
  - version: "0.9.5.3"
    name: "Notes Package Contract Model"
    purpose: "Introduce declarative notes packages as the contract for domains, capabilities, safety, runtime, targets, projections and conformance."
    type: "contract-design"
    status: "completed"
    requiredOutcome:
      - "Defined Domain, Capability, Safety, Runtime, Target, Projection and Conformance Notes as contract kinds."
      - "Added validation for package identity, dependencies, boundaries and ownership constraints."
  - version: "0.9.5.4"
    name: "Universal Semantic Action Graph"
    purpose: "Replace command-oriented projection with structured semantic actions."
    type: "semantic-model"
    status: "completed"
    requiredOutcome:
      - "Added a SemanticActionGraph model."
      - "Validated graph nodes against notes package declarations."
      - "Prevented command and shell vocabulary from becoming universal semantic action meaning."
  - version: "0.9.5.5"
    name: "Materialization Negotiation"
    purpose: "Require every semantic action to have an explicit materialization status before it can advance toward projection."
    type: "materialization"
    status: "completed"
    requiredOutcome:
      - "Defined and enforced materialization statuses."
      - "Required one explicit materialization decision per semantic action node."
      - "Required evidence for materializable, adapter-required and blocked statuses."
  - version: "0.9.5.6"
    name: "No-Shell Target Projection"
    purpose: "Remove shell as the default target projection strategy and require target artifacts to come from target/projection notes."
    type: "projection-correction"
    status: "completed"
    requiredOutcome:
      - "Added a TargetProjectionPlan contract."
      - "Required one projection artifact record per materialization decision."
      - "Rejected shell, command and script vocabulary as projection representation."
      - "Kept unavailable and adapter-required decisions out of target-native artifacts."
  - version: "0.9.5.7"
    name: "Target Registry Honesty"
    purpose: "Separate declared targets from implemented, tested and production-supported targets."
    type: "registry-honesty"
    status: "completed"
    requiredOutcome:
      - "Added declared-only, experimental, implemented, tested, production-supported, deprecated and blocked target statuses."
      - "Required status-specific evidence before target support claims."
      - "Kept shell registered only as blocked evidence."
  - version: "0.9.6"
    name: "Universal Native Projection Foundation"
    purpose: "Build a target-neutral, typed and provider-owned native projection architecture before expanding executable target coverage."
    type: "projection-architecture-track"
    status: "completed"
    requiredOutcome:
      - "Flow Core contains no target-specific payload vocabulary or concrete projection routing."
      - "Typed projection bindings preserve semantic source and resolution state."
      - "Native registry claims require explicit provider-owned implementation contracts."
      - "Executable reference evidence is added only after cross-target action coverage is concrete and tested."
  - version: "0.9.6.1"
    name: "Target-Neutral Projection Payload Contract"
    purpose: "Remove target-specific payload types from Flow Core."
    type: "projection-contract"
    status: "completed"
    requiredOutcome:
      - "Opaque payload identifiers replace target-specific Core enums."
      - "Concrete payload identifiers remain edge-owned."
  - version: "0.9.6.2"
    name: "Universal Typed Projection Bindings"
    purpose: "Preserve where projection values come from with a target-neutral discriminated binding model."
    type: "projection-contract"
    status: "completed"
    requiredOutcome:
      - "Compile-time, symbolic and unresolved binding states remain explicit."
      - "Missing values never collapse into anonymous empty strings."
  - version: "0.9.6.3"
    name: "Core and Target Projection Separation"
    purpose: "Move concrete target generators, renderers and syntax ownership to explicit edge composition roots."
    type: "architecture-boundary"
    status: "completed"
    requiredOutcome:
      - "Core generation routing depends only on injected target-neutral providers."
      - "Concrete targets remain explicit finite distribution composition, not plugin discovery."
  - version: "0.9.6.4"
    name: "Native Projection Architecture"
    purpose: "Require explicit provider-owned implementation contracts before NATIVE registry evidence can create renderer payloads."
    type: "projection-architecture"
    status: "completed"
    requiredOutcome:
      - "Registry declarations, provider implementation contracts and manifest bindings must agree."
      - "Missing or inconsistent native implementation evidence fails closed."
      - "Existing Jenkins checkout behavior remains honest without expanding action coverage."
  - version: "0.9.6.5"
    name: "Cross-target Checkout"
    purpose: "Add reviewed native checkout projection coverage across selected built-in targets using the common architecture."
    type: "projection-coverage"
    status: "completed"
    requiredOutcome:
      - "Every checkout implementation has registry evidence, a provider-owned contract, renderer behavior and behavioral tests."
      - "Unsupported targets remain adapter-required or review-only."
  - version: "0.9.6.6"
    name: "Native Image Build"
    purpose: "Add reviewed native image-build projection coverage without introducing command strings as universal semantics."
    type: "projection-coverage"
    status: "completed"
    requiredOutcome:
      - "Native image-build payloads use typed bindings and explicit target evidence."
      - "Missing implementation evidence remains fail-closed."
  - version: "0.9.6.7"
    name: "First Executable Reference Scenario"
    purpose: "Promote the first realistic multi-step reference scenario only when every action has concrete executable projection evidence."
    type: "reference-readiness"
    status: "completed"
    requiredOutcome:
      - "The executable claim is derived from the real parser, planner, compatibility, materialization, manifest and renderer pipeline."
      - "No review-only or adapter-required action is relabeled executable."
  - version: "0.9.7"
    name: "Policy-Driven Safety and Environment Classification"
    purpose: "Complete declarative environment classification and remove remaining policy aliases from implementation code."
    type: "safety-policy"
    status: "next"
    requiredOutcome:
      - "Environment sensitivity is derived from versioned safety notes evidence."
      - "No target adapter guesses production environments from target-specific strings."
  - version: "0.9.8"
    name: "Trigger Adapter Coverage"
    purpose: "Add target projection evidence for interval, calendar, event and webhook triggers where platforms can represent them faithfully."
    type: "trigger-projection"
    status: "planned"
    requiredOutcome:
      - "Unsupported trigger forms remain review-only or fail-fast instead of being approximated silently."
