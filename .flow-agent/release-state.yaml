    - "Module actions declare implemented standard capabilities through strict canonical contracts."
    - "Unbound standard intent remains standard semantic work instead of selecting a module implicitly."
    - "Invalid or incomplete explicit binding fails validation before planning."
    - "Semantic target parameters never select binding systems implicitly."
    - "Reference snapshots were regenerated through the canonical production generator."
    - "The final metadata head must pass the unmodified standard Flow CI."
