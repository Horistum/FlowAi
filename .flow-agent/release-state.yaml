qualityPrinciples:
  - "Do not bend code only to make tests pass."
  - "Every public behavior change must have tests."
  - "Every public contract change must have a migration document."
  - "Every roadmap item must declare an invariant, forbidden scope and completion evidence."
  - "Concrete implementation coverage must not define universal semantic meaning."
  - "Existing executable reference evidence remains live throughout every roadmap stream."
  - "A previous executable or support label has no grandfathered status."
  - "Missing implementation evidence fails closed."
  - "Governance status and score polarity must match the property claimed."
  - "Every public module loading path must use one canonical descriptor authority."
  - "Malformed module and notes declarations fail closed instead of becoming empty defaults."
  - "Every production projection path must obtain registry-derived authorization before invoking a target generator."
  - "Diagnostic projection evidence may preserve blocked facts but must never claim executable readiness."
  - "Ordering never implies value, workspace or state continuity."
  - "Continuity must be declared by canonical module contracts and supported explicitly by the target."
  - "Committed reference evidence must be regenerated through the canonical production generator."
  - "Canonical intent meaning is derived before explicit binding and is never enriched from implementation inventory."
  - "Explicit binding requires a declared capability implementation and an explicitly selected compatible system."
  - "Binding failure remains separate diagnostic evidence and must not mutate canonical meaning."
  - "Explicit implementation selection remains authored through uses and system evidence; registry order never selects a binding."
  - "Every built-in implementation claim has one strict adapter-owned binding evidence record."
  - "Canonical parameters are mapped or explicitly unsupported; binding-only parameters cannot impersonate semantic meaning."
  - "Resolved binding values and descriptor defaults are computed once before AST lowering."
  - "Semantic effects are derived from canonical capabilities before implementation binding."
  - "Effect domain, operation, resource and state transition remain implementation-independent."
  - "Bindings preserve canonical effects; module effects cannot replace them."
  - "Ordering, continuity, policy and topology evidence must not be inferred from semantic effects."
  - "Known canonical effects must be re-derived and validated before materialization."
  - "Control requirements, evidence and authorization decisions remain separate contracts."
  - "A policy declaration never proves that the required control mechanism exists."
  - "Unknown and unsatisfied control evidence blocks authorization."
  - "Dynamic control evidence remains pending and declares explicit enforcement capabilities."
  - "Module contracts may add control obligations but cannot rewrite canonical intent meaning."
  - "Adapter control evidence consumes frozen Core meaning and cannot add new universal control kinds."
  - "General platform capability, target registry flags and provider identity are not concrete control implementation evidence."
  - "Approval, retry, timeout, compensation and scheduling use complete supported, unsupported and unknown semantic partitions."
  - "Unsupported or unknown adapter control requirements force review-only diagnostic evidence before target rendering."
  - "Executable readiness requires matching execution-topology requirements and target evidence."
  - "Action capability, ordering and continuity cannot substitute for topology evidence."
  - "Missing, partial, unsupported and contradictory topology evidence blocks provider invocation."
  - "Target topology profiles must be complete, explicit and independent from renderer layout."
  - "Adapter topology profiles are derived from adapter-owned evidence and never from self-referential target registry assertions."
  - "Target-neutral runtime topology profiles carry status and exact evidence identity without duplicating adapter-specific prose."
  - "Profile-only target adapters remain UNKNOWN until a composed provider supplies concrete evidence."
  - "Every executable-reference scenario may consume only SUPPORTED topology claims."
  - "Every accepted meaningful intent input is preserved or rejected with explicit path-aware diagnostic evidence."
  - "Equivalent source forms must produce equivalent canonical meaning and diagnostics."
  - "Malformed declarations fail closed instead of becoming empty or default meaning."
  - "Unsupported lowering shapes cannot be flattened into weaker canonical contracts."
  - "Materialization validates lowering coverage before provider invocation."
  - "Rendering is explicit and requires executable evidence; manifest existence is not render authorization."
  - "Release compliance requires an explicit PASS conformance manifest."
  - "Release publication occurs only after staged bundle verification."
  - "Committed metadata may cite only already-merged validation evidence."
  - "Unknown or placeholder authored text never satisfies a safety control."
  - "A completed bounded correction may unblock the Core closure item only after exact-head implementation evidence exists."
  - "Exact-head and merge-candidate validation are separate evidence and neither may impersonate the other."
  - "Parser defaults apply only to omitted values; malformed or unknown authored declarations are rejected."
  - "A conformance gate must prove both acceptance and rejection polarity when it claims enforcement."
  - "Universal conformance evidence must not require a concrete target projection as its semantic substrate."
  - "Target materialization requires registry-validated explicit selection evidence rather than a raw target string."
  - "CLI execution outcomes are typed before presentation and target-neutral outcomes cannot carry target artifacts."
  - "Application composition remains in production coupling governance and is not an automatic exemption."
  - "Derived compatibility or readiness reports cannot be relabeled as explicit target-selection provenance."
  - "Target-selection origin categories are a closed architecture contract."
  - "Blocked CLI outcomes must return a distinct non-success process status."
  - "Successful CLI outcomes cannot accept caller-authored exit codes."
  - "A public PASS status must be computed from validated content and must have a negative counterpart."
  - "Target semantics may publish only registry or provider-owned evidence, never target-name folklore."
  - "Artifact producer and introduced-version metadata have no generic fallback."
  - "Required artifact derivation rejects dangling evidence references."
  - "Bundle verification parses exact JSON fields and never accepts substring occurrence as proof."
  - "Closure completion requires an explicit CLOSED lifecycle with distinct exact-head and merge-candidate implementation evidence."
  - "Closure-blocking conformance must consume CORRECTION_REQUIRED, READY and CLOSED rather than infer lifecycle from correction status."
  - "The complete pre-closure conformance sequence must execute exactly once and in declared order."
  - "Unknown or missing bounded-correction status blocks closure."
  - "closureItem is permanent identity; a next non-Core item cannot rewrite it."
  - "A completed Core track contains no next Core item and remains valid while later streams consume its contracts."
  - "Implementation and completion validation boundaries must use distinct workflow runs, exact heads and synthetic merge candidates."
  - "Adapter capability profiles, native leaf support and executable scenarios are separate evidence classes."
  - "Adapter conformance runs after frozen Core closure and cannot mutate the Core pre-closure inventory."
  - "An adapter item may become completed only after its lifecycle authority records a passed implementation boundary."

