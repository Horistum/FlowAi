qualityPrinciples:
  - "Do not bend code only to make tests pass."
  - "Every public behavior change must have tests."
  - "Every public contract change must have a migration document."
  - "Every Core roadmap item must declare a universal invariant, forbidden scope and completion evidence."
  - "Concrete implementation coverage must not define universal semantic meaning."
  - "Existing executable reference evidence remains live throughout the Core track."
  - "A previous executable label has no grandfathered status."
  - "Missing implementation evidence fails closed."
  - "Governance status and score polarity must match the property claimed."
  - "Every public module loading path must use one canonical descriptor authority."
  - "Malformed module and notes declarations fail closed instead of becoming empty defaults."
  - "Every production projection path must obtain registry-derived authorization before invoking a target generator."
  - "Diagnostic projection evidence may preserve blocked facts but must never claim executable readiness."
  - "Ordering never implies value, workspace or state continuity."
  - "Continuity must be declared by canonical module contracts and supported explicitly by the target."
  - "Committed reference evidence must be regenerated through the canonical production generator."
  - "Canonical intent meaning is derived before explicit binding and is never enriched from implementation inventory."
  - "Explicit binding requires a declared capability implementation and an explicitly selected compatible system."
  - "Binding failure remains separate diagnostic evidence and must not mutate canonical meaning."
  - "Semantic effects are derived from canonical capabilities before implementation binding."
  - "Effect domain, operation, resource and state transition remain implementation-independent."
  - "Ordering, continuity, policy and topology evidence must not be inferred from semantic effects."
  - "Known canonical effects must be re-derived and validated before materialization."
  - "Control requirements, evidence and authorization decisions remain separate contracts."
  - "A policy declaration never proves that the required control mechanism exists."
  - "Unknown and unsatisfied control evidence blocks authorization."
  - "Dynamic control evidence remains pending and declares explicit enforcement capabilities."
  - "Module contracts may add control obligations but cannot rewrite canonical intent meaning."

