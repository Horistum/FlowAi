qualityPrinciples:
  - "The Core, adapter and conformance roadmaps are independent authorities."
  - "Cross-stream focus is selected globally and never owned by a completed stream lifecycle."
  - "Stream-local corrections block only their own stream while active."
  - "No roadmap item is completed without code, focused tests, full regression coverage, documentation and exact-head plus synthetic merge-candidate CI evidence."
  - "Core work never depends on unfinished adapter or conformance work."
  - "Adapter and conformance evidence may falsify Core assumptions but cannot silently redefine Core meaning."
  - "The Core semantic-closure track is complete; later work consumes the frozen contract and may reopen it only through an explicit falsifying correction."
  - "The three C0.1 domains close only that bounded evidence scope, not the universe of automation meaning."
  - "A1.0 established a bounded executable GitHub Actions artifact/workspace continuity path without promoting generic target support."
  - "C0.2 topology evidence consumes the existing closed Core vocabulary and cannot add support through matrix membership."
  - "C0.3 equivalence must compare explicit observable results and continuity rather than target syntax, job layout or action identity."
  - "C0.1 conformance evidence runs after frozen Core closure and adapter certification."
  - "No previously claimed compatibility or support status is trusted without current implementation and behavioral evidence."
  - "No target is selectable merely because it exists in a registry."
  - "No Core semantic primitive may name a concrete pipeline engine, cloud, vendor or orchestration syntax."
  - "No adapter capability may be inferred from a profile without implementation-backed evidence."
  - "No materialization path may produce target syntax until all target-neutral requirements are resolved or explicitly blocked."
  - "No unsupported semantic may be silently approximated, dropped or relabeled as supported."
  - "Every executable claim must be backed by a production materialization path, provider-owned evidence and target artifact receipt."
  - "Review-only evidence must use a non-executable artifact identity and cannot borrow executable file names."
  - "Exact-head and synthetic merge-candidate CI are distinct validation dimensions and both must pass."
  - "Implementation and completion boundaries must be distinct workflow runs and revisions."
  - "A lifecycle authority owns only its local historical item and cannot block legitimate later roadmap progress."
  - "Frozen Core and completed adapter/conformance inventories remain immutable historical evidence."
  - "Conformance inventories are exact and must not acquire checks from later streams."
  - "A successful build cannot substitute for behavioral evidence, conformance polarity or roadmap honesty."
  - "No code or validation may be weakened merely to make tests green."
  - "All repository production code, tests and documentation are authored in English."
