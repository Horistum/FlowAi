forbiddenDirections:
  - id: "runtime-executor"
    description: "Flow Core must not execute workflows or become a runtime engine."
    severity: "blocker"

  - id: "sdk-first-architecture"
    description: "Flow Core must not be organized primarily as an SDK product."
    severity: "blocker"

  - id: "plugin-lifecycle"
    description: "Flow Core must not introduce plugin lifecycle management as part of the public standard."
    severity: "blocker"

  - id: "target-specific-public-dsl"
    description: "Flow public syntax must not expose concrete platform or implementation constructs."
    severity: "blocker"

  - id: "concrete-platform-semantic-authority"
    description: "No concrete platform, adapter or implementation tool may define universal Flow meaning."
    severity: "blocker"

  - id: "reversed-roadmap-dependency"
    description: "Core roadmap work must not depend on unfinished adapter or conformance implementation work."
    severity: "blocker"

  - id: "grandfathered-executability"
    description: "An earlier executable label must be demoted when new continuity or topology evidence disproves it."
    severity: "blocker"

  - id: "dishonest-governance-signal"
    description: "Governance PASS, FAIL and score semantics must match the property they claim to measure."
    severity: "blocker"

  - id: "test-only-hack"
    description: "Implementation must not be bent only to satisfy tests."
    severity: "blocker"

  - id: "duplicated-standard-model"
    description: "The same standard concept must not have multiple independent sources of truth."
    severity: "major"

  - id: "silent-semantic-loss"
    description: "Accepted intent information must not be dropped, guessed or replaced without diagnostics and provenance."
    severity: "blocker"

  - id: "self-referential-governance"
    description: "Governance features must measure behavior, quality, drift, compatibility or coverage. Ceremony-only controls are not allowed."
    severity: "major"
