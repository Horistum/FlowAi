project: Flow Adapter Portfolio
stream: adapters
roadmapVersion: 5
status: active

purpose: >-
  Manage concrete implementation bindings and artifact generation independently
  from universal Flow semantics. Adapter work consumes Core contracts; it never
  defines, amends or weakens their meaning.

activationGate:
  requiredCoreItem: "0.9.7.10"
  status: satisfied
  evidence: "PR #95 merged the final closure correction as e25a81b9c7e7802556a0d5b34cf34185b19ed498."
  rule: "Broad adapter work begins only after the bounded Core closure gate passes. Correctness maintenance, regression repair and honest demotion remain mandatory throughout the adapter track."

continuousReferenceEvidence:
  scenario: "checkout-build-image"
  currentExecutableTarget: "jenkins"
  rule: "The existing executable reference remains in the unmodified standard CI throughout every adapter work item."
  failurePolicy: "Repair an adapter-local regression or deliberately demote the claim with evidence; never weaken a Core invariant to preserve the previous label."
  otherBuiltInTargets:
    - "GitHub Actions and Tekton action-level native evidence remains tested."
    - "Action-level evidence does not imply scenario executability without continuity and topology proof."
    - "Any existing executable claim that lacks the frozen proof is demoted to REVIEW_ONLY; the regression is intended."

rules:
  - "Concrete platform names belong only to adapter-specific work packages and evidence."
  - "An unsupported adapter capability must remain explicit; it must not create a Core fallback."
  - "Every adapter declares topology evidence before scenario executability can be evaluated."
  - "Adapter topology evidence cannot cite the target registry or its own manifest as proof."
  - "Runtime topology profiles are derived from adapter-owned evidence rather than duplicated authored status."
  - "Profile-only targets remain unknown until a composed provider supplies evidence."
  - "Explicit capability bindings require authored uses and system selection; inventory order never selects an implementation."
  - "Binding parameter mapping is complete: every canonical parameter is mapped or explicitly unsupported."
  - "Resolved binding parameters and descriptor defaults are applied once before AST lowering."
  - "Module effects may support adapter evidence but never replace canonical semantic effects."
  - "Adapter tests prove preserved semantics, not merely syntactically valid output."
  - "Adapter implementation lifecycle is distribution-owned and is not part of the public Flow standard."
  - "Maintenance evidence stays live throughout adapter work."
  - "Capability profiles, native leaf projections and end-to-end executable scenarios are separate evidence classes."
  - "The frozen Core pre-closure inventory cannot be changed by adapter work."

currentDecision:
  completedItem: "A0.3"
  completedItemName: "Capability Binding Migration"
  nextItem: "A0.4"
  nextItemName: "Control Requirement Materialization"
  decisionBasis: "Flow CI #2303 passed the final A0.3 implementation on exact head f475ae8317122b986dec23a3d36bb8df05a31db3 and synthetic merge candidate afdfa505e96ba00eecf42a94d9b2e1ebe7059ec8. A0.4 is selected as the next bounded adapter item without including its work package or implementation."

items:
  - version: "A0.1"
    name: "Adapter Portfolio Reassessment"
    type: "adapter-governance"
    status: completed
    purpose: "Reclassify existing adapters against frozen universal requirements and remove unsupported readiness claims."
    dependsOnCore: "0.9.7.10"
    completionEvidence:
      - "Each adapter has an explicit support, limitation and evidence record."
      - "No adapter-specific behavior is required by Core semantics."
      - "Earlier labels receive no grandfathered status."
      - "Adapter certification is owned by a separate post-Core-closure conformance stream."
      - "Flow CI #2270 passed exact and merge-candidate validation with lifecycle integrity active."
      - "Flow CI #2272 passed the later completion metadata before PR #96 merged."

  - version: "A0.2"
    name: "Topology Evidence Adoption"
    type: "adapter-topology"
    status: completed
    purpose: "Declare execution isolation, state lifetime, transfer, scope, interaction and concurrency evidence for each adapter."
    dependsOnCore: "0.9.7.8"
    dependsOnAdapters: "A0.1"
    completionEvidence:
      - "Every target declares exactly one complete adapter-owned topology record."
      - "Runtime profiles are derived from that record rather than self-citing registry values."
      - "Detailed adapter mechanism and limitation prose remains outside target-neutral Core runtime profiles."
      - "Every executable claim is backed by complete supported topology evidence."
      - "Unknown properties and profile-only targets fail closed."
      - "Claims that fail reassessment are intentionally demoted."
      - "A0.2 lifecycle integrity blocks evidence-free completion and premature A0.3 selection."
      - "Flow CI #2284 passed exact and merge-candidate validation with the final A0.2 authority active."

  - version: "A0.3"
    name: "Capability Binding Migration"
    type: "adapter-binding"
    status: completed
    purpose: "Bind canonical capabilities to concrete implementations without changing canonical meaning."
    dependsOnCore: "0.9.7.5"
    dependsOnAdapters: "A0.2"
    completionEvidence:
      - "Every built-in implementation claim has exactly one strict adapter-owned binding record."
      - "Bindings preserve canonical semantic parameters, effects and explicit selection provenance."
      - "Binding-only parameters and descriptor defaults are resolved exactly once."
      - "Unsupported canonical parameters fail before AST lowering."
      - "Missing bindings remain unbound or invalid and never select an implementation implicitly."
      - "The canonical adapter stream runner owns the exact inventory 1.2 without a duplicate composition."
      - "A0.3 lifecycle integrity blocks evidence-free completion and premature A0.4 selection."
      - "Flow CI #2303 passed exact and merge-candidate validation with the final A0.3 authority active."

  - version: "A0.4"
    name: "Control Requirement Materialization"
    type: "adapter-control"
    status: next
    purpose: "Provide evidence for concrete satisfaction of approval, retry, timeout, compensation and scheduling requirements."
    dependsOnCore: "0.9.7.7"
    dependsOnAdapters: "A0.3"
    completionEvidence:
      - "Every native control claim has implementation and behavioral evidence."
      - "Unsupported control forms are not approximated silently."

  - version: "A0.5"
    name: "Continuity Satisfaction Proof"
    type: "adapter-continuity"
    status: planned
    purpose: "Prove that each adapter can satisfy declared data, artifact, mutable-state and durable-state dependencies."
    dependsOnCore: "0.9.7.4"
    dependsOnAdapters: "A0.4"
    completionEvidence:
      - "Behavioral tests validate producer-to-consumer continuity."
      - "Ordering-only support is never promoted to continuity support."
      - "Any existing executable claim without continuity proof becomes REVIEW_ONLY."

  - version: "A0.6"
    name: "Adapter Artifact Rendering"
    type: "adapter-rendering"
    status: planned
    purpose: "Generate concrete target artifacts only after capability, control, topology and continuity evidence is complete."
    dependsOnCore: "0.9.7.10"
    dependsOnAdapters: "A0.5"
    completionEvidence:
      - "Rendered artifacts preserve all required semantic evidence."
      - "Incomplete evidence produces review-only or fail-fast output."

  - version: "A0.7"
    name: "Trigger Materialization Coverage"
    type: "adapter-trigger"
    status: planned
    purpose: "Materialize interval, calendar, event and webhook requirements only where an adapter can represent them faithfully."
    dependsOnCore: "0.9.7.7"
    dependsOnAdapters: "A0.6"
    completionEvidence:
      - "Unsupported trigger forms remain explicit."
      - "No trigger approximation changes timing or delivery semantics silently."
