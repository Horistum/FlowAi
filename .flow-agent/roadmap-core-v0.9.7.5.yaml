project: Flow Core
stream: core
roadmapVersion: 5
track: v0.9.7-universal-semantic-foundation
status: active
trackObjective: Complete the universal semantic foundation with continuous reference evidence.
continuousFeedback:
- Every Core item runs the existing reference and regression suite.
- A failed claim is repaired at its owner or explicitly reclassified.
- Core meaning is never weakened to preserve an earlier label.
trackExitCriteria:
- Evidence for 0.9.7.1 through 0.9.7.9 passes.
- 0.9.7.10 checks only declared evidence.
items:
- version: 0.9.7.0
  name: Roadmap Separation and Universal Drift Lock
  type: architecture-governance
  status: completed
  purpose: Separate planning ownership and dependency direction.
  universalInvariant: Core contracts advance independently from implementation coverage.
  forbiddenScope:
  - No production behavior change.
  completionEvidence:
  - Stream structure and dependency direction tests pass.
- version: 0.9.7.1
  name: Governance Signal Integrity
  type: validation-honesty
  status: completed
  purpose: Make governance scope, status and scoring truthful.
  universalInvariant: Governance results match the property measured.
  forbiddenScope:
  - No broad source exclusion, inverted status or unused score.
  completionEvidence:
  - Behavioral fixtures and the final verification suite pass.
- version: 0.9.7.2
  name: Canonical Module and Notes Authority
  type: contract-authority
  status: completed
  purpose: Create one strict source of semantic and safety contracts.
  universalInvariant: Every capability and safety contract has one authority.
  forbiddenScope:
  - No duplicate defaults or permissive malformed conversion.
  completionEvidence:
  - Registry construction loads one complete strict descriptor directory.
  - Every public module load path uses the canonical validator.
  - Unknown fields, malformed shapes, duplicate identities and dependency cycles fail closed.
  - Explicit approval and destructive safety requirements survive production loading.
  - Implementation-owned evidence is excluded from Core descriptors.
  - Core notes load from one versioned manifest and preserve the declared dependency chain.
  - Flow CI 1586 passed full tests, conformance and reference evidence on the implementation head.
- version: 0.9.7.3
  name: Mandatory Materialization Authority
  type: validation-authority
  status: completed
  purpose: Make planning validation mandatory before projection.
  universalInvariant: Invalid planning evidence cannot reach an implementation boundary.
  forbiddenScope:
  - No alternate public bypass.
  completionEvidence:
  - Every public production projection path requests an unforgeable authorization from one materialization authority.
  - Execution candidates fail before provider invocation when structural or capability evidence is invalid.
  - Diagnostic evidence remains structurally validated, registry-derived and explicitly non-executable when blocked.
  - Semantic graph, materialization negotiation, projection plan and artifact authority alignment fail closed.
  - The optional projection helper and duplicate planner capability gate are removed.
  - Negative tests prove invalid plans do not invoke target generators.
  - Flow CI 1643 passed clean compilation, full tests, conformance and executable reference evidence on implementation head eff81da4f9c1aff90da30864092f884d71e73e24.
- version: 0.9.7.4
  name: Universal Dependency and Continuity Contract
  type: semantic-dependencies
  status: completed
  purpose: Distinguish ordering from data and state continuity.
  universalInvariant: Ordering never implies continuity.
  forbiddenScope:
  - No renderer assumption as continuity evidence.
  - No hidden workspace or state transfer.
  - No target-specific dependency syntax in Core contracts.
  completionEvidence:
  - Execution plans carry typed ordering, value, workspace and state relations.
  - Module contracts declare continuity providers, requirements and preservation rules.
  - Direct and preserved continuity paths resolve explicitly; missing and ambiguous paths remain blocking evidence.
  - Materialization authorization reloads canonical module contracts and rejects omitted or forged continuity claims.
  - Target compatibility derives from explicit continuity capabilities rather than renderer layout.
  - GitHub Actions reference evidence is blocked where workspace transfer is not represented explicitly.
  - Canonical snapshot generation replaced stale committed evidence file for file.
  - Flow CI 1695 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head 64393255468089b44c229361524abfc24157d487.
- version: 0.9.7.5
  name: Canonical Intent Meaning
  type: semantic-contract
  status: completed
  purpose: Separate canonical meaning from explicit binding.
  universalInvariant: Equivalent intent has equivalent meaning across inventories.
  forbiddenScope:
  - No implicit binding selection.
  - No implementation identity in canonical meaning.
  - No target capability inventory as semantic authority.
  completionEvidence:
  - Canonical intent meaning is derived before and independently from binding resolution.
  - Equivalent intent remains identical across distinct module and target inventories.
  - Explicit uses declarations produce separate binding evidence with provenance and resolution status.
  - Module actions declare the standard capabilities they implement through strict canonical contracts.
  - Unbound standard intent lowers to standard semantic work without selecting a preferred module.
  - Binding metadata cannot enter canonical meaning or silently become a semantic target.
  - Canonical reference snapshots were regenerated through the production generator.
  - Flow CI 1719 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head eed684e9996680f9abc6c4348c8747e332c1e6c9.
- version: 0.9.7.6
  name: Universal Effect and State Transition Model
  type: semantic-effects
