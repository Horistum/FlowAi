deliveryBase: main
authorization: Maintainer requested completing PR 271 with goal-first discovery from permitted environments, actual tools and constraints, without prepared solution mappings or self-confirming evidence.
objective: Let the existing host discover from a goal and explicit observation grants, retain inference and unknowns, and compile a separately reviewed complete plan without requiring binding or decision tables.
universalInvariant: Caller constraints precede the candidate; observed bytes, agent interpretations, compiler consistency and independent goal or runtime evidence retain separate authority. The compiler remains the only plan semantic evaluator.
scope:
- Add opt-in investigation v4 for agent-proposed decisions with exact observed inputs, explicit alternatives and existing requirements-v5 checks.
- Require exactly one matching alternative with type-sensitive equality; retain missing, conflicting and unsupported observations as blocked results.
- Bind the selected case and all alternatives to the existing separate review packet; preserve independent requirements and source freshness through compilation.
- Demonstrate infrastructure reuse versus creation with cleanup scoped after successful creation, and data recovery with producer-consumer continuity, using the same production mechanism.
- Exercise clarification, stale evidence, changed observations, unsafe alternative plans and real installed-compiler rejection.
- Add an opt-in goal context on investigation v4 with public constraints, frozen success criteria and enforced per-root observation grants; legacy configurations retain their behavior.
- Make observed decision tables optional in goal mode and require an evidence-linked interpretation instead; do not add another plan representation.
- Return bounded missing/inaccessible read observations so discovery can adapt, without equating a failed lookup with global absence; changes invalidate the session.
- Expose separate independent-constraint and model-derived-check results, with natural-language goal satisfaction and runtime outcomes explicitly unassessed.
- Add input-only infrastructure and data-recovery portfolios with changed layouts, state, goals and tool availability; no answer plans, mappings or expected tool sequence enter these cases.
- Keep the evaluation-only wrapper removed; live-model evaluation remains an independent open gate until an explicitly configured provider is available.
forbiddenScope:
- No second semantic graph, executor, generic expression engine, domain-specific production adapter or implicit contract migration.
- No automatic approval, inferred absence from missing records, partial-allocation cleanup claim or runtime-success claim.
- No S3, AI-A3, AR-06 or AR-07 closure; EF-09 remains paused.
validationPlan:
- Unit protocol and source-integrity tests, including legacy v3 preservation and caller clarification continuation.
- Cross-domain installed-compiler acceptance and falsification of stale alternatives, ownership, retry and value dependencies.
- Goal-context isolation, grant enforcement, adaptive failed reads, unresolved conflicts, map-free proposals and independent-check attribution, through the existing run and review path.
- Full tooling, architecture, conformance and exact-head/merge-candidate CI.
nextSlice: S3-live-discovery-and-runtime-precondition-revalidation
