version: "0.9.7.0"
name: "Roadmap Separation and Universal Drift Lock"
stream: "core"

objective: "Separate universal Core planning from adapter implementation and conformance certification, then enforce the boundary through Flow Agent tooling."

roadmapReference:
  version: "0.9.7.0"
  name: "Roadmap Separation and Universal Drift Lock"
  type: "architecture-governance"
  stream: "core"

architecturePurpose: "Prevent future work from using concrete implementation convenience as universal Flow meaning."

universalInvariant: "Universal semantic contracts advance independently from concrete implementation coverage and certification evidence."

forbiddenScope:
  - "No production semantic or projection behavior change."
  - "No adapter capability expansion."
  - "No public standard or artifact contract version bump."
  - "No package version bump."

completionEvidence:
  - "The top-level roadmap indexes separate Core, adapter and conformance files."
  - "Every Core item declares universalInvariant, forbiddenScope and completionEvidence."
  - "Flow Agent tests reject concrete platform or implementation-tool scope in Core roadmap items."
  - "The primary next item resolves to 0.9.7.1 Canonical Intent Meaning."
  - "No production Kotlin source is changed."

scope:
  include:
    - "Roadmap v3 index and stream separation."
    - "Historical roadmap extraction."
    - "Per-stream next-item resolution with Core as the primary stream."
    - "Core roadmap governance-field validation."
    - "Concrete implementation drift detection in Core roadmap scope."
    - "Flow Agent context generation for all active roadmap streams."
    - "Architecture constitution, forbidden directions, work-package template, report and release-state alignment."
  exclude:
    - "Intent, AST, ExecutionPlan or manifest changes."
    - "Materialization, renderer or adapter behavior changes."
    - "New target coverage."
    - "New conformance vectors."
    - "Package or public-contract promotion."

nonGoals:
  - "No runtime executor."
  - "No SDK-first architecture."
  - "No plugin lifecycle."
  - "No target-specific public DSL."
  - "No concrete platform as Core semantic authority."
  - "No adapter implementation in this Core work package."
  - "No test-only hacks."

ownershipBoundary:
  coreMayChange:
    - ".flow-agent roadmap governance."
    - "Flow Agent roadmap parsing, validation and context generation."
    - "Architecture and release documentation."
  adapterMayChange: []
  conformanceMayChange: []
  forbiddenCrossStreamChanges:
    - "No concrete adapter implementation or registry evidence."
    - "No semantic conformance behavior change."

expectedFilesToInspect:
  - ".flow-agent/roadmap.yaml"
  - ".flow-agent/architecture-constitution.md"
  - ".flow-agent/work-package-template.yaml"
  - "tools/flow_agent_roadmap.py"
  - "tools/flow_agent_validate.py"
  - "tools/flow_agent_runner.py"
  - "tools/tests/test_flow_agent_roadmap.py"

expectedFilesToChange:
  - ".flow-agent/roadmap.yaml"
  - ".flow-agent/architecture-constitution.md"
  - ".flow-agent/forbidden-directions.yaml"
  - ".flow-agent/work-package-template.yaml"
  - ".flow-agent/release-state.yaml"
  - "tools/flow_agent_roadmap.py"
  - "tools/flow_agent_validate.py"
  - "tools/flow_agent_runner.py"
  - "tools/tests/test_flow_agent_roadmap.py"
  - "docs/ARCHITECTURE_CONSTITUTION.md"
  - "REPORT.md"

expectedFilesToAdd:
  - ".flow-agent/roadmap-core.yaml"
  - ".flow-agent/roadmap-adapters.yaml"
  - ".flow-agent/roadmap-conformance.yaml"
  - ".flow-agent/roadmap-history-v0.7-v0.9.6.yaml"
  - ".flow-agent/work-packages/v0.9.7.0-roadmap-separation-and-universal-drift-lock.yaml"
  - ".flow-agent/reports/v0.9.7.0-roadmap-separation-and-universal-drift-lock.md"

testsToAddOrUpdate:
  - "Resolve the primary next item from the Core roadmap."
  - "Allow an independent next item in another stream."
  - "Reject multiple next items within one stream."
  - "Reject active roadmap paths outside the repository."
  - "Reject missing required streams."
  - "Reject missing mandatory Core governance fields."
  - "Reject concrete target or implementation scope in Core items."
  - "Allow concrete names inside adapter-owned roadmap scope."

conformanceToAddOrUpdate: []

documentationToUpdate:
  - "Architecture constitution."
  - "Flow Core report."
  - "Release state."
  - "Bounded work report."

architectureChecks:
  - "The change strengthens the original universal Flow purpose."
  - "The Core roadmap contains no concrete platform or implementation-tool scope."
  - "Adapter and conformance planning are separate from Core semantic authority."
  - "No production semantic model is changed."
  - "No validation gate is weakened."
  - "Historical roadmap evidence remains accessible."

validationPlan:
  - "Run Flow Agent tooling unit tests."
  - "Run Flow Agent structure validation."
  - "Generate Flow Agent context."
  - "Run the unmodified standard Flow CI on the pull request branch."
  - "Confirm the diff contains no production Kotlin source."

riskAssessment:
  risks:
    - "Roadmap parsing could become permissive and silently ignore a stream."
    - "The split could remain documentary while the Flow Agent still follows only one mixed file."
    - "Historical work could be lost or accidentally treated as active."
    - "Concrete implementation vocabulary could return through required outcomes even if item names stay generic."
  mitigations:
    - "Require exactly the Core, adapters and conformance stream declarations."
    - "Resolve and include all active streams in generated context."
    - "Keep historical roadmaps explicitly indexed but inactive."
    - "Scan Core item names, purposes and required outcomes."
    - "Add falsifying unit tests for every structural rule."

releaseArtifacts:
  - "Roadmap v3 index."
  - "Core, adapter, conformance and historical roadmap files."
  - "Flow Agent validation and context-generation updates."
  - "Governance tests."
  - "Updated architecture constitution, work-package template, release state and report."
