version: "A0.7"
name: "Trigger Materialization Coverage"
type: "adapter-trigger"
stream: adapters
status: active
objective: "Materialize manual, CRON, interval, calendar, event and webhook requirements only where the selected adapter preserves exact timing, scope, event identity and delivery semantics."
