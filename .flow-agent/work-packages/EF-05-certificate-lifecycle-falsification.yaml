sourceSelection:
  criteria:
    - "Use immutable public Git revisions with explicit redistributable license evidence."
    - "Prefer source artifacts that expose certificate lifecycle meaning directly: identity, renewal timing, issuer ownership, private-key behavior and revocation."
    - "Use at least two independent repositories so one product's API shape cannot become the semantic standard by accident."
  admittedSources:
    - repository: "cert-manager/cert-manager"
      revision: "2d0d7f7f74241a9cbf79f0e2a7bb247238ee09fd"
      path: "pkg/apis/certmanager/v1/types_certificate.go"
      license: "Apache-2.0"
      role: "certificate subject identities, renewal threshold, target secret, issuer reference and private-key rotation policy"
    - repository: "certbot/certbot"
      revision: "abf9d1b2e143c51fe1a2209a3b8be33e6a24267f"
      path: "certbot/docs/using.rst"
      license: "Apache-2.0"
      role: "named renewal and revocation with an explicit reason"

initialFalsification:
  expectedShape:
    representable:
      - "NAMED_CERTIFICATE_RENEWAL"
      - "RENEWAL_WINDOW"
      - "CERTIFICATE_SECRET_TARGET"
      - "ISSUER_OWNERSHIP"
    modelGaps:
      - "CERTIFICATE_SUBJECT_IDENTITIES"
      - "PRIVATE_KEY_ROTATION_POLICY"
      - "CERTIFICATE_REVOCATION_WITH_REASON"
  rule: "The committed baseline records the live evaluator result; these expectations do not override production semantics."

requiredOutcomes:
  - "Previously admitted EF-02 through EF-04 evidence remains intact while EF-05 appends independently proven certificate-lifecycle cases."
  - "Existing CERTIFICATE_RENEW is tested through the public intent validation path before any expansion of certificate semantics is considered."
  - "Named certificate renewal and authored renewal timing are evaluated independently from provider-specific execution syntax."
  - "Certificate subject identities are not reduced to an opaque certificate label when external evidence requires preservation of the identities covered by the certificate."
  - "Issuer identity is evaluated as semantic ownership without assuming cert-manager Issuer or ClusterIssuer objects are universal concepts."
  - "Private-key regeneration policy is kept distinct from generic secret rotation and is not hidden inside provider or description strings."
  - "Certificate revocation remains distinct from deleting local certificate material or deprovisioning a generic resource."
  - "Every gap remains explicit evidence; EF-05 does not add Core semantics merely to make the corpus representable."

forbiddenScope:
  - "Do not add or rename StandardCapability values."
  - "Do not change CanonicalIntentEffectAuthority mappings in EF-05."
  - "Do not add certificate subject, issuer, key-rotation or revocation parameters to current contracts in the falsification item."
  - "Do not treat Kubernetes Secret, cert-manager Issuer, ACME account keys or Certbot command flags as universal Core vocabulary."
  - "Do not collapse certificate revocation into local deletion or generic DEPROVISION solely to obtain a representable result."
  - "Do not collapse private-key rotation into SECRET_ROTATE unless current canonical meaning actually preserves the certificate-specific obligation."
  - "Do not promote adapter or executable support from corpus representability."
  - "Do not modify closed C0.1, C1.0, EF-01, EF-02, EF-03 or EF-04 evidence boundaries."

