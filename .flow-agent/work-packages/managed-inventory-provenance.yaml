version: AI-A3-S3.2
name: Authenticated managed inventory collection and bounded freshness
status: candidate
stream: architecture-recovery
parentWorkPackage: .flow-agent/work-packages/system-automation-direction.yaml
baselineMain: bb4a26d58009292d147b23451656d42e8fb03994
predecessorPullRequest: 269
deliveryBase: main
authorization: Maintainer confirmed PR 269 was merged and requested the next roadmap implementation PR.
objective: Bind discovery inputs to an independently trusted collector, exact managed scope, original request, actual collection interval and immutable exported bytes.
universalInvariant: A model cannot choose its inventory authority, replay another capture request, replace attested bytes or use expired collection evidence to obtain accepted operation bindings.
scope:
- Caller-prepared capture challenge and independent Ed25519 scope grant.
- Single bounded operator-configured collector process, durable attempt reservation and atomic signed export publication.
- Optional versioned inventory policy on discovery roots, whole-export validation and unchanged existing compiler fidelity authority.
- Provenance and collection-age checks at admission, dispatch, response, clarification and compilation boundaries.
- Retained raw attestations for review, provider-safe provenance receipts and dependent invalidation.
- Independent read-only source process and installed compiler proofs across multiple inventory structures.
forbiddenScope:
- No model-selected commands, workflow executor, new semantic graph, platform-specific semantic adapter or arbitrary shell fallback.
- No claim that a trusted collector signature establishes native provider truth, source completeness or upstream freshness.
- No automatic retry, refreshed evidence within an existing session, trust discovery or key revocation service.
- No live-model generalization, frozen-corpus exposure change, support promotion or S3/AI-A3 closure.
validationPlan:
- Signature domain, key, issuer, scope, request replay, file/tree mutation, limits, credential leakage and timing regressions.
- Admission and clarification rejection, expiry after successful compilation and complete final provenance receipts.
- Twelve real collector-process and installed-compiler integration cases across infrastructure, data and credential policy.
- Full Python tooling, architecture validation, source isolation, conformance and exact-head/merge-candidate GitHub CI.
nextSlice: S3-reviewed-live-discovery-evaluation
