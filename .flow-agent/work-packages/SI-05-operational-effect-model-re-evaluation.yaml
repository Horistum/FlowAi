version: "SI-05"
name: "Operational Effect Model Re-evaluation"
type: "semantic-integrity-correction"
stream: semantic-integrity
status: active
objective: "Determine the minimum target-neutral effect semantics required for backup and restore recovery meaning, using operational evidence to decide whether the SemanticEffect type system must evolve."

authorization:
  status: active
  source: "Semantic-integrity roadmap transition after independently validated and merged SI-04 completion."
  predecessor: "SI-04"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#15-re-evaluate-the-effect-model-under-operational-evidence"

invariant:
  - "Recovery meaning is derived from authored canonical semantics, never from implementation labels or inventory."
  - "Recovery-point identity, source/target state relationship, consistency boundary, retention/lifetime, recoverability and state replacement versus state creation must each have an explicit typed ownership decision."
  - "Authored recovery distinctions judged semantically relevant cannot collapse into one canonical representation."
  - "Existing implementation-independent effect meaning remains stable unless operational evidence proves the type system insufficient."

scope:
  - "Build a representability matrix for BACKUP and RESTORE across Intent, AST, ExecutionPlan, schema, semantic equivalence and conformance."
  - "Use operational DP01 backup and DP02 restore evidence plus focused negative pairs to falsify the current DATA_TRANSFORMATION state-transition model."
  - "Classify each recovery property as SemanticEffect meaning, another typed canonical contract, or intentionally unsupported authoring surface."
  - "Change the effect type system only where evidence demonstrates semantic information loss."
  - "Audit observation identity, semantic equivalence, serialization and materialization consumers for every accepted change."
  - "Make public contract-version decisions from actual serialized and normative impact."

forbiddenScope:
  - "Do not add BACKUP or RESTORE effect operations merely to rename existing information loss."
  - "Do not add effect domains or fields speculatively because one implementation exposes them."
  - "Do not encode structured recovery meaning inside free-form resource strings."
  - "Do not let target, provider, module, action or adapter identity define universal recovery meaning."
  - "Do not implement Track 1.6 parser coercion, Track 1.7 schema-validity alignment or the general Track 1.8 policy/state-lifetime redesign unless a narrow dependency is proven necessary."
  - "Do not rewrite historical SI-01 through SI-04, C1.0, AR0.1 or Core closure evidence."

versionDecision:
  publicStandard: "evaluate-during-implementation"
  artifactContracts:
    intent: "evaluate-if-authored-recovery-contract-expands"
    ast: "evaluate-if-recovery-semantics-require-new-public-ast-shape"
    executionPlan: "evaluate-effect-model-shape-and-normative-meaning"
  reason: "Operational evidence must force any type-system or version change; SI-05 must neither pre-bump nor preserve public contracts by assumption."

acceptanceEvidence:
  - "DP01 and DP02 remain positively representable through the production pipeline."
  - "Negative recovery pairs prove semantically relevant recovery-point, destination, retention, consistency or replacement distinctions do not silently collapse."
  - "Implementation-label invariance proves implementation metadata cannot change canonical recovery effects."
  - "Serialization and schema tests preserve every newly owned recovery semantic exactly and reject unsupported shapes fail closed."
  - "Semantic-equivalence behavior changes only where reviewed effect semantics require it."
  - "Full compile, tests, standalone conformance and Flow Agent validation pass before completion."

localValidation:
  status: pending
  rule: "SI-05 is authorized but not implemented by the SI-04 completion transition. Its future implementation requires its own local validation and later independent Flow CI boundary."
