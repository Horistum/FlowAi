version: "0.9.7.9.2"
name: "Artifact-Derived Lowering Evidence"
stream: core
status: exact-head-validation-pending
objective: "Replace source-iterated lowering claims with stable identity evidence re-derived from concrete execution-plan values."
scopeBoundary:
  - "Keep Flow Core target-neutral and do not introduce runtime command transport."
  - "Preserve the public ExecutionPlan version at 2.0 while advancing the embedded lowering evidence contract to 2.0."
  - "Certify accepted source fields only; do not imply that the evidence digest is a cryptographic signature of the entire plan."
  - "Treat sourcePath as human-readable source location and sourceIdentity as the stable authority."
universalInvariants:
  - "A lowering report is issued only after the concrete execution plan exists."
  - "Every accepted source field has one unique semantic source identity and one unique target identity."
  - "Every target identity resolves to exactly one concrete execution-plan value."
  - "PRESERVED requires equal source and target digests and no transform declaration."
  - "TRANSFORMED requires a named transform and a target digest matching the expected transformed value."
  - "Materialization re-derives the complete report and rejects stale, forged, missing, duplicate or value-inconsistent evidence."
  - "Topological step reordering does not change source or target evidence identity."
implementedSlices:
  - id: stable-source-catalog
    evidence:
      - "Intent source metadata carries stable semantic field identities independent of list positions."
      - "Source paths remain diagnostic locations and are not used as identity keys."
      - "Duplicate source identities and duplicate target claims fail closed."
  - id: shared-value-lowering
    evidence:
      - "IntentValueExpressionLowering is shared by AST lowering and evidence expectation construction."
      - "Structured objects are canonically ordered before expression lowering."
      - "Runtime input reference binding is represented as an explicit named transformation."
  - id: execution-plan-report-issuance
    evidence:
      - "IntentToAstPlanner stores source metadata but no lowering report."
      - "FlowPlanner issues the report only after all execution nodes and dependencies exist."
      - "The report records artifact kind, aggregate evidence digest and per-field source and target digests."
  - id: materialization-reverification
    evidence:
      - "The mandatory materialization validator re-resolves every target identity against the plan."
      - "The validator re-derives the report and requires exact equality with the stored report."
      - "Changed target values, forged evidence digests, missing entries and duplicate entries are rejected."
  - id: obsolete-drop-path-removal
    evidence:
      - "dropBlockedParams and the fabricated notes-driven-materialization-required marker are removed."
      - "Unrepresentable runtime command text remains rejected by the v0.9.7.9.1 semantic boundary."
  - id: canonical-evidence-refresh
    evidence:
      - "build-test-deploy and checkout-build-image snapshot bundles are regenerated by ReferenceSnapshotBundleGenerator."
      - "Committed AST snapshots no longer contain a premature lowering report."
validation:
  required:
    - "Adversarial artifact mutation tests"
    - "Stable identity test across topological reordering"
    - "Schema and snapshot honesty checks"
    - "Clean Gradle compilation and complete test suite"
    - "Standalone Flow conformance"
followUpWorkItem:
  version: "0.9.7.9.3"
  name: "Environment Safety Production Integration"
