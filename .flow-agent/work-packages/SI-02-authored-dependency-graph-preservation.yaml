version: "SI-02"
name: "Authored Dependency Graph Preservation"
type: "semantic-integrity-correction"
stream: semantic-integrity
status: active
objective: "Make authored semantic ordering an exact preserved contract: lowering may schedule work topologically and derive data-flow constraints, but it must neither invent authored ordering nor lose its independent provenance."

authorization:
  status: active
  source: "Semantic-integrity roadmap transition after independently validated SI-01.1 completion."
  predecessor: "SI-01.1"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#12-preserve-the-authored-dependency-graph-exactly"

invariant:
  - "For every accepted authored intent, the set of authored requires edges equals the set of ExecutionPlan ORDERING relations evidenced as DECLARED_ORDERING."
  - "Planner-derived DATA_REFERENCE ordering is separate evidence and is never reclassified as authored ordering."
  - "If one node pair is justified by both authored ordering and data flow, both evidence records survive independently."
  - "Lexical source order and topological traversal order are not semantic dependency sources."

scope:
  - "Remove intent lowering's synthetic previous-step dependency."
  - "Emit explicit and data-reference ordering evidence independently in FlowPlanner."
  - "Add fail-closed exact authored-edge-set verification to artifact-derived IntentLoweringAuthority evidence."
  - "Cover independent siblings, fan-out/fan-in, missing and extra declared edges, data-reference-only edges and dual-evidence pairs."
  - "Retain N08 parallelism-loss as a permanent semantic regression boundary."

forbiddenScope:
  - "Do not weaken cycle, missing-dependency or topology validation."
  - "Do not treat DATA_REFERENCE ordering as authored requires evidence."
  - "Do not add serialized execution merely because one target prefers it; target-specific technical ordering belongs in typed adapter evidence."
  - "Do not change Docker/BUILD_IMAGE canonical vocabulary; that remains SI-03."
  - "Do not change public artifact versions unless the actual serialized contract shape changes."
  - "Do not rewrite historical SI-01, SI-01.1, C1.0, AR0.1 or Core closure evidence."

localValidation:
  status: pending
  rule: "Record only commands actually executed against the final SI-02 tree. Local evidence does not replace GitHub CI."
