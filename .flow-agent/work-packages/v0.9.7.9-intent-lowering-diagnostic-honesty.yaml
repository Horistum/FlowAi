version: "0.9.7.9"
name: "Intent Lowering and Diagnostic Honesty"
stream: core
status: in-progress
objective: "Preserve or explicitly diagnose every meaningful accepted input across equivalent source forms."
universalInvariant: "Accepted information never disappears silently."
forbiddenScope:
  - "No source-form enforcement difference."
  - "No accepted field or value dropped without diagnostic evidence."
  - "No malformed declaration converted into empty or default meaning."
  - "No target-specific public Flow syntax or runtime execution."
implementedScope:
  - "The intent loader rejects unknown fields, malformed shapes, invalid booleans, empty references and duplicate config sources with stable path-aware diagnostics."
  - "Equivalent block YAML, flow YAML, JSON and normalized map forms produce equivalent intent meaning."
  - "Source intent metadata and typed lowering coverage evidence survive through AST and execution planning."
  - "Declared step outputs, structured defaults, source descriptions, system purpose and explicit binding metadata are preserved."
  - "Unknown semantic parameters, unsupported policy lowering, multiple workflow flattening and stopOnError=false fail closed instead of disappearing."
  - "Materialization validates source-step coverage and lowering evidence before provider invocation."
focusedValidation:
  - "IntentLoweringDiagnosticHonestyTests passed."
  - "CanonicalIntentMeaningTests passed."
  - "FlowConformanceBridgeJUnitTest passed."
  - "FlowRcConformanceTests passed."
  - "Both reference snapshot bundles were regenerated through the production generator."
finalValidation: "required on the exact completion metadata head"
completionEvidence:
  - "Equivalent source forms produce equivalent canonical meaning and diagnostics."
  - "Every accepted meaningful input is preserved or explicitly diagnosed."
  - "Malformed input fails closed without empty-default lowering."
  - "Round-trip and malformed-input tests pass."
  - "The complete unmodified Flow CI workflow passes compilation, tests, conformance and executable reference evidence."
