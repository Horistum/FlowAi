    - "new AR-02 conformance checks and path/workflow/failure mutation fixtures"

requiredTests:
  - "A value produced only by an if-then arm, one match case, a possibly empty loop, a parallel branch, a try success path or an error path is rejected when read unguarded after the join."
  - "A value defined before a branch remains definitely available afterwards when no explicit replacement changes its logical identity."
  - "Exhaustive paths with an explicit merge produce one Merged value whose incoming producer set and join point are deterministic."
  - "Matching names without an explicit merge remain ambiguous or maybe-defined and cannot authorize planning."
  - "Reversing if arms, match case storage, parallel branch storage or map iteration cannot change producer identities, dependency relations, canonical graph equality or digest."
  - "Nested structures preserve path evidence and do not leak local producers into parent, sibling, success or failure scopes."
  - "Direct planner invocation rejects the same unsafe maybe-defined read as FlowCompilationService."
  - "Multiple workflows retain distinct roots, memberships and trigger routes through graph construction; a target without explicit support rejects the graph instead of choosing or flattening a workflow."
  - "Cross-workflow dangling membership, illegal dependency and trigger-route mismatch fail graph validation."
  - "Workflow failure policy and handler membership round-trip through the graph and compatibility views without positional or synthetic-id inference."
  - "Mutating merge inputs, workflow membership, trigger routing, failure propagation or handler identity changes the canonical digest and authorization result."
  - "Existing accepted single-workflow straight-line fixtures retain their public artifact bytes in slices that claim no wire migration."

conformancePlan:
  inventory:
    - "architecture-recovery.ar-02.flow-analysis-single-owner"
    - "architecture-recovery.ar-02.value-availability-lattice"
    - "architecture-recovery.ar-02.maybe-defined-read-rejection"
    - "architecture-recovery.ar-02.explicit-merge-integrity"
    - "architecture-recovery.ar-02.producer-permutation-invariance"
    - "architecture-recovery.ar-02.workflow-membership-integrity"
    - "architecture-recovery.ar-02.multi-workflow-materialization-gate"
    - "architecture-recovery.ar-02.failure-policy-integrity"
    - "architecture-recovery.ar-02.no-synthetic-handler-authority"
    - "architecture-recovery.ar-02.public-contract-migration-integrity"
  evidenceRule: "Each check lands with a production invariant and at least one negative or permutation fixture that fails under the former mutable-state, first-workflow or synthetic-shape behavior."

forbiddenScope:
  - "Do not weaken AR-01 graph validation, semantic digest binding, direct compatibility projection or exact task authorization."
  - "Do not flatten multiple workflows, select the first workflow or duplicate one workflow's nodes under another identity."
  - "Do not infer a merge from equal display names, equal module actions or traversal position."
  - "Do not encode path, merge, workflow or failure semantics in free-form diagnostic, metadata or target-hint strings."
  - "Do not make nullable values, empty strings, assumptions or renderer defaults stand in for MaybeDefined."
  - "Do not move concrete adapters or perform the Gradle module extraction owned by AR-03."
  - "Do not promote target support or behavioral certification owned by AR-06."
  - "Do not change StandardCapability merely to represent control-flow, workflow membership or failure structure."
  - "Do not silently advance public AST, Execution Plan, Target Manifest or Target Registry versions."
  - "Do not resume EF-09 or activate AR-03 before AR-02 closes."

completionEvidence:
  - "One shared typed analysis governs value availability for validation and planning, with no last-writer mutable map acting as producer authority."
  - "Undefined, MaybeDefined, DefinitelyDefined and Merged behavior is proven across branch, match, loop, parallel, retry, success and failure paths."
  - "Explicit merges preserve every incoming producer and are invariant to branch visitation order."
  - "CanonicalExecutionGraph preserves workflow identity, membership and trigger routing without a single-workflow authority shortcut."
  - "Unsupported multi-workflow materialization fails honestly and no target support is promoted without adapter evidence."
  - "Workflow-level failure policy is first-class canonical meaning and no production consumer recognizes a synthetic tail Try as authority."
  - "F-02, F-08 and F-15 map to exact production changes, negative tests, conformance checks and distinct validation boundaries."
  - "Activation, implementation, validation and completion boundaries use distinct exact-head and synthetic merge-candidate Flow CI evidence."

