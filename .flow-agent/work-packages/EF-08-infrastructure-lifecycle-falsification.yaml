initialFalsification:
  expectedShape:
    representable:
      - "RESOURCE_EXISTENCE_UPSERT"
      - "RESOURCE_DEPROVISIONING"
      - "DESIRED_STATE_RECONCILIATION"
    modelGaps:
      - "NON_MUTATING_CHANGE_PREVIEW"
      - "CREATE_BEFORE_DESTROY_REPLACEMENT"
      - "DESTRUCTION_PROHIBITION"
      - "RETAIN_ON_MANAGEMENT_REMOVAL"
      - "PERSISTENT_MANAGEMENT_ACTION_POLICY"
  expectedCounts:
    representableFacts: 3
    modelGapFacts: 5
  rule: "The committed baseline records the live evaluator result after activation; expectations never override production semantics."

requiredOutcomes:
  - "Resource create/update intent is evaluated through IntentCapabilityValidator, canonical parameters and the infrastructure-resource UPSERT effect rather than OpenTofu apply syntax."
  - "Explicit resource removal is evaluated through a valid approval-protected DEPROVISION path and a canonical DELETE effect rather than a provider destroy command."
  - "Desired-state reconciliation is distinguishable from create-only intent through the declared target-neutral PROVISION mode and canonical infrastructure UPSERT meaning."
  - "A preview is not called representable merely because PROVISION accepts mode=preview; the canonical effect must remain non-mutating and the proposed resource/change identity must survive independently from apply."
  - "Create-before-destroy replacement must preserve that old and new instances implement one logical resource, that the replacement is created first and that the old instance is removed only after replacement availability; two unrelated ordered steps are insufficient."
  - "Destruction prohibition must prevent or reject destructive lifecycle planning while the guard is active; a safety string, generic approval or delete effect is not equivalent."
  - "Retain/orphan behavior must remove management ownership without deleting the external object; DEPROVISION or CLEANUP DELETE effects are not equivalent to forget/orphan."
  - "A persistent management-action policy must preserve the allowed set of Observe/Create/Update/Delete actions across reconciliation loops; a one-shot workflow action or arbitrary mode string is not equivalent."
  - "Every real gap remains explicit evidence; EF-08 does not add parameters, policies, capabilities or effects merely to make the corpus representable."

forbiddenScope:
  - "Do not add or rename StandardCapability values in EF-08."
  - "Do not change StandardCapabilityContracts or CanonicalIntentEffectAuthority mappings in EF-08."
  - "Do not add preview, replacement, prevent-destroy, orphan, management-policy or reconciliation-loop fields to Core in the falsification item."
  - "Do not treat OpenTofu resource addresses, state files, CLI flags, Crossplane CRD field names, provider APIs or controller reconcile loops as universal Core vocabulary."
  - "Do not infer non-mutating preview from a mode string while canonical meaning still carries an UPSERT effect."
  - "Do not infer replacement identity from two sequential infrastructure steps unless the old/new instances are structurally tied to one logical resource."
  - "Do not treat approval as destruction prohibition or DELETE as orphan/forget."
  - "Do not modify closed EF-01 through EF-07 evidence boundaries."
  - "Do not promote adapter or executable target support from corpus representability."

