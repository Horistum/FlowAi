    scope:
      - "Compile adapter catalog, neutral materialization SPI, generic evidence, three concrete adapters and reference composition as distinct Gradle modules."
      - "Require explicit AdapterCatalog and ModuleCatalog inputs at generic boundaries; move concrete defaults and scoped support selection into reference composition."
      - "Keep generators, renderers, expression translation, native catalogs, payload identifiers and target-specific continuity in their own adapter modules."
      - "Preserve projection-authorization constructors as module-internal; expose only guarded compatibility requests and test-only white-box fixtures."
      - "Package the strict source-alias resource in the frontend artifact, with no duplicate root resource."
      - "Physically build generic adapter layers without concrete or reference sources; prove each adapter cannot import its siblings or conformance."
      - "Preserve all 1424 accepted predecessor regression identities and standalone conformance."
