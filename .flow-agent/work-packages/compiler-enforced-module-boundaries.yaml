implementationSlices:
  - id: "AR-03A"
    name: "Independently compiled semantic kernel"
    status: complete
    invariant: "The typed canonical graph, semantic digest and their neutral contract dependencies compile and test on a classpath containing no product implementation, concrete adapter, frontend, CLI, conformance or serialization implementation."
    scope:
      - "Introduce flow-semantic-kernel as a real Gradle project and remove its sources from root compilation."
      - "Retain existing source paths and public qualified names during this first cut; one explicit source-ownership manifest prevents duplicate compilation and preserves live source inventories."
      - "Keep graph construction, binding metadata, authorization and validation in the residual product project."
      - "Add positive and negative Kotlin compilation probes and execute the kernel without the residual product source tree."
      - "Preserve all 1367 baseline regression tests and standalone conformance; report subproject tests in CI artifacts."
  - id: "AR-03B"
    name: "Compiler, frontend and module-contract boundary"
    status: complete
    invariant: "Compiler orchestration depends on the semantic kernel and neutral contracts; frontend parsing and serialization remain outside it."
    predecessorMerge: "0f96ef60e2a180ab1e7aa6d0f5d8e2b0003c8047"
    predecessorMainRunId: 34216542159
    acceptance:
      source: current-revision-ci
      requiredChecks: [compile-test-conformance, merge-candidate-compile-test-conformance]
    scope:
      - "Extract flow-module-contracts, flow-compiler and flow-frontends as disjoint Gradle production compilations."
      - "Replace compiler dependencies on loading registries with a neutral read-only ModuleCatalog."
      - "Supply expression syntax and environment-policy inputs explicitly; do not parse YAML or load default descriptors inside the compiler."
      - "Preserve all existing regression-test identities and compile-time authorization encapsulation."
      - "Prove the actual compiler and contracts on classpaths and source trees without frontends, adapters, serialization or conformance."
      - "Retain source locations under an exhaustive ownership partition until integrated closure reviews physical relocation."
    validationPolicy: "Local development first. Only final exact-head and merge-candidate CI are automatic; offline CI remains manual per docs/CI_COST_POLICY.md."
  - id: "AR-03C"
    name: "Adapter contracts and concrete implementation extraction"
    status: complete
    invariant: "Generic planning and materialization receive explicit adapter contracts; concrete adapter defaults and composition are distribution-owned."
    predecessorMerge: "c8ca99273a3cc7380c840d4075ad0b57361b86e2"
    predecessorPullRequest: 174
    predecessorAcceptedHead: "536a2d661e69b5b710242866d4b246c977cfca70"
    predecessorAcceptedRunId: 34224886497
    preservedBaselineTestIdentities: 1424
    acceptance:
      source: current-revision-ci
      requiredChecks: [compile-test-conformance, merge-candidate-compile-test-conformance]
    scope:
      - "Compile adapter catalog, neutral materialization SPI, generic evidence, three concrete adapters and reference composition as distinct Gradle modules."
      - "Require explicit AdapterCatalog and ModuleCatalog inputs at generic boundaries; move concrete defaults and scoped support selection into reference composition."
      - "Keep generators, renderers, expression translation, native catalogs, payload identifiers and target-specific continuity in their own adapter modules."
      - "Preserve projection-authorization constructors as module-internal; expose only guarded compatibility requests and test-only white-box fixtures."
      - "Package the strict source-alias resource in the frontend artifact, with no duplicate root resource."
      - "Physically build generic adapter layers without concrete or reference sources; prove each adapter cannot import its siblings or conformance."
      - "Preserve all 1424 accepted predecessor regression identities and standalone conformance."
    compatibilityInventory: ".flow-agent/architecture/compiler-adapter-boundary-inventory.yaml"
    validationPolicy: "Local offline development first; only final exact-head and synthetic-merge Flow CI are automatic. AR-03 and F-10/F-20 remain open for integrated AR-03D closure."
  - id: "AR-03D"
    name: "Conformance, distribution and integrated boundary closure"
    status: complete
    invariant: "Production does not depend on conformance; deletion of any concrete adapter leaves kernel and compiler tests buildable, and every temporary boundary has an owner and removal decision."
    predecessorMerge: "a11e8b3d70fe0e6844f135b85bc9f85290084594"
    predecessorPullRequest: 175
    predecessorAcceptedHead: "f63966e591e7cc106c1aae57892d373693101025"
    predecessorAcceptedRunId: 34331743662
    predecessorMainRunId: 34348510109
    preservedBaselineTestIdentities: 1463
    acceptance:
      source: current-revision-ci
      requiredChecks: [compile-test-conformance, merge-candidate-compile-test-conformance]
    compatibilityInventory: ".flow-agent/architecture/compiler-adapter-boundary-inventory.yaml"
    productionProfile:
      module: "flow-cli"
      entryPoint: "org.flowlang.cli.honest.HonestFlowCliKt"
      distributionTask: ":flow-cli:installDist"
      verificationDependencies: forbidden
    verificationProfile:
      module: "flow-conformance-kit"
      entryPoint: "org.flowlang.verification.VerificationCliKt"
      distributionTask: ":flow-conformance-kit:installDist"
      rootCompatibilityLauncher: "flow-core"
    integratedEvidence:
      sourceOwnershipReport: "build/reports/module-ownership/source-ownership.json"
      productIsolation: "tools/verify_product_isolation.py"
      compilerIsolation: "tools/verify_compiler_isolation.py"
      adapterIsolation: "tools/verify_adapter_isolation.py"
      requiredChecks: [compile-test-conformance, merge-candidate-compile-test-conformance]
    scope:
      - "Compile standard artifact contracts, product CLI and verification tooling as separately owned modules; the root owns no JVM implementation."
      - "Inject verification commands through a static typed CLI port. Product compile/runtime dependencies and its independent distribution exclude the verification implementation."
      - "Keep historical root launchers as an explicit verification profile, not as a falsely production-only distribution."
      - "Supply StandardSurface native catalogs from reference composition instead of hidden concrete defaults in the generic artifact authority."
      - "Preserve every predecessor regression identity; keep verification white-box tests in their actual owning module without widening internal APIs."
      - "Build and run the installed product after physically omitting verification sources, root tests and cached class outputs."
      - "Record each temporary compatibility boundary, reviewed retention and AR-07 removal decision; F-20 is contained, not closed."
    validationPolicy: "Local offline iteration; final exact-head and merge-candidate CI. Physical proofs are shared only for identical complete Git trees in the same run. No automatic offline-portability workflow or additional full validation matrix."

