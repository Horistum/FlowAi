version: AR-06AE-C7
name: Parallel Branch Topology Composition
status: candidate
stream: architecture-recovery
roadmapReference: .flow-agent/roadmap-architecture-recovery.yaml#AR-06
authorization:
  source: Maintainer requests the next PR under the corrected composition roadmap.
  predecessorPullRequest: 234
  mergedMain: b1f54f16a10e5701e6954677d9bed5c91179b25d
invariant: Independent parallel branches preserve their own sequential order and workspace, join before successors, and retain the authored failure/cancellation policy regardless of branch count, labels or leaf count.
architecturePurpose: Replace the pair-of-gates fixture matcher with branch membership, dependency and adapter-owned native isolation contracts.
scope:
- Support multiple top-level fork/join groups and varying nonzero branch counts, including empty branches and mixed sequential branch bodies.
- Give parallel approvals explicit native routing IDs derived from preserved step identities; verify UI/API lookup rather than direct execution-object selection.
- Compose native manual approvals and workspace-local checkout mappings independently of position, cardinality, messages and unused result aliases.
- Keep native isolation applicability separate from leaf support; a branch directory does not isolate shared services or export branch state.
- Enforce the same topology/dependency boundary for caller-supplied manifests.
- Derive independent source/canonical expectations and observe native pending inputs, branch membership, ordering, workspace paths, join and failure/cancellation with falsifying mutations.
nonGoals:
- No Core semantics, public syntax/version, generic support or portability promotion.
- No nested parallel or other structured controls inside branches, cross-branch dependencies, branch value/workspace export, shared-service isolation or fresh-workspace claim.
- No signed-portfolio expansion, historical acceptance transition or milestone closure.
ownershipBoundary:
  core: Canonical branch membership, dependencies, order and failure policy remain authoritative.
  adapters: Own native isolation mappings, directory placement and fork/join rendering.
  conformance: Own independent source expectations and native observations; never execute product actions.
testsToAddOrUpdate:
- Vary branch/group/body counts, duplicate labels/messages, empty bodies, leaf positions and local dependencies.
- Reject unsupported isolation mappings, crossing dependencies, path collisions, forged payloads and unsupported control nesting.
- Native mutations falsify serialization, omitted/reordered work, aliased directories, early successors, disabled cancellation, swallowed failure and message-derived approval-ID collisions.
validation:
  status: current-revision-ci-required
  requiredChecks:
  - compile-test-conformance
  - merge-candidate-compile-test-conformance
  - parallel-composition-runtime
  - adapter-certification-portfolio
  preservedChecks: All existing module isolation, composition, native scenarios and authenticated portfolio checks remain required.
documentationToUpdate:
- .flow-agent/reports/parallel-topology-composition.md
- docs/migrations/adapter-certification-bundle.md
- .flow-agent/roadmap-architecture-recovery.yaml
