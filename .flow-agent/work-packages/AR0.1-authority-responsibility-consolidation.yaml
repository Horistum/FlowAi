name: "Authority Responsibility Consolidation"
type: "cross-stream-architecture"
stream: architecture
status: active
objective: "Make authority ownership explicit and remove duplicated cross-cutting mechanism without collapsing independent semantic, adapter, target-edge, lifecycle or conformance policy owners."
