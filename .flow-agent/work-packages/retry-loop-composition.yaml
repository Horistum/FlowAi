testsToAddOrUpdate:
- Both nesting directions, alternating controls, independent siblings, renamed bindings and multiple task counts.
- Invalid nested policies, dynamic collections, loop-name capture across retry boundaries, unavailable result exports, unsupported leaves and forged manifests.
- Native whole-loop replay versus per-iteration retry, early success, empty collections, conditional routing and failure exhaustion.
- Reject flattened retry, changed collection multiplicity/order, repeated success and swallowed failure mutants.
conformanceToAddOrUpdate:
- Extend the existing source-derived loop oracle and native composition gate, preserving all existing cases and signed assessments.
