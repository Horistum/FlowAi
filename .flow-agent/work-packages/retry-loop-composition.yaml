version: AR-06AE-C10
name: Retry and Finite Iteration Composition
status: candidate
stream: architecture-recovery
roadmapReference: .flow-agent/roadmap-architecture-recovery.yaml#AR-06
authorization:
  source: Maintainer requests a complete follow-up PR according to the roadmap and prior architectural context.
  predecessorPullRequest: 237
  mergedMain: 1734e2f77f943f4fe41b515116965539332c2f56
invariant: A retry re-enters its entire authored body, while a retry inside a finite loop repeats only the current iteration body; lexical bindings, collection order, multiplicity and failure propagation remain intact.
architecturePurpose: Remove the artificial separation between two existing sequential control mappings using one adapter-owned recursive contract and independent source-derived native evidence.
scope:
- Compose fixed zero-delay retries, literal string loops, conditions and independently materialized leaves in both nesting directions.
- Share plan and rendered-manifest control validation while preserving policy, lexical-scope and leaf-eligibility checks.
- Extend the existing loop composition producer and independent replay consumer with successful, empty and failing mixed-control observations and falsifying mutants.
nonGoals:
- No Core semantics, public DSL or runtime executor changes.
- No nonzero delay, dynamic collection, parallel/recovery/approval interaction or general value/state transfer support.
- No fresh-workspace, rollback, idempotency, target-wide certification or portable execution claim.
- No signed portfolio expansion, historical acceptance rewrite, AR-06 closure, AR-07 activation or EF-09 resumption.
ownershipBoundary:
  core: Existing canonical retry, loop, expression, continuity and failure contracts remain authoritative.
  adapters: Validate bounded native sequential composition independently of fixture names or action counts.
  conformance: Derive expected invocation traces from source and compare native observations; reject semantic mutants.
