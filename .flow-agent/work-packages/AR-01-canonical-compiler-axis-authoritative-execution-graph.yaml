requiredTests:
  - "Equivalent accepted Intent YAML, Flow Source and reviewed AI proposal fixtures produce semantically equal CanonicalExecutionGraph values and digests while their CompilationUnit values retain distinct frontend provenance."
  - "A mutation in capability, dependency, effect, authored control requirement, continuity or topology changes the graph digest and the corresponding independent conformance observation."
  - "Frontend provenance, source locations, diagnostics, implementation labels, binding metadata, target selection and renderer payloads cannot change canonical graph meaning."
  - "Validation or authorization evidence bound to another graph digest cannot authorize materialization."
  - "Unknown, duplicate, dangling or contradictory graph identities fail before authorization and materialization."
  - "ExecutionPlan and CanonicalExecutionPlan are reproducible from the graph and cannot drift behind independent production constructors."
  - "A module.action pair cannot be wrapped in a synthetic one-node graph as a substitute for canonical compilation."
  - "Every production frontend reaches FlowCompilationService; direct parser-to-planner and intent-to-materialization bypasses fail architecture conformance."
  - "Existing target readiness and bounded executable references remain unchanged unless graph-derived evidence explicitly requires a downgrade."
  - "Public artifact bytes and versions remain stable in slices that claim no public migration."

conformancePlan:
  inventory:
    - "architecture-recovery.ar-01.compiler-entrypoint-inventory"
    - "architecture-recovery.ar-01.canonical-graph-integrity"
    - "architecture-recovery.ar-01.frontend-equivalence"
    - "architecture-recovery.ar-01.graph-mutation-polarity"
    - "architecture-recovery.ar-01.authorization-digest-binding"
    - "architecture-recovery.ar-01.derived-view-consistency"
    - "architecture-recovery.ar-01.no-pseudo-graph-bypass"
    - "architecture-recovery.ar-01.frozen-public-contract-preservation"
  evidenceRule: "Each check is added only with the production authority and a negative fixture that would fail if the former split compiler axis, digest-unbound authorization or redundant semantic authority returned."

forbiddenScope:
  - "Do not move Jenkins, GitHub Actions, Tekton or any concrete adapter implementation in AR-01; adapter extraction belongs to AR-03."
  - "Do not implement branch value lattices, phi semantics, multi-workflow execution or synthetic error-handler replacement owned by AR-02."
  - "Do not silently advance AST, ExecutionPlan, TargetManifest or other public artifact versions."
  - "Do not remove a public field before a versioned migration and compatibility boundary exists."
  - "Do not add target names, renderer primitives or implementation folklore to CanonicalExecutionGraph."
  - "Do not put frontend provenance, diagnostics or mutable authorization state into the semantic graph digest."
  - "Do not retain two production compiler orchestration paths after their parity boundary passes."
  - "Do not create a compatibility facade without a named owner, consumer inventory and AR-01 removal slice."
  - "Do not manufacture green tests by comparing two views produced by the same unchecked transformation."
  - "Do not activate AR-02, AR-03 or another recovery milestone before AR-01 completes."

completionEvidence:
  - "All production frontends use FlowCompilationService and produce one CompilationUnit containing a validated CanonicalExecutionGraph plus digest-bound authorization evidence."
  - "CanonicalExecutionGraph is the sole authority for executable meaning before target materialization."
  - "ExecutionPlan, CanonicalExecutionPlan, TargetManifest inputs and relevant reports are demonstrably graph-derived views."
  - "Frontend provenance remains available without changing semantic graph equality or digest."
  - "SemanticActionGraph no longer presents architecture obligations as the central execution IR."
  - "F-04, F-09 and F-17 each map to exact production changes, migrated callers, negative tests and conformance checks."
  - "Semantic mutation polarity proves the graph digest observes capability, dependency, effect, authored control, continuity and topology changes."
  - "Existing public artifact compatibility is preserved or advanced only through an explicit reviewed version boundary."
  - "Activation, implementation, validation and completion boundaries use distinct exact-head and synthetic merge-candidate Flow CI evidence."

