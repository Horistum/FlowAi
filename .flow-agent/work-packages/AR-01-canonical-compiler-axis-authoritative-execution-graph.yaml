version: "AR-01"
name: "Canonical Compiler Axis and Authoritative Execution Graph"
type: "architecture-recovery-foundation"
status: active
stream: "architecture-recovery"

objective: "Establish one authoritative compiler axis and one typed CanonicalExecutionGraph for accepted Flow meaning. AR-01 converges Intent YAML, Flow Source and reviewed AI proposals through FlowCompilationService, keeps frontend provenance, diagnostics and authorization in the digest-bound CompilationUnit, makes existing public plans and reports derived compatibility views, and removes SemanticActionGraph's false implication that an architecture-obligation graph is the execution IR."

authorization:
  status: active
  predecessor: "AR-00"
  strategicSource: ".flow-agent/roadmap-architecture-recovery.yaml#AR-01"
  postToolchainSource: ".flow-agent/roadmap-post-toolchain.yaml#ARCHITECTURE-RECOVERY"
  mainAtDefinition: "8cdcb5d0da93b0962c6c8597339c135cfd82bb23"
  mainAtActivation: "8cdcb5d0da93b0962c6c8597339c135cfd82bb23"
  rule: "AR-01 may introduce the canonical compiler service, typed compilation unit, authoritative execution graph and bounded compatibility projections. It must preserve current accepted semantics, target support and public artifact versions unless a separately validated migration slice explicitly advances a contract."

auditScope:
  closesFindings:
    - id: "F-04"
      title: "Flow Source and executable intent use different compiler axes"
      closure: "Every accepted frontend enters one FlowCompilationService and produces one canonical graph before authorization, materialization or target projection."
    - id: "F-09"
      title: "SemanticActionGraph is not the central execution IR it claims to be"
      closure: "CanonicalExecutionGraph owns executable meaning; the existing notes-backed graph is renamed or constrained to architecture and evidence obligations."
    - id: "F-17"
      title: "IR and report models are stringly typed and semantically redundant"
      closure: "Internal graph identities, node kinds, edges and semantic facets become typed; string wire values remain only in deliberate derived serialization views."
  closureRule: "No finding is closed by adding another model beside the existing models. Closure requires migrated production callers, graph-derived compatibility views, negative evidence and removal or explicit quarantine of superseded authority."

implementationStrategy:
  migrationOrder:
    - "Inventory every producer and consumer of Intent, AST, ExecutionPlan, CanonicalExecutionPlan, SemanticActionGraph and TargetManifest meaning."
    - "Introduce typed CompilationUnit and CanonicalExecutionGraph contracts without changing public artifacts."
    - "Introduce FlowCompilationService as the only production orchestration boundary for parsing, validation, planning and canonical graph construction."
    - "Migrate Intent YAML, Flow Source and reviewed AI proposal frontends one at a time, proving semantic graph equivalence before removing each former orchestration path."
    - "Cut authority over atomically only after the shadow graph, current execution plan and independent semantic oracles agree over positive fixtures and negative mutants."
    - "Derive ExecutionPlan, CanonicalExecutionPlan, evidence reports and adapter input from the canonical graph."
    - "Rename, constrain or remove SemanticActionGraph after all callers use its honest architecture-obligation role."
  stranglerRule: "New canonical paths are added first, callers migrate under parity tests, and old paths are removed only after production liveness and artifact compatibility are proven."
  compatibilityRule: "Existing public wire contracts remain stable compatibility projections during AR-01. A version change requires its own bounded slice, migration note and exact negative tests."
  noDualAuthorityRule: "At every intermediate boundary exactly one model is authoritative for newly compiled meaning; compatibility models may project or validate it but may not independently reconstruct semantics."
  authorityTransition:
    baselineAuthority: "ExecutionPlan remains the current de facto internal execution authority until the explicit cutover gate passes."
    shadowPhase: "CanonicalExecutionGraph may be built and validated in shadow mode, but shadow output cannot authorize materialization or repair the current plan."
    cutoverGate: "The cutover requires complete producer and consumer inventory, frontend equivalence, semantic mutation polarity, graph-to-view parity, authorization digest binding and unchanged public artifact evidence."
    postCutoverAuthority: "CanonicalExecutionGraph becomes the sole authority; production constructors that independently create ExecutionPlan or canonical semantics are removed or made graph-derived in the same bounded transition."

currentDeliverySlice:
  id: "AR-01-IFC-01"
  name: "Intent Frontend Convergence"
  status: "implementation-awaiting-boundary"
  relationToActivatedSlices: "This reviewable delivery slice establishes the AR-01A compiler-entrypoint inventory and the Flow Source plus Intent YAML portion of AR-01C. It deliberately does not reuse or claim the activated AR-01B Typed Canonical Execution Graph identity; graph authority, semantic digest and authorization cutover remain later boundaries."
  outcomes:
    - "Introduce FlowCompilationService as the sole product orchestration boundary for Flow Source and strict Intent YAML parsing results, Intent validation, lowering, Flow validation, planning and canonical compatibility projection."
    - "Introduce CompilationUnit with exact source-byte provenance, typed frontend evidence, Flow AST, validation, current ExecutionPlan authority and its derived CanonicalExecutionPlan view."
    - "Route the user-facing Flow Source and strict Intent YAML CLI commands plus canonical reference snapshot generation through the same compiler service. Reviewed AI normalization and independent conformance oracles remain explicitly inventoried as deferred."
    - "Publish a machine-readable entrypoint inventory that separates product composition roots from intentionally independent conformance and mutation oracles."
    - "Parse and hash one exact source-byte capture, reject invalid UTF-8, frontend/provenance mismatches and invalid Intent or Flow meaning before planning can produce an accepted CompilationUnit."
    - "Preserve Intent 2.0, AST 2.2, Execution Plan 2.4, lowering evidence 2.1, Target Manifest 3.0 and Target Registry 3.2 without target-support changes."
  currentAuthority:
    execution: "ExecutionPlan"
    derivedView: "CanonicalExecutionPlan"
    rule: "CanonicalExecutionPlan is emitted from the accepted CompilationUnit but cannot authorize materialization independently. CanonicalExecutionGraph has not yet taken authority in this delivery slice."
  independentOracleBoundary:
    rule: "Conformance-only semantic and mutation oracles may compose current authorities directly while ExecutionPlan remains the baseline. They are explicitly inventoried, cannot become user-facing compiler roots and cannot repair or widen product compiler output."
    evidence: "architecture-recovery/ar-01/compiler-entrypoint-inventory.yaml"
  productionFiles:
    - "src/main/kotlin/org/flowlang/compiler/CompilationContracts.kt"
    - "src/main/kotlin/org/flowlang/compiler/FlowCompilationService.kt"
    - "src/main/kotlin/org/flowlang/frontend/source/FlowSourceFrontend.kt"
    - "src/main/kotlin/org/flowlang/frontend/intent/IntentYamlFrontend.kt"
    - "src/main/kotlin/org/flowlang/intent/IntentToAstPlanner.kt"
    - "src/main/kotlin/org/flowlang/cli/honest/StandardCliCommands.kt"
    - "src/main/kotlin/org/flowlang/cli/honest/HonestFlowCli.kt"
    - "src/main/kotlin/org/flowlang/conformance/ReferenceSnapshotBundleGenerator.kt"
    - "src/main/kotlin/org/flowlang/conformance/ConformanceCheckSupport.kt"
    - "src/main/kotlin/org/flowlang/conformance/TargetNeutralConformanceFixture.kt"
    - "src/main/kotlin/org/flowlang/conformance/RealWorldCorpusRunner.kt"
    - "src/main/kotlin/org/flowlang/conformance/Ar01CompilerAxisConformanceChecks.kt"
    - "src/main/kotlin/org/flowlang/conformance/ArchitectureRecoveryConformanceChecks.kt"
    - "architecture-recovery/ar-01/compiler-entrypoint-inventory.yaml"
    - "architecture-recovery/conformance/check-inventory.yaml"
  testFiles:
    - "src/test/kotlin/FlowCompilationServiceTests.kt"
    - "src/test/kotlin/IntentFrontendConvergenceTests.kt"
    - "src/test/kotlin/Ar01CompilerAxisConformanceTests.kt"
  deferred:
    - "Typed CanonicalExecutionGraph construction, validation, digest and semantic mutation polarity."
    - "Digest-bound validation and materialization authorization."
    - "Reviewed AI proposal convergence and provider provenance."
    - "ExecutionPlan authority cutover and graph-derived TargetManifest input."
    - "Concrete adapter extraction or target-support promotion."
  completionGate: "A distinct implementation boundary must pass exact-head and synthetic merge-candidate compilation, complete tests and standalone conformance. A later validation boundary must independently prove legacy parity, mutation polarity, bypass rejection and frozen public artifacts before this delivery slice is complete."

implementationSlices:
  - id: "AR-01A"
    name: "Compiler and IR Responsibility Inventory"
    outcomes:
      - "Publish a machine-readable migration inventory for every live producer and consumer of execution meaning."
      - "Classify ExecutionPlan, CanonicalExecutionPlan, SemanticActionGraph, TargetManifest and overlapping reports as authority, derived view, evidence view or adapter view."
      - "Add liveness checks so an unlisted production caller or a second semantic reconstruction path fails conformance."
      - "Freeze current public artifact versions and graph-equivalence fixtures before introducing the new model."
  - id: "AR-01B"
    name: "Typed Canonical Execution Graph"
    outcomes:
      - "Introduce typed graph, node, edge, workflow, capability, effect, control, continuity and topology contracts."
      - "Use closed internal node and edge kinds while preserving extensible values only where the standard explicitly owns extensibility."
      - "Define a deterministic canonical graph digest over semantic content, excluding frontend provenance, source locations, diagnostics, authorization state, implementation labels and target metadata."
      - "Reject duplicate identities, dangling edges, contradictory semantic facets and incomplete semantic relationships before a graph becomes valid."
  - id: "AR-01C"
    name: "Unified Flow Compilation Service"
    outcomes:
      - "Introduce FlowCompilationService and CompilationUnit as the single production orchestration boundary."
      - "Route Intent YAML, Flow Source and reviewed AI proposals through shared validation, planning, safety and graph construction."
      - "Preserve frontend provenance, source views, assumptions and diagnostics in CompilationUnit without allowing them to alter semantic graph identity."
      - "Bind validation and authorization evidence to the exact canonical graph digest before materialization."
      - "Remove direct production composition paths that bypass the compiler service."
  - id: "AR-01D"
    name: "Derived Views and Superseded Authority Retirement"
    outcomes:
      - "Derive ExecutionPlan and CanonicalExecutionPlan compatibility views from CanonicalExecutionGraph."
      - "Provide adapters only authorized graph-derived input; module.action cannot be expanded into a one-node substitute graph."
      - "Rename or retire SemanticActionGraph as an execution-looking authority while preserving its legitimate notes and obligation evidence."
      - "Remove duplicated semantic fields or mark them as derived with equality checks until their public migration window closes."

canonicalGraphContract:
  authority: "CanonicalExecutionGraph"
  compositionRoot: "FlowCompilationService"
  compilationEnvelope: "CompilationUnit"
  semanticFacets:
    - "workflow identity and membership"
    - "typed nodes and typed dependency edges"
    - "canonical capability identity"
    - "semantic effects and state transitions"
    - "authored control requirements and evidence relationships"
    - "continuity and topology requirements"
    - "failure semantics already representable by the current model"
  compilationEnvelopeFacets:
    - "frontend identity, source provenance and source locations"
    - "frontend-specific parsed representation"
    - "assumptions and clarification state"
    - "validation diagnostics"
    - "control decisions and authorization evidence bound to the graph digest"
    - "public compatibility and evidence views"
  frontendInputs:
    - "Flow Source AST and source validation result"
    - "normalized Intent YAML and lowering evidence"
    - "reviewed AI proposal and proposal-review evidence"
  derivedViews:
    - "ExecutionPlan"
    - "CanonicalExecutionPlan"
    - "planning, graph-validation and authorization evidence"
    - "TargetManifest input"
    - "conformance observations and semantic graph digest"
  identityRule: "Graph identity and digest are derived only from typed semantic content. Frontend provenance, source locations, diagnostics, authorization timestamps, target names, renderer payloads, module implementation labels and collection iteration order cannot alter canonical meaning."
  authorizationRule: "Only a CompilationUnit whose validation and authorization evidence binds the exact CanonicalExecutionGraph digest may reach materialization. Derived reports cannot repair, widen or reinterpret the graph, and evidence for another digest fails closed."

migrationInventory:
  - model: "ExecutionPlan"
    currentRole: "Internal planner model and de facto generator input"
    targetRole: "Graph-derived compatibility and planner inspection view"
    owner: "AR-01D"
  - model: "CanonicalExecutionPlan"
    currentRole: "Public canonicalized copy of ExecutionPlan"
    targetRole: "Stable public serialization derived from CanonicalExecutionGraph"
    owner: "AR-01D"
  - model: "SemanticActionGraph"
    currentRole: "Notes-backed architecture and obligation graph with an execution-looking name"
    targetRole: "Renamed architecture-obligation evidence or retired where redundant"
    owner: "AR-01D"
  - model: "TargetManifest"
    currentRole: "Target-neutral materialization result consumed by renderers"
    targetRole: "Adapter-facing view derived only from an authorized canonical graph"
    owner: "AR-01D"
  - model: "IntentLoweringReport"
    currentRole: "Frontend lowering and provenance evidence"
    targetRole: "Compilation evidence retained by CompilationUnit and bound to canonical graph construction"
    owner: "AR-01C"
  - model: "Flow AST"
    currentRole: "Flow Source syntax and validation model"
    targetRole: "Frontend-specific parsed representation inside CompilationUnit, never a graph-derived or competing semantic authority"
    owner: "AR-01C"

