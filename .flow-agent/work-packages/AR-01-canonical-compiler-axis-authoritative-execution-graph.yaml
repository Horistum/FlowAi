version: "AR-01"
name: "Canonical Compiler Axis and Authoritative Execution Graph"
type: "architecture-recovery-foundation"
status: active
stream: "architecture-recovery"

objective: "Establish one authoritative compiler axis and one typed CanonicalExecutionGraph for accepted Flow meaning. AR-01 converges Intent YAML, Flow Source and AI proposals through FlowCompilationService, makes existing public plans and reports derived compatibility views, and removes SemanticActionGraph's false implication that an architecture-obligation graph is the execution IR."

authorization:
  status: active
  predecessor: "AR-00"
  strategicSource: ".flow-agent/roadmap-architecture-recovery.yaml#AR-01"
  postToolchainSource: ".flow-agent/roadmap-post-toolchain.yaml#ARCHITECTURE-RECOVERY"
  mainAtDefinition: "8cdcb5d0da93b0962c6c8597339c135cfd82bb23"
  mainAtActivation: "8cdcb5d0da93b0962c6c8597339c135cfd82bb23"
  rule: "AR-01 may introduce the canonical compiler service, typed compilation unit, authoritative execution graph and bounded compatibility projections. It must preserve current accepted semantics, target support and public artifact versions unless a separately validated migration slice explicitly advances a contract."

auditScope:
  closesFindings:
    - id: "F-04"
      title: "Flow Source and executable intent use different compiler axes"
      closure: "Every accepted frontend enters one FlowCompilationService and produces one canonical graph before authorization, materialization or target projection."
    - id: "F-09"
      title: "SemanticActionGraph is not the central execution IR it claims to be"
      closure: "CanonicalExecutionGraph owns executable meaning; the existing notes-backed graph is renamed or constrained to architecture and evidence obligations."
    - id: "F-17"
      title: "IR and report models are stringly typed and semantically redundant"
      closure: "Internal graph identities, node kinds, edges and semantic facets become typed; string wire values remain only in deliberate derived serialization views."
  closureRule: "No finding is closed by adding another model beside the existing models. Closure requires migrated production callers, graph-derived compatibility views, negative evidence and removal or explicit quarantine of superseded authority."

implementationStrategy:
  migrationOrder:
    - "Inventory every producer and consumer of Intent, AST, ExecutionPlan, CanonicalExecutionPlan, SemanticActionGraph and TargetManifest meaning."
    - "Introduce typed CompilationUnit and CanonicalExecutionGraph contracts without changing public artifacts."
    - "Introduce FlowCompilationService as the only production orchestration boundary for parsing, validation, planning and canonical graph construction."
    - "Migrate Intent YAML, Flow Source and AI proposal frontends one at a time, proving graph equivalence before removing each former orchestration path."
    - "Derive ExecutionPlan, CanonicalExecutionPlan, evidence reports and adapter input from the canonical graph."
    - "Rename, constrain or remove SemanticActionGraph after all callers use its honest architecture-obligation role."
  stranglerRule: "New canonical paths are added first, callers migrate under parity tests, and old paths are removed only after production liveness and artifact compatibility are proven."
  compatibilityRule: "Existing public wire contracts remain stable compatibility projections during AR-01. A version change requires its own bounded slice, migration note and exact negative tests."
  noDualAuthorityRule: "At every intermediate boundary exactly one model is authoritative for newly compiled meaning; compatibility models may project or validate it but may not independently reconstruct semantics."

implementationSlices:
  - id: "AR-01A"
    name: "Compiler and IR Responsibility Inventory"
    outcomes:
      - "Publish a machine-readable migration inventory for every live producer and consumer of execution meaning."
      - "Classify ExecutionPlan, CanonicalExecutionPlan, SemanticActionGraph, TargetManifest and overlapping reports as authority, derived view, evidence view or adapter view."
      - "Add liveness checks so an unlisted production caller or a second semantic reconstruction path fails conformance."
      - "Freeze current public artifact versions and graph-equivalence fixtures before introducing the new model."
  - id: "AR-01B"
    name: "Typed Canonical Execution Graph"
    outcomes:
      - "Introduce typed graph, node, edge, workflow, capability, effect, control, continuity, topology and provenance contracts."
      - "Use closed internal node and edge kinds while preserving extensible values only where the standard explicitly owns extensibility."
      - "Define a deterministic canonical graph digest over semantic content, not display order, implementation labels or target metadata."
      - "Reject duplicate identities, dangling edges, contradictory semantic facets and incomplete provenance before a graph becomes authorized."
  - id: "AR-01C"
    name: "Unified Flow Compilation Service"
    outcomes:
      - "Introduce FlowCompilationService and CompilationUnit as the single production orchestration boundary."
      - "Route Intent YAML, Flow Source and reviewed AI proposals through shared validation, planning, safety and graph construction."
      - "Preserve frontend provenance and diagnostics without allowing a frontend to define alternate canonical meaning."
      - "Remove direct production composition paths that bypass the compiler service."
  - id: "AR-01D"
    name: "Derived Views and Superseded Authority Retirement"
    outcomes:
      - "Derive ExecutionPlan and CanonicalExecutionPlan compatibility views from CanonicalExecutionGraph."
      - "Provide adapters only authorized graph-derived input; module.action cannot be expanded into a one-node substitute graph."
      - "Rename or retire SemanticActionGraph as an execution-looking authority while preserving its legitimate notes and obligation evidence."
      - "Remove duplicated semantic fields or mark them as derived with equality checks until their public migration window closes."

canonicalGraphContract:
  authority: "CanonicalExecutionGraph"
  compositionRoot: "FlowCompilationService"
  compilationEnvelope: "CompilationUnit"
  requiredFacets:
    - "frontend provenance and source identity"
    - "workflow identity and membership"
    - "typed nodes and typed dependency edges"
    - "canonical capability identity"
    - "semantic effects and state transitions"
    - "control requirements, evidence and decisions"
    - "continuity and topology requirements"
    - "failure semantics already representable by the current model"
    - "assumptions, diagnostics and authorization state"
  derivedViews:
    - "Flow AST and validation reports where still public"
    - "ExecutionPlan"
    - "CanonicalExecutionPlan"
    - "Intent lowering and planning evidence"
    - "TargetManifest input"
    - "conformance observations and graph digest"
  identityRule: "Graph identity and digest are derived from typed semantic content. Target names, renderer payloads, module implementation labels and collection iteration order cannot alter canonical meaning."
  authorizationRule: "Only a validated and authorized CanonicalExecutionGraph may reach materialization. Derived reports cannot repair, widen or reinterpret the graph."

migrationInventory:
  - model: "ExecutionPlan"
    currentRole: "Internal planner model and de facto generator input"
    targetRole: "Graph-derived compatibility and planner inspection view"
    owner: "AR-01D"
  - model: "CanonicalExecutionPlan"
    currentRole: "Public canonicalized copy of ExecutionPlan"
    targetRole: "Stable public serialization derived from CanonicalExecutionGraph"
    owner: "AR-01D"
  - model: "SemanticActionGraph"
    currentRole: "Notes-backed architecture and obligation graph with an execution-looking name"
    targetRole: "Renamed architecture-obligation evidence or retired where redundant"
    owner: "AR-01D"
  - model: "TargetManifest"
    currentRole: "Target-neutral materialization result consumed by renderers"
    targetRole: "Adapter-facing view derived only from an authorized canonical graph"
    owner: "AR-01D"
  - model: "IntentLoweringReport"
    currentRole: "Frontend lowering and provenance evidence"
    targetRole: "Compilation evidence derived from CompilationUnit and canonical graph construction"
    owner: "AR-01C"
  - model: "Flow AST"
    currentRole: "Flow Source syntax and validation model"
    targetRole: "Frontend-specific parsed representation inside CompilationUnit, never a competing semantic authority"
    owner: "AR-01C"

plannedProductionBoundary:
  compiler:
    - "src/main/kotlin/org/flowlang/compiler/FlowCompilationService.kt"
    - "src/main/kotlin/org/flowlang/compiler/CompilationUnit.kt"
    - "src/main/kotlin/org/flowlang/compiler/CanonicalExecutionGraph.kt"
    - "src/main/kotlin/org/flowlang/compiler/CanonicalExecutionGraphBuilder.kt"
    - "src/main/kotlin/org/flowlang/compiler/CanonicalExecutionGraphValidator.kt"
    - "src/main/kotlin/org/flowlang/compiler/CanonicalExecutionGraphDigest.kt"
  currentPlanning:
    - "src/main/kotlin/org/flowlang/planner/FlowPlanner.kt"
    - "src/main/kotlin/org/flowlang/planner/ExecutionPlan.kt"
    - "src/main/kotlin/org/flowlang/planner/CanonicalExecutionPlan.kt"
    - "src/main/kotlin/org/flowlang/planner/CanonicalExecutionPlanSemanticsAuthority.kt"
    - "src/main/kotlin/org/flowlang/lowering/IntentLoweringContracts.kt"
  frontends:
    - "src/main/kotlin/org/flowlang/parser/FlowParser.kt"
    - "src/main/kotlin/org/flowlang/intent/IntentToAstPlanner.kt"
    - "src/main/kotlin/org/flowlang/ai/normalization/AiIntentNormalization.kt"
    - "src/main/kotlin/org/flowlang/ai/normalization/IntentProposalReview.kt"
  overlappingAuthority:
    - "src/main/kotlin/org/flowlang/semantic/SemanticActionGraph.kt"
    - "src/main/kotlin/org/flowlang/generators/manifest/TargetManifestLowering.kt"
    - "src/main/kotlin/org/flowlang/cli/honest/StandardCliCommands.kt"
  evidence:
    - "standard/architecture/authority-responsibilities.yaml"
    - "architecture-recovery/conformance/check-inventory.yaml"
    - ".flow-agent/reports/ar0.2-architecture-readiness-baseline.md"

requiredTests:
  - "Equivalent accepted Intent YAML, Flow Source and AI proposal fixtures produce equal CanonicalExecutionGraph values and digests while retaining distinct frontend provenance."
  - "A mutation in capability, dependency, effect, control, continuity or topology changes the graph digest and the corresponding conformance observation."
  - "Implementation labels, binding metadata, target selection and renderer payloads cannot change canonical graph meaning."
  - "Unknown, duplicate, dangling or contradictory graph identities fail before authorization and materialization."
  - "ExecutionPlan and CanonicalExecutionPlan are reproducible from the graph and cannot drift behind independent constructors."
  - "A module.action pair cannot be wrapped in a synthetic one-node graph as a substitute for canonical compilation."
  - "Every production frontend reaches FlowCompilationService; direct parser-to-planner and intent-to-materialization bypasses fail architecture conformance."
  - "Existing target readiness and bounded executable references remain unchanged unless graph-derived evidence explicitly requires a downgrade."
  - "Public artifact bytes and versions remain stable in slices that claim no public migration."

conformancePlan:
  inventory:
    - "architecture-recovery.ar-01.compiler-entrypoint-inventory"
    - "architecture-recovery.ar-01.canonical-graph-integrity"
    - "architecture-recovery.ar-01.frontend-equivalence"
    - "architecture-recovery.ar-01.graph-mutation-polarity"
    - "architecture-recovery.ar-01.derived-view-consistency"
    - "architecture-recovery.ar-01.no-pseudo-graph-bypass"
    - "architecture-recovery.ar-01.frozen-public-contract-preservation"
  evidenceRule: "Each check is added only with the production authority and a negative fixture that would fail if the former split compiler axis or redundant semantic authority returned."

forbiddenScope:
  - "Do not move Jenkins, GitHub Actions, Tekton or any concrete adapter implementation in AR-01; adapter extraction belongs to AR-03."
  - "Do not implement branch value lattices, phi semantics, multi-workflow execution or synthetic error-handler replacement owned by AR-02."
  - "Do not silently advance AST, ExecutionPlan, TargetManifest or other public artifact versions."
  - "Do not remove a public field before a versioned migration and compatibility boundary exists."
  - "Do not add target names, renderer primitives or implementation folklore to CanonicalExecutionGraph."
  - "Do not retain two production compiler orchestration paths after their parity boundary passes."
  - "Do not create a compatibility facade without a named owner, consumer inventory and AR-01 removal slice."
  - "Do not manufacture green tests by comparing two views produced by the same unchecked transformation."
  - "Do not activate AR-02, AR-03 or another recovery milestone before AR-01 completes."

completionEvidence:
  - "All production frontends use FlowCompilationService and produce one validated CompilationUnit and CanonicalExecutionGraph."
  - "CanonicalExecutionGraph is the sole authority for executable meaning before target materialization."
  - "ExecutionPlan, CanonicalExecutionPlan, TargetManifest inputs and relevant reports are demonstrably graph-derived views."
  - "SemanticActionGraph no longer presents architecture obligations as the central execution IR."
  - "F-04, F-09 and F-17 each map to exact production changes, migrated callers, negative tests and conformance checks."
  - "Semantic mutation polarity proves the graph digest observes capability, dependency, effect, control, continuity and topology changes."
  - "Existing public artifact compatibility is preserved or advanced only through an explicit reviewed version boundary."
  - "Activation, implementation, validation and completion boundaries use distinct exact-head and synthetic merge-candidate Flow CI evidence."

lifecycle:
  activationBoundary:
    status: pending
  implementationBoundary:
    status: pending
  validationBoundary:
    status: pending
  completionBoundary:
    status: pending

localValidation:
  status: activation-defined
  rule: "This transition defines and activates AR-01 only. No production compiler, semantic model, public artifact or adapter behavior changes before the activation boundary passes on exact head and synthetic merge candidate."
