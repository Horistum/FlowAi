- Enforce the budget in the shared analyzer and translate exhaustion into validation-stage rejection in all compiler frontends.
- Reject direct planning and direct analysis explicitly; retain no partial accepted product.
- Preserve existing definite/maybe, existence-guard, explicit merge and concurrent-path behavior within the budget.
