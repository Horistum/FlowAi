  - "A production EF-06 evaluator classifies every reviewed PRESERVE observation through public intent validation and canonical meaning."
  - "Positive and negative tests prove current representability and reject provider-vocabulary smuggling or false schedule equivalence."
  - "A committed mixed baseline remains exact while EF-06 is active/validating and becomes monotonic after closure."
  - "Standalone conformance integrates EF-06 without converting known model gaps into success."
  - "A later distinct implementation, validation and completion CI boundary must pass on exact heads and synthetic merge candidates before lifecycle closure."

