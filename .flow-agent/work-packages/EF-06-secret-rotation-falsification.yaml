version: "EF-06"
name: "Secret Rotation Falsification"
type: "post-toolchain-external-falsification-domain"
status: active
stream: "post-toolchain"

objective: "Pressure the current Flow secret-rotation semantics with immutable external evidence for named rotation, recurring cadence, invocation-time deferral, bounded rotation windows, automated-rotation policy and prior-credential retirement without turning AWS Secrets Manager, OpenBao, database-role or version-stage vocabulary into universal Core meaning."

