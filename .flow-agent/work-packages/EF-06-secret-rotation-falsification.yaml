  criteria:
    - "Use immutable public Git revisions with explicit redistributable source licenses."
    - "Prefer first-party source artifacts that expose secret-rotation lifecycle meaning directly rather than deployment wrappers around a provider."
    - "Use at least two independent repositories with materially different rotation behavior so one product's implementation shape cannot become the semantic standard by accident."
