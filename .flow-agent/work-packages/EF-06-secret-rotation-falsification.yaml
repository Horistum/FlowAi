initialFalsification:
  expectedShape:
    representable:
      - "NAMED_SECRET_ROTATION"
      - "ROTATION_CADENCE"
    modelGaps:
      - "IMMEDIATE_VS_SCHEDULED_ROTATION"
      - "ROTATION_WINDOW"
      - "AUTOMATED_ROTATION_ENABLEMENT"
      - "PRIOR_CREDENTIAL_RETIREMENT_POLICY"
  expectedCounts:
    representableFacts: 2
    modelGapFacts: 5
  correctionFromActivationHypothesis: "Source review showed that AWS RotateImmediately=false performs invocation-time test behavior before waiting for the next configured window. Replacing that with a future workflow trigger would change meaning, so the evaluator treats this shape as a model-gap probe rather than manufacturing representability."
  rule: "The committed baseline records the live evaluator result; expectations do not override production semantics."

requiredOutcomes:
  - "Current SECRET_ROTATE is evaluated through IntentCapabilityValidator and CanonicalIntentMeaning rather than by source-string matching."
  - "The authored secret identity remains distinct from provider-specific ARNs, database mount paths, role names and CLI syntax."
  - "Exact recurring rotation cadence is tested through canonical interval-trigger semantics with an alternate cadence proving semantic distinguishability."
  - "Invocation-time immediate-versus-next-window behavior is not equated with merely delaying workflow invocation."
  - "A rotation window is not confused with cadence, retry timeout or generic workflow scheduling."
  - "Enabling or disabling automated rotation is evaluated as persistent lifecycle policy state, not as whether one SECRET_ROTATE action happens to execute."
  - "Prior-credential retirement remains explicit because AWS evidence retains a last-known-good previous credential while OpenBao evidence makes the previous root password inaccessible."
  - "Provider version labels and database-role syntax remain unsupported implementation detail."
  - "Every real gap remains explicit evidence; EF-06 does not add parameters, capabilities or effects merely to make the corpus representable."

forbiddenScope:
  - "Do not add or rename StandardCapability values."
  - "Do not change CanonicalIntentEffectAuthority mappings in EF-06."
  - "Do not add rotation-mode, rotation-window, automation-enable or prior-credential-policy parameters to SECRET_ROTATE in the falsification item."
  - "Do not treat AWS ARN, Lambda ARN, AWSCURRENT, AWSPENDING, AWSPREVIOUS, OpenBao mount paths or database role syntax as universal Core vocabulary."
  - "Do not represent a rotation window as a generic timeout or invocation-time deferral as a future trigger unless canonical meaning actually preserves the same obligation."
  - "Do not infer prior-credential invalidation merely from the word ROTATE."
  - "Do not modify closed EF-01 through EF-05 evidence boundaries."
  - "Do not promote adapter or executable target support from corpus representability."

completionEvidence:
  - "Flow CI #3032 passed the distinct activation-only boundary before any EF-06 external case was admitted."
