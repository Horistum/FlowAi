version: "EF-06"
name: "Secret Rotation Falsification"
type: "post-toolchain-external-falsification-domain"
status: planned
stream: "post-toolchain"

objective: "Pressure the current Flow secret-rotation semantics with immutable external evidence for named rotation, recurring cadence, immediate-versus-scheduled execution, bounded rotation windows and prior-credential retirement without turning AWS Secrets Manager, OpenBao, Lambda, database-role or version-stage vocabulary into universal Core meaning."

authorization:
  status: planned
  predecessor: "EF-05"
  strategicSource: ".flow-agent/roadmap-post-toolchain.yaml#EF-06"
  mainAtDefinition: "74f15ed0a1f517ef043975850b23c1d2bd311800"
  rule: "This file defines EF-06 only. External evidence may be admitted only after an independent activation commit passes exact-head and synthetic merge-candidate CI. EF-06 may classify gaps but must not repair Core semantics in the same work item."

sourceSelection:
  criteria:
    - "Use immutable public Git revisions with explicit OSI-approved or otherwise clearly redistributable source licenses."
    - "Prefer first-party source artifacts that expose secret-rotation lifecycle meaning directly rather than deployment wrappers around a provider."
    - "Use at least two independent repositories with materially different rotation behavior so one product's implementation shape cannot become the semantic standard by accident."
  plannedSources:
    - repository: "aws/aws-sdk-go-v2"
      revision: "c08b7424466a0fefab24ecabfa17effed4f8a885"
      paths:
        - "service/secretsmanager/api_op_RotateSecret.go"
        - "service/secretsmanager/types/types.go"
      license: "Apache-2.0"
      role: "named rotation, immediate-versus-scheduled execution, recurring cadence, rotation window and previous/current/pending version lifecycle"
    - repository: "openbao/openbao"
      revision: "8d648cab5992950080a64e9cb3c3516bd56fc897"
      paths:
        - "website/content/docs/secrets/databases/index.mdx"
      license: "MPL-2.0"
      role: "periodic static-credential rotation and immediate retirement of the previous root database credential"

initialFalsification:
  hypothesis:
    representable:
      - "NAMED_SECRET_ROTATION"
      - "ROTATION_CADENCE"
      - "IMMEDIATE_VS_SCHEDULED_ROTATION"
    modelGaps:
      - "ROTATION_WINDOW"
      - "AUTOMATED_ROTATION_ENABLEMENT"
      - "PRIOR_CREDENTIAL_RETIREMENT_POLICY"
  rule: "This is a pre-evidence hypothesis only. The committed baseline must record the live evaluator result after activation and may not be rewritten merely to manufacture a preferred shape."

requiredOutcomes:
  - "Current SECRET_ROTATE is evaluated through IntentCapabilityValidator and CanonicalIntentMeaning rather than by string inspection of source artifacts."
  - "The authored secret identity must remain distinct from provider-specific ARNs, database mount paths, role names or CLI syntax."
  - "Recurring rotation cadence must be tested through canonical workflow trigger semantics when a target-neutral interval or schedule can preserve the source behavior."
  - "Immediate execution must remain semantically distinguishable from waiting for a future scheduled rotation."
  - "A rotation window must not be confused with cadence, retry timeout or generic workflow scheduling if current semantics cannot preserve the allowed execution interval."
  - "Enabling or disabling automated rotation must be evaluated as lifecycle policy state, not silently collapsed into whether one SECRET_ROTATE action happens to execute."
  - "Prior-credential retirement must remain explicit when evidence distinguishes immediate invalidation from retaining a previous usable version during or after rotation."
  - "AWS staging labels, Lambda identifiers and OpenBao database-role paths remain unsupported implementation detail unless a target-independent semantic obligation is independently demonstrated."
  - "Every real gap remains explicit evidence; EF-06 does not add parameters, capabilities or effects merely to make the corpus representable."

forbiddenScope:
  - "Do not add or rename StandardCapability values."
  - "Do not change CanonicalIntentEffectAuthority mappings in EF-06."
  - "Do not add rotation-window, automation-enable, version-stage or retirement-policy parameters to SECRET_ROTATE in the falsification item."
  - "Do not treat AWS ARN, Lambda ARN, AWSCURRENT, AWSPENDING, AWSPREVIOUS, OpenBao mount paths or database role syntax as universal Core vocabulary."
  - "Do not represent a rotation window as a generic timeout unless current canonical meaning actually preserves the same obligation."
  - "Do not infer prior-credential invalidation merely from the word ROTATE if external evidence requires distinguishable overlap or retirement behavior."
  - "Do not modify closed EF-01 through EF-05 evidence boundaries."
  - "Do not promote adapter or executable target support from corpus representability."

completionEvidence:
  - "A distinct activation-only CI boundary passes before any EF-06 external case is admitted."
  - "Immutable source captures and SHA-256 provenance load through the EF-01 external corpus contract."
  - "A production EF-06 evaluator classifies every reviewed PRESERVE observation through public intent validation and canonical meaning."
  - "Positive and negative tests prove representable timing semantics and reject provider-vocabulary smuggling or fake equivalence."
  - "A committed mixed baseline remains exact while EF-06 is active/validating and becomes monotonic after closure."
  - "Standalone conformance integrates EF-06 without converting known model gaps into success."
  - "Distinct implementation, validation and completion CI boundaries pass on exact heads and synthetic merge candidates before lifecycle closure."

localValidation:
  status: not-started
  rule: "The work package is intentionally definition-only. EF-06 remains unactivated until the roadmap transition is committed separately and independently validated."
