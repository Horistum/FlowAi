version: "0.9.7.9.8"
name: "Closure-Blocking Safety, Governance and Diagnostic Integrity"
type: "bounded-correction"
stream: core
status: complete
parentCoreItem: "0.9.7.9"
objective: "Repair the remaining safety-evidence, governance-signal, diagnostic CLI, canonical-topology and adapter cancellation defects that block an honest v0.9.7 closure decision."
scopeBoundary:
  - "Treat authored safety evidence as confirmed only through explicit positive values or concrete control-specific references."
  - "Make CI/CD bias health depend on executable semantic coupling rather than comments, prose, catalog declarations or edge-owned target vocabulary."
  - "Expose target-neutral planning when no target is selected and diagnostic manifest evidence when a target cannot execute."
  - "Remove the legacy CLI entrypoint and every implicit Jenkins target default."
  - "Re-derive canonical topology from retained source provenance before materialization and reject canonical claims when that provenance is missing."
  - "Retain legacy dependencies and effects only as mechanically validated compatibility projections, never as independent authorities."
  - "Preserve GitHub Actions cancellation semantics; do not use always() for ordinary dependency jobs."
  - "Validate the exact pull-request head independently from the synthetic merge candidate."
  - "Keep package, public-standard and artifact contract versions unchanged."
universalInvariants:
  - "Unknown, placeholder or ambiguous text never satisfies a safety control."
  - "Governance health is reproducible from actionable lexical evidence and can reach PASS on an honest repository."
  - "Expected target incompatibility produces a typed review or blocked result, not a stack trace."
  - "Absence of target selection never means Jenkins."
  - "Canonical workflow and capability topology cannot disappear or self-certify without retained source provenance."
  - "Retained derived fields equal their typed authority at every materialization boundary."
  - "Ordinary GitHub Actions dependencies preserve native success and cancellation behavior."
  - "A validation record identifies the exact checked-out head and does not relabel a merge ref as exact-head evidence."
implementedSlices:
  - id: authored-control-evidence-classification
  - id: lexical-cicd-bias-governance
  - id: target-neutral-cli-planning
  - id: diagnostic-target-manifest-fallback
  - id: legacy-cli-removal
  - id: canonical-topology-provenance
  - id: retained-derived-projection-integrity
  - id: github-cancellation-semantics
  - id: exact-head-and-merge-candidate-validation
  - id: closure-blocking-integrity-conformance
validationPolicy:
  workflow: "Flow CI"
  requirement: "Flow CI #2025, run 30144935197, passed exact implementation head af2062a687e4fbf0a5ec4d3e50d44b8ba07e9319 and independently passed synthetic merge candidate 2e30830d55fe73ec0c46c75dfd425c1047dc9853. The completion-metadata head must pass the same dual workflow before review readiness."
  buildDiscipline: "Assemble one complete implementation candidate before opening a draft pull request. Close the pull request during any concrete correction set and never trigger CI for file-level connector commits."
followUpWorkItem:
  version: "0.9.7.10"
  name: "Bounded Semantic Closure Gate"
