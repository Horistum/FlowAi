version: "SI-03"
name: "Canonical Technology Neutrality"
type: "semantic-integrity-correction"
stream: semantic-integrity
status: active
objective: "Remove concrete implementation technology from target-neutral image capability meaning without deleting useful Docker-specific adapter evidence or inventing a breaking canonical rename where the existing capability identity is already technology-neutral."

authorization:
  status: active
  source: "Semantic-integrity roadmap transition after independently validated and merged SI-02 completion."
  predecessor: "SI-02"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#13-remove-implementation-technology-from-canonical-meaning"

invariant:
  - "Canonical BUILD_IMAGE and PUSH_IMAGE meaning is derived without requiring Docker, Dockerfile, a Docker builder or a concrete implementation inventory."
  - "Dockerfile selection is explicit Docker binding evidence and cannot change canonical capability parameters, effects or intent meaning."
  - "Generic BUILD_IMAGE publication intent remains canonical; SI-03 does not silently reclassify it as Docker-specific implementation detail."
  - "Concrete adapter/module evidence may implement canonical image semantics but cannot become the source of target-neutral meaning."
  - "Historical C0.4 binding evidence remains immutable; current post-C1 binding semantics supersede it only through one fail-closed versioned migration."

scope:
  - "Remove Docker as a required system and lowering authority from canonical BUILD_IMAGE and PUSH_IMAGE contracts."
  - "Move Dockerfile selection out of canonical BUILD_IMAGE parameters into explicit docker.build binding-only configuration."
  - "Keep generic image identity, build-context path and publication intent canonical where they are implementation-independent."
  - "Remove Docker from canonical image capability catalog hints so the public catalog does not present one implementation as the defining example."
  - "Retain the byte-exact C0.4 binding snapshot and introduce live binding evidence v1.1 rather than rewriting historical certification."
  - "Machine-enforce the exact v1.0 -> v1.1 migration so only docker.build dockerfile may move from semantic mapping to binding-only configuration."
  - "Add regression coverage proving identical canonical image meaning and effects with and without Docker implementation inventory."
  - "Add binding-evidence coverage proving Dockerfile remains available only under explicit docker.build selection."

forbiddenScope:
  - "Do not remove modules/docker.yaml or concrete Docker adapter evidence; implementation technology is valid below the canonical boundary."
  - "Do not rename BUILD_IMAGE or PUSH_IMAGE merely to make the diff look neutral; those operation names do not themselves name a concrete vendor."
  - "Do not reclassify generic push/publication intent as Docker-specific merely because the current Docker binding exposes it."
  - "Do not infer a Docker implementation when an authored image capability is unbound."
  - "Do not mutate the frozen C0.4 binding manifest or waive its recorded source digest."
  - "Do not change serialized artifact versions unless the serialized contract shape actually changes."
  - "Do not rewrite historical SI-01, SI-01.1, SI-02, C1.0, AR0.1 or Core closure evidence."

versionDecision:
  publicStandard: unchanged
  artifactContracts: unchanged
  reason: "SI-03 preserves serialized capability identities and artifact shapes while enforcing the already-declared rule that concrete platforms cannot define canonical meaning. Explicit docker.build still accepts Dockerfile selection as binding configuration."

