version: "SI-08"
name: "Typed Policy and State-Lifetime Semantics"
type: "semantic-integrity-correction"
stream: semantic-integrity
status: active
objective: "Replace string-fragment policy classification and unconditional durable-state assumptions with explicit typed policy and state-lifetime semantics so control authorization and topology requirements are derived from authored meaning rather than incidental text or relation kind alone."

authorization:
  status: active
  source: "Semantic-integrity roadmap transition after independently validated and merged SI-07 completion."
  predecessor: "SI-07"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#18-replace-string-heuristics-with-typed-policy-and-lifetime-semantics"

invariant:
  - "A policy condition may satisfy a standard control only when its typed semantic kind explicitly represents that control; unrelated text fragments never acquire control meaning by substring coincidence."
  - "Retention and safety semantics are distinct from generic predicates such as environment guards, and an environment predicate alone cannot satisfy a retention guard."
  - "State propagation and state persistence are independent requirements: workflow-local mutable-state transfer does not imply durable state across executions, restarts or suspension boundaries."
  - "DURABLE_STATE is required only when canonical authored semantics explicitly require persistence beyond workflow-local propagation."
  - "Target-specific implementation vocabulary never defines target-neutral policy or state-lifetime meaning."

scope:
  - "Inventory every production consumer of PolicyCondition and every path where policy condition text affects ControlRequirement or ControlEvidence decisions."
  - "Replace substring/contains-based standard policy classification with a closed typed representation and deterministic parsing/validation for standard requirements, retention constraints and non-retention predicates/custom conditions."
  - "Preserve free-form/custom authored policy text only as non-authoritative custom meaning unless an explicit typed standard form is recognized."
  - "Audit IntentPolicy wire compatibility and decide whether the existing string condition encoding can remain a validated serialization of the typed model or requires an Intent contract/version migration."
  - "Inventory PlanDependencyKind.STATE consumers and separate workflow-local state propagation from stronger persistence/lifetime requirements."
  - "Require STATE_PROPAGATION for state flow while deriving DURABLE_STATE only from explicit stronger persistence or lifetime semantics."
  - "Propagate the corrected distinctions through canonical control, planning topology, target matching, diagnostics and conformance evidence without weakening fail-closed decisions."
  - "Add positive and negative polarity tests proving policy classification and state-lifetime requirements cannot be promoted by incidental text, relation names or target capabilities."

forbiddenScope:
  - "Do not replace the current substring list with a different regex or keyword list and call the result typed semantics."
  - "Do not classify environment predicates, arbitrary custom expressions or messages as retention evidence merely because they contain familiar words."
  - "Do not remove DURABLE_STATE checks globally; preserve them for semantics that genuinely require persistence beyond workflow-local transfer."
  - "Do not collapse STATE_PROPAGATION and DURABLE_STATE into one convenience capability."
  - "Do not introduce Jenkins, GitHub Actions, Kubernetes, Docker or other target products into canonical policy or lifetime contracts."
  - "Do not weaken unknown/unsupported control or topology evidence to make existing targets appear executable."
  - "Do not mix public-schema realignment, authority-responsibility refactoring or unrelated roadmap work into SI-08."
  - "Do not rewrite historical SI-01 through SI-07, C1.0, AR0.1 or Core closure evidence."

acceptanceEvidence:
  - "A condition such as 'environment != prod' remains a generic predicate/custom condition and cannot satisfy RETENTION_GUARD without explicit typed retention semantics."
  - "Recognized retention and standard safety conditions are parsed deterministically into closed typed forms, with malformed standard forms rejected rather than reclassified by substring fallback."
  - "Control requirement and evidence decisions consume typed policy semantics rather than scanning raw policy condition or message text for semantic fragments."
  - "A workflow-local STATE relation requires STATE_PROPAGATION but does not by itself require DURABLE_STATE."
  - "Explicit durable or suspend-surviving state semantics require DURABLE_STATE and block a target whose evidence is unsupported, unknown or contradictory."
  - "Negative regressions prove target capability, relation naming and incidental text cannot promote stronger policy or lifetime meaning."
  - "Intent, plan/topology and migration/version consequences are documented from actual public-contract impact."
  - "Full compile, tests, standalone conformance and Flow Agent validation pass before completion."

localValidation:
  status: pending
  rule: "This lifecycle transition only activates SI-08. A dedicated SI-08 implementation PR must establish implementation and local-validation evidence without reusing the SI-07 completion boundary."
