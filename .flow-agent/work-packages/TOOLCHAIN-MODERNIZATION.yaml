invariants:
  - "The migration changes build tooling only; canonical Flow meaning is byte-for-byte or structurally equivalent wherever the toolchain does not legitimately alter generated build metadata."
  - "Published package, public standard and serialized artifact contract versions do not advance merely because Kotlin, Gradle or JDK changes."
  - "Target support, executable-reference status and adapter evidence are not promoted by a toolchain upgrade."
  - "Compiler, Gradle or JDK diagnostics are resolved at their semantic/configuration source instead of being hidden through global warning suppression."
  - "Kotlin, Gradle and JDK are upgraded as separately diagnosable boundaries; each predecessor must be validated before the next boundary advances."

forbiddenScope:
  - "Do not combine this milestone with External Falsification domain implementation."
  - "Do not combine this milestone with the future multi-module STRUCTURAL-BOUNDARIES split."
  - "Do not perform unrelated Authority refactors, semantic redesigns or target-support expansion."
  - "Do not select RC, beta or unsupported toolchain combinations merely to use a larger version number."
  - "Do not weaken tests, conformance, governance or compiler settings to manufacture a green build."

versionDecision:
  implementationPackage: unchanged
  publicStandard: unchanged
  artifactContracts:
    intent: unchanged
    ast: unchanged
    executionPlan: unchanged
    executionPlanLoweringEvidence: unchanged
    targetManifest: unchanged
    targetRegistry: unchanged
  reason: "Toolchain modernization is an implementation-maintenance axis and does not by itself alter Flow's public semantic or serialized contracts."

completionEvidence:
  - "Kotlin 2.4.10 migration passed exact-head and synthetic merge-candidate full validation before the Gradle boundary advanced."
  - "Gradle 9.5.0 migration passed exact-head and synthetic merge-candidate full validation before the JDK boundary advanced."
  - "JDK 25 migration passed exact-head and synthetic merge-candidate full validation on Kotlin 2.4.10 and Gradle 9.5.0 before offline refresh advanced."
  - "Offline/reproducible inputs were prepared in an isolated Gradle home and verified from a second isolated Gradle home with --offline for clean tests and standalone conformance."
  - "No semantic behavior, public artifact contract or target-support claim changed as a side effect of the migration."
  - "Implementation and completion Flow CI boundaries are distinct."

localValidation:
  status: passed
  evidence:
    - "Flow CI offline boundary #2 prepared a fresh isolated Gradle home on JDK 25 and resolved the Gradle 9.5.0 wrapper, Kotlin 2.4.10 plugins and complete test/conformance dependency closure."
    - "The same boundary copied those prepared inputs into a second isolated Gradle home and passed clean test plus standalone conformance using --offline for both exact head and synthetic merge candidate."
    - "The workflow emitted wrapper-properties, wrapper-jar and build-script SHA-256 provenance in the offline input manifest."
  rule: "Offline refresh acceptance requires a prepared isolated Gradle home plus a second isolated Gradle home that passes clean test and conformance with --offline on JDK 25."
