version: "TOOLCHAIN-MODERNIZATION"
name: "Kotlin and Gradle Toolchain Modernization"
type: "enabling-maintenance"
status: active
stream: "enabling-maintenance"

objective: "Modernize the Flow compiler and build baseline without changing target-neutral semantics, public artifact contracts, target support claims or execution evidence."

authorization:
  status: active
  predecessor: "SI-08"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#enabling-milestone-kotlin-and-gradle-toolchain-modernization"
  rule: "This work package is an orthogonal enabling milestone. It does not reopen the completed semantic-integrity stream and does not activate External Falsification."

activationBasis:
  semanticIntegrityStatus: completed
  semanticIntegrityCompletedItem: "SI-08"
  plannedMilestoneMergeCommit: "bfd879bf208f16f5c7ea6ec87e34f0d5718348fa"
  plannedMilestoneMainValidation:
    workflow: "Flow CI"
    runNumber: 2951
    runId: 31979925759
    head: "bfd879bf208f16f5c7ea6ec87e34f0d5718348fa"
    status: passed

baseline:
  kotlin: "1.9.24"
  gradle: "8.10.2"
  jdk: "21"

selectedTarget:
  kotlin: "2.4.10"
  gradle: "9.5.0"
  jdk: "25"
  selectionDate: "2026-08-20"
  rationale:
    - "Kotlin 2.4.10 is the selected stable Kotlin bug-fix release for this modernization milestone."
    - "Gradle 9.5.0 is retained as the independently validated build baseline before the JDK transition."
    - "JDK 25 is introduced as a separate evidence-backed boundary only after Kotlin 2.4.10 and Gradle 9.5.0 have each crossed their own validation boundary."
    - "The JDK transition remains build-tooling maintenance and must not alter Flow semantics, public contracts or target support claims."

sequence:
  - id: "KOTLIN"
    status: validated
    validationEvidence:
      status: passed
      workflow: "Flow CI"
      runNumber: 2958
      runId: 31985147977
      exactHead: "e400d08c2ece593d80f2223b9d139a87a8deff0e"
      mergeCandidate: "8351d3d5462947e9e94c47f11064017891c3e658"
    from: "1.9.24"
    to: "2.4.10"
    gradleDuringStep: "8.10.2"
    jdkDuringStep: "21"
    acceptance: "Complete compile, tests, standalone conformance and governance validation pass without semantic or public-contract drift."
  - id: "GRADLE"
    status: validated
    validationEvidence:
      status: passed
      workflow: "Flow CI"
      runNumber: 2962
      runId: 32090278981
      exactHead: "a6806899ed1b39b4782fbdcac158c64505b71538"
      mergeCandidate: "eff997be5a4f84171052444708f0ee521d49f113"
    from: "8.10.2"
    to: "9.5.0"
    kotlinDuringStep: "2.4.10"
    jdkDuringStep: "21"
    acceptance: "Complete compile, tests, standalone conformance and governance validation pass on the selected Kotlin/Gradle pair before JDK advancement."
  - id: "JDK"
    status: validated
    validationEvidence:
      status: passed
      workflow: "Flow CI"
      runNumber: 2976
      runId: 32328116587
      exactHead: "dc4a6cf6a3a45a58a8d8194702af3084d71a4ed3"
      mergeCandidate: "659c8d68123487844dcae0d0bfecdb2eb5f540bb"
    from: "21"
    to: "25"
    kotlinDuringStep: "2.4.10"
    gradleDuringStep: "9.5.0"
    acceptance: "Complete exact-head and synthetic merge-candidate compile, tests, standalone conformance and governance validation on JDK 25 before offline refresh may advance."
  - id: "OFFLINE-REFRESH"
    status: planned
    acceptance: "Offline/reproducible build inputs contain Kotlin 2.4.10, Gradle 9.5.0, a JDK 25-capable runtime/toolchain path, wrapper provenance and dependencies needed for trustworthy local validation."

invariants:
  - "The migration changes build tooling only; canonical Flow meaning is byte-for-byte or structurally equivalent wherever the toolchain does not legitimately alter generated build metadata."
  - "Published package, public standard and serialized artifact contract versions do not advance merely because Kotlin, Gradle or JDK changes."
  - "Target support, executable-reference status and adapter evidence are not promoted by a toolchain upgrade."
  - "Compiler, Gradle or JDK diagnostics are resolved at their semantic/configuration source instead of being hidden through global warning suppression."
  - "Kotlin, Gradle and JDK are upgraded as separately diagnosable boundaries; each predecessor must be validated before the next boundary advances."

forbiddenScope:
  - "Do not combine this milestone with External Falsification domain implementation."
  - "Do not combine this milestone with the future multi-module STRUCTURAL-BOUNDARIES split."
  - "Do not perform unrelated Authority refactors, semantic redesigns or target-support expansion."
  - "Do not select RC, beta or unsupported toolchain combinations merely to use a larger version number."
  - "Do not weaken tests, conformance, governance or compiler settings to manufacture a green build."

versionDecision:
  implementationPackage: unchanged
  publicStandard: unchanged
  artifactContracts:
    intent: unchanged
    ast: unchanged
    executionPlan: unchanged
    executionPlanLoweringEvidence: unchanged
    targetManifest: unchanged
    targetRegistry: unchanged
  reason: "Toolchain modernization is an implementation-maintenance axis and does not by itself alter Flow's public semantic or serialized contracts."

completionEvidence:
  - "Kotlin 2.4.10 migration passes exact-head and synthetic merge-candidate full validation before the Gradle boundary advances."
  - "Gradle 9.5.0 migration passes exact-head and synthetic merge-candidate full validation before the JDK boundary advances."
  - "JDK 25 migration passes exact-head and synthetic merge-candidate full validation on Kotlin 2.4.10 and Gradle 9.5.0 before offline refresh advances."
  - "No semantic behavior, public artifact contract or target-support claim changed as a side effect of the migration."
  - "Removed/deprecated Kotlin, Gradle or JDK-facing APIs encountered during migration were intentionally remediated without global suppression."
  - "Clean and warm/incremental build behavior is recorded before and after each toolchain step."
  - "Offline/reproducible build inputs are refreshed for the final Kotlin 2.4.10 / Gradle 9.5.0 / JDK 25 toolchain."
  - "A later distinct lifecycle transition records offline implementation validation and closes this milestone before External Falsification implementation expands the codebase."

localValidation:
  status: pending
  evidence:
    - "JDK 25 is independently validated by Flow CI #2976 exact-head and synthetic merge-candidate boundaries."
    - "Local offline validation remains pending until the reproducible offline cache preparation and isolated --offline verification boundary is implemented and validated."
  rule: "Offline refresh acceptance requires a prepared isolated Gradle home plus a second isolated Gradle home that passes clean test and conformance with --offline on JDK 25."
