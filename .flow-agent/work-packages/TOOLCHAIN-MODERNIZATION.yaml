version: "TOOLCHAIN-MODERNIZATION"
name: "Kotlin and Gradle Toolchain Modernization"
type: "enabling-maintenance"
status: active
stream: "enabling-maintenance"

objective: "Modernize the Flow compiler and build baseline without changing target-neutral semantics, public artifact contracts, target support claims or execution evidence."

authorization:
  status: active
  predecessor: "SI-08"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#enabling-milestone-kotlin-and-gradle-toolchain-modernization"
  rule: "This work package is an orthogonal enabling milestone. It does not reopen the completed semantic-integrity stream and does not activate External Falsification."

activationBasis:
  semanticIntegrityStatus: completed
  semanticIntegrityCompletedItem: "SI-08"
  plannedMilestoneMergeCommit: "bfd879bf208f16f5c7ea6ec87e34f0d5718348fa"
  plannedMilestoneMainValidation:
    workflow: "Flow CI"
    runNumber: 2951
    runId: 31979925759
    head: "bfd879bf208f16f5c7ea6ec87e34f0d5718348fa"
    status: passed

baseline:
  kotlin: "1.9.24"
  gradle: "8.10.2"
  jdk: "21"

selectedTarget:
  kotlin: "2.4.10"
  gradle: "9.5.0"
  jdk: "21"
  selectionDate: "2026-08-17"
  rationale:
    - "Kotlin 2.4.10 is the current stable Kotlin bug-fix release at activation."
    - "The Kotlin Gradle plugin 2.4.10 fully supported Gradle range ends at 9.5.0, so Gradle 9.5.0 is the newest stable Gradle baseline inside the fully supported pair at activation."
    - "Gradle 9.6.1 is newer but is intentionally not selected because it lies outside the Kotlin 2.4.10 fully supported Gradle range."
    - "JDK 21 remains unchanged because neither the selected Kotlin nor Gradle migration requires an unrelated JDK transition."

sequence:
  - id: "KOTLIN"
    status: implemented
    from: "1.9.24"
    to: "2.4.10"
    gradleDuringStep: "8.10.2"
    acceptance: "Complete compile, tests, standalone conformance and governance validation pass without semantic or public-contract drift."
  - id: "GRADLE"
    status: planned
    from: "8.10.2"
    to: "9.5.0"
    kotlinDuringStep: "2.4.10"
    acceptance: "Complete compile, tests, standalone conformance and governance validation pass on the final supported pair."
  - id: "OFFLINE-REFRESH"
    status: planned
    acceptance: "Offline/reproducible build inputs contain the selected compiler, plugins, wrapper and dependencies needed for trustworthy local validation."

invariants:
  - "The migration changes build tooling only; canonical Flow meaning is byte-for-byte or structurally equivalent wherever the toolchain does not legitimately alter generated build metadata."
  - "Published package, public standard and serialized artifact contract versions do not advance merely because Kotlin or Gradle changes."
  - "Target support, executable-reference status and adapter evidence are not promoted by a toolchain upgrade."
  - "Compiler or Gradle diagnostics are resolved at their semantic/configuration source instead of being hidden through global warning suppression."
  - "Kotlin and Gradle are upgraded as separately diagnosable steps; JDK 21 remains fixed unless a separate evidence-backed decision changes it."

forbiddenScope:
  - "Do not combine this milestone with External Falsification domain implementation."
  - "Do not combine this milestone with the future multi-module STRUCTURAL-BOUNDARIES split."
  - "Do not perform unrelated Authority refactors, semantic redesigns or target-support expansion."
  - "Do not select RC, beta or a Kotlin/Gradle combination outside the official fully supported compatibility range merely to use a larger version number."
  - "Do not weaken tests, conformance, governance or compiler settings to manufacture a green build."

versionDecision:
  implementationPackage: unchanged
  publicStandard: unchanged
  artifactContracts:
    intent: unchanged
    ast: unchanged
    executionPlan: unchanged
    executionPlanLoweringEvidence: unchanged
    targetManifest: unchanged
    targetRegistry: unchanged
  reason: "Toolchain modernization is an implementation-maintenance axis and does not by itself alter Flow's public semantic or serialized contracts."

completionEvidence:
  - "Kotlin 2.4.10 migration passes exact-head and synthetic merge-candidate full validation before the Gradle step is treated as clean."
  - "Gradle 9.5.0 migration passes exact-head and synthetic merge-candidate full validation on the final Kotlin/Gradle pair."
  - "No semantic behavior, public artifact contract or target-support claim changed as a side effect of the migration."
  - "Removed/deprecated Kotlin and Gradle APIs encountered during migration were intentionally remediated without global suppression."
  - "Clean and warm/incremental build behavior is recorded before and after each toolchain step."
  - "Offline/reproducible build inputs are refreshed for the selected final toolchain."
  - "A later distinct lifecycle transition records implementation validation and closes this milestone before External Falsification implementation expands the codebase."

localValidation:
  status: pending
  evidence:
    - "No trustworthy full local Gradle PASS is claimed for the Kotlin migration because the current execution environment does not contain the project offline Gradle bundle or an authenticated local checkout."
    - "Isolated Kotlin syntax compilation was used only to reject trivial source/test syntax defects before CI and is not treated as project validation."
  rule: "Kotlin implementation acceptance requires trustworthy exact-head and synthetic merge-candidate Flow CI; localValidation remains pending until the offline/reproducible inputs are refreshed."
