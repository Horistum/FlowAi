  criteria:
    - "Use immutable public Git revisions with explicit redistributable source licenses."
    - "Prefer first-party documentation or source that states orchestration behavior directly rather than examples whose semantics must be guessed from implementation syntax."
    - "Use at least two independent orchestration repositories with materially different task-centric and data-asset-centric models so one engine's graph vocabulary cannot become the standard by accident."
