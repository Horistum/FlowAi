      role: "asset dependency lineage and partition-subset backfill semantics"

initialFalsification:
  expectedShape:
    representable:
      - "TASK_DEPENDENCY_ORDER"
      - "SCHEDULED_CADENCE"
      - "PRODUCED_DATA_IDENTITY"
    modelGaps:
      - "DATA_ASSET_DEPENDENCY"
      - "ASSET_TRIGGER_CONDITION"
      - "RUN_DATA_INTERVAL"
      - "PARTITION_BACKFILL_SELECTION"
      - "CONDITIONAL_BRANCHING"
  expectedCounts:
    representableFacts: 3
    modelGapFacts: 5
  correctionFromImplementationAudit: "The initial 4R/4G hypothesis overclaimed DATA_ASSET_DEPENDENCY. Canonical requires expresses a step dependency, while produces names output identity; there is no canonical relation that identifies which produced data a downstream step consumes. The corrected evaluator therefore preserves the reviewed lineage fact as MODEL_GAP rather than inferring data flow from a single-output producer."
  rule: "The committed baseline records the corrected live evaluator result; expectations and previous green runs never override semantic distinguishability."

requiredOutcomes:
  - "Task dependency order is evaluated through IntentCapabilityValidator and CanonicalIntentMeaning requires edges, including an alternate graph that proves the dependency is semantically distinguishable."
  - "Scheduled cadence is evaluated through canonical IntentSchedule meaning rather than Airflow schedule spelling."
  - "Produced data identity is evaluated through canonical step outputs without treating URI schemes, table names or storage products as universal orchestration semantics."
  - "Data-asset dependency must preserve a relation from the downstream consumer to the specific produced upstream data; a generic producer step dependency is insufficient even for a single-output producer."
  - "A data-aware trigger is not called representable merely because arbitrary trigger params or an opaque event string can echo Airflow/Dagster vocabulary; the authored condition and asset identities must be structurally distinguishable and unrelated provider keys must fail validation."
  - "Run data interval semantics remain distinct from wall-clock start/end timestamps and from the schedule expression that caused the run."
  - "Partition or backfill selection preserves which historical subset is requested; generic rerun, schedule or batch-count parameters are not equivalent."
  - "Conditional branching preserves authored path-selection control flow; static requires edges or description strings are not equivalent meaning."
  - "Every real gap remains explicit evidence; EF-07 does not add capabilities, trigger schema, parameters or effects merely to make the corpus representable."

forbiddenScope:
  - "Do not add or rename StandardCapability values in EF-07."
  - "Do not change CanonicalIntentEffectAuthority mappings in EF-07."
  - "Do not add partition, backfill, data-interval, branch-condition, asset-condition or data-consumption fields to Core in the falsification item."
  - "Do not treat Airflow Dag/task/operator names, Dagster AssetKey/PartitionsDefinition, storage URI schemes, sensors or code-location concepts as universal Core vocabulary."
  - "Do not infer data lineage merely because a downstream step requires a producer that happens to have one output."
  - "Do not claim conditional asset scheduling through an opaque EVENT string or unvalidated trigger params if the logical condition is not preserved as canonical meaning."
  - "Do not collapse branch conditions into static dependency edges or description text."
  - "Do not equate a backfill partition subset with generic batches, retries or repeated scheduled runs."
  - "Do not modify closed EF-01 through EF-06 evidence boundaries."
  - "Do not promote adapter or executable target support from corpus representability."

