version: AI-A3-S3.3
name: Task-driven discovery evaluation with independent review
status: candidate
stream: architecture-recovery
parentWorkPackage: .flow-agent/work-packages/system-automation-direction.yaml
baselineMain: 611e688bcd9ac6e63d6a52de33d33bdae8e46dbf
predecessorPullRequest: 270
deliveryBase: main
authorization: Maintainer merged PR 270 and requested continuation according to the selected roadmap.
objective: Make repeated external-agent discovery trials executable across different goals and source structures, with private expectations, separately reviewed candidates and measurable failures and cost.
universalInvariant: Evaluation cannot supply its expected interpretation to the candidate, approve the candidate on its own, replay an uncertain paid call or turn reported live provenance into proof of generalization.
scope:
- Add a versioned suite of original requests, independently confirmed requirements and complete bounded exposure directories; never require caller source-to-operation mappings or candidate proposals.
- Capture repeated investigation-v3 sessions with a fixed provider/compiler contract and a conservative suite budget.
- Snapshot exposure separately from private expectations and review artifacts; preserve all outcomes, including blocked and incomplete runs.
- Review exact captured runs through the existing discovery-review boundary, without extra model calls or automatic approvals.
- Report compiler acceptance separately from caller-assessed goal fulfillment, discovery quality and constraint violations.
- Supply a public development portfolio with different infrastructure, data and credential goals; accept separately supplied private held-out suites without claiming public examples are unseen.
- Reuse the existing command-reasoning/v2 provider boundary and the optional installed provider from gitops-agent-control-plane; no new provider SDK.
forbiddenScope:
- No new semantic graph, workflow executor, scenario-specific adapter or automatic model judge.
- No answer proposals, hidden requirements, reviewer decisions or expected source selectors in candidate prompts.
- No implicit provider/account selection, credential reuse, unbudgeted trials or automatic replay after interruption.
- No live-model claim from scripted integration tests; absent provider credentials remain an explicit unmet prerequisite.
- No S3, AI-A3, AR-06 or AR-07 closure; EF-09 remains paused.
validationPlan:
- Cross-task and cross-schema installed-host tests using labeled transcripts, plus leakage, source mutation, review substitution, incomplete assessment, budget and interruption regressions.
- Verify captured task-dependent observations and actual independent compiler outcomes rather than counting source reads as success.
- Full Python tooling, architecture checks and exact-head/merge-candidate GitHub CI, preserving existing runtime evidence proofs.
nextSlice: S3-independent-live-trials-and-discovery-gap-remediation
