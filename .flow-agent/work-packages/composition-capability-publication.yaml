invariant: Repository references and provider projection declarations cannot publish runtime certification or authorize execution; plan-scoped mappings remain visibly distinct from target-wide declarations.
architecturePurpose: Correct the targets command's unsupported certification claim and expose current structural mapping scopes from the composed provider catalog.
scope:
- Audit the corrected producer, expression, control and topology boundaries against the remaining AR-06 outcomes.
- Version the repository maturity report to distinguish an executable reference snapshot from authenticated native runtime evidence.
- Remove certification promotion based only on implementation/test file existence and require complete valid reference evidence for reference maturity.
- Publish structural mappings and their scope directly from the composed provider definitions, including plan-scoped compositions.
- Verify actual CLI output, negative reference evidence, provider composition changes and preserved historical/runtime boundaries.
- Repair the observed cross-runtime CI observation race with bounded polling for source-bound GitHub job completion; preserve every provenance and outcome check.
- Retry the observed intermittent Jenkins public metadata HTTP 403 during fixture image setup, with three attempts and unchanged pinned plugins; runtime verdicts are never retried.
nonGoals:
- No Core language, canonical semantics, adapter rendering or generic support promotion.
- No runtime execution, new certification protocol, signed-portfolio expansion or portability claim.
- No rewriting historical acceptance receipts, AR-06 closure, AR-07 activation or EF-09 resumption.
ownershipBoundary:
  adapters: Own repository reference assessment and provider mapping declarations.
  conformance: Own authenticated runtime assessments and independent checks preventing publication overclaims.
testsToAddOrUpdate:
- Complete references, existing unrelated test files and missing evidence cannot manufacture runtime certification.
- Invalid reference scopes cannot retain executable-reference maturity.
- Invalid document kinds/versions invalidate every reference scope; duplicate scope identities invalidate their own assessments without demoting unrelated valid references.
- Projection summaries follow provider removal and support-scope changes without inferring support from target names.
- Both CLI hosts publish report v2 and explicit reference/runtime boundaries.
- Pending GitHub API observations can become final within a finite retry budget; missing, duplicated, unknown or terminally incorrect observations cannot be accepted.
- Plugin installation preserves arguments and failure status, retries only the observed metadata HTTP 403 and stops after three attempts.
validation:
