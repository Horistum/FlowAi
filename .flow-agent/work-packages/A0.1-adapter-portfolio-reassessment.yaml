version: "A0.1"
name: "Adapter Portfolio Reassessment"
type: "adapter-governance"
stream: adapters
status: active
objective: "Reclassify every built-in target against frozen Core contracts and remove any readiness claim that is not backed by registry, provider and end-to-end evidence at the level asserted."
activationEvidence:
  coreItem: "0.9.7.10"
  coreStatus: "completed"
  mergedCorrection: "PR #95 merged as e25a81b9c7e7802556a0d5b34cf34185b19ed498"
universalBoundary:
  - "Adapter evidence may consume frozen Core requirements but cannot redefine canonical meaning, effects, controls, topology or continuity."
  - "Capability profile, native leaf support and end-to-end executability are distinct claims."
  - "Earlier labels have no grandfathered status."
  - "The local semantic reference is not promoted into a production adapter."
forbiddenScope:
  - "No new Core semantic requirement."
  - "No target-specific public DSL or platform identity added to Core contracts."
  - "No renderer implementation added merely to improve portfolio labels."
  - "No executable claim inferred from capability or native-leaf coverage alone."
  - "No mutation of the frozen v0.9.7 Core pre-closure inventory."
completionEvidence:
  - "Every target registry entry has exactly one strict support, limitation and evidence record."
  - "Actual provider composition and native projection rules constrain portfolio classifications mechanically."
  - "Every executable-reference claim resolves to honest committed end-to-end snapshot evidence."
  - "Adapter conformance runs after the Core closure check from a separate committed inventory."
  - "Semantic Core packages have no dependency on adapter portfolio authority."
  - "Flow CI passes exact-head and synthetic merge-candidate validation before completion metadata is authored."
