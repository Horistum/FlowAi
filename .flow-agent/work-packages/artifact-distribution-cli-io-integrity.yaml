architecturePurpose: "Reference distribution owns its packaged contracts and evidence. CLI explicitly selects a resource authority; Core and adapter evidence validators retain their existing semantics."
universalInvariant: "Installed product behavior and contract bytes are independent of the working directory. An explicit external contract root is complete, recorded and fail-closed, never an implicit overlay."
scope:
  include:
    - "A sorted, explicit distribution resource inventory with build-time byte hashes."
    - "ContractResourceResolver for classpath resources and explicit external roots, with per-file provenance."
    - "Private command-scoped materialization for existing File-based validators, with cleanup on success and failure."
    - "Packaged default intent, module and target descriptors, and the evidence required by target authorities."
    - "Both installDist and relocated distZip execution from empty and misleading working directories."
  exclude:
    - "No input-limit or atomic artifact publication implementation; AR-05C and AR-05D retain those responsibilities."
    - "No changed adapter support, runtime execution, verification-class dependency or finding closure."
