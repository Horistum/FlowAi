architecturePurpose: "One frontend-owned I/O policy bounds product inputs, parser complexity, contract collections and encoded CLI output without introducing filesystem dependencies into Core."
universalInvariant: "Oversized inputs and outputs fail within fixed budgets with stable bounded diagnostics before publication starts; accepted bytes preserve source identity."
scope:
  include:
    - "Central InputLimits, bounded stream reads, strict UTF-8 and aggregate collection budgets."
    - "Flow, intent, normalization, descriptors, packaged and external contracts, and adapter witness inputs."
    - "Parser depth, token, alias and collection limits with original strict contract semantics."
    - "Bounded JSON serialization, presentation and complete output batch preflight before filesystem writes."
  exclude:
    - "Atomic publication, actual-byte receipts and write-failure rollback belong to AR-05D."
    - "No target-support promotion, whole-milestone finding closure or downstream activation."
