architecturePurpose: "One product-owned writer stages, forces, re-reads and validates files before atomic directory publication."
universalInvariant: "No published integrity PASS is derived from expected filenames; actual written bytes, schemas, versions, sizes and hashes are checked before the manifest is written last."
scope:
