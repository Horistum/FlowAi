architecturePurpose: "Keep argument syntax in flow-cli, with both product and verification hosts consuming the same parser and command-specific schemas. Parsing completes before file reads, report generation or output writes."
universalInvariant: "An option value never becomes a positional source. Every argument is consumed exactly once or rejected with CLI_INVALID_INPUT before command side effects."
scope:
  include:
    - "One typed flag/value parser with command-specific allowed options and positional bounds."
    - "Both --name value and --name=value, interspersed options and the -- end-of-options delimiter."
    - "Reject unknown, duplicate, empty, missing, conflicting and surplus arguments."
    - "Migrate every built-in product and verification command; preserve the explicit custom-command composition port."
  exclude:
    - "No packaged-resource, default-source, artifact-format or atomic-publication changes in AR-05A."
    - "No milestone finding closure, AR-06/AR-07 activation or EF-09 resumption."
