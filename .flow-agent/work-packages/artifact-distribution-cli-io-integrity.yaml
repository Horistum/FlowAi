    - "Failure cleanup, preserved existing outputs and explicit atomic filesystem support requirements."
  exclude:
    - "AR-05E retains integrated independent closure; no finding closure or downstream activation."
    - "No in-place replacement of nonempty destinations or unconditional crash-durability guarantee."
