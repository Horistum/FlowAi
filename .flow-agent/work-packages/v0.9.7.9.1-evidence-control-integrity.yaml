    evidence:
      - "The permanently empty targetImplications model and report fields are removed."
      - "Canonical module loading continues to reject descriptor-owned target implications."
      - "The unused portable-shell error-handler lowering overload is removed from production source."
  - id: canonical-evidence-refresh
