version: AR-A01
name: Action Result Handler Containment
status: candidate
stream: architecture-recovery
roadmapReference: .flow-agent/roadmap-architecture-recovery.yaml
authorization:
  source: Maintainer requests continuation according to the merged system audit findings.
  predecessorPullRequest: 242
  mergedMain: 19c8a802cce5d9be5bf40478dd513060ca0e5714
  finding: docs/audits/2026-10-20-system-roadmap/README.md (A-01)
invariant: An action with result-handler rules cannot become an accepted compilation or execution plan while those rules have no canonical representation.
architecturePurpose: Contain audit A-01 at the target-neutral compiler and direct planner boundaries before unsupported control intent can authorize an executable artifact.
scope:
- Reject non-empty action result handlers with a stable diagnostic and source location.
- Independently enforce the same support rule at the public planner boundary.
- Retain parsing and AST inspection, empty handler no-ops, ordinary result bindings, standalone result conditions and existing try/workflow failure handlers.
nonGoals:
- No result-handler execution, canonical handler lowering or adapter implementation.
- No repair of audit A-02 through A-06 or target support expansion.
- No runtime executor, SDK, plugin lifecycle, target-specific syntax or schema change.
ownershipBoundary:
  core: Owns the shared unsupported-semantics guard and planning rejection.
  adapters: Unchanged; rejected source cannot obtain compilation-backed authorization.
  conformance: Exercises real source compilation and direct planning, including negative cases and positive controls.
