version: "0.9.7.9.10"
name: "Target Selection Provenance and CLI Status Integrity"
type: "bounded-correction"
stream: core
status: active
parentCoreItem: "0.9.7.9"
objective: "Remove the dead CLI projection facade, prevent derived target reports from being relabeled as explicit configuration, and derive CLI process status from typed outcomes."
scopeBoundary:
  - "Delete the duplicate org.flowlang.cli TargetManifestGenerationPipeline facade and prove its compiled class is absent."
  - "Keep the canonical org.flowlang.generators.manifest TargetManifestGenerationPipeline as the only production materialization pipeline."
  - "Represent reference-snapshot, conformance and test configuration sources through a closed typed vocabulary."
  - "Reject arbitrary or CLI-derived source labels before explicit-configuration selection evidence is issued."
  - "Keep TargetSelectionOrigin closed to CLI_OPTION, INTENT_DECLARATION and EXPLICIT_CONFIGURATION."
  - "Derive successful, review-required, blocked, invalid-input and internal-error process status from sealed CLI outcomes."
  - "Remove caller-supplied exit codes from successful CLI results."
  - "Preserve package, public-standard and artifact contract versions."
universalInvariants:
  - "An analytical compatibility or readiness report cannot become target-selection provenance."
  - "Only one compiled production target-manifest generation pipeline exists."
  - "Blocked CLI evidence never returns a successful process status."
  - "A completed CLI result cannot carry a caller-authored process status."
implementedSlices:
  - id: dead-cli-composition-removal
  - id: typed-explicit-configuration-source
  - id: target-selection-origin-closed-set
  - id: target-selection-classpath-integrity
  - id: derived-cli-process-status
  - id: target-provenance-status-conformance
validationPolicy:
  workflow: "Flow CI"
  requirement: "The public pull-request head and its synthetic merge candidate must independently pass Flow Agent tooling, repository structure, complete tests and standalone conformance before this correction may become complete."
  buildDiscipline: "Keep 0.9.7.9 correction-required and 0.9.7.10 blocked until implementation evidence and a later completion-metadata head each pass exact-head and merge-candidate validation."
followUpWorkItem:
  version: "0.9.7.10"
  name: "Bounded Semantic Closure Gate"
