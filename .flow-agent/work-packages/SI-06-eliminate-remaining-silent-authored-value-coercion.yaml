version: "SI-06"
name: "Eliminate Remaining Silent Authored-Value Coercion"
type: "semantic-integrity-correction"
stream: semantic-integrity
status: active
objective: "Eliminate parser and source-loading paths where an explicitly authored malformed or unknown value is silently converted into a default or different semantic value; defaults remain valid only for genuinely omitted values."

authorization:
  status: active
  source: "Semantic-integrity roadmap transition after independently validated and merged SI-05 completion."
  predecessor: "SI-05"
  strategicSource: "docs/PROJECT_DIRECTION_AFTER_C1_0.md#16-eliminate-remaining-silent-authored-value-coercion"

invariant:
  - "Every explicitly authored value is either preserved with its intended typed meaning or rejected with an explicit diagnostic; it is never silently replaced by a default or alternate value."
  - "Parser defaults apply only when the corresponding authored value is absent."
  - "Malformed booleans, numbers, enums and symbolic scalar values cannot become false, zero, empty text, a default enum member or another accepted value merely because conversion failed."
  - "Diagnostics identify the rejected source location and the semantic field or parser boundary whenever that identity is available."
  - "Valid previously accepted authored values and intentional omission defaults remain behaviorally stable unless independent evidence proves a separate defect."

scope:
  - "Inventory production parser and source-loading boundaries that assign defaults, use nullable casts, equality-to-one-valid-literal checks or fallback branches after an authored token or value is already present."
  - "Begin with the confirmed FlowParser parallel failFast defect where any identifier other than true is currently coerced to false instead of being rejected."
  - "Fix only evidence-confirmed instances of the same authored-value coercion class across the .flow parser and canonical source-loading boundaries."
  - "Preserve the already fail-closed retry policy behavior and use it as a quality reference for path-aware diagnostics."
  - "Add systematic or property-style negative tests that separate omission from explicit valid values and malformed authored values, rather than relying only on hand-picked happy paths."
  - "Audit each corrected boundary for downstream semantic and serialization impact before deciding artifact-version consequences."

forbiddenScope:
  - "Do not implement Track 1.7 public-schema validity alignment; schema/loader agreement belongs to SI-07 unless a narrow test fixture must be adjusted to reflect an already-correct parser contract."
  - "Do not implement Track 1.8 typed policy or state-lifetime redesign."
  - "Do not broaden accepted syntax by normalizing unknown authored values into known ones."
  - "Do not change omission defaults merely to make malformed-value tests pass."
  - "Do not rewrite the parser architecture wholesale when a smaller typed fail-closed boundary owns the invariant."
  - "Do not introduce target, provider or adapter-specific interpretation into Core parsing."
  - "Do not rewrite historical SI-01 through SI-05, C1.0, AR0.1 or Core closure evidence."

inventoryDecision:
  confirmedCorrections:
    - "FlowParser.parseParallel: explicit failFast identifiers other than true were converted to false; parse only true/false and reject all other present values at the authored token."
    - "FlowYaml.readStrict: Jackson scalar coercion remained enabled for strict typed documents, allowing examples such as integer 1 -> boolean true and numeric/boolean scalars -> text."
    - "TargetRegistryYamlLoader: the public target-registry loader used lenient typed YAML deserialization, so scalar coercion and unknown-property dropping bypassed the intended typed contract."
  reviewedNoChange:
    - "FlowParser.parseRetry already distinguishes omission defaults from present malformed values, rejects duplicates and unknown keys, and remains the diagnostic quality reference."
    - "IntentYamlLoader performs explicit structural/type validation and path-aware boolean/enum rejection before constructing canonical intent."
    - "CanonicalModuleLoader validates public module YAML before the internal ModuleYamlLoader decoder; coercive decoder helpers are not reachable as an unvalidated public loading path."
    - "CanonicalNotesPackageLoader and AdapterTriggerEvidenceLoader already reject malformed typed values and unknown structure explicitly."
    - "FlowParser.parseSafety is not changed because a bare expression can represent an authored conditional safety expression; no evidence proves that branch is failed conversion or default substitution."
  deferred:
    - "Public schema-versus-loader acceptance agreement remains SI-07. SI-06 does not expand target-registry schema definitions merely to mirror the stricter production loader."

versionDecision:
  publicStandard: unchanged-0.8.0
  artifactContracts:
    intent: unchanged-2.0
    ast: unchanged-2.2
    executionPlan: unchanged-2.3
    executionPlanLoweringEvidence: unchanged-2.1
    targetManifest: unchanged-3.0
    targetRegistry: unchanged-3.1
  reason: "SI-06 changes neither serialized artifact shape nor intended valid semantic vocabulary. It rejects malformed scalar representations and unknown authored fields that reached typed contracts only through implementation-level coercion or leniency. TargetRegistry 3.1 remains the same typed serialized contract; its incomplete public schema acceptance surface is deliberately left for SI-07."

acceptanceEvidence:
  - "parallel failFast omission retains its documented default, explicit true remains true, explicit false remains false, and malformed identifiers fail with a source-located parse diagnostic."
  - "The audited production boundaries contain no evidence-confirmed path where a present malformed authored value is converted into a default or alternate semantic value."
  - "Systematic negative tests exercise malformed boolean, scalar or enum inputs for every corrected coercion boundary and prove both acceptance and rejection polarity."
  - "Existing valid parser behavior, retry fail-closed behavior and target-neutral canonical meaning remain stable outside the reviewed corrections."
  - "Any public contract-version decision is documented from actual accepted-input or serialized impact rather than assumed from roadmap scope."
  - "Full compile, tests, standalone conformance and Flow Agent validation pass before completion."

localValidation:
  status: pending
  evidence:
    - "The offline sandbox copies of FlowParser.kt, FlowYaml.kt and TargetRegistry.kt were hash-verified byte-identical to main before applying SI-06 changes."
    - "A standalone Kotlin harness compiled the modified production FlowYaml.kt against the cached Jackson 2.17.2 runtime and proved omission defaults remain stable while integer/boolean-to-text, integer-to-boolean, quoted-text-to-boolean and float-to-integer coercions fail."
    - "The offline Gradle production compile reached :compileKotlin without reporting a compiler error but exceeded the available execution window, so no full compile PASS is claimed."
    - "The offline Gradle test attempt could not resolve kotlin-test/JUnit artifacts absent from the supplied cache and therefore did not start test compilation; this is an environment limitation, not a test result."
  rule: "The status remains pending because the lifecycle contract reserves passed for complete local validation; partial attempted evidence is retained above without impersonating a local PASS. SI-06 remains active until the final implementation head receives independent Flow CI exact-head and synthetic merge-candidate validation and is merged; a later completion transition records that boundary."
