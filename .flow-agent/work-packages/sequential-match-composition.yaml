testsToAddOrUpdate:
- Alternating nested controls, branch positions, task counts, independent siblings and different native leaves.
- Lexical capture through selected, unselected and default branches; unsupported policies and missing continuity.
- Forged manifest branches, payloads and nested policies cannot bypass applicability.
- Independent native selection, retry ownership, loop order and multiplicity, empty and default routing, failure exhaustion.
conformanceToAddOrUpdate:
- Extend existing match producer and same-attempt composition replay; preserve signed portfolio assessments.
