version: AR-06AE-C11
name: Exclusive Selection in Sequential Control Composition
status: candidate
stream: architecture-recovery
roadmapReference: .flow-agent/roadmap-architecture-recovery.yaml#AR-06
authorization:
  source: Maintainer confirms the predecessor merge and requests continued roadmap implementation.
  predecessorPullRequest: 238
  mergedMain: 8a4ae19e1c9b34e353dd877dd63adaa8c9345774
invariant: Exclusive selection preserves exactly one authored branch inside retries and finite loops; retry ownership, iteration order, lexical bindings and failure propagation survive arbitrary supported sequential nesting.
architecturePurpose: Replace the separate match body allowlist with the same adapter-owned recursive contract used by retry and loop, without redefining canonical control semantics.
scope:
- Compose literal exclusive match with fixed zero-delay retry, finite string iteration, conditions and independently materialized leaves.
- Carry lexical scope through every branch and revalidate caller-supplied manifests.
- Extend source-derived match observations and independent replay with both retry nesting directions, iteration, default and empty selection, and falsifying mutants.
nonGoals:
- No Core, public DSL, runtime executor or target-wide support changes.
- No dynamic match or collection, nonzero retry delay, error branches, parallel interaction or value exports.
- No signed portfolio expansion, portability claim, historical evidence rewrite or AR-06 closure.
ownershipBoundary:
  core: Existing canonical control, value, continuity and failure contracts remain authoritative.
  adapters: Own recursive native applicability and lexical scope validation, independent of fixture identity or cardinality.
  conformance: Independently derive selection and invocation expectations from source and verify observed native behavior.
