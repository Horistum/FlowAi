version: AR-06AB
name: Jenkins Secret Condition Binding Certification
status: candidate
stream: architecture-recovery
roadmapReference: .flow-agent/roadmap-architecture-recovery.yaml#AR-06
authorization:
  source: Maintainer requests the next roadmap slice after merging PR 224.
  predecessorPullRequest: 224
  mergedMain: dbeb803267eec8a5f2dc4d1203534ff48d5b8f5e
invariant: Jenkins condition secret references resolve the exact authored credential identities through the same
  environment mapping as their bindings, with native positive and falsifying observations.
scope:
- Collect typed secret references from condition expressions, preserving identities and rejecting environment-name
  collisions.
- Render Jenkins secret expressions with the same environment mapping used by credential bindings.
- Execute a compiler-rendered condition over two disposable string credentials on real isolated Jenkins, with omitted
  and substituted binding mutants.
- Observe native checkout count, workspace marker, binding identities and absence of fixture canaries in build logs;
  authenticate and replay all observations in the portfolio.
nonGoals:
- No generic secrets support, masking/security certification, credential authorization, rotation, external secret
  store, value/state continuity or portable-execution promotion.
- No Core semantics, public syntax/version, historical acceptance, finding closure, AR-06 closure, AR-07 activation
  or EF-09 resumption.
ownershipBoundary:
  adapters: Own exact credential environment mapping and condition expression projection.
  conformance: Own disposable runtime fixtures, independent observations, authentication and publication.
expectedFilesToChange:
- src/main/kotlin/org/flowlang/generators/JenkinsGroovyExpr.kt
- src/main/kotlin/org/flowlang/targets/builtin/JenkinsManifestRenderer.kt
- src/main/kotlin/org/flowlang/conformance/JenkinsCheckoutRuntimeCertification.kt
- src/main/kotlin/org/flowlang/conformance/AdapterBehaviorMatrix.kt
- src/main/kotlin/org/flowlang/conformance/AdapterCertificationPortfolio.kt
- flow-adapter-jenkins/src/runtimeTest/run.groovy
- .github/workflows/adapter-runtime-check.yml
testsToAddOrUpdate:
- Typed condition secret traversal, exact environment mapping and collision rejection.
- Compiler-bound artifacts and distinguishable omission/substitution mutants.
- Invalid bindings, leaked canaries, malformed observations, forged or incomplete receipts fail closed.
- Historical lifecycle evidence and finding ownership remain enforced.
documentationToUpdate:
- docs/migrations/adapter-certification-bundle.md
- .flow-agent/reports/jenkins-secret-condition-certification.md
validation:
  status: current-revision-ci-required
  requiredChecks:
  - compile-test-conformance
  - merge-candidate-compile-test-conformance
  - jenkins-checkout-runtime
  - jenkins-failure-runtime
  - jenkins-condition-runtime
  - jenkins-error-boundary-runtime
  - jenkins-local-recovery-runtime
  - jenkins-approval-runtime
  - github-actions-checkout-runtime
  - jenkins-shared-checkout-runtime
  - jenkins-retry-runtime
  - jenkins-loop-runtime
  - jenkins-match-runtime
  - jenkins-parallel-runtime
  - adapter-certification-portfolio
  - jenkins-shared-condition-runtime
  - github-actions-condition-prepare
  - jenkins-secret-condition-runtime
  - github-actions-condition-runtime
  negativeEvidence: Missing or substituted credential bindings cannot reproduce the positive native observation;
    declarations and synthetic test records cannot replace native execution.
followUp:
- Extend behavioral evidence only with separately bounded native scenarios and falsifying mutants.
- Keep general secret security and value/state continuity obligations explicit and AR-06 active.
