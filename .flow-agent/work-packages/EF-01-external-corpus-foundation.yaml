requiredOutcomes:
  - "Every external corpus case records immutable repository/revision/path/license provenance."
  - "Every captured source is bound to the exact admitted bytes by SHA-256."
  - "Authored behavior observations remain separate from expected Flow semantic observations."
  - "Every semantic observation references concrete authored-behavior evidence rather than implementation-token heuristics."
  - "Every case explicitly records unsupported facts, including an empty list when none are identified."
  - "Path traversal, mutable revisions, digest drift, malformed evidence and invented behavior references fail closed."
  - "FOUNDATION contains no domain evidence cases; EVIDENCE_ACTIVE requires at least one admitted case."
  - "The repository-level external corpus manifest remains in FOUNDATION state with no domain evidence fabricated by EF-01."

implementation:
  contracts: "src/main/kotlin/org/flowlang/conformance/ExternalCorpusContracts.kt"
  loader: "src/main/kotlin/org/flowlang/conformance/ExternalCorpusLoader.kt"
  manifest: "conformance/corpus/external/manifest.yaml"
  tests: "src/test/kotlin/ExternalCorpusLoaderTests.kt"
  conformanceCheck: "conformance.ef-01.external-corpus-foundation"

invariants:
  - "External source syntax is evidence, never semantic authority."
  - "A pinned upstream revision and captured-byte digest identify what was actually reviewed."
  - "Open-ended external domain labels remain conformance evidence and do not extend Core taxonomy."
  - "FOUNDATION is schema/loader readiness, not a representability or target-support claim."
  - "C0.1 and C1.0 corpora remain immutable historical evidence boundaries."
  - "No public artifact-contract version advances in EF-01."

forbiddenScope:
  - "Do not implement EF-02 through EF-09 domain cases in EF-01."
  - "Do not infer StandardCapability or semantic-effect identity from upstream keywords."
  - "Do not reuse RealWorldDomain as the External Falsification domain taxonomy."
  - "Do not modify frozen C0.1 or C1.0 corpus manifests or inventories."
  - "Do not promote target materialization or executable support."
  - "Do not add an Authority solely to own this ingestion contract."

completionEvidence:
  - "Production loader accepts the repository FOUNDATION manifest while rejecting FOUNDATION manifests that contain evidence cases."
  - "Tests prove valid ingestion plus digest tampering, typed evidence-range validation, case-package traversal, provenance traversal, mutable revision and invented-behavior rejection."
  - "Standalone conformance contains and passes the EF-01 foundation check."
  - "Flow CI #2994 passed the distinct implementation boundary and #2995 passed the later evidence-bearing validation boundary."
  - "Flow CI #2997 passed exact-head and synthetic merge-candidate test plus standalone conformance after final contract hardening."
  - "EF-02 remains unactivated and requires its own distinct transition."

