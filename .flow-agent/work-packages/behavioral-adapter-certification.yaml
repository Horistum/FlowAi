selectedSlice: "AR-06P"
selectedWorkPackage: ".flow-agent/work-packages/jenkins-retry-certification.yaml"
acceptedSlices: ["AR-06A", "AR-06B"]
invariant: "A bounded retry preserves its authored total attempt limit, stops after a successful body and propagates the final failure without executing its successor."
scope:
  - "Freeze source, canonical graph and actual rendered artifact at the existing compiler and adapter authority boundary."
  - "Require exact scenario bindings and derive per-scenario semantic, structural and native-leaf occurrence coverage."
  - "Authenticate every observation against caller-owned runner keys, assessment challenge and exact run inventory."
  - "Accept AR-06B against independently verified PR and actual-main receipts while preserving every historical acceptance gate."
  - "Retain compiler-owned workflow failure-boundary occurrences and independently observe handler routing and terminal error origin."
  - "Observe bounded local recovery, skipped failed-body successors and continuation independently on real Jenkins."
  - "Observe a pending manual input, approval and rejection before one protected checkout, including omitted, late and suppressed-rejection mutants."
  - "Expose baseline and mutant observations together, with explicit missing construct evidence and no support inference."
  - "Aggregate reauthenticated current-revision scenarios into one honest reference adapter portfolio."
  - "Execute the compiler-rendered GitHub Actions native checkout leaf with omitted and substituted revision mutants on a hosted runner."
  - "Include the second adapter in the complete source-bound portfolio while preserving native-leaf scope and distinct canonical fixtures."
  - "Execute one shared canonical native checkout scenario on both providers and compare authenticated baseline and mutant observations."
  - "Certify native fixed zero-delay Jenkins retry with exact exhaustion and early-success observations and falsifying attempt mutants."
nonGoals:
  - "No product runtime execution, general semantic adequacy or portable-execution claim."
  - "No support promotion, finding closure, public version change or EF-09 resumption."
ownershipBoundary:
  production: "Adapter-owned fixed zero-delay retry rendering and scoped capability; Core unchanged."
  semanticKernel: unchanged
  concreteAdapters: "Jenkins retry only; generic target registry unchanged."
  conformance: "Lifecycle validation and real-provider integration tests."
validation:
  status: current-revision-ci-required
  requiredChecks:
  - compile-test-conformance
  - merge-candidate-compile-test-conformance
  - jenkins-checkout-runtime
  - jenkins-failure-runtime
  - jenkins-condition-runtime
  - jenkins-error-boundary-runtime
  - jenkins-local-recovery-runtime
  - jenkins-approval-runtime
  - github-actions-checkout-runtime
  - jenkins-shared-checkout-runtime
  - jenkins-retry-runtime
  - adapter-certification-portfolio
  negativeEvidence: Flattened retry, changed attempt limit, repeated successful body, omitted body, wrong terminal failure,
    continued execution after exhaustion and altered signed observations.
followUp:
  - "Adapter-owned behavioral scenarios and external runner integration for Jenkins and GitHub Actions."
  - "Construct/target/behavior/mutant matrix and equivalent execution on two materially different adapters."
  - "Evidence-derived public views with separate profile, leaf and scenario claims."
