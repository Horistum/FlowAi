version: "AR-06"
name: "Behavioral Adapter Certification and Honest Target Portfolio"
status: active
stream: architecture-recovery
roadmapReference: ".flow-agent/roadmap-architecture-recovery.yaml#AR-06"
authorization:
  source: "Maintainer requests the next roadmap step after merging PR #199."
