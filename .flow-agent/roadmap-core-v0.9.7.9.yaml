project: Flow Core
stream: core
roadmapVersion: 5
track: v0.9.7-universal-semantic-foundation
status: active
trackObjective: Complete the universal semantic foundation with continuous reference evidence.
continuousFeedback:
  - Every Core item runs the existing reference and regression suite.
  - A failed claim is repaired at its owner or explicitly reclassified.
  - Core meaning is never weakened to preserve an earlier label.
trackExitCriteria:
  - Evidence for 0.9.7.1 through 0.9.7.9 passes after all active bounded corrections complete.
  - 0.9.7.10 checks only declared evidence and cannot start while a correction is active.
items:
  - version: 0.9.7.0
    name: Roadmap Separation and Universal Drift Lock
    type: architecture-governance
    status: completed
    purpose: Separate planning ownership and dependency direction.
    universalInvariant: Core contracts advance independently from implementation coverage.
    forbiddenScope:
      - No production behavior change.
    completionEvidence:
      - Stream structure and dependency direction tests pass.
  - version: 0.9.7.1
    name: Governance Signal Integrity
    type: validation-honesty
    status: completed
    purpose: Make governance scope, status and scoring truthful.
    universalInvariant: Governance results match the property measured.
    forbiddenScope:
      - No broad source exclusion, inverted status or unused score.
    completionEvidence:
      - Behavioral fixtures and the final verification suite pass.
  - version: 0.9.7.2
    name: Canonical Module and Notes Authority
    type: contract-authority
    status: completed
    purpose: Create one strict source of semantic and safety contracts.
    universalInvariant: Every capability and safety contract has one authority.
    forbiddenScope:
      - No duplicate defaults or permissive malformed conversion.
    completionEvidence:
      - Registry construction loads one complete strict descriptor directory.
      - Every public module load path uses the canonical validator.
      - Unknown fields, malformed shapes, duplicate identities and dependency cycles fail closed.
      - Explicit approval and destructive safety requirements survive production loading.
      - Implementation-owned evidence is excluded from Core descriptors.
      - Core notes load from one versioned manifest and preserve the declared dependency chain.
      - Flow CI 1586 passed full tests, conformance and reference evidence on the implementation head.
  - version: 0.9.7.3
    name: Mandatory Materialization Authority
    type: validation-authority
    status: completed
    purpose: Make planning validation mandatory before projection.
    universalInvariant: Invalid planning evidence cannot reach an implementation boundary.
    forbiddenScope:
      - No alternate public bypass.
    completionEvidence:
      - Every public production projection path requests an unforgeable authorization from one materialization authority.
      - Execution candidates fail before provider invocation when structural or capability evidence is invalid.
      - Diagnostic evidence remains structurally validated, registry-derived and explicitly non-executable when blocked.
      - Semantic graph, materialization negotiation, projection plan and artifact authority alignment fail closed.
      - The optional projection helper and duplicate planner capability gate are removed.
      - Negative tests prove invalid plans do not invoke target generators.
      - Flow CI 1643 passed clean compilation, full tests, conformance and executable reference evidence on implementation head eff81da4f9c1aff90da30864092f884d71e73e24.
  - version: 0.9.7.4
    name: Universal Dependency and Continuity Contract
    type: semantic-dependencies
    status: completed
    purpose: Distinguish ordering from data and state continuity.
    universalInvariant: Ordering never implies continuity.
    forbiddenScope:
      - No renderer assumption as continuity evidence.
      - No hidden workspace or state transfer.
      - No target-specific dependency syntax in Core contracts.
    completionEvidence:
      - Execution plans carry typed ordering, value, workspace and state relations.
      - Module contracts declare continuity providers, requirements and preservation rules.
      - Direct and preserved continuity paths resolve explicitly; missing and ambiguous paths remain blocking evidence.
      - Materialization authorization reloads canonical module contracts and rejects omitted or forged continuity claims.
      - Target compatibility derives from explicit continuity capabilities rather than renderer layout.
      - Legacy dependencies fields are retained only as compatibility projections of dependsOn and are mechanically rejected when they diverge.
      - GitHub Actions reference evidence is blocked where workspace transfer is not represented explicitly.
      - Canonical snapshot generation replaced stale committed evidence file for file.
      - Flow CI 1695 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head 64393255468089b44c229361524abfc24157d487.
  - version: 0.9.7.5
    name: Canonical Intent Meaning
    type: semantic-contract
    status: completed
    purpose: Separate canonical meaning from explicit binding.
    universalInvariant: Equivalent intent has equivalent meaning across inventories.
    forbiddenScope:
      - No implicit binding selection.
      - No implementation identity in canonical meaning.
      - No target capability inventory as semantic authority.
    completionEvidence:
      - Canonical intent meaning is derived before and independently from binding resolution.
      - Equivalent intent remains identical across distinct module and target inventories.
      - Explicit uses declarations produce separate binding evidence with provenance and resolution status.
      - Module actions declare the standard capabilities they implement through strict canonical contracts.
      - Unbound standard intent lowers to standard semantic work without selecting a preferred module.
      - Binding metadata cannot enter canonical meaning or silently become a semantic target.
      - Canonical reference snapshots were regenerated through the production generator.
      - Flow CI 1719 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head eed684e9996680f9abc6c4348c8747e332c1e6c9.
  - version: 0.9.7.6
    name: Universal Effect and State Transition Model
    type: semantic-effects
    status: completed
    purpose: Model resource reads and state changes consistently.
    universalInvariant: Effects remain stable across implementations.
    forbiddenScope:
      - No implementation-name inference.
      - No target inventory as effect authority.
      - No ordering or continuity relation treated as a state transition.
      - No serializer framework as a Core semantic dependency.
    completionEvidence:
      - Canonical intent capabilities derive target-neutral typed effects before binding resolution.
      - AST and execution-plan nodes preserve domain, operation, resource and state-transition evidence.
      - Software delivery, data transformation and infrastructure state change share one effect vocabulary.
      - Module effect buckets convert to the shared model without inferring semantic domains from implementation identities.
      - Materialization authorization re-derives canonical effects and rejects omitted, duplicated or forged evidence.
      - Legacy string effects remain a derived resource projection rather than a second semantic authority.
      - Serialized effect evidence contains only declared semantic fields and Core remains serializer-independent.
      - Canonical reference snapshots were regenerated through the production generator while the Jenkins executable proof remained live.
      - Flow CI 1756 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head af921b5ceb1f5e15c9f6a152a7291003817f8134.
  - version: 0.9.7.7
    name: Universal Control and Policy Requirements
    type: control-and-safety
    status: completed
    purpose: Represent control and safety as independent requirements.
    universalInvariant: Control meaning is implementation-independent.
    forbiddenScope:
      - No unknown evidence treated as safe.
      - No policy declaration treated as proof that its control exists.
      - No target inventory or renderer layout as control authority.
      - No semantic effect treated as implicit approval or policy evidence.
      - No collapsed requirement, evidence and authorization decision.
    completionEvidence:
      - Canonical intent derives target-neutral control requirements before implementation binding.
      - Requirements, evidence and authorization decisions use separate typed contracts.
      - Known, unknown, unsatisfied and dynamic evidence remain explicit through AST and execution planning.
      - Module contracts may add control obligations but cannot rewrite canonical intent requirements.
      - Materialization re-derives canonical and module-owned requirements and rejects omitted, forged or unresolved evidence.
      - Dynamic evidence declares explicit enforcement capabilities and remains pending rather than silently safe.
      - Approval policies no longer count as approval evidence without an authored approval mechanism.
      - Legacy safety validators remain compatibility facades over one canonical control authority.
      - Canonical reference snapshots were regenerated through the production generator while the Jenkins executable proof remained live.
      - Flow CI 1787 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head b0cac07630df7270912c2db0fb528d5f6ed663a3.
  - version: 0.9.7.8
    name: Abstract Execution Topology Model
    type: topology-contract
    status: completed
    purpose: Describe isolation, lifetime, persistence and propagation.
    universalInvariant: Executability requires matching plan and topology evidence.
    forbiddenScope:
      - No action-only readiness proof.
      - No renderer layout or target inventory as topology authority.
      - No ordering or continuity relation treated as a complete execution environment.
      - No target-specific execution syntax in Core contracts.
    completionEvidence:
      - Canonical intent derives inventory-independent topology requirements before binding resolution.
      - AST and execution-plan artifacts preserve isolation, lifetime, persistence and propagation requirements.
      - Target Registry 3.1 requires complete evidence-backed topology profiles for every target.
      - Missing, partial, unsupported and contradictory target topology evidence blocks executable materialization.
      - Materialization independently re-derives canonical workflow and capability topology from retained source provenance.
      - Action support, ordering and continuity evidence cannot substitute for an execution topology match.
      - Complete, missing, forged and contradictory profiles are tested through unit and conformance evidence.
      - Canonical reference snapshots were regenerated while the Jenkins executable proof remained live.
      - Flow CI 1811 passed Flow Agent checks, clean compilation, full tests, conformance and reference evidence on implementation head ba7e90cad6efe92fb929f13475fa8f3409fd3ef1.
  - version: 0.9.7.9
    name: Intent Lowering and Diagnostic Honesty
    type: lowering-integrity
    status: correction-required
    purpose: Preserve or diagnose every meaningful input.
    universalInvariant: Accepted information never disappears silently.
    forbiddenScope:
      - No source-form enforcement difference.
      - No accepted field or value dropped without diagnostic evidence.
      - No malformed declaration converted into empty or default meaning.
      - No unsupported policy or workflow shape flattened into a weaker contract.
    completionEvidence:
      - The original implementation evidence remains historical but is insufficient for closure.
      - Bounded corrections 0.9.7.9.1 through 0.9.7.9.7 repaired confirmed lowering, identity, approval, governance and release defects.
      - Active correction 0.9.7.9.8 must repair remaining safety, governance, CLI, topology and adapter integrity blockers.
      - The item may return to completed only after exact-head CI proves the correction and reference evidence.
  - version: 0.9.7.10
    name: Bounded Semantic Closure Gate
    type: architecture-closure
    status: blocked
    purpose: Verify declared evidence with a finite checklist.
    universalInvariant: The track closes by falsifiable evidence.
    forbiddenScope:
      - No new requirement introduced during closure.
      - No closure execution while a bounded correction is active.
    completionEvidence:
      - The declared checklist and reference evidence pass after all correction work packages are complete.
