retiredNow:
- symbol: BuiltInProjectionPayloadKinds
  decision: Removed unused global payload registry. Each concrete adapter owns its private identifiers; wire values
    are unchanged.
- symbol: ProjectionTarget
  decision: Removed shared platform-switch enum; concrete adapters supply ProjectionValueSyntax.
- symbol: TargetProjectionContext
  decision: No staged unguarded context remains. Concrete generators consume the existing checked TargetProjectionAuthorization.
- symbol: StandardSurface implicit ReferenceTargetProjections native-catalog default
  decision: Removed. Callers must supply catalogs; ReferenceStandardArtifacts is the explicit reference composition.
- symbol: Product CLI direct ConformanceRunner / StandardReleaseAssemblyAuthority calls
  decision: Removed. VerificationCli owns those commands; the product executes only a statically supplied typed
    command catalog.
- symbol: Root production Kotlin compilation
  decision: Removed. The build root is an aggregate with separate product and verification runtime profiles, no
    implementation sources and no root JAR.
