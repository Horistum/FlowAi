    owner: "flow-adapter-runtime:testFixtures"
    decision: "Retain actual white-box regression access in test variants only; AR-07 audits necessity. Production classpath gates reject test-fixture variants."
  - symbol: "RenderingEvidenceTestFixture"
    owner: "flow-adapter-evidence:testFixtures"
    decision: "Retain receipt mutation tests without widening the production integrity owner; AR-07 audits necessity."
retiredNow:
