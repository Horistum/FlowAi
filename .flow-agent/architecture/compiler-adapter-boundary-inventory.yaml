    owner: "flow-adapter-runtime"
    decision: "Retain strategy-based traversal and neutral validation; target syntax remains concrete-owned. Review package relocation at AR-03D and AR-07."
  - symbol: "GitHubActionsProjectionInspection"
    owner: "flow-adapter-github-actions"
    decision: "Retain a non-authorizing read-only adapter observation API; internal condition/trigger helpers remain internal. Review at AR-07."
