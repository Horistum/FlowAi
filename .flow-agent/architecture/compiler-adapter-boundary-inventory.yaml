    path: "src/main/kotlin/org/flowlang/targets/builtin/BuiltInTargetProjections.kt"
    owner: "flow-reference-distribution"
    reason: "Retained source-compatible catalog/pipeline facade delegates to the actual reference composition."
    removalTarget: "AR-07"
    exit: "Conformance and external callers use explicit catalogs or ReferenceTargetProjections; migrate historical source anchors before deletion."
  - symbol: "BuiltInNativeProjectionCatalogs"
    path: "src/main/kotlin/org/flowlang/targets/builtin/BuiltInNativeProjectionCatalogs.kt"
    owner: "flow-reference-distribution"
    reason: "Retained names delegate to provider-owned native catalogs; concrete modules never import the facade."
    removalTarget: "AR-07"
    exit: "Callers use the selected provider catalog and historical evidence anchors have migrated."
  - symbol: "TargetExpressionTranslator"
    path: "src/main/kotlin/org/flowlang/targets/builtin/TargetExpressionTranslator.kt"
    owner: "flow-reference-distribution"
    reason: "Deprecated source facade forwards to separately compiled concrete translators."
    removalTarget: "AR-07"
    exit: "Remaining conformance and test callers use the concrete translator or adapter-facing inspection API."
  - symbol: "CompatibilityMaterializationBoundary"
    path: "src/main/kotlin/org/flowlang/materialization/CompatibilityMaterializationBoundary.kt"
    owner: "flow-adapter-runtime"
    reason: "Deprecated bridge preserves retained CLI diagnostic and conformance raw-plan requests across module boundaries; all original planning, graph, capability, control and topology gates remain mandatory."
    removalTarget: "AR-07"
    exit: "Replace retained raw-plan evidence consumers with CompilationUnit-bound requests, then remove the bridge and original internal compatibility factories."
  - symbol: "ReferenceAdapterEvidence.portfolio.compositionEvidenceReference"
    path: "src/main/kotlin/org/flowlang/distribution/reference/ReferenceAdapterEvidence.kt"
    owner: "flow-reference-distribution"
    reason: "The reference distribution explicitly supplies the historical facade path cited by versioned portfolio evidence; generic validation no longer hardcodes it."
    removalTarget: "AR-07"
    exit: "Migrate versioned portfolio anchors to the direct reference composition before deleting its historical facade."
retainedPublicBoundaries:
