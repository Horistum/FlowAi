project: Flow Conformance
stream: conformance
roadmapVersion: 8
status: active

purpose: "Maintain bounded independent evidence for universal contracts and implementation behavior."

rules:
  - "The C0.1 domain vocabulary closes only C0.1 evidence scope, not the universe of automation domains."
  - "Concrete source workflows are evidence inputs, never semantic authorities."
  - "Every accepted case declares exactly one bounded domain and immutable source provenance."
  - "Every bounded domain has at least one positively representable baseline."
  - "Mutation polarity requires an observed REPRESENTABLE baseline to become an observed REJECTED mutation."
  - "Unsupported dynamic construction is an independent honesty gate and cannot satisfy positive coverage."
  - "Infrastructure state change requires explicit canonical PROVISION semantics; a generic deployment label or command text is insufficient."
  - "Corpus evidence runs only after frozen Core closure and adapter certification."
  - "Conformance work cannot mutate the Core pre-closure or adapter inventories."
  - "Concrete artifact checks remain separate from universal contract checks."
  - "C0.2 activates only after A1.0 establishes a second executable target with real continuity evidence."
  - "C0.2 matrix declarations must match production-derived topology requirements and cannot promote target support."
  - "C0.3 defines observable equivalence without using target syntax, job layout or action identity as semantic truth."

currentDecision:
  completedItem: "C0.2"
  completedItemName: "Abstract Topology Matrix"
  nextItem: "C0.3"
  nextItemName: "Semantic Equivalence Rules"
  decisionBasis: "Flow CI #2679, run 30913933725, passed C0.2 validation on exact head 4edb2b1440966bdc794d4f001021367654c8b4e7 and synthetic merge candidate 2ec62d58b5f7e1944e11c8c31354cdf0366770a7. C0.2 is complete and C0.3 is the adjacent active conformance item."

items:
  - version: "C0.1"
    name: "Bounded Domain Corpus"
    type: "core-evidence"
    status: completed
    purpose: "Exercise preserved meaning, dependencies and explicit model gaps across the three bounded evidence domains."
    dependsOnCore: "0.9.7.7"
    completionEvidence:
      - "Each bounded domain has a positively representable baseline."
      - "Data transformation carries explicit DATA_TRANSFORM semantics and named value continuity."
      - "Infrastructure state change carries explicit PROVISION semantics backed by a pinned apply workflow."
      - "Runtime-generated delivery remains explicitly unsupported instead of being approximated."
      - "Mutation polarity compares baseline and mutation behavior rather than counting diagnostic mutations."
      - "The domain vocabulary is explicitly scoped to C0.1 evidence and is not an exhaustive taxonomy."
      - "The corpus executes through the production intent, validation, AST and planning path."
      - "The conformance inventory is exact and remains separate from frozen Core and adapter inventories."

  - version: "C0.1.1"
    name: "Bounded Domain Integrity Correction"
    type: "bounded-correction"
    status: completed
    purpose: "Repair C0.1 representability, mutation-polarity and roadmap-ownership enforcement without changing Core meaning."
    dependsOnCore: "0.9.7.10"
    completionEvidence:
      - "Each domain has a positively representable baseline."
      - "Mutation polarity compares observed baseline and mutation results."
      - "Dynamic negative evidence is checked independently."
      - "Cross-stream selection is globally owned."
      - "Flow CI #2655 passed exact-head and synthetic merge-candidate validation."

  - version: "C0.2"
