apiVersion: flowlang.org/v1alpha1
kind: TargetProjectionReview
metadata:
  name: "build-test-deploy"
spec:
  standardVersion: "0.8.0"
  manifestVersion: "3.0"
  target: "github-actions"
  capabilityCompatibility: "PARTIAL"
  effectiveCompatibility: "PARTIAL"
  materializationReadiness: "REVIEW_REQUIRED"
  projectionReadiness: "REVIEW_ONLY"
  renderMode: REVIEW_ONLY
  executable: false
  reason: "Target syntax was not emitted because required materialization, trigger, or renderer payload evidence is unresolved."
  findings:
    - nodeId: "manifest"
      status: "CAPABILITY_PARTIAL"
      reason: "Target capability compatibility is 'PARTIAL' and cannot produce executable syntax."
    - nodeId: "git_checkout_1"
      status: "ADAPTER_REQUIRED"
      reason: "Target 'github-actions' declares no projection rule for 'git.checkout'."
    - nodeId: "standard_execute_1"
      status: "NOTES_PROJECTED"
      reason: "Standard semantic work is review-only until an explicit GitHub Action payload is declared."
    - nodeId: "docker_build_1"
      status: "ADAPTER_REQUIRED"
      reason: "Target 'github-actions' declares no projection rule for 'docker.build'."
    - nodeId: "approve_1"
      status: "TARGET_PAYLOAD_MISSING"
      reason: "Native materialization evidence exists, but no structured renderer payload is declared for 'github-actions'."
    - nodeId: "standard_execute_2"
      status: "NOTES_PROJECTED"
      reason: "Standard semantic work is review-only until an explicit GitHub Action payload is declared."
    - nodeId: "standard_execute_3"
      status: "NOTES_PROJECTED"
      reason: "Standard semantic work is review-only until an explicit GitHub Action payload is declared."
    - nodeId: "standard_rollback_1"
      status: "NOTES_PROJECTED"
      reason: "Rollback intent remains notes-backed until an explicit GitHub Action rollback payload is declared."
    - nodeId: "notify_send_1"
      status: "ADAPTER_REQUIRED"
      reason: "Target 'github-actions' declares no projection rule for 'notify.send'."
  semanticInventory:
    - nodeId: "git_checkout_1"
      module: "git"
      action: "checkout"
      materializationStatus: "ADAPTER_REQUIRED"
      materializationSource: ""
      projectionArtifact: "artifact.git-checkout-1"
      rendererPayloadPresent: false
    - nodeId: "standard_execute_1"
      module: "standard"
      action: "execute"
      materializationStatus: "NOTES_PROJECTED"
      materializationSource: "target-registry-projection-rule"
      projectionArtifact: "artifact.standard-execute-1"
      rendererPayloadPresent: false
    - nodeId: "docker_build_1"
      module: "docker"
      action: "build"
      materializationStatus: "ADAPTER_REQUIRED"
      materializationSource: ""
      projectionArtifact: "artifact.docker-build-1"
      rendererPayloadPresent: false
    - nodeId: "approve_1"
      module: ""
      action: ""
      materializationStatus: "NATIVE"
      materializationSource: ""
      projectionArtifact: ""
      rendererPayloadPresent: false
    - nodeId: "standard_execute_2"
      module: "standard"
      action: "execute"
      materializationStatus: "NOTES_PROJECTED"
      materializationSource: "target-registry-projection-rule"
      projectionArtifact: "artifact.standard-execute-2"
      rendererPayloadPresent: false
    - nodeId: "standard_execute_3"
      module: "standard"
      action: "execute"
      materializationStatus: "NOTES_PROJECTED"
      materializationSource: "target-registry-projection-rule"
      projectionArtifact: "artifact.standard-execute-3"
      rendererPayloadPresent: false
    - nodeId: "standard_rollback_1"
      module: "standard"
      action: "rollback"
      materializationStatus: "NOTES_PROJECTED"
      materializationSource: "target-registry-projection-rule"
      projectionArtifact: "artifact.standard-rollback-1"
      rendererPayloadPresent: false
    - nodeId: "notify_send_1"
      module: "notify"
      action: "send"
      materializationStatus: "ADAPTER_REQUIRED"
      materializationSource: ""
      projectionArtifact: "artifact.notify-send-1"
      rendererPayloadPresent: false
