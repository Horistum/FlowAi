kind: FlowConformanceVector
version: "1.0"
id: artifacts.standard-freeze.public-draft
description: Standard freeze report must mark the public 0.4 draft contracts stable and expose breaking-change rules.
input:
  fixture: examples/intent/build-test-deploy.intent.yaml
  target: jenkins
expected:
