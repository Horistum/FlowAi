  artifact: standard-freeze-report.json
  schema: schemas/standard-freeze-report.schema.json
  status: PASS
  stableContracts:
    includes:
      - execution-plan.json
      - standard-compliance-report.json
  breakingChangeRules:
    includes:
      - add-required-field
      - drop-required-artifact
