kind: FlowConformanceVector
version: "1.0"
id: artifacts.standard-export-manifest.public-candidate
introducedIn: "0.5.0"
description: Standard export manifest must describe implementer-facing documents, artifacts, schemas and boundaries.
input:
  command: standard-export
expected:
  artifact: standard-export-manifest.json
  schema: schemas/standard-export-manifest.schema.json
  requiredCheck: v0.5.0.standard-export-manifest
  manifestVersion: "1.3"
  releaseGateChecks:
    includes:
      - v0.5.3.standard-bundle-verifier
      - v0.5.4.data-driven-conformance-index
      - v0.6.1.intent-corpus-expansion
      - v0.6.2.required-clarification-contract
      - v0.6.3.safety-policy-matrix
      - v0.6.4.target-semantics-negative-corpus
      - v0.6.5.execution-plan-semantic-invariants
      - v0.6.6.ai-input-trust-boundary
      - v0.6.7.standard-example-bundle
      - v0.6.8.compatibility-promise
      - v0.7.0.reference-corpus-execution-harness
      - v0.7.1.architecture-debt-cleanup-and-drift-enforcement
      - v0.7.3.standard-model-projection-coherence
      - v0.7.4.architecture-delta-analyzer
      - v0.7.5.purpose-coverage-ratio
  acceptanceCriteria:
    includes:
      - All stable public surface artifacts are covered by the export bundle.
  requiredDocuments:
    includes:
      - docs/IMPLEMENTER_GUIDE.md
      - docs/STANDARD_EXPORT_MANIFEST.md
  nonGoals:
    includes:
      - No runtime executor.
      - No SDK or plugin lifecycle.
  selfVerificationCommands:
    includes:
      - ./gradlew clean test
      - ./gradlew run --args="standard-verify --bundle dist/flow-standard-0.7.5"
  verificationInputs:
    includes:
      - standard-export-manifest.json
      - public-standard-surface.json
      - conformance-vector-index.json
