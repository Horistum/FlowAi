kind: FlowConformanceVector
version: "1.0"
id: standard.architecture-delta-analyzer
introducedIn: "0.7.4"
area: standard
summary: Architecture Delta Analyzer compares the frozen v0.7.3 StandardModel baseline with the active model and rejects purpose drift.
expected:
  status: PASS
  requiredCheck: v0.7.4.architecture-delta-analyzer
  standardVersion: "0.7.5"
  previousVersion: "0.7.3"
  invariants:
    - delta.previousVersion == 0.7.3
    - delta.currentVersion == FlowStandardVersions.FLOW_STANDARD_VERSION
    - addedChecks includes v0.7.4.architecture-delta-analyzer
    - registryConsistencyCheckGrowth == 0
    - stablePublicArtifactGrowth == 0
    - no silent gate-kind reclassification
    - stable public surface growth must not outrun evidence-backed check growth
  noRuntimeExecutor: true
  noSdkApi: true
  noPluginLifecycle: true
  noTargetSpecificPublicDsl: true
