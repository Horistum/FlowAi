kind: FlowConformanceVector
version: "1.0"
id: standard.model-projection-coherence
introducedIn: "0.7.3"
area: standard
summary: StandardModel is the single source for release, manifest, candidate and public surface projections.
expected:
  status: PASS
  requiredCheck: v0.7.3.standard-model-projection-coherence
  standardVersion: "0.7.5"
  invariants:
    - releaseProfile == StandardModel.releaseProfileCheckIds
    - standardExportManifest == StandardModel.standardExportManifestCheckIds
    - standardCandidate == StandardModel.candidateCheckIds
    - publicSurfaceStableArtifacts == StandardModel.stableArtifacts
    - registryConsistencyCheckIds == []
  noRuntimeExecutor: true
  noSdkApi: true
  noPluginLifecycle: true
  noTargetSpecificPublicDsl: true
