intentVersion: '2.0'
kind: FlowIntentDocument
name: dp01-backup-missing-artifact
workflows:
  - name: protect-state
    kind: BACKUP
    steps:
      - id: create-backup
        capability: BACKUP
        params:
          subject: application-state
          destination: durable-backup-store
      - id: verify-backup
        capability: VERIFY
        requires: [create-backup]
        params:
          resource: 'ref:backup_artifact'
          criteria: recovery-artifact-readable
failure: {notify: false, rollback: false, stopOnError: true}
