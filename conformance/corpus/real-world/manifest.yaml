kind: FlowRealWorldCorpus
version: '0.2'
status: executable-baseline
name: real-world-pipeline-representability
scope:
  domains: [software-delivery, data-transformation, infrastructure-state-change]
  primaryUse: Independent representability, continuity and negative-mutation evidence.
  roadmapRelationship:
    A0.5: Consumes continuity-focused behavioral cases without redefining or replacing the adapter work item.
    C0.1: Receives the broader catalog and accepted case packages as bounded-domain evidence.
catalogs:
  sources: conformance/corpus/real-world/sources.yaml
  scenarios: conformance/corpus/real-world/scenarios.yaml
  acceptedScenarios: conformance/corpus/real-world/accepted-scenarios.yaml
schemas:
  manifest: schemas/real-world-corpus.schema.json
  sources: schemas/real-world-source.schema.json
  scenarios: schemas/real-world-scenario.schema.json
  case: schemas/real-world-case.schema.json
  provenance: schemas/real-world-provenance.schema.json
  expectedPlan: schemas/real-world-expected-plan.schema.json
  targetAssessments: schemas/real-world-target-assessments.schema.json
  evidence: schemas/real-world-evidence.schema.json
  mutation: schemas/real-world-mutation.schema.json
casePackages:
- cases/C02-ordering-only-diamond
- cases/C06-artifact-transfer
- cases/A06-typed-human-input
- cases/A11-output-driven-matrix
- cases/N01-missing-result
- cases/N08-parallelism-loss
counts:
  sources: 15
  admittedSources: 11
  screenedSources: 4
  productionSources: 3
  exampleSources: 8
  semanticReferenceSources: 4
  scenarios: 44
  admittedScenarios: 19
  screenedScenarios: 9
  plannedScenarios: 16
  executableCases: 6
  productionCases: 1
  exampleCases: 5
  semanticReferenceCases: 0
  mutationCases: 8
invariants:
- A source is never admitted from a mutable branch reference.
- A source workflow is evidence of platform behavior, not the authority for universal Flow meaning.
- Ordering is not accepted as value, workspace, artifact or state continuity.
- Broad scenario hypotheses and accepted executable evidence remain separate authorities.
- Source composition and executable-case primary provenance are explicit; official examples are not described as production workflows.
- Every accepted case owns a canonical intent, expected plan semantics, target assessment, mutation evidence and immutable source provenance.
- Unsupported or ambiguous behavior remains explicit and cannot be converted to PASS by approximation.
- The corpus runs after frozen Core and adapter inventories and cannot mutate either evidence boundary.
- No corpus case creates a new Core capability merely because one platform exposes a feature.
