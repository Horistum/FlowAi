invariants:
- A source is never admitted from a mutable branch reference.
- A source workflow is evidence of platform behavior, not the authority for universal Flow meaning.
- Ordering is not accepted as value, workspace, artifact or state continuity.
- Every result is a hypothesis until a canonical intent, execution plan and target assessment are committed.
- Unsupported or ambiguous behavior remains explicit and cannot be converted to PASS by approximation.
- The corpus cannot mutate the frozen Core pre-closure inventory.
- No corpus case creates a new Core capability merely because one platform exposes a feature.
