intentVersion: '2.0'
kind: FlowIntentDocument
name: n05-runtime-generated-pipeline
description: Preserve the runtime pipeline-generation request while refusing to invent a static task graph.
inputs:
- name: branch
  type: text
  required: true
workflows:
- name: main
  kind: CUSTOM
  steps:
  - id: generate-pipeline
    capability: CUSTOM
    params:
      branch: 'ref:branch'
      description: Discover test directories at runtime and generate conditional delivery steps
failure: {notify: false, rollback: false, stopOnError: true}
