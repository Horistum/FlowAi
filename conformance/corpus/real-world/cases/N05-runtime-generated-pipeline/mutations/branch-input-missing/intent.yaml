intentVersion: '2.0'
kind: FlowIntentDocument
name: n05-runtime-generated-pipeline-missing-branch
description: Mutation removes the branch input while pipeline generation still consumes it.
workflows:
- name: main
  kind: CUSTOM
  steps:
