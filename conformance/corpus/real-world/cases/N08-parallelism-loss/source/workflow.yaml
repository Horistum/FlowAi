apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata: {generateName: dag-diamond-}
spec:
  entrypoint: diamond
  templates:
  - name: diamond
    dag:
      tasks:
      - {name: A, template: echo}
      - {name: B, depends: A, template: echo}
      - {name: C, depends: A, template: echo}
      - {name: D, depends: B && C, template: echo}
  - name: echo
    container: {image: busybox, command: [echo, ok]}
