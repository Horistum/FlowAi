intentVersion: '2.0'
kind: FlowIntentDocument
name: c02-ordering-only-diamond
description: Preserve an external diamond DAG without inventing data continuity.
workflows:
- name: main
  kind: CUSTOM
  steps:
  - id: A
    capability: CUSTOM
    produces: [a_done]
    params: {operation: prepare}
  - id: B
    capability: CUSTOM
    requires: [A]
    produces: [b_done]
    params: {operation: branch-b}
  - id: C
    capability: CUSTOM
    requires: [A]
    produces: [c_done]
    params: {operation: branch-c}
  - id: D
    capability: CUSTOM
    requires: [B, C]
    params: {operation: fan-in}
failure: {notify: false, rollback: false, stopOnError: true}
