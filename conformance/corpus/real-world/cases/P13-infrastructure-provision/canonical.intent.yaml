intentVersion: '2.0'
kind: FlowIntentDocument
name: p13-infrastructure-provision
description: Preserve initialization, infrastructure apply and verification as target-neutral state-changing intent.
workflows:
- name: main
  kind: PROVISION
  steps:
  - id: initialize
    capability: CUSTOM
    produces: [initialized_configuration]
    params: {description: Initialize the pinned Terraform configuration}
  - id: apply
    capability: PROVISION
    requires: [initialize]
    produces: [provisioned_state]
    params:
      tool: terraform
      mode: apply
      resource: local-test-infrastructure
      stack: 'ref:initialized_configuration'
  - id: verify
    capability: VERIFY
    requires: [apply]
    params:
      subject: provisioned infrastructure
      criteria: 'ref:provisioned_state'
failure: {notify: false, rollback: false, stopOnError: true}
