intentVersion: '2.0'
kind: FlowIntentDocument
name: n05-runtime-generated-infrastructure-missing-input
workflows:
- name: main
  kind: PROVISION
  steps:
  - id: discover
    capability: CUSTOM
    params: {description: Discover deployable components at runtime}
  - id: deploy
    capability: DEPLOY
    requires: [discover]
    params:
      subject: infrastructure
      environment: production
      artifact: 'ref:discovered_components'
failure: {notify: false, rollback: false, stopOnError: true}
