expectedSemanticObservations:
  - id: preserve-hardware-failure-incident-context
    expectation: PRESERVE
    statement: Flow must preserve the hardware-failure incident context and affected compute-node target without making OpenStack a Core capability.
    behaviorRefs:
      - identify-hardware-failure
    rationale: Incident subject and target identity are universal meaning; the platform name is authored data, not vocabulary.
  - id: preserve-compute-node-remediation
    expectation: PRESERVE
    statement: Flow must preserve the targeted remediation action for the affected compute node independently from StackStorm action syntax.
    behaviorRefs:
      - evacuate-compute-node
    rationale: Evacuating work from an affected service target is remediation intent even when execution is product-specific.
  - id: preserve-potential-downtime-notification
    expectation: PRESERVE
    statement: Flow must preserve the authored downtime message and email delivery channel as notification meaning.
    behaviorRefs:
      - notify-potential-downtime
    rationale: Communication content and channel remain meaningful across automation products.
  - id: preserve-failure-conditioned-human-escalation
    expectation: PRESERVE
    statement: Flow must preserve that human escalation occurs only when remediation fails, including the human handoff destination.
    behaviorRefs:
      - escalate-remediation-failure
      - workflow-transition-conditions
    rationale: Replacing failure-conditioned escalation with an unconditional notification changes control flow and operator ownership.
unsupportedFacts:
