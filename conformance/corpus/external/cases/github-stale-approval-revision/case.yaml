authoredBehaviors:
  - id: stale-approval-invalidation
    statement: GitHub records the reviewed diff state and can dismiss approval as stale when that diff changes, requiring the work to be approved again.
    evidence:
      - startLine: 1
        endLine: 1
expectedSemanticObservations:
  - id: preserve-revision-bound-approval
    expectation: PRESERVE
    statement: Flow must bind authorization to the reviewed change revision and invalidate it when the revision changes.
    behaviorRefs:
      - stale-approval-invalidation
    rationale: Approval freshness is a relation between authorization and change identity, not a comment attached to a workflow.
  - id: preserve-whole-changeset-coverage
    expectation: PRESERVE
    statement: Flow must preserve that approval covers the complete reviewed change set and cannot remain valid when new unreviewed content is introduced.
    behaviorRefs:
      - stale-approval-invalidation
    rationale: Partial protection of one operation is not equivalent to authorization of the whole authored change.
unsupportedFacts:
  - id: github-diff-and-update-branch-mechanics
    statement: The source uses GitHub diff snapshots, pull-request branches and Update branch behavior.
    evidence:
      - startLine: 1
        endLine: 1
    reason: EF-09 preserves revision identity and complete change coverage without promoting GitHub branch-update mechanics into Core.
