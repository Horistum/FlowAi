expectedSemanticObservations:
  - id: preserve-ordered-approval-gate
    expectation: PRESERVE
    statement: Flow must preserve an approval gate that is ordered before the protected infrastructure change and blocks execution when disconnected.
    behaviorRefs:
      - approved-apply-requirement
    rationale: A reachable authorization mechanism protecting a specific change is target-neutral control-flow meaning.
  - id: preserve-author-approver-separation
    expectation: PRESERVE
    statement: Flow must preserve that the change author cannot satisfy the approval requirement.
    behaviorRefs:
      - approved-apply-requirement
    rationale: Separation of duties changes who may authorize execution and cannot be reduced to a generic approval message.
unsupportedFacts:
