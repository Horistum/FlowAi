kind: FlowBackupRestoreFalsification
version: '1.0'
caseId: restic-backup-and-restore
facts:
  - id: backup-capture
    observationRef: preserve-backup-capture
    requirement: BACKUP_RECOVERY_POINT_CAPTURE
    values:
      subject: ~/work
  - id: restore-from-recovery-point
    observationRef: preserve-restore-source-and-target
    requirement: RESTORE_FROM_RECOVERY_POINT
    values:
      recoveryPoint: your-snapshot-ID
      subject: /tmp/restore-work
