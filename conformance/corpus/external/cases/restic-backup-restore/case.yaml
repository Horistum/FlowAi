expectedSemanticObservations:
  - id: preserve-backup-capture
    expectation: PRESERVE
    statement: Flow must preserve that backup captures protected state as a recovery point.
    behaviorRefs:
      - capture-worktree
    rationale: Recovery-point capture is target-neutral backup intent; the restic command spelling is not.
  - id: preserve-restore-source-and-target
    expectation: PRESERVE
    statement: Flow must preserve the authored recovery-point identity and restore target as separate semantics.
    behaviorRefs:
      - restore-snapshot-to-target
    rationale: The source recovery point and protected-state destination are distinct recovery roles.
unsupportedFacts:
  - id: restic-cli-spelling
    statement: The backup, restore and --target tokens are restic CLI syntax.
    evidence:
      - startLine: 5
        endLine: 5
      - startLine: 17
        endLine: 17
    reason: Product command and flag spelling cannot become universal Flow vocabulary.
