authoredBehaviors:
  - id: capture-worktree
    statement: The authored workflow captures ~/work into a recovery snapshot.
    evidence:
      - startLine: 1
        endLine: 5
  - id: restore-snapshot-to-target
    statement: The authored workflow restores an identified snapshot into /tmp/restore-work.
    evidence:
