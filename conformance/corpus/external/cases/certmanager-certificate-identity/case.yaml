  - id: preserve-certificate-secret-target
    expectation: PRESERVE
    statement: Flow must preserve the authored storage target for the renewed certificate material without making Kubernetes Secret a universal capability.
    behaviorRefs:
      - store-certificate-in-target-secret
    rationale: The destination holding renewed certificate material is lifecycle meaning; the concrete resource type remains authored data.
