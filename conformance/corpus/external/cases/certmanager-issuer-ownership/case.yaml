authoredBehaviors:
  - id: reference-responsible-issuer
    statement: The certificate specification references the issuer responsible for issuing the certificate and requires its name.
    evidence:
      - startLine: 1
        endLine: 7
expectedSemanticObservations:
  - id: preserve-issuer-ownership
    expectation: PRESERVE
    statement: Flow must preserve the issuer identity responsible for renewal without treating cert-manager issuer scope or object kind as universal meaning.
    behaviorRefs:
      - reference-responsible-issuer
    rationale: Certificate authority ownership is target-neutral lifecycle context; product scoping mechanics are not.
unsupportedFacts:
  - id: certmanager-issuer-scope
    statement: The source distinguishes namespace-scoped and cluster-scoped issuers.
    evidence:
      - startLine: 2
        endLine: 4
    reason: Namespace versus cluster scope is cert-manager resource topology and is not evidence for a universal Core capability.
