kind: FlowExternalCorpusCase
version: '1.0'
id: velero-selective-remapped-restore
domain: backup-and-restore
provenance:
  repository: velero-io/velero
  revision: 'd9c25173f7f9256e3d8f770064e6de8d43736c21'
  path: pkg/cmd/cli/restore/create.go
  license:
