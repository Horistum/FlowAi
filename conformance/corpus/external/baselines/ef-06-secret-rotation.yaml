kind: FlowSecretRotationFalsificationBaseline
version: '1.0'
facts:
  - caseId: aws-secret-rotation-request
    factId: named-secret-rotation
    observationRef: preserve-named-secret-rotation
    requirement: NAMED_SECRET_ROTATION
    initialOutcome: REPRESENTABLE
  - caseId: aws-secret-rotation-request
    factId: immediate-vs-scheduled-execution
    observationRef: preserve-immediate-vs-scheduled-execution
    requirement: IMMEDIATE_VS_SCHEDULED_ROTATION
    initialOutcome: MODEL_GAP
  - caseId: aws-secret-rotation-window
    factId: bounded-rotation-window
    observationRef: preserve-bounded-rotation-window
    requirement: ROTATION_WINDOW
    initialOutcome: MODEL_GAP
  - caseId: aws-secret-rotation-policy
    factId: automatic-rotation-disabled
    observationRef: preserve-automatic-rotation-state
    requirement: AUTOMATED_ROTATION_ENABLEMENT
    initialOutcome: MODEL_GAP
  - caseId: aws-secret-prior-version
    factId: retained-prior-credential
    observationRef: preserve-prior-credential-retention
    requirement: PRIOR_CREDENTIAL_RETIREMENT_POLICY
    initialOutcome: MODEL_GAP
  - caseId: openbao-static-secret-rotation
    factId: one-hour-rotation-cadence
    observationRef: preserve-rotation-cadence
    requirement: ROTATION_CADENCE
    initialOutcome: REPRESENTABLE
  - caseId: openbao-root-secret-retirement
    factId: immediate-prior-credential-retirement
    observationRef: preserve-immediate-prior-credential-retirement
    requirement: PRIOR_CREDENTIAL_RETIREMENT_POLICY
    initialOutcome: MODEL_GAP
